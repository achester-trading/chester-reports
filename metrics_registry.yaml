    family: quantity
    long_window: 365d
  llama_protocol_daily:
    description: >-
      What pays the token, per basket protocol DefiLlama lists: llama.fees_<sym>,
      llama.revenue_<sym>, llama.holders_revenue_<sym> (daily flows, from
      /summary/fees/{slug}) and llama.tvl_<sym> (the level, from /protocol/{slug}).
      config/crypto_basket.yaml `llama_series` lists what DefiLlama serves per name
      (TAO has no fee or TVL series; KAS is not listed).
    source: defillama
    members_from: altdata.sources.llama.PROTOCOL_KEYS
    members_are: values
    expected_members: 36  # 8 names x 4, ONDO x 3 (no TVL chart), PRL x 1 (a chain: fees only)
    key_prefix: llama.
    units: usd
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    trigger_eligible: false
    mechanism_group: crypto_protocol_economics
    family: quantity
    long_window: 365d
  llama_coin_mcap:
    description: >-
      Market cap (llama.mcap_<sym>) for all twelve, from coins.llama.fi/mcaps.
      FORWARD-ONLY: the service serves the current cap and no history, so the
      series starts the day the writer first runs.
    source: defillama
    members_from: altdata.sources.llama.MCAP_KEYS
    members_are: values
    expected_members: 12
    key_prefix: llama.
    units: usd
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    trigger_eligible: false
    mechanism_group: crypto_basket_price
    family: quantity
    long_window: full
  llama_coin_supply:
    description: >-
      Circulating supply in tokens (llama.supply_<sym>): the coin service's cap
      over its own price at the same instant (within an hour, else not computed).
      Forward-only, like the cap.
    source: defillama
    members_from: altdata.sources.llama.SUPPLY_KEYS
    members_are: values
    expected_members: 12
    key_prefix: llama.
    units: count
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    trigger_eligible: false
    mechanism_group: crypto_basket_price
    family: quantity
    long_window: full
  crypto_dilution:
    description: >-
      calc.crypto_dilution_<sym>: a year's issuance (the annualised change in
      llama.supply_<sym>, at the latest price) over the value returned to holders
      (llama.holders_revenue_<sym> over the last 365 days -- buybacks, burns and
      distributions, which DefiLlama does not split). Written only when both legs
      are stored; otherwise the reports print "not measured -- <reason>".
    source: derived_state
    members_from: altdata.crypto_basket.DILUTION_KEYS
    members_are: values
    expected_members: 12
    key_prefix: calc.
    units: ratio
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    trigger_eligible: false
    mechanism_group: crypto_protocol_economics
    family: ratio
    long_window: 365d

