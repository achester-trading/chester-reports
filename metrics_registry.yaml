# metrics_registry.yaml -- every metric this system computes, and what it may
# be used for.
#
# Architecture 26.14 gate 3: signal rights, horizons, mechanism groups and
# source semantics validated. This is the minimal-but-real first cut: it covers
# what exists TODAY and is expected to grow with use. Where a field is not yet
# worth deciding per-metric, a documented default carries it rather than a
# guess dressed up as a decision.
#
# -----------------------------------------------------------------------------
# SCHEMA
# -----------------------------------------------------------------------------
#
# Three kinds of entry, and the distinction is what makes the CI check bite:
#
#   metrics:       things that could feed a decision. Each declares the four
#                  required fields. Registered individually.
#   bulk_imports:  families too large to hand-enumerate, whose truth already
#                  lives in code. The block declares shared fields and points at
#                  the code with `members_from`; the checker expands it. This is
#                  deliberate -- copying 59 series into YAML would create two
#                  registries that drift apart, which is worse than one.
#   non_metrics:   fields that are provenance, diagnostics or labels and are
#                  NOT metrics. Declared so that "unregistered" and "knowingly
#                  not a metric" are different states. Without this list the
#                  drift check cannot tell a new metric from a new comment.
#
# -----------------------------------------------------------------------------
# DELTA SEMANTICS -- WHICH FIELD altdata/derived.py READS, AND WHY IT IS `units`
# -----------------------------------------------------------------------------
#
# derived_forms() (O.14, one function for every report's deltas, percentiles and
# z-scores) needs to know what a CHANGE in a metric means. Three answers exist
# and only one is right per metric:
#
#   units '%' / 'percent' / 'bps'          -> the delta is in BASIS POINTS
#   units '$' / 'price' / 'idx' / 'usd'    -> the delta is in PERCENT of level
#   units 'K' / 'B' / 'M' / 'count' / ...  -> the delta is RAW
#
# A 10y yield going 4.45 -> 4.52 is +7bp; SPY going 640 -> 646 is +0.94%;
# claims going 221K -> 229K is +8000. One formula for all three is wrong twice
# and plausible three times.
#
# THE FIELD IS `units`. The Phase 2 change order named `observation_type`, but in
# this registry that field's vocabulary is observed|calculated|inferred: it
# records how a number came to exist, not what a change in it means. `units` is
# the field that carries the semantics, and for the 59 FRED series it resolves
# through the fred_macro bulk block to altdata.config's own units field.
#
# A metric whose units are not in the table is treated as RAW and says so in
# `delta_unit_reason`. An unregistered metric_id likewise. A silent default here
# is the rule failing without a trace, which is why it is never silent.
#
# The other two fields derived_forms() reads:
#
#   information_half_life   with `freq`, sets the staleness allowance that
#                           CONFIDENCE derives from. `until_next_release` has no
#                           fixed length -- it resolves to the series' own
#                           cadence (daily 2 sessions, weekly 8, monthly 32,
#                           quarterly 95) rather than guessing one.
#   derived_window_days     OPTIONAL per-metric own-history window. Absent means
#                           five years (1826 days), which is §K's percentile_5y.
#   extreme_percentiles     OPTIONAL [lo, hi] override of the 5/95 extreme flag.
#
# -----------------------------------------------------------------------------
# HOW AN available_at MAY BE ARRIVED AT -- THE RECONSTRUCTION RULE
# -----------------------------------------------------------------------------
#
# Every observation carries `available_at`, and altdata/observations.py now
# records HOW that instant was arrived at, in `availability_kind`:
#
#   observed         a real first-publication instant from the source. ALFRED
#                    vintages would be this. Nothing writes it yet.
#   ingest_instant   the write instant stood in for it. Every live pull does
#                    this; it is an UPPER BOUND on when we knew, so an as-of join
#                    over it is safe -- just later than the truth.
#   reconstructed    derived from the observation plus a DECLARED latency, e.g. a
#                    session close plus 20 minutes. Backfills only.
#   (null)           unstated: written before the column existed. The migrated
#                    FRED history is all of this, and leaving it unstated is the
#                    useful fact -- all 20,372 rows share the migration instant.
#
# THE RULE: `reconstructed` IS PERMITTED ONLY WHERE revision_policy IS `never` OR
# `split_only`.
#
# A daily close is knowable at the close and is never restated except by a split,
# so reconstructing its availability RECOVERS the truth. A revisable series is the
# opposite case: FRED's August payrolls exist in three vintages, and stamping
# "known at the release" on what is actually the third revision hands a backtest a
# number that did not exist for months -- a leak no as-of join can catch, because
# the join is working correctly on a lie. Revisable series get ALFRED or nothing.
#
# tools/backfill_prices.py reads revision_policy and REFUSES any metric that is
# not reconstructable; tools/validate_prices.py asserts the refusal rather than
# trusting it.
#
# -----------------------------------------------------------------------------
# A RE-READ OF AN IDENTICAL VALUE IS NOT A REVISION
# -----------------------------------------------------------------------------
#
# The store's idempotence key is (registry_key, instrument, observed_at,
# available_at, source), so re-reading a series at a new instant does NOT collide:
# it creates a NEW VINTAGE, and the as-of join returns the latest vintage per
# period. A writer that re-reads unchanged data therefore SUPERSEDES its own
# better-dated rows.
#
# THIS IS NOT THEORETICAL. Phase 2b ran a live 2-year price pull before a
# reconstructed 5-year backfill. Every close in the live window acquired a second
# vintage stamped "available today" carrying the identical number, and the as-of
# join then did precisely its job: asked for Friday's object at Friday's cutoff, it
# could not see closes the store said were learned on Sunday. Two dimensions read
# 514 sessions stale -- exactly the boundary between the two windows -- and went
# absent with a staleness reason that was true on its own terms. Nothing about the
# join was wrong; the rows were.
#
# THE RULE: a writer must not create a vintage for a value equal to the latest one
# already stored for that period. Only a CHANGED value is a revision, which is what
# the three clocks exist to record. altdata/observations.drop_unchanged() implements
# it and tools/validate_prices.py proves that a second identical pull writes zero
# rows.
#
# -----------------------------------------------------------------------------
# AND NO BAR MAY CARRY A NON-SESSION OBSERVED DATE
# -----------------------------------------------------------------------------
#
# yfinance served VIX closes on Memorial Day and Labor Day 2026. The index is
# computed from SPX option quotes and does not exist on a day the options market is
# shut, so those bars are artefacts -- and stored, each would have counted as a
# session in every percentile, delta lookback and staleness count that reads the
# series.
#
# Instruments that genuinely trade when the US equity market does not are DECLARED
# (yfinance_source.CONTINUOUS_SYMBOLS -- Bitcoin, whose 528 non-session bars out of
# 1,827 are all real, and since AQ-5 ETH, SOL and ZEC). Everything else is filtered against the session calendar,
# which sees holidays only in the years it covers (2026-2027) and falls back to
# weekdays outside them.
#
# Full convention, with the confidence table: docs/market-state.md.
#
# Required on every metric:
#
#   source            an id from source_registry.yaml
#   mechanism_group   which cluster it belongs to for confluence purposes.
#                     Metrics sharing a group are ONE piece of evidence, never
#                     several. This is the field that stops four Greeks from
#                     being counted as four votes (architecture 26.9).
#   native_horizon    the horizon the metric actually describes. Not how often
#                     it is computed -- what it is about.
#   units             from the vocabulary below.
#   trigger_eligible  whether this metric may, on its own, move a decision.
#
# TRIGGER_ELIGIBLE DEFAULTS TO FALSE, AND EVERY METRIC IS FALSE TODAY. Nothing
# in this repo produces a recommendation yet, and the pin-log base rate has an
# effective n too small to act on. A metric earns trigger eligibility by
# demonstrated performance, not by existing. Flipping one to true is a
# deliberate, reviewable edit -- which is the point of writing it down.

version: 1
updated: 2026-09-05

vocabularies:
  native_horizon: [intraday, daily, weekly, monthly, quarterly, structural]
  units:
    - usd                    # a dollar amount
    - usd_per_1pct           # dollars per 1% move in spot
    - usd_per_point          # dollars per one-point move in spot
    - usd_per_volpt          # dollars per 1 implied-vol point
    - usd_per_day            # dollars per calendar day
    - shares                 # shares of the underlying
    - shares_per_1pct
    - shares_per_volpt
    - shares_per_day
    - price                  # a price or strike, in the underlying's currency
    - bps                    # basis points
    - ratio                  # unbounded ratio
    - fraction               # 0..1
    - count
    - days
    - label                  # closed-vocabulary string
    - percent                # RETIRED from entries (AUD-3a item 3, 14 Oct
                             # 2026): it meant a yield, a percentile, a return
                             # and a share at once, so a percentile moving 40 ->
                             # 55 read +1,500 bp. Kept in the vocabulary so a
                             # stored reference resolves; tools/check_registry.py
                             # refuses it on a metric or a bulk block. Use one of
                             # the six below. 1.0 == one per cent in every one of
                             # them (NOT a fraction; `fraction` is the 0..1 form
                             # and confusing the two is a 100x error).
    - percent_rate           # a yield, rate or spread LEVEL in percent; its
                             # change is in BASIS POINTS (4.45 -> 4.52 is +7 bp)
    - percentile             # an own-history rank, 0..100; its change is in
                             # POINTS (40 -> 55 is +15 pts)
    - percent_return         # a return, growth rate, change or distance in
                             # percent; its change is in PERCENTAGE POINTS
    - percent_share          # a share of a whole in percent (of sectors, of
                             # GDP, of open interest); its change is in PERCENTAGE
                             # POINTS (36% -> 45% is +9 pp, not +900 bp)
    - vol_pct                # an annualised volatility in percent; its change
                             # is in vol POINTS (18 -> 20 is +2 pts)
    - vol_index              # a volatility INDEX level (^VIX); its change is in
                             # POINTS. Its level prints as the price it was
                             # declared as before (altdata/derived.py LEVEL_UNITS)
    - index_points           # an index LEVEL that is no price and no volatility
                             # (^SKEW): its change is in POINTS, because a percent
                             # change of it means nothing. Prints as a price.
    - contract_ccy           # an amount in the CONTRACT's own currency, which
                             # is not necessarily the account's. The companion
                             # portfolio.position_currency row names it. Never
                             # sum two of these without converting first.
    - boolean
    - date
    - from_member            # bulk blocks only: the member's own declared units
    - by_source              # one key written by several sources in different
                             # units; the entry's `units_by_source` maps each
                             # source id to its unit (pm.volume, AUD-3a)
  # 26.4: every signal carries a native horizon AND an information half-life.
  # Outside them a metric may DISPLAY as context but may not affect a decision.
  # They are different questions and a metric can be short on one and long on
  # the other -- a pin outcome describes a single session and never decays.
  information_half_life:
    - intraday            # dead within the session; a stale read is not truth
    - session             # superseded by the next capture
    - to_next_expiry      # structurally REWRITTEN when the contributing
                          # options expire, not merely superseded
    - until_next_release  # valid until the source's next scheduled print
    - week
    - month
    - permanent           # a recorded historical fact; never decays
  # HALF-LIFE GATES DECISION USE, so it must be the TIGHTER constraint. An
  # expiry rewrite is a hard invalidation, not a half-life: encoding it as one
  # would license acting on a ten-day-old gamma flip merely because no expiry
  # had intervened, when a fresh one is computed every night. So the half-life
  # is `session` and the rewrite gets its own field.
  invalidated_by:
    - none
    - expiry_rewrite      # the contributing options expire and the profile is
                          # structurally rebuilt -- not decay, deletion
    - position_change     # any fill makes the previous reading untrue
  # 26.4 OBSERVATION_TYPE.
  observation_type:
    - observed            # a source reported it; we did not compute it
    - calculated          # computed deterministically from stored inputs
    - inferred            # derived under a model or assumption that can be
                          # wrong in a way arithmetic cannot be. EVERY
                          # dealers-hand-v1 metric is here: the signing
                          # convention is an assumption about inventory that
                          # public chains cannot observe, and under the
                          # customer-hand reading every sign inverts. Calling
                          # it `calculated` would lend the arithmetic's
                          # certainty to the assumption underneath it.
  # 26.4 REVISION_POLICY. One rule, one real exception:
  #   observed   -> never       a snapshot is a snapshot
  #   calculated -> recomputed  a methodology change REWRITES it, which is not
  #                             the same thing as the source restating
  #   FRED       -> revised     the source itself restates
  # WHAT POPULATION A METRIC ACTUALLY MEASURED. Absent means the metric measures
  # the thing its name says. A value here is a standing caveat that travels with
  # the number: `sector_etf_proxy` means eleven cap-weighted sector funds stood in
  # for the market, which is NOT market-wide breadth and must never be described
  # as it. Declared as a vocabulary so a new proxy has to be named on purpose.
  sample:
    - sector_etf_proxy
    - index_proxy
  # A METRIC THAT IS DECLARED AND HAS NO SOURCE. Not the same as absent-on-this-run:
  # `not_yet_sourced` says the system knows it wants this number, has looked, and has
  # nowhere to get it. It exists so a gap can be reviewed rather than rediscovered.
  status_extra:
    - not_yet_sourced
    # `superseded`: a name kept so references resolve, its series now written
    # under another key, which the entry's `superseded_by` names (the wgc.* gold
    # names, superseded by imf.ifs.* on 10 Oct 2026).
    - superseded
  # WHAT A METRIC IS STANDING IN FOR, when it is standing in for something. Declared
  # as a vocabulary so a proxy cannot be introduced without naming its target, and
  # so a reader can ask "what would I rather have here" and get an answer. A metric
  # with no proxy_for measures the thing its name says.
  proxy_for:
    - vx_futures_curve
  # AN OVERRIDE, NOT A SECOND RULE. `units` decides a metric's delta semantics;
  # this exists for the one thing `units: percent` cannot separate -- a SPREAD in
  # percent moves in basis points (HY OAS 2.70 -> 2.72 is +2bp) and a SHARE in
  # percent moves in POINTS (breadth 36% -> 45% is +9pp, not +900bp). Declared per
  # metric so the exception is visible in the diff.
  delta_unit:
    - bps
    - percent
    - raw
    - pp
    - pts     # POINTS: a percentile or a volatility (AUD-3a item 3). A plain
              # difference, like pp, under its own name: "+15 pts" of rank is not
              # fifteen percentage points of anything.
  revision_policy:
    - never
    - recomputed
    - revised
    # A SPLIT IS NOT A REVISION OF JUDGEMENT. It restates a price history exactly
    # once, mechanically, and by a known factor -- which is what makes a
    # reconstructed availability defensible for a close and indefensible for a
    # FRED series that is genuinely re-estimated. See the reconstruction rule in
    # the schema header.
    - split_only
  # THE METRIC FAMILY (metric-lenses brief, 1 Oct 2026): which forms a series is
  # measured in. Declared per series in `families` below; a family outside this
  # list fails tools/check_registry.py.
  family: [price, rate, spread, release, quantity, conditions, ratio]
  # THE RIGHTS CEILING (docs/templates/signal-intake.md item 4; first declared by
  # AQ-5, 10 Oct 2026): the most a series may ever be used for, whatever its
  # trigger_eligible says today. Optional; declared, it must be one of these.
  # Declared with it, on the same entries: `long_window` (the lenses' own-history
  # window -- `until_the_lenses` until 6e declares it), `added_date`, and
  # `kill_condition` (the written falsification condition, architecture Session 2)
  # where a ruling gave one.
  rights_ceiling: [narrow_flag, composite_input, confidence_modifier, base_rate_only, none]
  # W-1.1a item 1 (12 Oct 2026): what a series' figure IS, for the numeral
  # audit's unit equivalence -- a yield, rate, spread, probability, implied move
  # or volatility may be written as a percent where its payload field types it
  # as a price. See the `series_kinds` block.
  series_kind: [yield, rate, spread, probability, implied_move, volatility, price]
  mechanism_group:
    # Dealer chain. The greeks and the OI structure are SEPARATE groups on
    # purpose -- architecture 26.9 requires settled OI, effective OI and flow
    # polarity kept distinct, and max pain is an OI construct rather than a
    # gamma one. Everything inside dealer_chain_derived is one cluster.
    - dealer_chain_derived
    - dealer_chain_oi
    - chain_quality
    - pin_outcome
    # Broker state. Its own group because it is an OBSERVATION OF OUR OWN BOOK
    # rather than of the market -- it can never confirm a market signal, and
    # letting it share a group with one would be self-confirmation.
    - portfolio_truth
    # Macro, by pillar. Pillars are genuinely different mechanisms -- labour and
    # liquidity can confirm each other; two labour series cannot.
    - macro_labor
    - macro_momentum
    - macro_consumer_stress
    - macro_liquidity
    - macro_inflation
    - macro_sentiment
    - macro_valuation_credit
    - macro_global_fx
    - macro_sovereign
    # STRUCTURE ECONOMICS. A comparison of EXPRESSIONS of one view, not a reading
    # of the market: "the collar beats holding the index below 4,900" says nothing
    # about whether the index will fall. Its own group so it can never stand as
    # confirmation of a market signal -- it is about how to hold a view, never
    # about whether the view is right.
    - structure_economics
    # THE VX TERM STRUCTURE. Its own group and not equity_tape, because the curve
    # is a set of tradeable instruments with their own roll and their own basis --
    # the whole reason calc.vix3m_over_vix was only ever a declared PROXY for it.
    # Grouping the futures with the index's implied vols would let the proxy and
    # the thing it proxies for count as two witnesses to one fact, which is
    # exactly the double-count 26.9 forbids.
    - vx_term_structure
    # NARRATIVE. What is being SAID, which is not a reading of the market and can
    # never confirm one. Its own group for the strictest version of 26.9's rule:
    # a headline about widening credit spreads and the spread itself are one fact
    # reported twice, and letting them share a group would let the commentary
    # about a move count as a second witness to the move. Nothing here is
    # trigger_eligible, and a story count is a measure of attention rather than of
    # the thing attention is on.
    - narrative
    # BASE RATES. Its own group, and the reason is the sharpest case of 26.9 in
    # the registry: a base rate is a DENOMINATOR. "The index falls 10% about once a
    # year" cannot confirm anything about today -- it is the yardstick today is
    # measured against, and a yardstick that could also act as a witness would let
    # one fact be counted as two (the move, and the fact that the move is unusual).
    # Nothing in this group is trigger_eligible and nothing ever will be; 31.6 holds
    # the Part 26 freeze over all of it.
    - base_rate
    # FORECAST CALIBRATION. Separate from decision_grade because they measure
    # different things: a grade asks whether a POSITION worked, a Brier score asks
    # whether a stated LIKELIHOOD was honest. A system can be well calibrated and
    # unprofitable, or profitable and badly calibrated, and merging the groups
    # would let one stand in as evidence for the other.
    - forecast_calibration
    # P5-B, EL-3: Book Z's reference ledgers. Their own group, because a
    # benchmark is neither a market series nor a position.
    - paper_benchmark
    # THE MOVE SCREEN (Audit #4 Category 1 items 1 and 5). Its own group: a flag
    # is a statement about how unusual another series' move was, computed from
    # that series, never independent evidence beside it.
    - move_screen
    # DECISION GRADES. Its own group, and it must never share one with a market
    # metric: a grade is a measurement of THIS SYSTEM'S OWN OUTPUT, so letting it
    # confirm a market signal would be the system marking its own homework and
    # calling the mark independent evidence.
    - decision_grade
    # The overnight read. Its own group because it is a CLOCK-WINDOW
    # decomposition of one move, not several independent observations: the
    # Tokyo, Europe and residual legs are three slices of a single number
    # and sum to it, so counting them as three confirmations would be
    # counting the same fact three times -- exactly what 26.9 forbids.
    - overnight_context
    # THE MARKET-STATE OBJECT. Its own group: a dimension state is a declared
    # reading of one mechanism, and eight of them are eight clusters -- but the
    # OBJECT's own fields (a published state, its percentile, its direction, a
    # dial) are one cluster, because they are four views of the same computation.
    # Counting a dimension's state and its percentile as two confirmations would
    # be counting one reading twice.
    - market_state
    # A DIVERGENCE IS NOT A STATE. The contradiction table measures two markets
    # disagreeing, which is a different mechanism from either market's own level
    # -- and a separate group so that "credit is stressed" and "equities and
    # credit disagree" can never be summed into two pieces of evidence about
    # credit.
    - market_divergence
    # DAILY CLOSES. One group for the price basket, because 28 ETF closes are 28
    # views of the same equity tape rather than 28 independent observations --
    # counting SPY and QQQ as two confirmations of a trend is exactly the
    # double-counting 26.9 forbids. Dividends and splits are CORPORATE ACTIONS,
    # not prices, and go in their own group so a dividend can never read as a
    # confirmation of a price move.
    - market_close
    - corporate_action
    # EVERYTHING DERIVED FROM THE EQUITY TAPE IS ONE CLUSTER. Trend, breadth and
    # realized volatility are three views of the SAME 28 closes: the index's
    # distance from its average, the dispersion beneath it, and the size of its
    # daily moves. They answer different questions and they are not independent
    # observations, so a decision citing all three is citing one tape three times
    # -- which is exactly the double-counting 26.9 forbids. Keeping them in one
    # group makes the confluence count conservative, which is the right direction
    # for a metric family with no graded history.
    - equity_tape
    # RETAIL ACTIVITY. Its own group: a retail-flow share and a dealer greek are
    # measurements of different participants, and a decision citing both is citing
    # two genuinely independent observations rather than one tape twice.
    - retail_activity
    # CONSENSUS ESTIMATES. Its own group: a forward EPS is what analysts believe and
    # a price is what the market paid, so the two disagreeing IS the decomposition
    # this family exists to compute -- merging them would let one stand in as
    # evidence for the other.
    - consensus_estimate
    # CLOSING-AUCTION FLOW. Its own group: an auction imbalance is a statement about
    # one ten-minute window and about participants who must trade at the official
    # close, which is a different mechanism from either a daily price or a dealer
    # greek. It is also the group whose members are DISPLAY-ONLY by ruling.
    - auction_flow
    # SHORT FLOW and SHORT STOCK are TWO GROUPS, not one, and the split is the whole
    # point: daily short volume is a flow that a market maker's intraday hedging
    # fills with noise, and short interest is the position still open at a
    # settlement date. Merging them would let one stand in as evidence for the
    # other, which is the specific error this data invites.
    - short_flow
    - short_stock
    # SOCIAL ATTENTION. Its own group: a mention count measures who is talking, not
    # who is trading, and pairing it with a flow measure as confirmation would be
    # counting an opinion as a transaction.
    - social_attention
    # BORROW TERMS -- what it costs and whether it is possible to be short.
    - borrow_terms
    # PRIVACY CHAIN. Its own group: a shielded-pool share is an on-chain behaviour
    # measure and a ZEC price is a market one, and this family exists to watch
    # whether the two diverge -- which they cannot do inside one cluster.
    - privacy_chain
    # THE CRYPTO BASKET (12 Oct 2026; config/crypto_basket.yaml). Four groups,
    # because a coin's price, what pays it, the market-wide crypto flows and the
    # scan's stories are different mechanisms: a fee series and the price it
    # might explain must never confirm each other by sharing a cluster.
    - crypto_basket_price
    - crypto_protocol_economics
    - crypto_flows
    - crypto_basket_scan
    # RATES DECOMPOSITIONS (signal-triage order, ST-1). Every term-premium model
    # -- Kim-Wright (fred.term_premium_kw), ACM (acm.*), the SF Fed model
    # (sffed.*) and DKW (dkw.*) -- splits the SAME Treasury curve into an
    # expected-rate path and a premium, so four models agreeing is one curve
    # read four ways, not four witnesses. One cluster, deliberately: SR-6 asks
    # for their sign disagreement to be surfaced, never for their agreement to
    # be counted. Separate from macro_momentum, where the yields themselves
    # live, because a premium and the yield it is carved out of would otherwise
    # confirm each other by construction.
    - rates_decomposition
    # FACTOR ATTRIBUTION (AQ-8a). A family's return split by regression into what
    # the common factors explain and the residual -- the gold residual and the
    # driver attribution. One group however many families: every row is a cut of
    # the same four factors, so two families' shares are one lens read twice,
    # never two witnesses. Separate from the factors' own groups, because a
    # residual and the real yield it is net of would otherwise confirm each other.
    - factor_attribution
    # THE PAPER BID (AQ-8a; two-bid decomposition). Options positioning in the
    # commodity and crypto ETFs -- net call-put OI and the 25-delta risk reversal
    # from the captured chains. Its own group, apart from the dealer chain (the
    # 13's exposure), because it reads the speculative bid in four other funds.
    - paper_bid
    # HOUSEHOLD ALLOCATION (Z.1 B.101). What households HOLD, which is a
    # positioning stock rather than a sentiment reading or a flow -- SR-12's
    # bond-allocation blend reads it. Its own group so an allocation share and a
    # survey of what the same households say they feel cannot confirm each other.
    - household_allocation
    # TREASURY SUPPLY (signal-triage order, ST-1). What the Treasury sells and
    # how the auction absorbed it -- auction.* and fiscaldata.*. A statement
    # about the supply side of the curve, distinct from the curve's own level
    # (macro_momentum) and from the premium models read off it
    # (rates_decomposition); SR-22 and SR-23 need the two to be separable.
    - treasury_supply
    # OPERATOR-ENTERED FIGURES (tools/manual_input.py). A number a human typed
    # from a published source -- the SEP median dot, a FedWatch probability, the
    # CBO path, IG new-issue terms. Its own group because the provenance is a
    # person, and a hand-entered figure must never count as independent
    # confirmation of the automated series it may have been read beside.
    - manual_entry
    # QUARTERLY COMPANY FUNDAMENTALS (ST-2). Six filers' cash flow, capex, debt
    # and inventory: accounting statements, not market prices.
    - corporate_fundamentals
    # OIL INVENTORY (ST-2). Physical stocks and the curve's prompt shape: the
    # buffer variable of SR-18, separate from the oil price (macro_inflation).
    - oil_inventory
    # INFLATION EXPECTATIONS -- SURVEYS AND THE CIE (ST-2). UMich 5-10y,
    # the NY Fed SCE and the Board's CIE are one cluster: three readings of
    # what people expect. Market breakevens stay in macro_inflation, which
    # is what lets DEANCHOR require both (SR-24).
    - inflation_expectations
    # REFERENCE LIBRARIES (ST-2). Ken French, Damodaran, Shiller: long
    # histories that restate themselves by edition, used as yardsticks and
    # calibration inputs. One cluster; none is a live market witness.
    - reference_library
    # COMMODITY PRICES (ST-2). The World Bank indices; the LBMA gold
    # benchmark is declared and not sourced (A-4, 9 Oct 2026).
    - commodity_prices
    # PHYSICAL HOLDINGS (AQ-3 part 1). Metal held in ETF trusts and exchange
    # warehouses, and the trusts' share counts: where the stock sits, not its
    # price. One cluster: an ETF outflow and a warehouse draw are two reads of
    # one question.
    - commodity_holdings
    # SUPPLY RESPONSE (AQ-3 part 1). Rigs in operation: the producers'
    # answer to price, two to three quarters ahead of output.
    - commodity_supply
    # LEVERAGE (ST-2). Margin debt and leveraged-ETF assets: how much of
    # the book is borrowed or daily-rebalanced (SR-8). One cluster.
    - leverage_positioning
    # CORPORATE CREDIT SUPPLY (ST-2). Issuance by the private sector -- the
    # SR-16 supply that competes with Treasuries for the same buyers.
    - credit_supply
    # EXTERNAL POSITION (signal-triage order ST-2). Who holds and who buys a
    # country's assets across the border: TIC holdings and flows, SAFE's
    # reserves, BOP and IIP, central-bank gold. One cluster, deliberately --
    # a TIC China row and SAFE's reserves describe one external position from
    # two sides, and must never be counted as two witnesses to it.
    - external_position
    # FOREIGN SOVEREIGN RATES (ST-2). JGB and CGB yields and offshore
    # funding rates: the other leg of a carry or a spread, separate from the
    # US curve's own group so a spread's two legs are not one reading.
    - foreign_rates
    # FUTURES POSITIONING (ST-2). CFTC Commitments of Traders: what
    # speculators HOLD in a contract, a stock of positions and not a price.
    - futures_positioning
    # PREDICTION MARKETS (6d). Venue-implied probabilities: market beliefs,
    # never facts, with discovery / shock / disagreement rights only -- their own
    # group so a venue move can never confirm a market signal it resembles.
    - prediction_market
    # The correlation layer (AQ-5): one mechanism, however many pairs.
    - cross_asset_correlation

defaults:
  trigger_eligible: false
  status: active
  # Documented so a missing field is a default, not an oversight.
  rationale: >-
    Nothing here may move a decision on its own. No recommendation path exists,
    and the pin-log sample is far too small for any level to have earned it.

# -----------------------------------------------------------------------------
# Exposure engine -- tools/exposure_compute.py
# -----------------------------------------------------------------------------
# Every greek-derived metric below shares mechanism_group dealer_chain_derived,
# which is the same string the engine stamps on each profile. They are four
# derivatives of one object: same open interest, same vol surface, same signing
# assumption. Treating any two of them as independent confirmation is
# double-counting one chain.

metrics:

  # --- GEX family -----------------------------------------------------------
  exposure.net_gex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd_per_point     # Γ·OI·100·S: dollars per one-point move
    description: Raw signed gamma notional across strikes. Underlying quantity.
  exposure.shares_per_1pct:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares_per_1pct
    description: >-
      STORED PRIMARY for gamma. Change in dealer delta, in shares, per 1% move.
  exposure.dollar_gamma_per_1pct:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd_per_1pct
    derived_from: exposure.shares_per_1pct
    description: shares_per_1pct x spot. Derived so the two cannot drift.
  exposure.gross_gex_abs:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd_per_point     # Γ·OI·100·S: dollars per one-point move
    description: >-
      Call-gamma mass plus put-gamma mass, unnetted: the sum of
      |sign x gamma x OI x 100 x spot| over rows. Same units as net_gex. The
      denominator against which the net's sign is read (dealer audit F1).
  exposure.gross_gamma_per_1pct:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd_per_1pct
    derived_from: exposure.gross_gex_abs
    description: gross_gex_abs x 0.01 x spot, the gross counterpart of dollar_gamma_per_1pct.
  exposure.net_to_gross:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: fraction
    derived_from: exposure.gross_gex_abs
    description: >-
      |net_gex| / gross_gex_abs; None when gross is zero. Computed and stored
      only (dealer audit F1); the regime-word gate on it arrives with 6b.
  exposure.gamma_flip:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      Spot at which net dealer gamma changes sign, by scan and bisection.
      Blank is meaningful and flip_reason says which blank it is.
  exposure.gamma_flip_cum_strikes:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      Zero crossing of GEX cumulated across strikes at fixed spot. A DIFFERENT
      question from gamma_flip; the two disagreeing is expected.
  exposure.call_wall:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      The strike with the largest POSITIVE signed GEX across every strike
      (tools/exposure_compute.py _profile). All strikes, not only out-of-the-money;
      exposure.call_wall_otm is the OTM-only definition.
  exposure.put_wall:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: Extreme negative GEX strike, all strikes. Not the tradeable one.
  exposure.put_wall_otm:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      Extreme negative GEX restricted to OTM. Matches the vendor and is the
      tradeable reading. Immune to the at-the-money artifact that broke the
      peak strike, since an ATM strike cannot be an OTM wall.
  exposure.call_wall_otm:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      The strike ABOVE spot with the largest positive signed GEX: the call wall
      restricted to out-of-the-money strikes, the definition FlashAlpha's put_wall
      reproduces on the put side (exposure_compute.py, verified 5 Sep 2026).
  exposure.put_wall_gamma:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      The strike carrying the most PUT gamma notional, which sits near the money
      because gamma peaks there. One of three put-wall definitions printed side by
      side (with put_wall_oi and put_wall_otm), because they answer different
      questions.
  exposure.put_wall_oi:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: calculated
    revision_policy: recomputed
    units: price
    description: Largest OTM put OI shelf. An OI construct, not a gamma one.
  exposure.peak_abs_gex_strike:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      Largest |GEX| strike. EX-0DTE at a settled capture -- with 0DTE in it was
      an artifact of the MIN_T floor and pinned at the money by construction.

  # --- DEX family -----------------------------------------------------------
  exposure.dex_shares:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares
    description: >-
      STORED PRIMARY for delta. What the dealer OPTION BOOK is long; the hedge
      is the opposite sign. One-signed under dealers-hand-v1, so the magnitude
      and its distribution across expiries carry the information and the
      direction carries none.
  exposure.dex_notional:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd
    description: >-
      Dealer option-book delta in dollars: exposure.dex_shares x spot. Derived from
      the shares so the two cannot drift. The sign is what the book is long; the
      hedge is the opposite sign.
    derived_from: exposure.dex_shares
  exposure.abs_dex_shares:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares
    description: Gross delta, as a denominator that does not cancel.
  exposure.expiration_release.dex_shares:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: monthly
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares
    description: >-
      Dated dealer-delta unwind: hedge scheduled to be released at one expiry.
      Mechanical consequence of contracts expiring, not a forecast.
  exposure.expiration_release.share_of_abs_dex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: monthly
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: fraction
    description: >-
      One expiry's share of the absolute dealer delta across all expiries,
      |dex_shares| over the sum of |dex_shares|, 0..1 -- how much of the book's
      delta that expiry releases when it expires.

  # --- VEX / CHEX -----------------------------------------------------------
  exposure.vex_shares_per_volpt:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares_per_volpt
    description: >-
      Vanna. VOL-TRIGGERED: does nothing until IV moves. Collapses to ~0 in
      0DTE, which is a property of the greek and not a data fault.
  exposure.vex_notional_per_volpt:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd_per_volpt
    description: >-
      Vanna exposure in dollars per one implied-vol point:
      exposure.vex_shares_per_volpt x spot, derived so the two cannot drift.
    derived_from: exposure.vex_shares_per_volpt
  exposure.chex_shares_per_day:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares_per_day
    description: >-
      Charm. TIME-TRIGGERED: resolves over hours to days, not on a price move.
      Diverges as 1/sqrt(T), which is why a settled capture reports none for
      0DTE and why the intraday cadence will need a fractional time to expiry.
  exposure.chex_notional_per_day:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd_per_day
    description: >-
      Charm exposure in dollars per calendar day of time passing:
      exposure.chex_shares_per_day x spot, derived so the two cannot drift.
    derived_from: exposure.chex_shares_per_day

  # --- per-strike profile ---------------------------------------------------
  # The aggregates above are sums of these. Registered separately because a
  # reader can act on the SHAPE -- where the exposure sits across strikes --
  # without ever touching the scalar, and a shape is a different claim.
  exposure.per_strike.gex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd
    description: Signed dealer gamma notional at one strike.
  exposure.per_strike.call_gex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd
    description: >-
      At one strike, the call rows' gamma notional (sign x gamma x OI x 100 x spot),
      in the same terms as exposure.net_gex. With put_gex it splits the strike's
      signed GEX by side.
  exposure.per_strike.put_gex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd
    description: >-
      At one strike, the put rows' gamma notional, stored NEGATIVE (minus the put
      gamma mass), in the same terms as exposure.net_gex. call_gex plus put_gex is
      the strike's signed GEX.
  exposure.per_strike.dex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares
    description: >-
      At one strike, the dealer option book's delta in shares (dealer sign x delta x
      OI x 100), summed over the strike's rows.
  exposure.per_strike.vex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares_per_volpt
    description: >-
      At one strike, the dealer book's vanna in shares of delta per one implied-vol
      point.
  exposure.per_strike.chex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares_per_day
    description: >-
      At one strike, the dealer book's charm in shares of delta per calendar day.

  # --- bucket shares --------------------------------------------------------
  exposure.share_of_total_abs_gex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: fraction
    description: >-
      An expiry bucket's share of the absolute GEX across every bucket, 0..1. Null
      for a settled 0DTE bucket, which reports open interest and refuses greeks.
      Gamma share and delta share differ: 0DTE dominates gamma while carrying little
      delta.
  exposure.share_of_total_abs_dex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: fraction
    description: >-
      Deliberately separate from the gamma share: 0DTE dominates gamma while
      carrying little delta, and one number cannot say both.
  exposure.floored_share_of_abs_gex:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: fraction
    description: >-
      Share of a bucket's |GEX| resting on the MIN_T floor. MIN_T is a guard
      and must never be load-bearing; past 5% the bucket flags itself.

  # --- OI structure (a different mechanism from the greeks) -----------------
  exposure.max_pain:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: calculated
    revision_policy: recomputed
    units: price
    description: >-
      Strike minimising total ITM payout. An OI construct: unaffected by the
      MIN_T floor, so it reads every row including settled 0DTE.
  exposure.oi_total:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: observed
    revision_policy: never
    units: count
    description: >-
      Open interest summed over the rows, calls plus puts, in contracts
      (exposure_compute.py _oi_structure). An observed fact about what was
      outstanding, reported even where greeks are refused.
  exposure.oi_calls:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: observed
    revision_policy: never
    units: count
    description: >-
      Call open interest summed over the rows, in contracts.
  exposure.oi_puts:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: observed
    revision_policy: never
    units: count
    description: >-
      Put open interest summed over the rows, in contracts.
  exposure.oi_put_call_ratio:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    description: >-
      Put open interest over call open interest, rounded to four places; null when
      there is no call OI.
  exposure.oi_strikes:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: observed
    revision_policy: never
    units: count
    description: >-
      The number of distinct strikes among the rows.
  exposure.spot:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: expiry_rewrite
    observation_type: observed
    revision_policy: never
    units: price
    description: >-
      For massive-sourced symbols this is derived from the put-call parity
      forward, not a printed index level; spot_source records which.

  # --- data-quality gates ---------------------------------------------------
  gates.data_quality:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    description: ok / degraded / excluded. Governs whether a day may enter a base rate.
  gates.liquidity_floor:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: boolean
    description: >-
      The liquidity hard rule (tools/quality_gates.py): total OI and total volume
      must each clear their declared thresholds (config.LIQUIDITY_MIN_TOTAL_OI,
      LIQUIDITY_MIN_TOTAL_VOLUME). False excludes the symbol from skew and OI-
      percentile work; it is not downgraded.
  gates.iv_dispersion:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    description: Normalised IV surface roughness. Threshold PROVISIONAL, uncalibrated.
  gates.oi_concentration:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    description: OI Herfindahl and effective strike count.
  gates.oi_weighted_dte:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: days
    description: >-
      Open-interest-weighted days to expiry over the chain's rows
      (tools/quality_gates.py): one number for whether positioning is short or long
      dated. Informational, not a pass or fail.

  # --- pin outcomes ---------------------------------------------------------
  # A different mechanism from the levels themselves: these measure whether a
  # level was reached, which is evidence ABOUT the levels, not more of it.
  pin.dist_bps:
    source: yfinance
    mechanism_group: pin_outcome
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: bps
    description: >-
      Signed distance from a scored level to the close. Applies to max_pain,
      peak_gex, call_wall, put_wall, call_wall_otm, put_wall_otm.
  pin.hit:
    source: yfinance
    mechanism_group: pin_outcome
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: boolean
    description: >-
      |dist_bps| within config.PIN_TOLERANCE_BPS. A CONDITIONER, not a signal,
      until effective n is meaningful -- the sample is currently one session.

  # --- Portfolio Truth (architecture 26.11 Gate 1) --------------------------
  # Read-only broker state. native_horizon is intraday because each row is an
  # instant, not a period: NAV describes the moment it was read.
  portfolio.nav:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
    description: Net liquidation value. The account's mark-to-market worth.
  portfolio.cash:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
    description: >-
      IBKR account summary TotalCashValue, in the account's base currency (USD): the
      paper account's cash (altdata/sources/ibkr_portfolio.py ACCOUNT_TAGS).
  portfolio.buying_power:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
    description: >-
      IBKR account summary BuyingPower, USD: what the paper account may buy on
      margin.
  portfolio.gross_position_value:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
    description: >-
      IBKR account summary GrossPositionValue, USD: the sum of the absolute values
      of every position.
  portfolio.init_margin:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
    description: >-
      IBKR account summary FullInitMarginReq, USD: the initial margin the account's
      positions require.
  portfolio.maint_margin:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
    description: >-
      IBKR account summary FullMaintMarginReq, USD: the maintenance margin the
      positions require.
  portfolio.excess_liquidity:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
    description: >-
      IBKR account summary ExcessLiquidity, USD: equity with loan value less
      maintenance margin -- the cushion before liquidation.
  portfolio.available_funds:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
    description: >-
      IBKR account summary AvailableFunds, USD: equity with loan value less initial
      margin.
  portfolio.cushion:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: ratio
    description: >-
      Excess liquidity as a fraction of net liquidation. The margin-stress
      reading; the one to watch rather than the absolute margin figures.
  portfolio.position_qty:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: shares
    description: >-
      Signed position size, keyed `<localSymbol>@<venue>.<currency>`. localSymbol
      alone was the key until 19 September 2026 and was not unique: it separates
      two options on one underlying but not a cross-listing, so SPY on ARCA in
      USD and SPY on MEXI in MXN both keyed to `SPY` and the store silently kept
      only one of them. The conId is recorded as portfolio.position_con_id.
  portfolio.position_avg_cost:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: price
    description: >-
      Average cost in the contract's own currency, per portfolio.position_currency.
  portfolio.position_market_value:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: contract_ccy
    description: >-
      Market value in the CONTRACT's currency, not the account's -- declared
      `usd` until 19 September 2026, which was wrong for any non-USD listing and
      read a 1,313,769-peso short as a 1.3-million-dollar one. Convert before
      comparing or summing; portfolio.gross_position_value is IBKR's own
      base-currency total and is the figure to use for the book as a whole.
  portfolio.position_unrealized_pnl:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: contract_ccy
    description: >-
      Unrealized P&L in the contract's currency, per portfolio.position_currency.
  portfolio.position_currency:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: label
    description: >-
      ISO currency of the contract, and therefore of this holding's avg_cost,
      market_value and unrealized_pnl. Recorded per holding so no reader has to
      infer it from the instrument key.
  portfolio.position_con_id:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: count
    description: >-
      IBKR's contract id -- the authoritative identifier for the holding. Not
      the store key, because the key is read by humans in the close report and a
      conId is opaque; recorded so the unambiguous id is still on the record.

# -----------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # GRADES (Phase 3). Every one is `calculated` and every one is
  # trigger_eligible: false -- and that second fact is not a placeholder waiting
  # to be flipped. A grade is the measurement by which a metric might EARN
  # trigger eligibility; letting the grade itself move a decision would close
  # the loop on itself. Nothing in this block should ever become true.
  #
  # revision_policy is `recomputed`, which is the honest reading: the grader
  # stamps every row with a method_version, and a methodology change rewrites the
  # grade rather than the source restating anything. Two grades of one decision
  # are comparable only if that version matches.
  #
  # information_half_life is `permanent`. A graded outcome is a historical fact
  # about a decision that has already resolved; it does not decay.
  calc.breadth_sector_above_50d:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_share
    sample: sector_etf_proxy
    delta_unit: pp
    trigger_eligible: false
    description: >-
      Share of the ELEVEN SPDR SECTOR ETFs trading above their own 50-day average.
      NOT MARKET-WIDE BREADTH, and `sample: sector_etf_proxy` is the reason it can
      never be described as such: real breadth counts ~500 constituents, while
      eleven cap-weighted sector funds are eleven portfolios -- in a market led by
      four megacaps XLK can sit above its average while most of its own holdings
      sit below theirs. The proxy moves with breadth and UNDERSTATES narrowness,
      which is the direction that matters, so it is worth having and worth
      labelling. A partial sample emits nothing: eight of eleven reporting would
      make the denominator the finding.
  calc.breadth_sector_above_200d:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_share
    sample: sector_etf_proxy
    delta_unit: pp
    trigger_eligible: false
    description: >-
      The same share against the 200-day average -- the slower participation read.
      Same proxy caveat, same reason.
  calc.breadth_rsp_over_spy:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      RSP/SPY: equal weight over cap weight. The honest half of the breadth
      reading -- a participation measure that needs no constituent data and
      carries no proxy caveat, because the two funds hold the same universe
      weighted two ways.
  yf.forward_eps:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: usd
    trigger_eligible: false
    description: >-
      Consensus forward EPS for one name, read nightly. REVISED by construction -- a consensus is restated whenever an analyst moves, which is the whole point of logging it daily. NOT SERVED FOR ETFs: no analyst covers a wrapper, so the sector funds and SPY/QQQ/IWM carry no forward estimate and an index-level forward multiple needs a holdings-weighted build this does not do.
  spdji.op_eps_est_q:
    source: spdji
    mechanism_group: consensus_estimate
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: usd
    trigger_eligible: false
    description: >-
      S&P DJI's bottom-up operating EPS estimate for the S&P 500, one quarter per row (instrument = the quarter, "2027Q2"), from the estimates block of sp-500-eps-est.xlsx. One vintage per monthly drop, observed on the workbook's own "as of" date. AVAILABILITY RULE (ruled 13 Oct 2026): available_at = the as-of date plus one business day (the next NYSE session), at the end of that day in New York, availability_kind reconstructed, because S&P DJI posts the workbook a day or more after its as-of close; retrieved_at (spdji.eps_drop) stays the drop time. A later drop's estimate for the same quarter is a new row on its own date, never a restatement of this one. Revisions are read across drops (altdata/return_attribution.py). Inbox only: the host refuses non-browser clients.
  spdji.fwd12m_op_eps:
    source: spdji
    mechanism_group: consensus_estimate
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: usd
    trigger_eligible: false
    description: >-
      The S&P 500's forward twelve-month bottom-up operating EPS: the sum of the first four estimated quarters ending after the workbook's "as of" date, one row per drop. The quarters summed are in that drop's spdji.eps_drop record. AVAILABILITY RULE (ruled 13 Oct 2026): available_at = the as-of date plus one business day (the next NYSE session), at the end of that day in New York, availability_kind reconstructed (S&P DJI posts a day or more after its as-of); retrieved_at stays the drop time.
  spdji.eps_drop:
    source: spdji
    mechanism_group: consensus_estimate
    native_horizon: monthly
    freq: monthly
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      One record per drop of sp-500-eps-est.xlsx: file, sha256, as_of (the workbook's cell), retrieved_at (the drop time, the inbox file's modification time carried over from Drive by rclone copyto), the forward quarters and the layout version. Its available_at is retrieved_at: the store has no retrieved_at column, so the drop time lives here.
  index.forward_pe:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: revised
    units: ratio
    status_extra: not_yet_sourced
    trigger_eligible: false
    description: >-
      INDEX-LEVEL forward P/E for SPY/QQQ/IWM and the sector ETFs. NOT_YET_SOURCED:
      yfinance serves forward estimates for individual stocks and returns None for
      every ETF, because no analyst covers a wrapper. Getting this needs a
      holdings-weighted build from constituent estimates -- each fund's weights times
      its members' forward EPS -- or a vendor that sells the aggregate. Registered so
      the gap is a reviewable item rather than something rediscovered each quarter.
      THE PER-NAME SERIES STAYS: yf.forward_eps and yf.forward_pe are logged nightly
      for the 13 tracked stocks and are unaffected by this.
  yf.forward_pe:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: ratio
    trigger_eligible: false
    description: >-
      Consensus forward P/E for one name. Same ETF limitation as yf.forward_eps.
  yf.trailing_eps:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: usd
    trigger_eligible: false
    description: >-
      Trailing twelve-month EPS. Revised when a company restates.
  yf.trailing_pe:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: ratio
    trigger_eligible: false
    description: >-
      Trailing P/E. The ONE multiple the ETFs do carry, which is why they are logged at all rather than skipped.
  yf.analyst_count:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: count
    trigger_eligible: false
    description: >-
      Number of analyst opinions behind the consensus. A forward estimate from three analysts and one from fifty-nine are not the same number, and nothing else in the row says which it is.
  yf.target_mean_price:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: usd
    trigger_eligible: false
    description: >-
      Mean analyst target price. Logged for the same reason as the consensus itself: its REVISIONS are the signal, not its level.
  ibkr.auction_indicative_price:
    source: ibkr_md_nyse_imbalances
    mechanism_group: auction_flow
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: price
    trigger_eligible: false
    description: >-
      The indicative closing price published during the 15:50-16:00 auction window. observed_at is the TICK INSTANT, not the session: the shape of this through the window is the whole reason to sample it.
  ibkr.auction_paired_qty:
    source: ibkr_md_nyse_imbalances
    mechanism_group: auction_flow
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Paired quantity -- shares that will cross at the indicative price. The denominator any absorption measure would need, and absorption itself is 6h and gated.
  ibkr.auction_imbalance_qty:
    source: ibkr_md_nyse_imbalances
    mechanism_group: auction_flow
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Unpaired imbalance in shares. DISPLAY-ONLY by ruling: the raw number says how much wants to trade one way, and says nothing about what the price did with it. Nothing reads this to make a decision.
  ibkr.auction_imbalance_side:
    source: ibkr_md_nyse_imbalances
    mechanism_group: auction_flow
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      The imbalance's sign as a label: +1 buy, -1 sell, 0 balanced. Stored separately from the quantity so a query can ask 'which way' without arithmetic on a signed field.
  ibkr.auction_probe:
    source: ibkr_md_nyse_imbalances
    mechanism_group: auction_flow
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      The stored entitlement probe: whether this account can see the auction feed,
      recorded EITHER WAY. A dormant sampler with a stored probe result is a
      decision; a dormant sampler with nothing written down is something somebody
      forgot. States: entitled, not_entitled, inconclusive_closed (outside the
      window no tick publishes even with a full entitlement, so silence proves
      nothing), inconclusive_silent, probe_failed.
  finra.short_volume:
    source: finra
    mechanism_group: short_flow
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Shares SOLD SHORT during one session, from FINRA's Reg SHO daily file, for every symbol with at least 1,000,000 shares of FINRA-reported total volume that session plus the tracked universe (AUD-1, 14 Oct 2026; until then the tracked universe only, so a name's history before it was tracked is absent). THIS IS NOT SHORT INTEREST. It is a FLOW and it includes a market maker shorting to fill a buy order and covering nine seconds later -- a stock can print 45 percent short volume every day for a year with no net short position at all. Short interest is the STOCK of shares still held short and is finra.short_interest. The ratio of one to the other is not a meaningful number.
  finra.total_volume:
    source: finra
    mechanism_group: short_flow
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Total volume from the same file -- FINRA-reported venues, not the consolidated tape -- stored so the short-volume SHARE can be computed without joining a second source whose volume definition differs. The same instrument set as finra.short_volume: this series is the floor's test.
  finra.short_exempt_volume:
    source: finra
    mechanism_group: short_flow
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Short-exempt volume from the same file, for the same instrument set as finra.short_volume. Small, and separate because an exempt short is a different act from a regular one.
  finra.short_interest:
    source: finra
    mechanism_group: short_stock
    native_horizon: daily
    information_half_life: month
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: shares
    trigger_eligible: false
    description: >-
      Shares still held short at a settlement date -- a STOCK, published semi-monthly with roughly a fortnight's lag. NOT finra.short_volume, which is the daily flow: they answer different questions and move differently. Revisable, because FINRA restates.
  finra.short_interest_prior:
    source: finra
    mechanism_group: short_stock
    native_horizon: monthly
    information_half_life: month
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: shares
    trigger_eligible: false
    description: >-
      The PRIOR settlement date's short interest, as FINRA reports it alongside the current one. Stored rather than derived by subtraction because FINRA's own pairing accounts for splits and re-listings that a naive lag would get wrong.
  finra.short_interest_avg_volume:
    source: finra
    mechanism_group: short_stock
    native_horizon: monthly
    information_half_life: month
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: shares
    trigger_eligible: false
    description: >-
      Average daily volume over the settlement period, as FINRA computes it. The denominator of days-to-cover, stored so that figure can be checked rather than taken.
  finra.short_interest_days_to_cover:
    source: finra
    mechanism_group: short_stock
    native_horizon: monthly
    information_half_life: month
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: days
    trigger_eligible: false
    description: >-
      FINRA's own days-to-cover: short interest divided by average daily volume. A VENDOR CALCULATION, logged as given rather than recomputed -- and note it mixes a STOCK (the position) with a FLOW (volume), so it is a rough measure of crowding and not a forecast of how long a cover would take.
  apewisdom.mentions:
    source: apewisdom
    mechanism_group: social_attention
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: count
    trigger_eligible: false
    description: >-
      Mention count for one ticker on one venue in the trailing day. TICKER@all-stocks is every ticker on every page ApeWisdom serves for the all-stocks filter (AUD-1, 14 Oct 2026; until then the tracked universe only); TICKER@wallstreetbets is the tracked universe. The instrument carries the FEED because a count on one venue and a count across all of them are measurements of different populations and must never be summed.
  apewisdom.rank:
    source: apewisdom
    mechanism_group: social_attention
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: count
    trigger_eligible: false
    description: >-
      The ticker's rank by mentions on that venue, for the same instrument set as apewisdom.mentions. Rank moves when OTHER tickers move, which is why the raw count is stored beside it.
  apewisdom.upvotes:
    source: apewisdom
    mechanism_group: social_attention
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: count
    trigger_eligible: false
    description: >-
      Upvotes on the counted mentions, for the same instrument set as apewisdom.mentions -- an intensity measure beside the volume one.
  ibkr.shortable_shares:
    source: ibkr_paper
    mechanism_group: borrow_terms
    native_horizon: daily
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Shares the broker shows as available to short. DORMANT ON THIS ACCOUNT: the probe returns 10358 (fundamentals data is not allowed) and the field is NaN. Registered so the series exists the day the entitlement does.
  ibkr.borrow_fee_rate:
    source: ibkr_paper
    mechanism_group: borrow_terms
    native_horizon: daily
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: percent_rate
    trigger_eligible: false
    description: >-
      Indicative annualised borrow fee. Dormant for the same reason.
  ibkr.borrow_rebate_rate:
    source: ibkr_stock_loan
    mechanism_group: borrow_terms
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: percent_rate
    trigger_eligible: false
    description: >-
      Annualised rebate rate from IB's public stock-loan file. A NEGATIVE rebate is
      normal for a hard-to-borrow name and is not an error -- it means the short
      pays rather than receives. Registered empty: the host does not answer.
  ibkr.stock_loan_file_probe:
    source: ibkr_stock_loan
    mechanism_group: borrow_terms
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      Every route to IB's public stock-loan file, tried and recorded: the anonymous
      FTP account and three HTTPS mirror candidates. States: available, unreachable.
      Currently unreachable -- ftp3.interactivebrokers.com resolves and answers on no
      port from two networks, and the mirrors 404.
  ibkr.borrow_probe:
    source: ibkr_paper
    mechanism_group: borrow_terms
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      The stored borrow-entitlement probe, recorded either way. States: entitled,
      not_entitled, probe_failed, never_probed. This account reads not_entitled.
  zec.price_usd:
    source: yfinance
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: price
    trigger_eligible: false
    description: >-
      ZEC close in USD. Daily, including weekends: a chain does not keep exchange hours, which is why it is not in the equity price basket and not subject to its session filter.
  zec.realized_vol_20d:
    source: yfinance
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: vol_pct
    trigger_eligible: false
    description: >-
      Annualised realized volatility of ZEC's 20-day log returns, on a 365-DAY year rather than 252 -- annualising a seven-day-a-week series on a trading-day count would overstate it by about 20 percent.
  zec.beta_to_btc_60d:
    source: yfinance
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      ZEC's beta to BTC over 60 overlapping days, from log returns. Computed on the days both series traded; BTC comes from the price basket, so the two are the same vintage.
  zec.btc_ratio:
    source: yfinance
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      ZEC divided by BTC. A RELATIVE PRICE and explicitly NOT a share of crypto market capitalisation -- see zec.crypto_cap_share for why the two are not interchangeable.
  zec.shielded_tx_share:
    source: blockchair
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: fraction
    trigger_eligible: false
    description: >-
      Share of ZEC TRANSACTIONS using a shielded pool -- a FLOW. STILL NO SOURCE, and
      registered empty on purpose. Seven candidates have been probed; the one that
      answers (zcashexplorer) serves `valuePools`, which is the shielded share of
      SUPPLY and is logged separately as zec.shielded_value_share. The two are not
      interchangeable and neither substitutes for the other: a value share is what is
      held, this is what moved. zec.shielded_probe records every candidate's answer so
      the gap is not re-investigated.
  zec.crypto_cap_share:
    source: coingecko
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: fraction
    trigger_eligible: false
    description: >-
      ZEC's market capitalisation divided by the total, both from CoinGecko, from
      6 Oct to 12 Oct 2026. NOT SOURCED FROM 13 OCT 2026: the total has no free
      source whose terms permit stored vintages (crypto.total_market_cap_usd), so
      nothing writes this series; its stored history stays, dated, and the Monthly
      prints it as "not sourced -- <reason>" rather than reading its last value as
      current. zec.btc_ratio is a different number -- a relative price, not a share
      of a market.
  zec.market_cap_usd:
    source: defillama
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: usd
    trigger_eligible: false
    description: >-
      ZEC's market capitalisation in USD. From DefiLlama's coin service
      (coins.llama.fi/mcaps, coingecko:zcash) from 13 Oct 2026, the same reading as
      the crypto basket's caps; read keylessly from CoinGecko 6 to 12 Oct, rows
      which stay with source coingecko. FORWARD-ONLY: the coin service serves the
      current value and no history, so this series grows from the day it is read;
      the day is the service's own timestamp's UTC day.
  crypto.total_market_cap_usd:
    source: coingecko
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: usd
    trigger_eligible: false
    description: >-
      Total crypto market capitalisation in USD, from CoinGecko's /global endpoint,
      6 to 12 Oct 2026. STOPPED 13 OCT 2026 at its last stored value, which stays in
      the store dated: CoinGecko's terms discourage storing data and provide for no
      keyless plan, and no free source whose terms permit stored vintages serves the
      total (CoinPaprika's free plan is non-commercial and bars derivative works;
      CoinLore bars copying and data mining; DefiLlama serves no total). The
      verdict and the terms are in docs/briefs/crypto-basket-notes.md.
  zec.cap_probe:
    source: defillama
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      The stored capitalisation read, nightly. From 13 Oct 2026 it is DefiLlama's
      coin service for ZEC (states: available, partial, error) and carries `total:
      not_sourced` with the reason; until then it was the CoinGecko probe, whose
      rows keep source coingecko.
  zec.pool_value:
    source: zcashexplorer
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: count
    trigger_eligible: false
    description: >-
      ZEC held in one value pool, instrument-keyed by pool name (transparent, sprout,
      sapling, orchard, lockbox, ironwood). From zcashd's own blockchain-info via
      zcashexplorer. A STOCK -- the balance sitting in the pool -- not a measure of
      activity through it.
  zec.shielded_value_share:
    source: zcashexplorer
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: fraction
    trigger_eligible: false
    description: >-
      Share of ZEC supply held in the three DOCUMENTED user-shielded pools -- sprout,
      sapling and orchard. First read 5.414 percent.
      IT IS NOT zec.shielded_tx_share AND THE TWO ARE NOT INTERCHANGEABLE: this is a
      STOCK (what is held shielded) and that is a FLOW (how much of today's activity
      used a shielded pool). A chain can hold a third of its supply shielded with
      almost no shielded activity, or the reverse -- the same distinction that keeps
      finra.short_interest and finra.short_volume in separate mechanism groups.
      WHICH POOLS COUNT IS DECLARED, not inferred from "not transparent". `lockbox` is
      the NU6 development-fund reserve, which is protocol accounting rather than a
      user's privacy decision, and `ironwood` holds nearly a quarter of supply with
      semantics this code has not verified. Both are logged as zec.pool_value and
      EXCLUDED here: including them would read 29.4 percent instead of 5.4, and a
      number that large should not move a headline on a guess. A pool the code has
      never seen is reported and logged at WARNING rather than averaged in.
  zec.shielded_probe:
    source: blockchair
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      Every candidate explorer's answer, recorded nightly. Run every night rather
      than once because an explorer GAINING the shielded field is the event this
      logger waits for, and nobody will re-check by hand. States: available,
      no_shielded_field.
  ndl.rtat10_activity:
    source: nasdaq_data_link
    mechanism_group: retail_activity
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: fraction
    sample: top10_censored
    trigger_eligible: false
    description: >-
      Daily retail activity share for a ticker in Nasdaq's RTAT10 -- the TEN names
      with the most retail activity. A ticker's absence means "not in the top ten",
      NOT "no retail activity", and the two are only the same if you forget which
      table you are reading. Instrument-keyed.
  ndl.rtat10_sentiment:
    source: nasdaq_data_link
    mechanism_group: retail_activity
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: count
    sample: top10_censored
    trigger_eligible: false
    description: >-
      Nasdaq's RTAT sentiment score for the same ten names. A vendor construct with
      no published formula in the API response, logged as given.
  ndl.rtat10_concentration:
    source: nasdaq_data_link
    mechanism_group: retail_activity
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    sample: top10_censored
    trigger_eligible: false
    description: >-
      Herfindahl of activity share across the VISIBLE TEN, plus the top name's
      share of them. An UPPER BOUND on the retail concentration of the whole
      market: the invisible tail is flatter than anything this table can show.
      Reads insufficient_history until 60 sessions exist.
  ndl.rtat10_persistence:
    source: nasdaq_data_link
    mechanism_group: retail_activity
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: days
    sample: top10_censored
    trigger_eligible: false
    description: >-
      Consecutive days a ticker has been IN THE TOP TEN. A ticker that slips to
      eleventh reads as a broken run that did not break -- the censoring is the
      whole caveat. Reads insufficient_history until 60 sessions exist.
  ndl.rtat10_new_entrants:
    source: nasdaq_data_link
    mechanism_group: retail_activity
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: count
    sample: top10_censored
    trigger_eligible: false
    description: >-
      Arrivals into the visible ten since the prior session. A measure of TURNOVER
      AT THE BOUNDARY rather than of new retail interest: a name entering at tenth
      displaced one that was tenth. Reads insufficient_history until 60 sessions.
  calc.spy_vs_252d_high:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    delta_unit: pp
    trigger_eligible: false
    description: >-
      SPY's close against its own 252-session high, in percent: 0 at a new high and
      negative below it. The price leg of the price_vs_breadth contradiction row,
      replacing SPY's LEVEL percentile -- which in any uptrend sits near the top of
      its five-year distribution almost every day, making the leg nearly constant
      and the divergence it measures nearly invisible. Distance from the running
      high is ~0 at a new high and falls away at once, which is what "making new
      highs while participation narrows" means.
  cfe.vx_settle:
    source: cboe
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: price
    trigger_eligible: false
    description: >-
      One VX monthly contract's daily settlement, in volatility points. The
      INSTRUMENT is the contract's expiry date, so the series is per contract and
      the curve is assembled from it rather than stored twice. revision_policy is
      `never` -- a settlement price is final, which is what makes a reconstructed
      availability defensible for it.
  cfe.vx1:
    source: cboe
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: price
    trigger_eligible: false
    description: >-
      The front MONTHLY VX settlement for a session, assigned by expiry order on
      that date rather than by contract. Weekly VX contracts are deliberately
      excluded: VX1 in 30.8's state machine means the front monthly, and a weekly
      in the front slot would move the slope every Wednesday for reasons that have
      nothing to do with the curve.
  cfe.vx2:
    source: cboe
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: price
    trigger_eligible: false
    description: The second monthly VX settlement, same assignment rule as cfe.vx1.
  cfe.vx3:
    source: cboe
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: price
    trigger_eligible: false
    description: The third monthly VX settlement, same assignment rule as cfe.vx1.
  cfe.vx_probe:
    source: cboe
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      Which Cboe endpoints answered and which refused, stored so a route that
      stops working is a recorded fact rather than something to re-probe. Three of
      the four probed return 403: the all-products daily settlement file, the
      directory listing and the delayed-quote API. Only the per-contract history
      answers, which is why this module computes expiry dates instead of reading a
      listing.
  calc.vx_front_slope:
    source: derived_state
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    delta_unit: raw
    trigger_eligible: false
    description: >-
      VX2 minus VX1, in VOLATILITY POINTS. units is `ratio` because the vocabulary
      has no vol-point member and `price` would make its delta a percent of a
      difference, which is meaningless; delta_unit `raw` is the override that keeps
      a change in the slope reported in the points it is measured in.
  calc.vx_front_ratio:
    source: derived_state
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      VX2 divided by VX1 -- the CHAMPION for the vol dial's term-structure leg. A
      ratio and not the slope, because the leg is banded on a ratio and the
      challenger it is measured against (calc.vix3m_over_vix) is one: a champion in
      points and a challenger as a ratio could not be printed side by side, which
      is the entire purpose of the dual run.
  calc.vx1_vix_basis:
    source: derived_state
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    delta_unit: raw
    trigger_eligible: false
    description: >-
      VX1 minus VIX, in volatility points -- THE NUMBER THE PROXY CANNOT SEE.
      VIX3M/VIX is two implied volatilities of the same index, so it moves with the
      curve but can never show a futures-to-index dislocation: both its legs ARE
      the index. This is that dislocation, and it is the standing reason the proxy
      carries `proxy_for: vx_futures_curve` rather than being treated as the curve.
  calc.vix3m_over_vix:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    proxy_for: vx_futures_curve
    trigger_eligible: false
    description: >-
      VIX3M divided by VIX: the ratio of three-month to one-month IMPLIED VOLATILITY
      OF THE INDEX. IT IS NOT THE VX FUTURES CURVE and must never be described as
      one. The curve is the price of VX futures -- tradeable instruments with their
      own supply, their own roll and their own basis to spot VIX -- and 30.8's state
      machine is defined on VX1/VX2/VX3. This ratio moves with that curve most of the
      time and is a different object: it cannot show a roll, it cannot show a
      dislocation between the futures and the index, and it is not something anyone
      can trade.
      It is here because it is FREE AND SAME-DAY, where the curve needs the CFE
      Enhanced subscription. `proxy_for: vx_futures_curve` is the standing caveat.
      When VX1-VX3 arrive, both run a quarter as champion and challenger before
      either is retired -- see config/market_state.yaml.
  calc.cyclical_over_defensive:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      XLY/XLP -- consumer discretionary over consumer staples. What the equity
      market is paying for growth, read as a ratio of two funds on the same tape
      so a general re-rating cancels out. The second leg of the growth_vs_cyclicals
      contradiction row: the growth DIMENSION says what the macro data shows, this
      says what the tape is willing to pay for it.
  calc.trend_spy_vs_50d:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    trigger_eligible: false
    description: >-
      SPY's close against its own 50-day average, in percent. Split-adjusted,
      dividend-unadjusted closes -- the same series the pin log and the exposure
      engine speak in.
  calc.trend_spy_vs_200d:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    trigger_eligible: false
    description: SPY's close against its own 200-day average, in percent.
  calc.trend_spy_ma20_slope:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    trigger_eligible: false
    description: >-
      Percent change in SPY's 20-day average over 20 sessions -- direction rather
      than position, so a market above its average but rolling over is
      distinguishable from one above its average and rising.
  calc.vol_spy_realized_20d:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: vol_pct
    trigger_eligible: false
    description: >-
      Annualised realized volatility of SPY's 20-session log returns, in percent.
      The leg the vol dial was missing: VIX alone is an implied number with nothing
      to be rich or cheap against.
  # -------------------------------------------------------------------------
  # THE MACRO TRANSFORMS, ported out of monthly_macro/compute.py.
  #
  # Each of these WAS a function one report called over the CSV store at render
  # time: one number, no history, no percentile, and unreadable by the
  # market-state object that has a macro dial to fill. Registered here they are
  # series like any other -- and the object's liquidity, rates and growth
  # dimensions read three of them.
  #
  # `delta_unit: pp` on every rate-of-change series, deliberately. `units:
  # percent` would otherwise make their deltas basis points, and core PCE going
  # 3.29% -> 3.41% is +12 BASIS POINTS in a rates-desk sentence and +0.12
  # PERCENTAGE POINTS in a macro one. These are macro series; a reader of the
  # Monthly means points.
  # -------------------------------------------------------------------------
  # THE STORE-WIDE MOVE SCREEN (Audit #4 Category 1 items 1 and 5; SR-46 b-d):
  # altdata/move_screen.py. Each row is JSON, observed_at the session and
  # available_at the compute instant, so the false-flag base rates accrue
  # point-in-time and the scorecard can grade a flag later. Report-only rights.
  screen.move:
    source: derived_state
    mechanism_group: move_screen
    native_horizon: daily
    freq: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      One row per series past 2.5 sigma on the session, instrument = the series
      ("<key>" or "<key>@<instrument>"): its 1-day and 5-day z against its own
      five-year history of such changes, the change in its unit (log for a price,
      difference otherwise), and the false-flag base rate k/N.
  screen.move_summary:
    source: derived_state
    mechanism_group: move_screen
    native_horizon: daily
    freq: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      The session's screen as a whole: how many series were screened and flagged,
      the series skipped for want of 500 observations, the prediction-market
      families too short to pool, and SR-35's 10-year companion.
  screen.em:
    source: derived_state
    mechanism_group: move_screen
    native_horizon: daily
    freq: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      SR-46(b, c): the EM basket's dispersion against its co-movement (systemic,
      idiosyncratic, mixed, quiet), in stress terms, and the EM spread family's
      levels and percentiles.
  screen.em_contagion:
    source: derived_state
    mechanism_group: move_screen
    native_horizon: daily
    freq: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      SR-46(d): one single-country shock, instrument "<country>:<shock date>",
      with its five-session window and its status -- watching, passed (to the
      basket or to EM spreads, and when) or lapsed.
  calc.net_liquidity:
    source: derived_state
    mechanism_group: macro_liquidity
    native_horizon: weekly
    freq: weekly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: usd
    trigger_eligible: false
    description: >-
      The Fed balance sheet less the reverse repo facility less the Treasury
      General Account, IN DOLLARS. The liquidity dimension's primary member: it is
      the stock of central-bank money actually in the system, where WALCL alone
      counts money parked at the RRP and sitting in the TGA as though it were
      circulating.
      WEEKLY, and same-day only. WALCL and WTREGEN print on Wednesdays and RRP is
      daily, so the series is the intersection -- 211 rows over this store's
      history -- rather than a daily number carrying two stale legs forward.
      THE UNITS ARE THE WHOLE DIFFICULTY. WALCL and WTREGEN are in MILLIONS and
      RRPONTSYD is in BILLIONS; the three are normalised to dollars before
      subtraction. monthly_macro/compute.py had TGA as billions and returned
      -823.6 trillion for its entire life. NET_LIQUIDITY_BAND in
      altdata/market_features.py declares the plausible range and
      tools/validate_regime.py group I asserts both sides of it.
  calc.sahm_rule:
    source: derived_state
    mechanism_group: macro_labor
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_share
    delta_unit: pp
    trigger_eligible: false
    description: >-
      The Sahm recession indicator: the 3-month average of U-3 less the LOWEST
      3-MONTH AVERAGE of the trailing twelve months, in percentage points. Sahm's
      own threshold is 0.50.
      THE DEFINITION MATTERS AND WAS WRONG BEFORE. compute.py took the low of the
      raw monthly LEVELS rather than of the 3-month averages. The raw low is never
      above the averaged low, so the old reading was biased toward the trigger --
      0.333 against 0.20 on April 2026, a third of the way to a recession call
      that the published definition does not make.
      SUPPORTING MEMBER OF THE GROWTH DIMENSION, never a primary: it is monthly,
      it is a labour-market lag, and `trigger_eligible: false` like everything
      else here.
  calc.yield_curve_2s10s:
    source: derived_state
    mechanism_group: macro_momentum
    native_horizon: daily
    freq: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: bps
    trigger_eligible: false
    description: >-
      The 10-year Treasury yield less the 2-year, in basis points. Both legs on
      the SAME session: a curve built from two different days is not a curve.
      A supporting member of the rates dimension. The dimension's primary is the
      10-year level, because the level is the discount rate everything is priced
      off; the curve is the shape, and shape and level move independently -- an
      inversion at 1% and an inversion at 5% are different worlds.
  calc.real_wages_yoy:
    source: derived_state
    mechanism_group: macro_labor
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    delta_unit: pp
    trigger_eligible: false
    description: >-
      Average hourly earnings year-over-year less CPI year-over-year, in
      percentage points. Negative means the average hour buys less than it did a
      year ago. Computed from calc.yoy_ahe and calc.yoy_cpi rather than from a
      second year-over-year implementation.
  calc.r_real_10y_core_pce:
    source: derived_state
    mechanism_group: macro_momentum
    native_horizon: monthly
