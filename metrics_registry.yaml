# QUOTE CONVENTIONS (W-1.1a item 3): for an FX pair, which currency strengthens
# when the pair's quote rises. EUR/USD is dollars per euro, so EUR/USD up is the
# euro firmer and the dollar softer; USD/JPY is yen per dollar, so USD/JPY up is
# the dollar firmer and the yen weaker. The direction audit
# (daily_cascade/direction.py) reads a sentence about "the dollar" against the
# pair through this, and `aliases` are the names the tables and the prose use.
quote_conventions:
  yfinance.mkt_eurusd:
    pair: EUR/USD
    base: euro
    quote: dollar
    rises: base
    aliases: ["EUR/USD", "EUR/USD (dollars per euro)", "euro-dollar"]
  yfinance.mkt_usdjpy:
    pair: USD/JPY
    base: dollar
    quote: yen
    rises: base
    aliases: ["USD/JPY", "USD/JPY (yen per dollar)", "dollar-yen"]
  yfinance.mkt_usdcny:
    pair: USD/CNY
    base: dollar
    quote: yuan
    rises: base
    aliases: ["USD/CNY", "USD/CNY (yuan per dollar)"]
  yfinance.mkt_dxy:
    pair: DXY
    base: dollar
    quote: basket
    rises: base
    aliases: ["DXY", "the dollar index", "dollar index"]

