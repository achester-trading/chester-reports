  # -------------------------------------------------------------------------
  # TREASURY AUCTIONS (signal-triage order ST-1; altdata/sources/treasury_auctions.py).
  # `auction.*` is the TREASURY auction. The equity closing auction is
  # `ibkr.auction_*`, above, and the two families share nothing but a word.
  # instrument = "<type>:<original term>", observed_at = auction date,
  # available_at = 13:00 ET that day (reconstructed; results are never revised).
  # -------------------------------------------------------------------------
  auction.bid_to_cover:
    source: treasurydirect
    mechanism_group: treasury_supply
    native_horizon: daily
    freq: weekly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: ratio
    trigger_eligible: false
    description: >-
      Bid-to-cover: total tendered over total accepted, as TreasuryDirect publishes it.
  auction.dealer_share:
    source: treasurydirect
    mechanism_group: treasury_supply
    native_horizon: daily
    freq: weekly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: fraction
    trigger_eligible: false
    description: >-
      Share of COMPETITIVE ACCEPTED taken by primary dealers. Dealer + direct + indirect sum to 1; SOMA add-ons and non-competitive awards are outside the denominator. A high dealer share is the dealers absorbing what end buyers would not.
  auction.direct_share:
    source: treasurydirect
    mechanism_group: treasury_supply
    native_horizon: daily
    freq: weekly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: fraction
    trigger_eligible: false
    description: >-
      Share of COMPETITIVE ACCEPTED taken by direct bidders. Dealer + direct + indirect sum to 1; SOMA add-ons and non-competitive awards are outside the denominator. A high dealer share is the dealers absorbing what end buyers would not.
  auction.indirect_share:
    source: treasurydirect
    mechanism_group: treasury_supply
    native_horizon: daily
    freq: weekly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: fraction
    trigger_eligible: false
    description: >-
      Share of COMPETITIVE ACCEPTED taken by indirect bidders (foreign and domestic real money bidding through dealers). Dealer + direct + indirect sum to 1; SOMA add-ons and non-competitive awards are outside the denominator. A high dealer share is the dealers absorbing what end buyers would not.
  auction.high_yield:
    source: treasurydirect
    mechanism_group: treasury_supply
    native_horizon: daily
    freq: weekly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: percent_rate
    trigger_eligible: false
    description: >-
      The auction's stop-out (high) yield, coupons only -- Note, Bond, TIPS. A TIPS high yield is a REAL yield. Stored so the tail can be computed the day a when-issued source exists.
  auction.offering_amount:
    source: treasurydirect
    mechanism_group: treasury_supply
    native_horizon: daily
    freq: weekly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: usd
    trigger_eligible: false
    description: >-
      Offering size in dollars.
  auction.cusip:
    source: treasurydirect
    mechanism_group: treasury_supply
    native_horizon: daily
    freq: weekly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      The auction's CUSIP as text, so a reopening can be told from a new issue under the same instrument.
  auction.tail_bp:
    source: treasurydirect
    mechanism_group: treasury_supply
    native_horizon: daily
    freq: weekly
    status_extra: not_yet_sourced
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: bps
    trigger_eligible: false
