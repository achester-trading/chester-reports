  # ---------------------------------------------------------------------------
  # AQ-8a (change order 10 Oct 2026, section 5): THE GOLD RESIDUAL AND THE
  # YIELDS-UP/DOLLAR-DOWN SERIES. Written by altdata/attribution.py from
  # config/attribution.yaml; rights ceiling NARROW FLAG, never trigger-eligible,
  # no composite weight. The driver attribution and the paper bid are the
  # driver_attribution_* and paper_bid_* bulk blocks. long_window waits for the
  # metric lenses (6e): until then percentiles are over the store's own history.
  # ---------------------------------------------------------------------------
  calc.gold_residual.residual:
    source: derived_state
    mechanism_group: factor_attribution
    native_horizon: monthly
    freq: monthly
    information_half_life: month
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    delta_unit: pp
    family: ratio
    long_window: until_the_lenses
    rights_ceiling: narrow_flag
    trigger_eligible: false
    added_date: "2026-10-10"
    description: >-
      THE GOLD RESIDUAL (arch Session 12): what real rates (DFII10) and the
      trade-weighted dollar (DTWEXBGS) do not explain. Gold's monthly log return
      less the fit of a rolling 36-month regression on the 10-year real yield's
      change and the broad dollar's log return, in log-return percent (2.0 = the
      month's return was two log points above what the window's betas imply).
      Rolling 36 COMPLETE months (config/attribution.yaml); gold is the
      COMEX front future (GC=F), GLD for a month the front has no return.
      Section 5 rules no kill condition for the gold residual.
  calc.gold_residual.explained_share:
    source: derived_state
    mechanism_group: factor_attribution
    native_horizon: monthly
    freq: monthly
    information_half_life: month
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: fraction
    family: ratio
    long_window: until_the_lenses
    rights_ceiling: narrow_flag
    trigger_eligible: false
    added_date: "2026-10-10"
    description: >-
      The gold residual's explained share: the R squared of the rolling 36-month
      regression of gold's monthly log return on the real yield's change and the
      broad dollar's log return, 0 to 1. Low means the residual is most of the
      move -- the paper's 'the real-yield model broke in 2022' read as a number.
      Rolling 36 COMPLETE months (config/attribution.yaml); gold is the
      COMEX front future (GC=F), GLD for a month the front has no return.
      Section 5 rules no kill condition for the gold residual.
  calc.gold_residual.beta_real_yield:
    source: derived_state
    mechanism_group: factor_attribution
    native_horizon: monthly
    freq: monthly
    information_half_life: month
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    family: ratio
    long_window: until_the_lenses
    rights_ceiling: narrow_flag
    trigger_eligible: false
    added_date: "2026-10-10"
    description: >-
      The gold residual's beta to the 10-year real yield (DFII10): log return per
      percentage point of the month's real-yield change, rolling 36 months
      (-0.08 = gold about 8% lower per +1pp). The falsification test 'the
      real-yield link dormant not dead' (VIII section 4) reads its sign and size.
      Rolling 36 COMPLETE months (config/attribution.yaml); gold is the
      COMEX front future (GC=F), GLD for a month the front has no return.
      Section 5 rules no kill condition for the gold residual.
  calc.gold_residual.beta_dollar:
    source: derived_state
    mechanism_group: factor_attribution
    native_horizon: monthly
    freq: monthly
    information_half_life: month
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    family: ratio
    long_window: until_the_lenses
    rights_ceiling: narrow_flag
    trigger_eligible: false
    added_date: "2026-10-10"
    description: >-
      The gold residual's beta to the broad dollar (DTWEXBGS): gold's monthly log
      return per unit of the dollar's, rolling 36 months -- an elasticity.
      Rolling 36 COMPLETE months (config/attribution.yaml); gold is the
      COMEX front future (GC=F), GLD for a month the front has no return.
      Section 5 rules no kill condition for the gold residual.
  calc.yields_up_dollar_down.flag:
    source: derived_state
    mechanism_group: macro_global_fx
    native_horizon: weekly
