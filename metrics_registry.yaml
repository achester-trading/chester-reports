      conId is opaque; recorded so the unambiguous id is still on the record.

# -----------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # GRADES (Phase 3). Every one is `calculated` and every one is
  # trigger_eligible: false -- and that second fact is not a placeholder waiting
  # to be flipped. A grade is the measurement by which a metric might EARN
  # trigger eligibility; letting the grade itself move a decision would close
  # the loop on itself. Nothing in this block should ever become true.
  #
  # revision_policy is `recomputed`, which is the honest reading: the grader
  # stamps every row with a method_version, and a methodology change rewrites the
  # grade rather than the source restating anything. Two grades of one decision
  # are comparable only if that version matches.
  #
  # information_half_life is `permanent`. A graded outcome is a historical fact
  # about a decision that has already resolved; it does not decay.
  calc.breadth_sector_above_50d:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    sample: sector_etf_proxy
    delta_unit: pp
    trigger_eligible: false
    description: >-
      Share of the ELEVEN SPDR SECTOR ETFs trading above their own 50-day average.
      NOT MARKET-WIDE BREADTH, and `sample: sector_etf_proxy` is the reason it can
      never be described as such: real breadth counts ~500 constituents, while
      eleven cap-weighted sector funds are eleven portfolios -- in a market led by
      four megacaps XLK can sit above its average while most of its own holdings
      sit below theirs. The proxy moves with breadth and UNDERSTATES narrowness,
      which is the direction that matters, so it is worth having and worth
      labelling. A partial sample emits nothing: eight of eleven reporting would
      make the denominator the finding.
  calc.breadth_sector_above_200d:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    sample: sector_etf_proxy
    delta_unit: pp
    trigger_eligible: false
    description: >-
      The same share against the 200-day average -- the slower participation read.
      Same proxy caveat, same reason.
  calc.breadth_rsp_over_spy:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      RSP/SPY: equal weight over cap weight. The honest half of the breadth
      reading -- a participation measure that needs no constituent data and
      carries no proxy caveat, because the two funds hold the same universe
      weighted two ways.
  yf.forward_eps:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: usd
    trigger_eligible: false
    description: >-
      Consensus forward EPS for one name, read nightly. REVISED by construction -- a consensus is restated whenever an analyst moves, which is the whole point of logging it daily. NOT SERVED FOR ETFs: no analyst covers a wrapper, so the sector funds and SPY/QQQ/IWM carry no forward estimate and an index-level forward multiple needs a holdings-weighted build this does not do.
  index.forward_pe:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: revised
    units: ratio
    status_extra: not_yet_sourced
    trigger_eligible: false
    description: >-
      INDEX-LEVEL forward P/E for SPY/QQQ/IWM and the sector ETFs. NOT_YET_SOURCED:
      yfinance serves forward estimates for individual stocks and returns None for
      every ETF, because no analyst covers a wrapper. Getting this needs a
      holdings-weighted build from constituent estimates -- each fund's weights times
      its members' forward EPS -- or a vendor that sells the aggregate. Registered so
      the gap is a reviewable item rather than something rediscovered each quarter.
      THE PER-NAME SERIES STAYS: yf.forward_eps and yf.forward_pe are logged nightly
      for the 13 tracked stocks and are unaffected by this.
  yf.forward_pe:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: ratio
    trigger_eligible: false
    description: >-
      Consensus forward P/E for one name. Same ETF limitation as yf.forward_eps.
  yf.trailing_eps:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: usd
    trigger_eligible: false
    description: >-
      Trailing twelve-month EPS. Revised when a company restates.
  yf.trailing_pe:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: ratio
    trigger_eligible: false
    description: >-
      Trailing P/E. The ONE multiple the ETFs do carry, which is why they are logged at all rather than skipped.
  yf.analyst_count:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: count
    trigger_eligible: false
    description: >-
      Number of analyst opinions behind the consensus. A forward estimate from three analysts and one from fifty-nine are not the same number, and nothing else in the row says which it is.
  yf.target_mean_price:
    source: yfinance
    mechanism_group: consensus_estimate
    native_horizon: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: usd
    trigger_eligible: false
    description: >-
      Mean analyst target price. Logged for the same reason as the consensus itself: its REVISIONS are the signal, not its level.
  ibkr.auction_indicative_price:
    source: ibkr_md_nyse_imbalances
    mechanism_group: auction_flow
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: price
    trigger_eligible: false
    description: >-
      The indicative closing price published during the 15:50-16:00 auction window. observed_at is the TICK INSTANT, not the session: the shape of this through the window is the whole reason to sample it.
  ibkr.auction_paired_qty:
    source: ibkr_md_nyse_imbalances
    mechanism_group: auction_flow
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Paired quantity -- shares that will cross at the indicative price. The denominator any absorption measure would need, and absorption itself is 6h and gated.
  ibkr.auction_imbalance_qty:
    source: ibkr_md_nyse_imbalances
    mechanism_group: auction_flow
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Unpaired imbalance in shares. DISPLAY-ONLY by ruling: the raw number says how much wants to trade one way, and says nothing about what the price did with it. Nothing reads this to make a decision.
  ibkr.auction_imbalance_side:
    source: ibkr_md_nyse_imbalances
    mechanism_group: auction_flow
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      The imbalance's sign as a label: +1 buy, -1 sell, 0 balanced. Stored separately from the quantity so a query can ask 'which way' without arithmetic on a signed field.
  ibkr.auction_probe:
    source: ibkr_md_nyse_imbalances
    mechanism_group: auction_flow
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      The stored entitlement probe: whether this account can see the auction feed,
      recorded EITHER WAY. A dormant sampler with a stored probe result is a
      decision; a dormant sampler with nothing written down is something somebody
      forgot. States: entitled, not_entitled, inconclusive_closed (outside the
      window no tick publishes even with a full entitlement, so silence proves
      nothing), inconclusive_silent, probe_failed.
  finra.short_volume:
    source: finra
    mechanism_group: short_flow
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Shares SOLD SHORT during one session, from FINRA's Reg SHO daily file. THIS IS NOT SHORT INTEREST. It is a FLOW and it includes a market maker shorting to fill a buy order and covering nine seconds later -- a stock can print 45 percent short volume every day for a year with no net short position at all. Short interest is the STOCK of shares still held short and is finra.short_interest. The ratio of one to the other is not a meaningful number.
  finra.total_volume:
    source: finra
    mechanism_group: short_flow
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Total consolidated volume from the same file, stored so the short-volume SHARE can be computed without joining a second source whose volume definition differs.
  finra.short_exempt_volume:
    source: finra
    mechanism_group: short_flow
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Short-exempt volume from the same file. Small, and separate because an exempt short is a different act from a regular one.
  finra.short_interest:
    source: finra
    mechanism_group: short_stock
    native_horizon: daily
    information_half_life: month
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: shares
    trigger_eligible: false
    description: >-
      Shares still held short at a settlement date -- a STOCK, published semi-monthly with roughly a fortnight's lag. NOT finra.short_volume, which is the daily flow: they answer different questions and move differently. Revisable, because FINRA restates.
  finra.short_interest_prior:
    source: finra
    mechanism_group: short_stock
    native_horizon: monthly
    information_half_life: month
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: shares
    trigger_eligible: false
    description: >-
      The PRIOR settlement date's short interest, as FINRA reports it alongside the current one. Stored rather than derived by subtraction because FINRA's own pairing accounts for splits and re-listings that a naive lag would get wrong.
  finra.short_interest_avg_volume:
    source: finra
    mechanism_group: short_stock
    native_horizon: monthly
    information_half_life: month
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: shares
    trigger_eligible: false
    description: >-
      Average daily volume over the settlement period, as FINRA computes it. The denominator of days-to-cover, stored so that figure can be checked rather than taken.
  finra.short_interest_days_to_cover:
    source: finra
    mechanism_group: short_stock
    native_horizon: monthly
    information_half_life: month
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: days
    trigger_eligible: false
    description: >-
      FINRA's own days-to-cover: short interest divided by average daily volume. A VENDOR CALCULATION, logged as given rather than recomputed -- and note it mixes a STOCK (the position) with a FLOW (volume), so it is a rough measure of crowding and not a forecast of how long a cover would take.
  apewisdom.mentions:
    source: apewisdom
    mechanism_group: social_attention
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: count
    trigger_eligible: false
    description: >-
      Mention count for one ticker on one venue in the trailing day. The instrument carries the FEED (TICKER@all-stocks, TICKER@wallstreetbets) because a count on one venue and a count across all of them are measurements of different populations and must never be summed.
  apewisdom.rank:
    source: apewisdom
    mechanism_group: social_attention
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: count
    trigger_eligible: false
    description: >-
      The ticker's rank by mentions on that venue. Rank moves when OTHER tickers move, which is why the raw count is stored beside it.
  apewisdom.upvotes:
    source: apewisdom
    mechanism_group: social_attention
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: count
    trigger_eligible: false
    description: >-
      Upvotes on the counted mentions -- an intensity measure beside the volume one.
  ibkr.shortable_shares:
    source: ibkr_paper
    mechanism_group: borrow_terms
    native_horizon: daily
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: shares
    trigger_eligible: false
    description: >-
      Shares the broker shows as available to short. DORMANT ON THIS ACCOUNT: the probe returns 10358 (fundamentals data is not allowed) and the field is NaN. Registered so the series exists the day the entitlement does.
  ibkr.borrow_fee_rate:
    source: ibkr_paper
    mechanism_group: borrow_terms
    native_horizon: daily
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: percent
    trigger_eligible: false
    description: >-
      Indicative annualised borrow fee. Dormant for the same reason.
  ibkr.borrow_rebate_rate:
    source: ibkr_stock_loan
    mechanism_group: borrow_terms
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: percent
    trigger_eligible: false
    description: >-
      Annualised rebate rate from IB's public stock-loan file. A NEGATIVE rebate is
      normal for a hard-to-borrow name and is not an error -- it means the short
      pays rather than receives. Registered empty: the host does not answer.
  ibkr.stock_loan_file_probe:
    source: ibkr_stock_loan
    mechanism_group: borrow_terms
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      Every route to IB's public stock-loan file, tried and recorded: the anonymous
      FTP account and three HTTPS mirror candidates. States: available, unreachable.
      Currently unreachable -- ftp3.interactivebrokers.com resolves and answers on no
      port from two networks, and the mirrors 404.
  ibkr.borrow_probe:
    source: ibkr_paper
    mechanism_group: borrow_terms
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      The stored borrow-entitlement probe, recorded either way. States: entitled,
      not_entitled, probe_failed, never_probed. This account reads not_entitled.
  zec.price_usd:
    source: yfinance
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: price
    trigger_eligible: false
    description: >-
      ZEC close in USD. Daily, including weekends: a chain does not keep exchange hours, which is why it is not in the equity price basket and not subject to its session filter.
  zec.realized_vol_20d:
    source: yfinance
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    trigger_eligible: false
    description: >-
      Annualised realized volatility of ZEC's 20-day log returns, on a 365-DAY year rather than 252 -- annualising a seven-day-a-week series on a trading-day count would overstate it by about 20 percent.
  zec.beta_to_btc_60d:
    source: yfinance
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      ZEC's beta to BTC over 60 overlapping days, from log returns. Computed on the days both series traded; BTC comes from the price basket, so the two are the same vintage.
  zec.btc_ratio:
    source: yfinance
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      ZEC divided by BTC. A RELATIVE PRICE and explicitly NOT a share of crypto market capitalisation -- see zec.crypto_cap_share for why the two are not interchangeable.
  zec.shielded_tx_share:
    source: blockchair
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: fraction
    trigger_eligible: false
    description: >-
      Share of ZEC TRANSACTIONS using a shielded pool -- a FLOW. STILL NO SOURCE, and
      registered empty on purpose. Seven candidates have been probed; the one that
      answers (zcashexplorer) serves `valuePools`, which is the shielded share of
      SUPPLY and is logged separately as zec.shielded_value_share. The two are not
      interchangeable and neither substitutes for the other: a value share is what is
      held, this is what moved. zec.shielded_probe records every candidate's answer so
      the gap is not re-investigated.
  zec.crypto_cap_share:
    source: coingecko
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: fraction
    trigger_eligible: false
    description: >-
      ZEC's market capitalisation divided by the total, both from CoinGecko. First
      read 0.938 percent. FORWARD-ONLY: no history of the total is served, so this
      series starts the day it was first logged and cannot be backfilled.
      zec.btc_ratio KEEPS ITS OWN NAME and is a different number -- a relative price,
      not a share of a market -- and now that both exist, having built the second is
      no reason to conflate it with the first.
  zec.market_cap_usd:
    source: coingecko
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: usd
    trigger_eligible: false
    description: >-
      ZEC's market capitalisation in USD, from CoinGecko. FORWARD-ONLY: the free tier
      serves the current value and no history, so this series starts the day it was
      first logged.
  crypto.total_market_cap_usd:
    source: coingecko
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: usd
    trigger_eligible: false
    description: >-
      Total crypto market capitalisation in USD, from CoinGecko's /global endpoint --
      the denominator zec.crypto_cap_share needed. FORWARD-ONLY for the same reason,
      which is the whole argument for logging it tonight rather than later.
  zec.cap_probe:
    source: coingecko
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      The stored CoinGecko probe. States: available, partial, http_error, error, plus a
      `needs_key` flag set when a 401 or 403 says the endpoint has stopped being
      anonymous -- the condition the ruling asked to be told about rather than worked
      around.
  zec.pool_value:
    source: zcashexplorer
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: count
    trigger_eligible: false
    description: >-
      ZEC held in one value pool, instrument-keyed by pool name (transparent, sprout,
      sapling, orchard, lockbox, ironwood). From zcashd's own blockchain-info via
      zcashexplorer. A STOCK -- the balance sitting in the pool -- not a measure of
      activity through it.
  zec.shielded_value_share:
    source: zcashexplorer
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: fraction
    trigger_eligible: false
    description: >-
      Share of ZEC supply held in the three DOCUMENTED user-shielded pools -- sprout,
      sapling and orchard. First read 5.414 percent.
      IT IS NOT zec.shielded_tx_share AND THE TWO ARE NOT INTERCHANGEABLE: this is a
      STOCK (what is held shielded) and that is a FLOW (how much of today's activity
      used a shielded pool). A chain can hold a third of its supply shielded with
      almost no shielded activity, or the reverse -- the same distinction that keeps
      finra.short_interest and finra.short_volume in separate mechanism groups.
      WHICH POOLS COUNT IS DECLARED, not inferred from "not transparent". `lockbox` is
      the NU6 development-fund reserve, which is protocol accounting rather than a
      user's privacy decision, and `ironwood` holds nearly a quarter of supply with
      semantics this code has not verified. Both are logged as zec.pool_value and
      EXCLUDED here: including them would read 29.4 percent instead of 5.4, and a
      number that large should not move a headline on a guess. A pool the code has
      never seen is reported and logged at WARNING rather than averaged in.
  zec.shielded_probe:
    source: blockchair
    mechanism_group: privacy_chain
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      Every candidate explorer's answer, recorded nightly. Run every night rather
      than once because an explorer GAINING the shielded field is the event this
      logger waits for, and nobody will re-check by hand. States: available,
      no_shielded_field.
  ndl.rtat10_activity:
    source: nasdaq_data_link
    mechanism_group: retail_activity
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: fraction
    sample: top10_censored
    trigger_eligible: false
    description: >-
      Daily retail activity share for a ticker in Nasdaq's RTAT10 -- the TEN names
      with the most retail activity. A ticker's absence means "not in the top ten",
      NOT "no retail activity", and the two are only the same if you forget which
      table you are reading. Instrument-keyed.
  ndl.rtat10_sentiment:
    source: nasdaq_data_link
    mechanism_group: retail_activity
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: count
    sample: top10_censored
    trigger_eligible: false
    description: >-
      Nasdaq's RTAT sentiment score for the same ten names. A vendor construct with
      no published formula in the API response, logged as given.
  ndl.rtat10_concentration:
    source: nasdaq_data_link
    mechanism_group: retail_activity
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    sample: top10_censored
    trigger_eligible: false
    description: >-
      Herfindahl of activity share across the VISIBLE TEN, plus the top name's
      share of them. An UPPER BOUND on the retail concentration of the whole
      market: the invisible tail is flatter than anything this table can show.
      Reads insufficient_history until 60 sessions exist.
  ndl.rtat10_persistence:
    source: nasdaq_data_link
    mechanism_group: retail_activity
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: days
    sample: top10_censored
    trigger_eligible: false
    description: >-
      Consecutive days a ticker has been IN THE TOP TEN. A ticker that slips to
      eleventh reads as a broken run that did not break -- the censoring is the
      whole caveat. Reads insufficient_history until 60 sessions exist.
  ndl.rtat10_new_entrants:
    source: nasdaq_data_link
    mechanism_group: retail_activity
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: count
    sample: top10_censored
    trigger_eligible: false
    description: >-
      Arrivals into the visible ten since the prior session. A measure of TURNOVER
      AT THE BOUNDARY rather than of new retail interest: a name entering at tenth
      displaced one that was tenth. Reads insufficient_history until 60 sessions.
  calc.spy_vs_252d_high:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: >-
      SPY's close against its own 252-session high, in percent: 0 at a new high and
      negative below it. The price leg of the price_vs_breadth contradiction row,
      replacing SPY's LEVEL percentile -- which in any uptrend sits near the top of
      its five-year distribution almost every day, making the leg nearly constant
      and the divergence it measures nearly invisible. Distance from the running
      high is ~0 at a new high and falls away at once, which is what "making new
      highs while participation narrows" means.
  cfe.vx_settle:
    source: cboe
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: price
    trigger_eligible: false
    description: >-
      One VX monthly contract's daily settlement, in volatility points. The
      INSTRUMENT is the contract's expiry date, so the series is per contract and
      the curve is assembled from it rather than stored twice. revision_policy is
      `never` -- a settlement price is final, which is what makes a reconstructed
      availability defensible for it.
  cfe.vx1:
    source: cboe
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: price
    trigger_eligible: false
    description: >-
      The front MONTHLY VX settlement for a session, assigned by expiry order on
      that date rather than by contract. Weekly VX contracts are deliberately
      excluded: VX1 in 30.8's state machine means the front monthly, and a weekly
      in the front slot would move the slope every Wednesday for reasons that have
      nothing to do with the curve.
  cfe.vx2:
    source: cboe
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: price
    trigger_eligible: false
    description: The second monthly VX settlement, same assignment rule as cfe.vx1.
  cfe.vx3:
    source: cboe
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: price
    trigger_eligible: false
    description: The third monthly VX settlement, same assignment rule as cfe.vx1.
  cfe.vx_probe:
    source: cboe
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      Which Cboe endpoints answered and which refused, stored so a route that
      stops working is a recorded fact rather than something to re-probe. Three of
      the four probed return 403: the all-products daily settlement file, the
      directory listing and the delayed-quote API. Only the per-contract history
      answers, which is why this module computes expiry dates instead of reading a
      listing.
  calc.vx_front_slope:
    source: derived_state
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    delta_unit: raw
    trigger_eligible: false
    description: >-
      VX2 minus VX1, in VOLATILITY POINTS. units is `ratio` because the vocabulary
      has no vol-point member and `price` would make its delta a percent of a
      difference, which is meaningless; delta_unit `raw` is the override that keeps
      a change in the slope reported in the points it is measured in.
  calc.vx_front_ratio:
    source: derived_state
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      VX2 divided by VX1 -- the CHAMPION for the vol dial's term-structure leg. A
      ratio and not the slope, because the leg is banded on a ratio and the
      challenger it is measured against (calc.vix3m_over_vix) is one: a champion in
      points and a challenger as a ratio could not be printed side by side, which
      is the entire purpose of the dual run.
  calc.vx1_vix_basis:
    source: derived_state
    mechanism_group: vx_term_structure
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    delta_unit: raw
    trigger_eligible: false
    description: >-
      VX1 minus VIX, in volatility points -- THE NUMBER THE PROXY CANNOT SEE.
      VIX3M/VIX is two implied volatilities of the same index, so it moves with the
      curve but can never show a futures-to-index dislocation: both its legs ARE
      the index. This is that dislocation, and it is the standing reason the proxy
      carries `proxy_for: vx_futures_curve` rather than being treated as the curve.
  calc.vix3m_over_vix:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    proxy_for: vx_futures_curve
    trigger_eligible: false
    description: >-
      VIX3M divided by VIX: the ratio of three-month to one-month IMPLIED VOLATILITY
      OF THE INDEX. IT IS NOT THE VX FUTURES CURVE and must never be described as
      one. The curve is the price of VX futures -- tradeable instruments with their
      own supply, their own roll and their own basis to spot VIX -- and 30.8's state
      machine is defined on VX1/VX2/VX3. This ratio moves with that curve most of the
      time and is a different object: it cannot show a roll, it cannot show a
      dislocation between the futures and the index, and it is not something anyone
      can trade.
      It is here because it is FREE AND SAME-DAY, where the curve needs the CFE
      Enhanced subscription. `proxy_for: vx_futures_curve` is the standing caveat.
      When VX1-VX3 arrive, both run a quarter as champion and challenger before
      either is retired -- see config/market_state.yaml.
  calc.cyclical_over_defensive:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      XLY/XLP -- consumer discretionary over consumer staples. What the equity
      market is paying for growth, read as a ratio of two funds on the same tape
      so a general re-rating cancels out. The second leg of the growth_vs_cyclicals
      contradiction row: the growth DIMENSION says what the macro data shows, this
      says what the tape is willing to pay for it.
  calc.trend_spy_vs_50d:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    trigger_eligible: false
    description: >-
      SPY's close against its own 50-day average, in percent. Split-adjusted,
      dividend-unadjusted closes -- the same series the pin log and the exposure
      engine speak in.
  calc.trend_spy_vs_200d:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    trigger_eligible: false
    description: SPY's close against its own 200-day average, in percent.
  calc.trend_spy_ma20_slope:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    trigger_eligible: false
    description: >-
      Percent change in SPY's 20-day average over 20 sessions -- direction rather
      than position, so a market above its average but rolling over is
      distinguishable from one above its average and rising.
  calc.vol_spy_realized_20d:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    trigger_eligible: false
    description: >-
      Annualised realized volatility of SPY's 20-session log returns, in percent.
      The leg the vol dial was missing: VIX alone is an implied number with nothing
      to be rich or cheap against.
  # -------------------------------------------------------------------------
  # THE MACRO TRANSFORMS, ported out of monthly_macro/compute.py.
  #
  # Each of these WAS a function one report called over the CSV store at render
  # time: one number, no history, no percentile, and unreadable by the
  # market-state object that has a macro dial to fill. Registered here they are
  # series like any other -- and the object's liquidity, rates and growth
  # dimensions read three of them.
  #
  # `delta_unit: pp` on every rate-of-change series, deliberately. `units:
  # percent` would otherwise make their deltas basis points, and core PCE going
  # 3.29% -> 3.41% is +12 BASIS POINTS in a rates-desk sentence and +0.12
  # PERCENTAGE POINTS in a macro one. These are macro series; a reader of the
  # Monthly means points.
  # -------------------------------------------------------------------------
  calc.net_liquidity:
    source: derived_state
    mechanism_group: macro_liquidity
    native_horizon: weekly
    freq: weekly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: usd
    trigger_eligible: false
    description: >-
      The Fed balance sheet less the reverse repo facility less the Treasury
      General Account, IN DOLLARS. The liquidity dimension's primary member: it is
      the stock of central-bank money actually in the system, where WALCL alone
      counts money parked at the RRP and sitting in the TGA as though it were
      circulating.
      WEEKLY, and same-day only. WALCL and WTREGEN print on Wednesdays and RRP is
      daily, so the series is the intersection -- 211 rows over this store's
      history -- rather than a daily number carrying two stale legs forward.
      THE UNITS ARE THE WHOLE DIFFICULTY. WALCL and WTREGEN are in MILLIONS and
      RRPONTSYD is in BILLIONS; the three are normalised to dollars before
      subtraction. monthly_macro/compute.py had TGA as billions and returned
      -823.6 trillion for its entire life. NET_LIQUIDITY_BAND in
      altdata/market_features.py declares the plausible range and
      tools/validate_regime.py group I asserts both sides of it.
  calc.sahm_rule:
    source: derived_state
    mechanism_group: macro_labor
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: >-
      The Sahm recession indicator: the 3-month average of U-3 less the LOWEST
      3-MONTH AVERAGE of the trailing twelve months, in percentage points. Sahm's
      own threshold is 0.50.
      THE DEFINITION MATTERS AND WAS WRONG BEFORE. compute.py took the low of the
      raw monthly LEVELS rather than of the 3-month averages. The raw low is never
      above the averaged low, so the old reading was biased toward the trigger --
      0.333 against 0.20 on April 2026, a third of the way to a recession call
      that the published definition does not make.
      SUPPORTING MEMBER OF THE GROWTH DIMENSION, never a primary: it is monthly,
      it is a labour-market lag, and `trigger_eligible: false` like everything
      else here.
  calc.yield_curve_2s10s:
    source: derived_state
    mechanism_group: macro_momentum
    native_horizon: daily
    freq: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: bps
    trigger_eligible: false
    description: >-
      The 10-year Treasury yield less the 2-year, in basis points. Both legs on
      the SAME session: a curve built from two different days is not a curve.
      A supporting member of the rates dimension. The dimension's primary is the
      10-year level, because the level is the discount rate everything is priced
      off; the curve is the shape, and shape and level move independently -- an
      inversion at 1% and an inversion at 5% are different worlds.
  calc.real_wages_yoy:
    source: derived_state
    mechanism_group: macro_labor
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: >-
      Average hourly earnings year-over-year less CPI year-over-year, in
      percentage points. Negative means the average hour buys less than it did a
      year ago. Computed from calc.yoy_ahe and calc.yoy_cpi rather than from a
      second year-over-year implementation.
  calc.r_real_10y_core_pce:
    source: derived_state
    mechanism_group: macro_momentum
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: >-
      The 10-year yield less core PCE year-over-year: R on the core-PCE basis, in
      percentage points. MONTHLY, on the inflation print's own date, with the
      yield taken at or before it. compute.py paired the LATEST yield with the
      latest inflation rate and stamped the result with the yield's date, which
      mixed a May yield with an April inflation reading -- 1.16 against 1.04 on
      the dates that actually go together.
  calc.r_real_10y_cpi:
    source: derived_state
    mechanism_group: macro_momentum
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: >-
      The 10-year yield less headline CPI year-over-year: R on the CPI basis. Both
      bases are carried because they disagree by the core/headline gap, and which
      one a debt-cycle argument uses changes its sign at the margin.
  calc.r_minus_g:
    source: derived_state
    mechanism_group: macro_momentum
    native_horizon: quarterly
    freq: quarterly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: >-
      R (core-PCE basis) less G (real GDP year-over-year), in percentage points.
      POSITIVE is r > g -- debt compounds faster than the economy that services
      it, which is the debt-cycle arithmetic the Rate and Liquidity Machine turns
      on. QUARTERLY, because G is; the r leg is taken at or before the quarter's
      own date rather than interpolated forward.
      NO BOOLEAN. compute.py also returned `r_greater_than_g`, which is the sign
      of this number: a flag derived from a figure beside the figure is a second
      answer waiting to disagree with it.
  calc.yoy_cpi:
    source: derived_state
    mechanism_group: macro_inflation
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: >-
      CPI, all items, year-over-year in percent. The prior observation is the one
      closest to 365 days back within 45 days, so a month's shape does not move
      the comparison and a hole in the series cannot silently substitute for it.
  calc.yoy_core_cpi:
    source: derived_state
    mechanism_group: macro_inflation
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: Core CPI, ex food and energy, year-over-year in percent.
  calc.yoy_pce:
    source: derived_state
    mechanism_group: macro_inflation
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: The PCE price index, year-over-year in percent.
  calc.yoy_core_pce:
    source: derived_state
    mechanism_group: macro_inflation
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: >-
      Core PCE, year-over-year in percent -- the Fed's own target variable, and
      the inflation leg of calc.r_real_10y_core_pce.
  calc.yoy_m2:
    source: derived_state
    mechanism_group: macro_liquidity
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: M2 money stock, year-over-year in percent.
  calc.yoy_real_gdp:
    source: derived_state
    mechanism_group: macro_momentum
    native_horizon: quarterly
    freq: quarterly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: >-
      Real GDP, year-over-year in percent. This is the G in r-vs-g, and it is
      computed once: calc.r_minus_g reads this series rather than recomputing it.
  calc.yoy_housing_starts:
    source: derived_state
    mechanism_group: macro_momentum
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: Housing starts, year-over-year in percent.
  calc.yoy_ahe:
    source: derived_state
    mechanism_group: macro_labor
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    delta_unit: pp
    trigger_eligible: false
    description: >-
      Average hourly earnings, year-over-year in percent. The upstream FRED key is
      named `ahe_yoy` and is NOT a year-over-year series: CES0500000003 is a level
      in dollars per hour. The year-over-year is computed here, and the key's name
      is left alone because prior snapshots and the store reference it.
  baserate.review_flag:
    source: derived_base_rate
    mechanism_group: base_rate
    native_horizon: structural
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      Written when a recompute moves a watched base-rate field further than its
      declared tolerance, naming the field, both values and the tolerance. NOT an
      error path: a drawdown distribution that has genuinely shifted is the most
      informative thing tools/base_rates.py can report, and the flag exists so it
      reaches a human rather than being absorbed into the next year's numbers. A
      method_version change is reported here too and explicitly NOT as drift --
      fields are never compared across methods.
  overnight.gap_attribution:
    source: yfinance
    mechanism_group: overnight_context
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      31.3(a)'s attribution line as one record: the ES move split across the Tokyo
      and European clock windows and the remainder, the CASH index that was trading
      in each window beside it, the total since the prior settle, and the window
      that dominated -- or that none did, which is the commoner answer. Written by
      the 06:45 overnight pass, which owns the legs; the 07:00 anchor READS it and
      derives nothing, because two producers of one label is how a page and a store
      come to disagree about last night. RIGHTS: Backdrop context only. Per 31.3(a)
      an attribution line MAY NOT generate a Book C setup, and the string travels on
      the record rather than only in a rendering so a consumer that skipped the
      prose still has it.
  overnight.gap_attribution_dominant:
    source: yfinance
    mechanism_group: overnight_context
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      Which window dominated last night -- tokyo, europe, other, or `none` -- as its
      own series, so the question "how often does the move happen while Tokyo is
      open" is answerable by a query rather than by opening a year of JSON records.
      A window is named only when its absolute move is at least the declared
      multiple (2x) of the next largest; without that margin the word means nothing,
      since three windows of 4, 4 and 3 points have no dominant window and naming
      the 4 would tell a reader the night had a location it did not have.
  regime.dimension_state:
    source: derived_state
    mechanism_group: market_state
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      One dimension's published state, from declared percentile bands on its
      primary member and subject to persistence_sessions. An absent dimension
      carries no state and a written reason instead.
  regime.dimension_percentile:
    source: derived_state
    mechanism_group: market_state
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    trigger_eligible: false
    description: >-
      The primary member's own-history percentile ON THE DIMENSION'S SCALE, after
      the declared polarity is applied -- so a wide HY spread reads as stressed
      credit rather than as a high number.
  regime.dimension_direction:
    source: derived_state
    mechanism_group: market_state
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      The sign of the primary member's rate of change times its polarity: +, -,
      or 0. Zero means NOT MEASURED as often as it means flat, and the object
      records which.
  regime.dial_state:
    source: derived_state
    mechanism_group: market_state
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      One dial's state. macro comes from a declared lookup over dimension states,
      vol from VIX level bands, gamma from the exposure engine's own sign -- read,
      never recomputed.
  contradiction.magnitude:
    source: derived_state
    mechanism_group: market_divergence
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      Today's standardised gap between a pair's two legs, expressed as a z of that
      gap's own history over the window. 2.0 means the legs are further apart than
      they have been 95% of the time -- a claim about the RELATIONSHIP, not about
      either level. None on a dial pair, which is a state mismatch and has no
      distribution to take a z of.
  contradiction.open:
    source: derived_state
    mechanism_group: market_divergence
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: boolean
    trigger_eligible: false
    description: >-
      Whether the pair's condition has held persistence_sessions consecutive
      sessions. Opens and closes on the same rule the dimensions use, so a single
      day's disagreement is not an event.
  contradiction.persistence_days:
    source: derived_state
    mechanism_group: market_divergence
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: days
    trigger_eligible: false
    description: >-
      Consecutive sessions the current run has held. At or past
      exception_sessions the row is an exception -- report-only today, because
      this repo has no exceptions alert path.
  contradiction.since:
    source: derived_state
    mechanism_group: market_divergence
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: date
    trigger_eligible: false
    description: >-
      The first session of the current open run, carried forward from the prior
      object rather than recomputed, so a row's age survives a recompute.
  grade.return_pct:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    trigger_eligible: false
    description: >-
      Return from the decision-time reference close to the horizon close, in the
      decision's own direction. Stored prices only, as-of the horizon date.
  grade.return_points:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: price
    trigger_eligible: false
    description: >-
      The same return in the instrument's own quote units.
  grade.mae_close_pct:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent
    trigger_eligible: false
    description: >-
      Maximum adverse excursion measured ON SETTLED CLOSES between entry and
      horizon. A LOWER BOUND on the true excursion: a position stopped out
      intraday and recovered by the close is invisible to a close-only series,
      which is why the column is named mae_close and not mae.
  grade.invalidation_hit:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: boolean
    trigger_eligible: false
    description: >-
      Whether the declared invalidation level was breached on a SETTLED CLOSE
      before the horizon. Tested the way the register words it, so here the
      stored data and the declared rule agree exactly.
  grade.risk_per_unit:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: price
    trigger_eligible: false
    description: >-
      Distance from the reference price to the invalidation level -- the loss per
      unit the decision declared it would accept. NULL when the invalidation
      names no level, never defaulted.
  grade.dollars_at_risk:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: usd
    trigger_eligible: false
    description: >-
      risk_per_unit times the declared units. The R denominator; NULL rather than
      guessed when the size declares no parseable units, because an invented
      denominator makes every R in every cut meaningless.
  grade.r_multiple:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      The THESIS outcome: return against dollars at risk, held to the horizon
      regardless of whether the invalidation was touched on the way.
  grade.r_multiple_ruled:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      What a RULE-FOLLOWING operator got: -1R when the invalidation was touched
      before the horizon, otherwise r_multiple. THIS is the column expectancy is
      computed on -- it is the money. The gap between it and r_multiple is the
      measurable cost of where the invalidation was placed, and collapsing the two
      would destroy the distinction Part 7 grades on: a thesis exited early that
      would have worked is a different failure from a thesis that was wrong.


  # ---------------------------------------------------------------------------
  # BRIER (Phase 3). Calculated, trigger_eligible false, and permanently so for
  # the same reason the grades are: a calibration score is how a forecast SOURCE
  # earns credibility, and letting the score move a decision would close the loop
  # on itself.
  brier.score:
    source: derived_probability
    mechanism_group: forecast_calibration
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: ratio
    trigger_eligible: false
    description: >-
      (p - outcome)^2 for one resolved forecast. 0 is certain and right, 0.25 is
      what always saying 50% gets you, 1 is certain and wrong. revision_policy is
      `never`: a forecast is immutable by trigger and a resolution is written
      once, so the score cannot change once it exists.
  brier.running:
    source: derived_probability
    mechanism_group: forecast_calibration
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      Mean Brier over every resolved forecast from one source. Recomputed as
      forecasts resolve, and never reported without its n -- the score conflates
      calibration with resolution, so below the 0.25 coin line the number alone
      cannot separate a calibrated forecaster from a lucky one.
  brier.vs_coin:
    source: derived_probability
    mechanism_group: forecast_calibration
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      brier.running minus 0.25. Positive means the source is worse than always
      saying fifty per cent, which is the one verdict a Brier score delivers
      unambiguously at small n.


bulk_imports:

  fred_macro:
    description: >-
      The 59 FRED series behind the Monthly Macro report. Enumerated in code
      with key, units, freq and pillar; duplicating them here would create two
      registries that drift. mechanism_group is assigned by pillar, because
      pillars are genuinely different mechanisms -- liquidity and labour can
      confirm each other, two labour series cannot.
    source: fred
    members_from: altdata.config.FRED_SERIES
    member_key: key
    # The observation store writes these as "fred.nfp", not "nfp", so that a
    # future non-FRED series of the same name cannot collide. The registry has
    # to agree or a join between the two silently finds nothing.
    key_prefix: "fred." 
    expected_members: 59
    units: from_member          # SeriesSpec.units
    native_horizon: from_member # SeriesSpec.freq
    # FRED INHERITS ITS RELEASE CADENCE. A monthly series is current until the
    # next monthly print; a daily one is stale in a day. One half-life across
    # 59 series of four different frequencies would be wrong for most of them.
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    # THE ONE SOURCE THAT REVISES. GDP, payrolls and most of the macro set are
    # restated, sometimes more than once. A revision shares its observed_at
    # with the original print and differs in available_at -- exactly what the
    # point-in-time store exists to hold.
    #
    # ALFRED is FRED's vintage archive and holds the true release times. We do
    # NOT read it yet: migrated rows carry available_at = the pull time, an
    # upper bound that OVERSTATES how early we knew. Backfilling real vintages
    # from ALFRED is the open item.
    revision_policy: revised
    revision_source: "ALFRED (alfred.stlouisfed.org) -- not yet ingested"
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "1": macro_labor
      "2": macro_momentum
      "2F": macro_consumer_stress
      "3": macro_liquidity
      "4": macro_inflation
      "5": macro_sentiment
      "6": macro_valuation_credit
      "7": macro_global_fx
      "8": macro_sovereign

  market_closes:
    description: >-
      Daily closes for the 29-symbol market basket, keyed yfinance.mkt_<sym>.
      SPLIT-ADJUSTED AND DIVIDEND-UNADJUSTED -- the value that traded. The
      adjusted close is deliberately not stored: it restates its own history
      every time a dividend is paid, which no point-in-time store can support,
      and it would disagree with the pin log, the exposure engine's spot and
      every decision's reference price. Dividends and splits are stored beside it
      as their own series (see market_actions) so total return is computable
      without un-adjusting anything.
    source: yfinance
    members_from: altdata.sources.yfinance_source.SYMBOLS
    # SYMBOLS maps ticker -> store key, and the STORE KEY is the member name.
    # Declared rather than assumed: iterating the dict yields tickers, so a
    # resolver left to guess would register yfinance.SPY and never
    # yfinance.mkt_spy, and every price metric would read as unregistered.
    members_are: values
    expected_members: 31
    key_prefix: yfinance.
    units: price
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: split_only
    trigger_eligible: false
    mechanism_group: market_close
  market_actions:
    description: >-
      Dividend and split events for the same basket, keyed
      yfinance.mkt_<sym>_dividend and _split. Stored only when NON-ZERO: yfinance
      emits 0.0 on every ordinary day, and 250 rows a year asserting that nothing
      happened are both noise and indistinguishable from a real zero. Registered
      as a block against the same code list so a symbol added to the basket
      cannot arrive with unregistered event series.
    source: yfinance
    members_from: altdata.sources.yfinance_source.SYMBOLS
    members_are: values
    # ONE MEMBER, TWO SERIES. Each symbol can carry a dividend series and a split
    # series, so the block declares the suffixes rather than needing 56 lines.
    member_suffixes: ['_dividend', '_split']
    expected_members: 31
    key_prefix: yfinance.
    units: price
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    trigger_eligible: false
    mechanism_group: corporate_action
  structure_comparison:
    description: >-
      Chapter 15's scenario matrix per symbol, one observation a week, holding the
      ten structures, the scenario grid, the expected value, P(below capital) and
      the ATM implied volatility each tenor was priced on. The SIGMA IS MEASURED
      from the exposure engine's chain snapshots and SOLVED by tools/iv_solver.py
      rather than read off the vendor's ITM side; the drift, the risk-free rate and
      the dividend yield are declared assumptions and every row says which is
      which. Symbols with no chain in the capture universe are not priced at all --
      see tools/structure_compare.py.
    source: derived_state
    members_from: tools.structure_compare.REGISTRY_KEYS
    members_are: values
    expected_members: 3
    key_prefix: ""
    units: label
    native_horizon: weekly
    information_half_life: week
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    trigger_eligible: false
    mechanism_group: structure_economics
  base_rate_tables:
    description: >-
      The Base Rates paper's Part I tables, each stored as ONE observation whose
      value is the table as JSON. A base rate cited in a decision packet has to be
      replayable as of the date it was cited, and a paper's table has no
      available_at -- so the tables become observations and the as-of join answers
      the question for free. See tools/base_rates.py and architecture 31.1.
      NATIVE_HORIZON IS `structural`, WHICH IS 31.1's WORD "strategic": the
      vocabulary is closed and this is its long-horizon member, so the synonym is
      recorded here rather than by widening the vocabulary to hold two names for
      one horizon.
    source: derived_base_rate
    members_from: tools.base_rates.TABLE_KEYS
    # A FLAT TUPLE OF FULL KEYS, so there is no prefix to add and no attribute to
    # read -- but the resolver skips any block that declares neither member_key
    # nor members_are, which silently left all six tables unregistered while the
    # registry checker still reported the block. `values` is the right answer for
    # a sequence: the members ARE the values.
    members_are: values
    expected_members: 6
    key_prefix: ""
    units: label
    native_horizon: structural
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    trigger_eligible: false
    mechanism_group: base_rate
  pin_log_columns:
    description: >-
      The pin log's column set, which IS the file format and is append-only.
      Registered as a block against the code so a new column cannot appear
      unregistered. The metrics it carries are registered individually above;
      this block exists so the CI check can prove the column list is covered.
    source: yfinance
    members_from: tools.pin_log.PIN_COLUMNS
    expected_members: 80
    trigger_eligible: false
    mechanism_group: pin_outcome
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    # NEVER. A graded outcome is history. The architecture is explicit that the
    # tolerance is "declared in advance and never revised after the fact", so a
    # backfill that regrades an old row at today's tolerance is a violation of
    # this policy, not a variation on it. See TODO -- the code does not honour
    # this yet, and declaring it here is what makes that a defect rather than a
    # matter of taste.
    revision_policy: never
    units: from_member

# -----------------------------------------------------------------------------
# Not metrics. Provenance, diagnostics and labels -- they describe a metric or
# the run that produced it. Listed so the drift check can tell a new metric from
# a new field, and so that adding one is a deliberate act.
  overnight_levels:
    description: >-
      The 06:45 ET overnight fetch's price-quoted rows: each instrument's current
      level, the prior US settlement it is measured against, the point change
      between them, and for the two continuously traded futures the per-window
      attribution of that change. Enumerated in code as
      altdata.sources.overnight.PRICE_KEYS so the keys the fetcher can write and
      the keys the registry knows are one list; adding a symbol fails the member
      count here until this block is updated, which is the intended friction.
    source: yfinance
    members_from: altdata.sources.overnight.PRICE_KEYS
    expected_members: 36
    mechanism_group: overnight_context
    native_horizon: intraday
    units: price
    # Dead within the session, by construction. These exist to answer "what
    # happened while I was asleep" at 07:00; by 10:00 the cash session has
    # overwritten the question and a stale overnight read is not truth.
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    # BACKDROP CONTEXT ONLY. 31.3(a) is explicit that a gap attribution may not
    # generate a Book C setup, and the attribution here is a first pass over
    # clock windows -- a window is not a cause. Nothing in this block is
    # trigger-eligible and nothing in it should become so without a measured
    # base rate behind it.
    trigger_eligible: false

  overnight_percent_changes:
    description: >-
      The same overnight fetch's percent changes against the prior US
      settlement, split out because a percent is not a price and one bulk block
      cannot declare two units. altdata.sources.overnight.PERCENT_KEYS.
    source: yfinance
    members_from: altdata.sources.overnight.PERCENT_KEYS
    expected_members: 10
    mechanism_group: overnight_context
    native_horizon: intraday
    units: percent
    information_half_life: intraday
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    trigger_eligible: false

