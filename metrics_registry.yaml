  # -------------------------------------------------------------------------
  # SURPRISE v1 (6c-1 piece 3). Two blocks over the 59 tracked series, so each
  # metric inherits ITS OWN UNITS -- a surprise is a difference in the series'
  # units, index points for CPI and percentage points for the unemployment rate,
  # and one entry could not have declared both.
  #
  # `calc.surprise_vs_consensus` DOES NOT EXIST and that is deliberate. There is no
  # free macro consensus, so the honest state is not_yet_sourced rather than an
  # approximation wearing the name. Every metric here says `naive` in its key, its
  # description and its payload.
  # -------------------------------------------------------------------------
  naive_expectations:
    description: >-
      `calc.naive_expectation.<series>` -- what the declared rule in
      config/naive_expectations.yaml expected for each observation, computed from
      that series' PRIOR observations only. Two methods: `last` for a series with
      no drift of its own, `trend_3m` for a level that trends by construction. A
      series without enough history for its declared method gets no row rather
      than a silent fall back, because a surprise computed by an undeclared method
      is mislabelled and mislabelled is worse than absent.
    source: derived_state
    members_from: altdata.config.FRED_SERIES
    member_key: key
    key_prefix: "calc.naive_expectation."
    expected_members: 59
    units: from_member
    # FOLLOWS ITS FRED SERIES (ruled 15 Oct 2026, AUD-3a part 1): an expectation of a share is a share,
    # so the twelve FRED shares and rates of change carry the unit
    # fred_macro gives them (pp). The rest keep FRED's own.
    member_units:
      calc.naive_expectation.u3_rate: percent_share
      calc.naive_expectation.lfp_rate: percent_share
      calc.naive_expectation.emp_pop_ratio: percent_share
      calc.naive_expectation.quits_rate: percent_share
      calc.naive_expectation.mortgage_delinq: percent_share
      calc.naive_expectation.cc_delinq_30: percent_share
      calc.naive_expectation.auto_delinq: percent_share
      calc.naive_expectation.cc_chargeoff: percent_share
      calc.naive_expectation.sticky_cpi: percent_return
      calc.naive_expectation.sticky_core: percent_return
      calc.naive_expectation.flex_cpi: percent_return
      calc.naive_expectation.fed_debt_pct_gdp: percent_share
    native_horizon: from_member
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "1": macro_labor
      "2": macro_momentum
      "3": macro_liquidity
      "4": macro_inflation
      "5": macro_sentiment
      "6": macro_valuation_credit
      "7": macro_global_fx
      "8": macro_sovereign
      "9": macro_consumer_stress
      "10": macro_sentiment
  naive_surprises:
    description: >-
      `calc.surprise_vs_naive.<series>` -- THE ACTUAL MINUS A NAIVE EXPECTATION,
      AND NOT A CONSENSUS SURPRISE. It measures whether a series did what its own
      recent history implied, which is a different question from whether the
      market was wrong; this system has no macro consensus and does not pretend
      to. available_at is inherited from the ACTUAL, because that is the instant
      the surprise became computable, and a revision produces a second vintage
      with the same observed_at -- so "what did the surprise look like at the
      time" survives a restatement.
      ON mechanism_group: the map below assigns a pillar per member, and
      altdata/grader.py resolves a PER-MEMBER block to the BLOCK'S NAME instead --
      `naive_surprises` -- exactly as it does for fred_macro. That is the
      conservative direction for 26.9: collapsing these into one family means two
      surprises can never count as two independent witnesses. The map is kept
      because it states what each metric is about and check_registry validates its
      values, not because a cut reads it.
    source: derived_state
    members_from: altdata.config.FRED_SERIES
    member_key: key
    key_prefix: "calc.surprise_vs_naive."
    expected_members: 59
    units: from_member
    # FOLLOWS ITS FRED SERIES (ruled 15 Oct 2026, AUD-3a part 1): a surprise in a share is a change in it,
    # so the twelve FRED shares and rates of change carry the unit
    # fred_macro gives them (pp). The rest keep FRED's own.
    member_units:
      calc.surprise_vs_naive.u3_rate: percent_share
      calc.surprise_vs_naive.lfp_rate: percent_share
      calc.surprise_vs_naive.emp_pop_ratio: percent_share
      calc.surprise_vs_naive.quits_rate: percent_share
      calc.surprise_vs_naive.mortgage_delinq: percent_share
      calc.surprise_vs_naive.cc_delinq_30: percent_share
      calc.surprise_vs_naive.auto_delinq: percent_share
      calc.surprise_vs_naive.cc_chargeoff: percent_share
      calc.surprise_vs_naive.sticky_cpi: percent_return
      calc.surprise_vs_naive.sticky_core: percent_return
      calc.surprise_vs_naive.flex_cpi: percent_return
      calc.surprise_vs_naive.fed_debt_pct_gdp: percent_share
    native_horizon: from_member
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "1": macro_labor
      "2": macro_momentum
      "3": macro_liquidity
      "4": macro_inflation
      "5": macro_sentiment
      "6": macro_valuation_credit
      "7": macro_global_fx
      "8": macro_sovereign
      "9": macro_consumer_stress
      "10": macro_sentiment
  # ---------------------------------------------------------------------------
  # AQ-8a: THE DRIVER ATTRIBUTION (section 5, 10A) and THE PAPER BID (two-bid
  # decomposition). The driver blocks' members are built from the correlation
  # layer's universe (config/correlation.yaml, AQ-5) at import, so a family given
  # a key there is a member here; they carry NO expected_members, because that
  # universe's deliberate count is the correlation layer's own block and a second
  # count of the same list could only disagree with it. Where that file is not in
  # the checkout the four blocks are empty and the attribution says why.
  # ---------------------------------------------------------------------------
  driver_attribution_explained:
    description: >-
      Each family's monthly return regressed on the common factor set -- the
      10-year real yield's change (DFII10), the broad dollar's log return
      (DTWEXBGS), the growth surprise (payrolls) and the inflation surprise
      (core CPI), both against the naive rule and aligned to the month they
      printed in -- over a rolling 60 complete months: the R squared, 0 to 1. A
      lens, never a composite; 'attributing a move to any one driver is
      guesswork' (III Ch 7), so the share is printed, not asserted.
    members_from: altdata.attribution.DRIVER_EXPLAINED
    units: fraction
    source: derived_state
    members_are: keys
    mechanism_group: factor_attribution
    native_horizon: monthly
    freq: monthly
    family: ratio
    information_half_life: month
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    long_window: until_the_lenses
    rights_ceiling: narrow_flag
    trigger_eligible: false
    added_date: "2026-10-10"
    kill_condition: >-
      Drop a factor whose five-year loading has no stable sign across the regime
      splits; the residual stays (change order 10 Oct 2026, section 5, driver
      attribution). The sign-stability check is computed and printed
      (calc.driver_attribution.<family>.sign_stable.<factor>); nothing acts on it.

  driver_attribution_residual:
    description: >-
      Each family's residual this month: its monthly return less the rolling
      60-month fit on the four common factors, in the return's own units x 100
      (log-return percent for a price). What the common factors do not explain.
    members_from: altdata.attribution.DRIVER_RESIDUAL
    units: percent_return
    delta_unit: pp
    source: derived_state
    members_are: keys
    mechanism_group: factor_attribution
    native_horizon: monthly
    freq: monthly
    family: ratio
    information_half_life: month
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    long_window: until_the_lenses
    rights_ceiling: narrow_flag
    trigger_eligible: false
    added_date: "2026-10-10"
    kill_condition: >-
      Drop a factor whose five-year loading has no stable sign across the regime
      splits; the residual stays (change order 10 Oct 2026, section 5, driver
      attribution). The sign-stability check is computed and printed
      (calc.driver_attribution.<family>.sign_stable.<factor>); nothing acts on it.

  driver_attribution_loadings:
    description: >-
      Each family's STANDARDISED loading on each common factor over the rolling
