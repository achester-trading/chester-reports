    description: >-
      1 in a week the 10-year Treasury yield (DGS10) rose and the broad dollar
      (DTWEXBGS) fell, 0 otherwise; each move is stored beside it.
      ONE SERIES under both papers' names: Currencies section 19
      'yields-up/dollar-down' and the Rates paper's S10/S29 'credibility
      repricing' (front end down, term premium up, currency down, gold up)
      describe the same signature. Weeks end Friday; each leg is read on its
      week's final observation. Narrow flag; no kill condition ruled.
