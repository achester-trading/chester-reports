bulk_imports:

  fred_macro:
    description: >-
      The 59 FRED series behind the Monthly Macro report. Enumerated in code
      with key, units, freq and pillar; duplicating them here would create two
      registries that drift. mechanism_group is assigned by pillar, because
      pillars are genuinely different mechanisms -- liquidity and labour can
      confirm each other, two labour series cannot.
    source: fred
    members_from: altdata.config.FRED_SERIES
    member_key: key
    # The observation store writes these as "fred.nfp", not "nfp", so that a
    # future non-FRED series of the same name cannot collide. The registry has
    # to agree or a join between the two silently finds nothing.
    key_prefix: "fred." 
    expected_members: 59
    units: from_member          # SeriesSpec.units
    # SHARES AND RATES OF CHANGE (ruled 15 Oct 2026, AUD-3a follow-up 1). FRED
    # quotes them in "%" as it quotes a yield, and "%" moves in basis points, so
    # "unemployment up 20 bp" misread. Only the unit of the printed CHANGE moves
    # (percentage points); no value does. Yields, rates and spreads keep bp.
    member_units:
      fred.u3_rate: percent_share
      fred.lfp_rate: percent_share
      fred.emp_pop_ratio: percent_share
      fred.quits_rate: percent_share
      fred.mortgage_delinq: percent_share
      fred.cc_delinq_30: percent_share
      fred.auto_delinq: percent_share
      fred.cc_chargeoff: percent_share
      fred.sticky_cpi: percent_return
      fred.sticky_core: percent_return
      fred.flex_cpi: percent_return
      fred.fed_debt_pct_gdp: percent_share
    native_horizon: from_member # SeriesSpec.freq
    # FRED INHERITS ITS RELEASE CADENCE. A monthly series is current until the
    # next monthly print; a daily one is stale in a day. One half-life across
    # 59 series of four different frequencies would be wrong for most of them.
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    # THE ONE SOURCE THAT REVISES. GDP, payrolls and most of the macro set are
    # restated, sometimes more than once. A revision shares its observed_at
    # with the original print and differs in available_at -- exactly what the
    # point-in-time store exists to hold.
    #
    # ALFRED is FRED's vintage archive and holds the true release times. We do
    # NOT read it yet: migrated rows carry available_at = the pull time, an
    # upper bound that OVERSTATES how early we knew. Backfilling real vintages
    # from ALFRED is the open item.
    revision_policy: revised
    revision_source: "ALFRED (alfred.stlouisfed.org) -- not yet ingested"
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "1": macro_labor
      "2": macro_momentum
      "2F": macro_consumer_stress
      "3": macro_liquidity
      "4": macro_inflation
      "5": macro_sentiment
      "6": macro_valuation_credit
      "7": macro_global_fx
      "8": macro_sovereign

  fred_signal_triage:
    description: >-
      The FRED series the signal-triage order adds (ST-1, 26 Sep 2026): real and
      front-end yields, the Kim-Wright term premium, fed funds, the NBER
      recession flag, SOMA Treasuries, nominal GDP, AA and BBB OAS, G.19 consumer
      credit, the real broad dollar and three Z.1 household rows; ST-2 added the
      OECD monthly Japan 10-year and 3-month (percent); the 28 Sep rulings
      added the 30-year TIPS real yield (DFII30, percent); the INC-6 follow-up
      (1 Oct) added USD/MXN (DEXMXUS, pesos per dollar, read off FRED's series
      record that day) for the heat view's FX conversion. Pulled by the
      same path as fred_macro (altdata/sources/fred.py over FRED_PULL_SERIES) and
      written under the same `fred.` prefix, but a SEPARATE list and block,
      because FRED_SERIES is what the Monthly and surprise v1 iterate and ST-1
      may add neither a render change nor a calc.* series. Units are the
      member's own, read off each FRED page on 26 Sep 2026: TREAST, TOTALSL,
      REVOLSL, NONREVSL and the Z.1 rows are MILLIONS; GDP is billions SAAR.
    source: fred
    members_from: altdata.config.FRED_SIGNAL_SERIES
    member_key: key
    key_prefix: "fred."
    expected_members: 52   # + EXPINF10YR, the G7 CLI, fourteen HICP legs and three EM 10-years (ST-R5.42a/43a/39a) + T5YIE (6d) + SOFR, IORB (T2.3) + DFII5 (batch 3, ST-B3-02) + the two EM OAS (SR-46; its six EM currencies are AQ-3's FX-scan and Thailand keys) + AAA and euro HY OAS (ST-R5.41a) + the Z.1 equity share and financial assets (ST-R5.30a) + WPSFD49116 and ULCNFB (ST-R5.35a)
    member_units:
      fred.hh_equity_share: percent_share
    units: from_member
    native_horizon: from_member
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    # G.19, GDP and Z.1 are restated; the daily yields and OAS are not, but the
    # block takes the stricter policy for all of them -- the rule that matters is
    # that nothing here may carry a reconstructed availability, and `revised`
    # is what forbids it. First prints for SR-5 come from ALFRED, not this pull.
    revision_policy: revised
    revision_source: "ALFRED (alfred.stlouisfed.org) -- not yet ingested (O.16)"
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "2": macro_momentum
      "2F": macro_consumer_stress
      "2R": rates_decomposition
      "3": macro_liquidity
      "6": macro_valuation_credit
      "4": macro_inflation
      "7": macro_global_fx
      "HH": household_allocation

  fred_fx_scan:
    description: >-
      The FX scan tier (AQ-3 part 1, 11 Oct 2026; the Quarterly's currency
      chapter, change order section 4.4): every daily H.10 pair on FRED the store
      did not already hold -- AUD, NZD, GBP (US dollars per unit), CAD, CHF, SEK,
      NOK, DKK, BRL, ZAR, KRW, TWD, INR, SGD, HKD, MYR, LKR, VES (units per US
      dollar). Each read off its FRED page on 11 Oct 2026, last print 2 Oct; the
      quote convention is the member's units. Same FRED path and prefix as the
      other two blocks; a separate list because nothing reads these yet but the
      currency chapter. The baht is NOT here (fred_thailand).
    source: fred
    members_from: altdata.config.FRED_FX_SCAN_SERIES
    member_key: key
    key_prefix: "fred."
    expected_members: 18
    units: from_member
    native_horizon: from_member
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    revision_source: "ALFRED (alfred.stlouisfed.org) -- not yet ingested"
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "7": macro_global_fx

  fred_sloos:
    description: >-
      SLOOS (AQ-3 part 2, 11 Oct 2026): the Fed's Senior Loan Officer Opinion
      Survey, the NET PERCENTAGE of domestic banks tightening standards --
      C&I to large and middle-market firms (DRTSCILM) and to small firms
      (DRTSCIS); CRE construction and land development (SUBLPDRCSC), nonfarm
      nonresidential (SUBLPDRCSN), multifamily (SUBLPDRCSM; the CRE split from
      2013Q4). Quarterly, observed_at the survey quarter's first day. The credit
      chapter's lending-standards measurable (the operator's ruling on AQ-2 part
      2's choice 6). A net share of banks moves in PERCENTAGE POINTS: "%" alone
      would print a ten-point swing as 1,000 bp.
    source: fred
    members_from: altdata.config.FRED_SLOOS_SERIES
    member_key: key
    key_prefix: "fred."
    expected_members: 5
    units: from_member
    delta_unit: pp
    # The same as a declared unit (ruled 15 Oct 2026): a net share of banks. The
    # block's delta_unit already moved them in pp; this names why.
    member_units:
      fred.sloos_ci_large: percent_share
      fred.sloos_ci_small: percent_share
      fred.sloos_cre_construction: percent_share
      fred.sloos_cre_nonres: percent_share
      fred.sloos_cre_multifamily: percent_share
    native_horizon: from_member
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    revision_source: "ALFRED (alfred.stlouisfed.org) -- not yet ingested"
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "6": macro_valuation_credit

  fred_aq3:
    description: >-
      The real-estate and global-rates legs (AQ-3 part 2, 11 Oct 2026), each
      read off FRED with its unit checked against the series page: CRE loan
      delinquency (DRCRELEXFACBS, %, quarterly -- the real-estate chapter's
      headline row); Case-Shiller US national (CSUSHPINSA, index, monthly); the
      policy rates of the hedged-yield approximation -- effective fed funds daily
      (DFF), the ECB deposit rate (ECBDFR), Japan's call rate monthly
      (IRSTCI01JPM156N); and the UK 10-year gilt, monthly average
      (IRLTLT01GBM156N; the Bank of England's database disallows robots); and
      the Fed's nominal emerging-market dollar index (DTWEXEMEGS, index Jan
      2006 = 100, daily -- the EM paper's request, 12 Oct 2026).
    source: fred
    members_from: altdata.config.FRED_AQ3_SERIES
    member_key: key
    key_prefix: "fred."
    expected_members: 7
    units: from_member
    # CRE delinquency is a share of loans: pp (ruled 15 Oct 2026; see fred_macro).
    # The four policy rates and the gilt keep bp.
    member_units:
      fred.cre_delinq: percent_share
    native_horizon: from_member
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    revision_source: "ALFRED (alfred.stlouisfed.org) -- not yet ingested"
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "2": macro_momentum
      "3": macro_liquidity
      "6": macro_valuation_credit
      "7": macro_global_fx

  fred_sr43:
    description: >-
      SR-43 / SR-49 (signal-triage batch 4, ST4-09 and ST4-15): the OECD
      long-term government bond yields on FRED (IRLTLT01<cc>M156N, 10-year,
      monthly average, percent) for the twin-deficit fit's developed markets and
      the selloff-shape axis's focal sovereigns -- the US, Canada, Germany,
      France, Italy, Spain, the Netherlands, Belgium, Australia, New Zealand,
      Switzerland and Sweden. Ids and units read off each FRED page 12 Oct 2026.
    source: fred
    members_from: altdata.config.FRED_SR43_SERIES
    member_key: key
    key_prefix: "fred."
    expected_members: 12
    units: from_member
    native_horizon: from_member
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    revision_source: "ALFRED (alfred.stlouisfed.org) -- not yet ingested"
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "7": macro_global_fx

  fred_thailand:
    description: >-
      USD/THB, H.10 (DEXTHUS, baht per dollar; AQ-3 part 1). ISOLATED: the
      Thailand chapter's series (change order section 4.10; the Thailand spec)
      carry namespace thailand and are never trigger_eligible -- they inform a
      private decision and nothing in the trading system. Its own block so the
      isolation is declared once, on the block, and cannot be lost in a list.
    source: fred
    members_from: altdata.config.FRED_THAILAND_SERIES
    member_key: key
    key_prefix: "fred."
    expected_members: 1
    namespace: thailand
    units: from_member
    native_horizon: from_member
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    revision_source: "ALFRED (alfred.stlouisfed.org) -- not yet ingested"
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "7": macro_global_fx

  market_closes:
    description: >-
      Daily closes for the 40-symbol market basket, keyed yfinance.mkt_<sym>
      (ST-2 added IVW IVE IWF IWD VWO ACWX EMXC GUNR and CNH=X as mkt_usdcnh;
      PB-1, 5 Oct 2026, replaced CNH=X with CNY=X as mkt_usdcny; AQ-4, 10 Oct
      2026, added DBC for the returns quilt's broad commodities; AQ-5, 10 Oct
      2026, added DBA ETH-USD SOL-USD ZEC-USD VNQI MCHI for the correlation
      layer's universe).
      SPLIT-ADJUSTED AND DIVIDEND-UNADJUSTED -- the value that traded. The
      adjusted close is deliberately not stored: it restates its own history
      every time a dividend is paid, which no point-in-time store can support,
      and it would disagree with the pin log, the exposure engine's spot and
      every decision's reference price. Dividends and splits are stored beside it
      as their own series (see market_actions) so total return is computable
      without un-adjusting anything.
    source: yfinance
    members_from: altdata.sources.yfinance_source.SYMBOLS
    # SYMBOLS maps ticker -> store key, and the STORE KEY is the member name.
    # Declared rather than assumed: iterating the dict yields tickers, so a
    # resolver left to guess would register yfinance.SPY and never
    # yfinance.mkt_spy, and every price metric would read as unregistered.
    members_are: values
    # ONE MEMBER'S OWN UNITS (AUD-3a item 3, 14 Oct 2026). The block's units are
    # price, which moves in percent of itself. Two yields and two volatility
    # indexes are not prices: ^TNX going 4.25 -> 4.32 is +7 bp, not +1.65%, and
    # the VIX going 18 -> 20 is +2 points, not +11.1%. Declared per store key,
    # read by altdata/derived.py; check_registry fails a key that is no member.
    member_units:
      yfinance.mkt_tnx: percent_rate
      yfinance.mkt_tyx: percent_rate
      yfinance.mkt_vix: vol_index
      yfinance.mkt_vix3m: vol_index
      # Ruled 15 Oct 2026: the MOVE and the VVIX are volatility indexes like the
      # VIX; SKEW is an index level whose percent change means nothing. All three
      # move in points. The move screen's basis is pinned apart, in
      # config/move_screen.yaml, so this line cannot move it.
      yfinance.mkt_vvix: vol_index
      yfinance.mkt_move: vol_index
      yfinance.mkt_skew: index_points
    expected_members: 106   # 40 + NVDA + AGG + the tape's ^TNX ^TYX DX-Y.NYB GC=F CL=F (T2.1) + ^MOVE ^VVIX ^SKEW (T2.2) + HG=F JPY=X EURUSD=X (T2.3) + RB=F HO=F (AQ-3) + VNQ VEA HEFA (AQ-3 part 2) + DBC (AQ-4) + DBA ETH-USD SOL-USD ZEC-USD VNQI MCHI (AQ-5) + the 28 earnings names (Book B scanner follow-up 4, 13 Oct 2026) + EURCHF=X (batch 3, SR-30) + TRY=X IDR=X and ten EM country ETFs (SR-46)
    key_prefix: yfinance.
    units: price
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: split_only
    trigger_eligible: false
    mechanism_group: market_close
  market_ohlc:
    description: >-
      T2.1 (4 Oct 2026): the daily open, high and low beside the close for the
      tape set's nine symbols (SPY, QQQ, IWM, ^TNX, ^TYX, DX-Y.NYB, GC=F, CL=F,
      BTC-USD), keyed yfinance.mkt_<sym>_open / _high / _low, so the tape's daily
      frames and the Weekly's candles read the store and the bars table holds
      intraday only. Same basis as the close: split-adjusted, dividend-unadjusted.
    source: yfinance
    members_from: altdata.sources.yfinance_source.OHLC_KEYS
    members_are: values
    member_suffixes: ['_open', '_high', '_low']
    # The two yields' open, high and low are yields as their closes are
    # (AUD-3a item 3; see market_closes).
    member_units:
      yfinance.mkt_tnx_open: percent_rate
      yfinance.mkt_tnx_high: percent_rate
      yfinance.mkt_tnx_low: percent_rate
      yfinance.mkt_tyx_open: percent_rate
      yfinance.mkt_tyx_high: percent_rate
      yfinance.mkt_tyx_low: percent_rate
    expected_members: 9
    key_prefix: yfinance.
    units: price
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: split_only
    trigger_eligible: false
    mechanism_group: market_close
  market_volume_shares:
    description: >-
      Book B scanner follow-up 1 (ruled 13 Oct 2026): the daily volume beside the
      close, keyed yfinance.mkt_<sym>_volume, for every ETF and stock in the
      basket, in SHARES as Yahoo reports them. Read by the scanner's breakout and
      reclaim volume legs (the session against its 20-session average) and its
      dollar-ADV liquidity score. A zero is not stored: it is the source having
      none. Index levels, currency pairs and the dollar index carry no volume
      and have no member here (yfinance_source.VOLUME_UNITS).
    source: yfinance
    members_from: altdata.sources.yfinance_source.VOLUME_SHARE_KEYS
    members_are: values
    member_suffixes: ['_volume']
    expected_members: 82
    key_prefix: yfinance.
    units: shares
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: split_only
    trigger_eligible: false
    mechanism_group: market_close
  market_volume_contracts:
    description: >-
      The same, for the three front futures (GC=F, CL=F, HG=F): front-month
      CONTRACTS traded, a count and not a notional (a gold contract is 100 oz,
      WTI 1,000 bbl), so the scanner reads it for the volume leg's ratio and
      never multiplies it by the close.
    source: yfinance
    members_from: altdata.sources.yfinance_source.VOLUME_CONTRACT_KEYS
    members_are: values
    member_suffixes: ['_volume']
    expected_members: 5
    key_prefix: yfinance.
    units: count
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    trigger_eligible: false
    mechanism_group: market_close
  market_volume_usd:
    description: >-
      The same, for the crypto pairs (BTC-USD, and AQ-5's ETH-USD, SOL-USD,
      ZEC-USD): Yahoo quotes crypto volume in DOLLARS, not coins, so
      it is already a dollar volume and the scanner reads it as one.
    source: yfinance
    members_from: altdata.sources.yfinance_source.VOLUME_USD_KEYS
    members_are: values
    member_suffixes: ['_volume']
    expected_members: 4
    key_prefix: yfinance.
    units: usd
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    trigger_eligible: false
    mechanism_group: market_close
  # THE BARS TABLE (AUD-3a items 1 and 3, 14 Oct 2026). altdata/bars.py's table is
  # not keyed by registry_key: a row is (instrument, interval, observed_at) with
  # OHLC and a volume. Registered here so the store check can resolve every bar
  # instrument, and so its VOLUME has a declared unit, as the daily
  # market_volume_* blocks give the closes'. The keys are built from the tape in
  # config/reporting_stack.yaml (altdata.bars.BAR_PRICE_KEYS / BAR_VOLUME_*).
  bars_prices:
    description: >-
      Each bar instrument's 5-minute and daily open, high, low and close, keyed
      bars.<tape id> (bars.spy, bars.y10 ...). The two yield indices are yields
      in percent, as their daily closes are.
    members_from: altdata.bars.BAR_PRICE_KEYS
    members_are: keys
    expected_members: 10
    units: price
    member_units:
      bars.y10: percent_rate
      bars.y30: percent_rate
    source: yfinance
    native_horizon: intraday
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    trigger_eligible: false
    mechanism_group: market_close
  bars_volume_shares:
    description: >-
      A bar's volume in SHARES, for the ETFs (SPY, QQQ, IWM), keyed
      bars.<tape id>.volume. An index, a currency pair and the dollar index carry
      no volume and have no key.
    members_from: altdata.bars.BAR_VOLUME_SHARE_KEYS
    expected_members: 3
    units: shares
    source: yfinance
    native_horizon: intraday
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    trigger_eligible: false
    mechanism_group: market_close
  bars_volume_contracts:
    description: >-
      A bar's volume in CONTRACTS, for the futures (gold, oil, ES): front-month
      contracts traded, not a notional.
    members_from: altdata.bars.BAR_VOLUME_CONTRACT_KEYS
    expected_members: 3
    units: count
    source: yfinance
    native_horizon: intraday
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    trigger_eligible: false
    mechanism_group: market_close
  bars_volume_usd:
    description: >-
      A bar's volume in DOLLARS, for Bitcoin, as Yahoo quotes a crypto pair.
    members_from: altdata.bars.BAR_VOLUME_USD_KEYS
    expected_members: 1
    units: usd
    source: yfinance
    native_horizon: intraday
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    trigger_eligible: false
    mechanism_group: market_close

  market_actions:
    description: >-
      Dividend and split events for the same basket, keyed
      yfinance.mkt_<sym>_dividend and _split. Stored only when NON-ZERO: yfinance
      emits 0.0 on every ordinary day, and 250 rows a year asserting that nothing
      happened are both noise and indistinguishable from a real zero. Registered
      as a block against the same code list so a symbol added to the basket
      cannot arrive with unregistered event series.
    source: yfinance
