  # ---------------------------------------------------------------------------
  # THE CORRELATION LAYER'S NAMED ROWS (AQ-5; change order 10 Oct 2026, sections
  # 5 and 9). Each carries its paper's reading rule in its description. Written by
  # altdata/correlation.py from config/correlation.yaml; rights ceiling NARROW
  # FLAG, never trigger-eligible, no composite weight. The matrix, the shift flags
  # and the breaks are the three correlation_* bulk blocks below. The btc/gold/oil
  # rows are matrix cells registered here for their reading rule (a metric entry
  # takes precedence over a bulk member of the same key). long_window waits for
  # the metric lenses (6e): until then percentiles are over the store's own
  # full history.
  # ---------------------------------------------------------------------------
  corr.stock_bond.spx_tlt.60d:
    source: derived_state
    mechanism_group: cross_asset_correlation
    native_horizon: daily
    freq: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    family: ratio
    long_window: until_the_lenses
    rights_ceiling: narrow_flag
    trigger_eligible: false
    added_date: "2026-10-10"
    description: >-
      S&P 500 (^GSPC) against TLT, daily log returns over 60 common sessions,
      percentile-ranked over the store's own history. Reading rule (arch Session 12;
      XX Ch 5; XVII): high inflation makes a negative stock-bond correlation rare and
      low inflation makes it possible -- never a CPI threshold. The Base Rates regime
      table is the prior: disinflationary calm -0.3 to -0.5; inflationary +0.2 to
      +0.6; crisis 'bonds usually rally, but not always'.
