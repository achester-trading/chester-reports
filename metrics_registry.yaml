      Core PCE, year-over-year in percent -- the Fed's own target variable, and
      the inflation leg of calc.r_real_10y_core_pce.
  calc.yoy_m2:
    source: derived_state
    mechanism_group: macro_liquidity
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    delta_unit: pp
    trigger_eligible: false
    description: M2 money stock, year-over-year in percent.
  calc.yoy_real_gdp:
    source: derived_state
    mechanism_group: macro_momentum
    native_horizon: quarterly
    freq: quarterly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    delta_unit: pp
    trigger_eligible: false
    description: >-
      Real GDP, year-over-year in percent. This is the G in r-vs-g, and it is
      computed once: calc.r_minus_g reads this series rather than recomputing it.
  calc.yoy_housing_starts:
    source: derived_state
    mechanism_group: macro_momentum
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
