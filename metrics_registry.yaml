  bbk.bund_10y:
    source: bundesbank
    mechanism_group: foreign_rates
    native_horizon: daily
    freq: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: percent_rate
    trigger_eligible: false
    description: >-
      The 10-year Bund yield, PERCENT, daily: the Bundesbank's term-structure estimate (Svensson method) for listed Federal securities at 10.0 years' residual maturity (BBSIS.D.I.ZST.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A). A fitted zero-coupon yield, a few bp from the on-the-run benchmark's quote. available_at the next weekday 12:00 Frankfurt (reconstructed).
  ecb.irs_10y_de:
    source: ecb
    mechanism_group: foreign_rates
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: revised
    units: percent_rate
    trigger_eligible: false
