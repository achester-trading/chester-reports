  # AQ-3 PART 2 (11 Oct 2026) -- the remaining structure series. Writers:
  # bundesbank.py, ecb_irs.py, nbs.py; computed: altdata/market_features.py
  # aq3b_rows. FRED's SLOOS and real-estate/rates legs are bulk blocks below.
