  calc.yoy_ahe:
    source: derived_state
    mechanism_group: macro_labor
    native_horizon: monthly
    freq: monthly
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    delta_unit: pp
    trigger_eligible: false
    description: >-
      Average hourly earnings, year-over-year in percent. The upstream FRED key is
      named `ahe_yoy` and is NOT a year-over-year series: CES0500000003 is a level
      in dollars per hour. The year-over-year is computed here, and the key's name
      is left alone because prior snapshots and the store reference it.
  # -------------------------------------------------------------------------
  # THE EVENTS TABLE (6c-1). Six types, one per kind of thing that happens.
  #
  # These are RECORDS, not figures: a row is a headline, a filing, a scheduled
  # release. The numbers events produce -- a surprise, a count per story query --
  # are ordinary observations written by the modules that compute them, and are
  # registered separately. Registering the types here is what makes a report able
  # to filter on `type` and know the set is closed.
  #
  # observation_type OBSERVED for all six: a source reported that this happened.
  # The one that looks arguable is `scheduled` -- a calendar entry is a statement
  # about the future -- but the OBSERVATION is that the source published that date,
  # which is a fact about the source and not a forecast of ours.
  #
  # revision_policy NEVER. An event is a snapshot. When a scheduled release comes
  # true the actual is a NEW row of type `release`, not a revision of the calendar
  # entry: "the print is due Thursday" and "the print was 3.2%" are two facts and
  # collapsing them would lose the calendar the moment it was fulfilled.
  # -------------------------------------------------------------------------
  calc.earnings_surprise_pct:
    source: yfinance
    mechanism_group: equity_tape
    native_horizon: daily
    freq: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: percent_return
    delta_unit: pp
    trigger_eligible: false
    description: >-
      THE REAL SURPRISE: reported EPS against the ANALYST MEAN, in percent, from
      yfinance, keyed by symbol as the instrument. A consensus existed before the
      print, so this is a surprise in the ordinary sense -- which is exactly why it
      does not share a name with calc.surprise_vs_naive.
      ONE UNIT FOR EVERY SYMBOL, which is why this is a single metric where the
      macro surprises are one per series: a percentage surprise is comparable
      across names in a way a difference in index points is not.
      Read out of the events table's `earnings` rows rather than re-fetched, so the
      figure in the observation and the figure in the event are the same figure.
    caveats:
      - >-
        THE PERCENTAGE IS OF A SMALL DENOMINATOR AND OCCASIONALLY ABSURD. AMZN's
        July 2026 quarter reads +215% because the estimate was 1.83 against 5.75
        reported -- a GAAP figure against an adjusted estimate, or a one-off gain.
        The payload keeps both numbers so a reader can see what produced it, and a
        percentile over this metric's own history is the only honest way to read it.
  events.release:
    source: fred
    mechanism_group: macro_momentum
    native_horizon: daily
    freq: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      A macro data release that has landed: the source, the series it belongs to
      as an entity, and the actual where the feed carries one. The figure itself
      goes to the observation store under its own key; this row is the record that
      the release happened when it did.
  events.earnings:
    source: yfinance
    mechanism_group: equity_tape
    native_horizon: daily
    freq: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      An earnings report for a universe symbol, with the EPS estimate, the
      reported figure and the surprise where yfinance carries them. This is real
      consensus -- an analyst mean, not a naive expectation -- which is why the
      earnings surprise and the macro one are different metrics with different
      names.
  events.filing:
    source: sec_edgar
    mechanism_group: equity_tape
    native_horizon: daily
    freq: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      An SEC filing for a universe symbol -- 8-K, 13F and whatever else the feed
      carries -- with its accession number as the dedupe key. An 8-K is the one
      filing that arrives because something happened rather than because a quarter
      ended, which is why it is worth a row in a table a daily report reads.
  events.headline:
    source: news_rss
    mechanism_group: narrative
    native_horizon: daily
    freq: daily
    information_half_life: session
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      A news item matching one of the DECLARED story queries in
      config/story_queries.yaml. Capped per query per day, stored with its source
      and url so a claim can be chased to its origin.
      HALF-LIFE SESSION, unlike every other type here: a headline is a record of
      what was being said, and what was being said yesterday is context rather
      than news. The row never decays -- revision_policy is never -- but its
      usefulness to a decision does, and the half-life is the field that says so.
  events.session_event:
    source: derived_state
    mechanism_group: equity_tape
    native_horizon: daily
    freq: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      A session's own event classes -- OPEX, TRIPLE_WITCHING, MONTH_END,
      QUARTER_END and the rebalances -- from altdata/session.py, which is the one
      place the calendar rules live. CALCULATED rather than observed: nobody
      publishes these, they follow from the date.
  events.scheduled:
    source: fred
    mechanism_group: macro_momentum
    native_horizon: daily
    freq: daily
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    revision_policy: never
    units: label
    trigger_eligible: false
    description: >-
      A FORWARD-DATED item: a release date, an earnings date, an FOMC meeting. Its
      observed_at is the instant it is scheduled for, which is why the forward
      calendar is this table read ahead of the cutoff rather than a second table.
      HALF-LIFE until_next_release at a daily cadence: a calendar pulled today is
      current until tomorrow's pull, because dates move.
  baserate.review_flag:
    source: derived_base_rate
    mechanism_group: base_rate
    native_horizon: structural
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      Written when a recompute moves a watched base-rate field further than its
      declared tolerance, naming the field, both values and the tolerance. NOT an
      error path: a drawdown distribution that has genuinely shifted is the most
      informative thing tools/base_rates.py can report, and the flag exists so it
      reaches a human rather than being absorbed into the next year's numbers. A
      method_version change is reported here too and explicitly NOT as drift --
      fields are never compared across methods.
  overnight.gap_attribution:
    source: yfinance
    mechanism_group: overnight_context
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      31.3(a)'s attribution line as one record: the ES move split across the Tokyo
      and European clock windows and the remainder, the CASH index that was trading
      in each window beside it, the total since the prior settle, and the window
      that dominated -- or that none did, which is the commoner answer. Written by
      the 06:45 overnight pass, which owns the legs; the 07:00 anchor READS it and
      derives nothing, because two producers of one label is how a page and a store
      come to disagree about last night. RIGHTS: Backdrop context only. Per 31.3(a)
      an attribution line MAY NOT generate a Book C setup, and the string travels on
      the record rather than only in a rendering so a consumer that skipped the
      prose still has it.
  overnight.gap_attribution_dominant:
    source: yfinance
    mechanism_group: overnight_context
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      Which window dominated last night -- tokyo, europe, other, or `none` -- as its
      own series, so the question "how often does the move happen while Tokyo is
      open" is answerable by a query rather than by opening a year of JSON records.
      A window is named only when its absolute move is at least the declared
      multiple (2x) of the next largest; without that margin the word means nothing,
      since three windows of 4, 4 and 3 points have no dominant window and naming
      the 4 would tell a reader the night had a location it did not have.
  regime.dimension_state:
    source: derived_state
    mechanism_group: market_state
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      One dimension's published state, from declared percentile bands on its
      primary member and subject to persistence_sessions. An absent dimension
      carries no state and a written reason instead.
  regime.dimension_percentile:
    source: derived_state
    mechanism_group: market_state
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percentile
    trigger_eligible: false
    description: >-
      The primary member's own-history percentile ON THE DIMENSION'S SCALE, after
      the declared polarity is applied -- so a wide HY spread reads as stressed
      credit rather than as a high number.
  regime.dimension_direction:
    source: derived_state
    mechanism_group: market_state
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      The sign of the primary member's rate of change times its polarity: +, -,
      or 0. Zero means NOT MEASURED as often as it means flat, and the object
      records which.
  regime.dial_state:
    source: derived_state
    mechanism_group: market_state
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    trigger_eligible: false
    description: >-
      One dial's state. macro comes from a declared lookup over dimension states,
      vol from VIX level bands, gamma from the exposure engine's own sign -- read,
      never recomputed.
  contradiction.magnitude:
    source: derived_state
    mechanism_group: market_divergence
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      Today's standardised gap between a pair's two legs, expressed as a z of that
      gap's own history over the window. 2.0 means the legs are further apart than
      they have been 95% of the time -- a claim about the RELATIONSHIP, not about
      either level. None on a dial pair, which is a state mismatch and has no
      distribution to take a z of.
  contradiction.open:
    source: derived_state
    mechanism_group: market_divergence
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: boolean
    trigger_eligible: false
    description: >-
      Whether the pair's condition has held persistence_sessions consecutive
      sessions. Opens and closes on the same rule the dimensions use, so a single
      day's disagreement is not an event.
  contradiction.persistence_days:
    source: derived_state
    mechanism_group: market_divergence
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: days
    trigger_eligible: false
    description: >-
      Consecutive sessions the current run has held. At or past
      exception_sessions the row is an exception -- report-only today, because
      this repo has no exceptions alert path.
  contradiction.since:
    source: derived_state
    mechanism_group: market_divergence
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: date
    trigger_eligible: false
    description: >-
      The first session of the current open run, carried forward from the prior
      object rather than recomputed, so a row's age survives a recompute.
  grade.return_pct:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    trigger_eligible: false
    description: >-
      Return from the decision-time reference close to the horizon close, in the
      decision's own direction. Stored prices only, as-of the horizon date.
  grade.return_points:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: price
    trigger_eligible: false
    description: >-
      The same return in the instrument's own quote units.
  grade.mae_close_pct:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: percent_return
    trigger_eligible: false
    description: >-
      Maximum adverse excursion measured ON SETTLED CLOSES between entry and
      horizon. A LOWER BOUND on the true excursion: a position stopped out
      intraday and recovered by the close is invisible to a close-only series,
      which is why the column is named mae_close and not mae.
  grade.invalidation_hit:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: boolean
    trigger_eligible: false
    description: >-
      Whether the declared invalidation level was breached on a SETTLED CLOSE
      before the horizon. Tested the way the register words it, so here the
      stored data and the declared rule agree exactly.
  grade.risk_per_unit:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: price
    trigger_eligible: false
    description: >-
      Distance from the reference price to the invalidation level -- the loss per
      unit the decision declared it would accept. NULL when the invalidation
      names no level, never defaulted.
  grade.dollars_at_risk:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: usd
    trigger_eligible: false
    description: >-
      risk_per_unit times the declared units. The R denominator; NULL rather than
      guessed when the size declares no parseable units, because an invented
      denominator makes every R in every cut meaningless.
  grade.r_multiple:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      The THESIS outcome: return against dollars at risk, held to the horizon
      regardless of whether the invalidation was touched on the way.
  grade.r_multiple_ruled:
    source: derived_grade
    mechanism_group: decision_grade
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      What a RULE-FOLLOWING operator got: -1R when the invalidation was touched
      before the horizon, otherwise r_multiple. THIS is the column expectancy is
      computed on -- it is the money. The gap between it and r_multiple is the
      measurable cost of where the invalidation was placed, and collapsing the two
      would destroy the distinction Part 7 grades on: a thesis exited early that
      would have worked is a different failure from a thesis that was wrong.


  # ---------------------------------------------------------------------------
  # BRIER (Phase 3). Calculated, trigger_eligible false, and permanently so for
  # the same reason the grades are: a calibration score is how a forecast SOURCE
  # earns credibility, and letting the score move a decision would close the loop
  # on itself.
  brier.score:
    source: derived_probability
    mechanism_group: forecast_calibration
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: ratio
    trigger_eligible: false
    description: >-
      (p - outcome)^2 for one resolved forecast. 0 is certain and right, 0.25 is
      what always saying 50% gets you, 1 is certain and wrong. revision_policy is
      `never`: a forecast is immutable by trigger and a resolution is written
      once, so the score cannot change once it exists.
  brier.running:
    source: derived_probability
    mechanism_group: forecast_calibration
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      Mean Brier over every resolved forecast from one source. Recomputed as
      forecasts resolve, and never reported without its n -- the score conflates
      calibration with resolution, so below the 0.25 coin line the number alone
      cannot separate a calibrated forecaster from a lucky one.
  brier.vs_coin:
    source: derived_probability
    mechanism_group: forecast_calibration
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    trigger_eligible: false
    description: >-
      brier.running minus 0.25. Positive means the source is worse than always
      saying fifty per cent, which is the one verdict a Brier score delivers
      unambiguously at small n.


