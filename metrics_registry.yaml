# -----------------------------------------------------------------------------
bulk_imports:

  fred_macro:
    description: >-
      The 59 FRED series behind the Monthly Macro report. Enumerated in code
      with key, units, freq and pillar; duplicating them here would create two
      registries that drift. mechanism_group is assigned by pillar, because
      pillars are genuinely different mechanisms -- liquidity and labour can
      confirm each other, two labour series cannot.
    source: fred
    members_from: altdata.config.FRED_SERIES
    member_key: key
    # The observation store writes these as "fred.nfp", not "nfp", so that a
    # future non-FRED series of the same name cannot collide. The registry has
    # to agree or a join between the two silently finds nothing.
    key_prefix: "fred." 
    expected_members: 59
    units: from_member          # SeriesSpec.units
    native_horizon: from_member # SeriesSpec.freq
    # FRED INHERITS ITS RELEASE CADENCE. A monthly series is current until the
    # next monthly print; a daily one is stale in a day. One half-life across
    # 59 series of four different frequencies would be wrong for most of them.
    information_half_life: until_next_release
    invalidated_by: none
    observation_type: observed
    # THE ONE SOURCE THAT REVISES. GDP, payrolls and most of the macro set are
    # restated, sometimes more than once. A revision shares its observed_at
    # with the original print and differs in available_at -- exactly what the
    # point-in-time store exists to hold.
    #
    # ALFRED is FRED's vintage archive and holds the true release times. We do
    # NOT read it yet: migrated rows carry available_at = the pull time, an
    # upper bound that OVERSTATES how early we knew. Backfilling real vintages
    # from ALFRED is the open item.
    revision_policy: revised
    revision_source: "ALFRED (alfred.stlouisfed.org) -- not yet ingested"
    trigger_eligible: false
    mechanism_group_from_member: pillar
    mechanism_group_map:
      "1": macro_labor
      "2": macro_momentum
      "2F": macro_consumer_stress
      "3": macro_liquidity
      "4": macro_inflation
      "5": macro_sentiment
      "6": macro_valuation_credit
      "7": macro_global_fx
      "8": macro_sovereign

  pin_log_columns:
    description: >-
      The pin log's column set, which IS the file format and is append-only.
      Registered as a block against the code so a new column cannot appear
      unregistered. The metrics it carries are registered individually above;
      this block exists so the CI check can prove the column list is covered.
    source: yfinance
    members_from: tools.pin_log.PIN_COLUMNS
    expected_members: 80
    trigger_eligible: false
    mechanism_group: pin_outcome
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    # NEVER. A graded outcome is history. The architecture is explicit that the
    # tolerance is "declared in advance and never revised after the fact", so a
    # backfill that regrades an old row at today's tolerance is a violation of
    # this policy, not a variation on it. See TODO -- the code does not honour
    # this yet, and declaring it here is what makes that a defect rather than a
    # matter of taste.
    revision_policy: never
    units: from_member

# -----------------------------------------------------------------------------
# Not metrics. Provenance, diagnostics and labels -- they describe a metric or
# the run that produced it. Listed so the drift check can tell a new metric from
# a new field, and so that adding one is a deliberate act.
non_metrics:
  provenance:
    - symbol
    - session_date
    - fetched_at
    - computed_at
    - spot_source
    - vendor
    - source_chain
    - computed_path
    - convention_version
    - convention_caveat
    - mechanism_group
    - gamma_source
    - greeks_source
    - risk_free_rate
    - capture
    - settled_0dte_rule
    - greeks_status
    - underlying_verified_from
    - close_source
    - run_id
    - tolerance_bps
    - evaluated_at
    - rule
  diagnostics:
    - rows_in
    - exposure_rows
    - settled_0dte_excluded_rows
    - gamma_computed
    - gamma_supplied
    - greeks_solved
    - greeks_unsolved
    - skipped_no_iv
    - skipped_insane_iv
    - skipped_no_oi
    - chex_floored_rows
    # Per-row IV provenance counters behind greeks_source. Diagnostics about
    # how a number was made, not numbers.
    - greeks_from_yf_iv
    - greeks_from_solver
    - strikes
    - strikes_used
    - contracts
    - flip_reason
    - flip_band_pct
    - gamma_flip_method
    - gamma_flip_cum_all
    - min_t_load_bearing
    - excluded_from_exposure_aggregates
    - greeks
    - expiries
    - usable_for_percentiles
    # Emitted by a DEFERRED profile -- the vendor symbols, whose Greeks are
    # gated behind the solver. The absence of a metric is itself a fact the
    # record has to carry, so these are declared rather than unregistered.
    - error
    - deferred
  containers:
    # Structural keys that hold metrics rather than being ones. Declared so the
    # drift check does not mistake a new section for a new number.
    - overall
    - buckets
    - gates
    - quality
    - expiration_release
    - per_strike
    # The per-field mechanism_group map. Structure that says how to READ the
    # metrics, not a metric.
    - field_mechanism_groups
  labels:
    - strike
    - expiry
    - dte
    - bucket
    - expiry_type
    - max_pain_expiry_type
    - unwind_direction
    - cumulative_share_of_abs_dex

