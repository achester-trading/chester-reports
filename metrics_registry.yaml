    kill_condition: >-
      Drop a factor whose five-year loading has no stable sign across the regime
      splits; the residual stays (change order 10 Oct 2026, section 5, driver
      attribution). The sign-stability check is computed and printed
      (calc.driver_attribution.<family>.sign_stable.<factor>); nothing acts on it.

  driver_attribution_sign_stability:
    description: >-
      THE KILL CONDITION'S CHECK, per family and factor: 1 when the factor's
      loading has one sign over the five-year window and in both halves of every
      regime split that can be tested (real yields rising/falling; core CPI
