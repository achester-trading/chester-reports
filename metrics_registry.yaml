# metrics_registry.yaml -- every metric this system computes, and what it may
# be used for.
#
# Architecture 26.14 gate 3: signal rights, horizons, mechanism groups and
# source semantics validated. This is the minimal-but-real first cut: it covers
# what exists TODAY and is expected to grow with use. Where a field is not yet
# worth deciding per-metric, a documented default carries it rather than a
# guess dressed up as a decision.
#
# -----------------------------------------------------------------------------
# SCHEMA
# -----------------------------------------------------------------------------
#
# Three kinds of entry, and the distinction is what makes the CI check bite:
#
#   metrics:       things that could feed a decision. Each declares the four
#                  required fields. Registered individually.
#   bulk_imports:  families too large to hand-enumerate, whose truth already
#                  lives in code. The block declares shared fields and points at
#                  the code with `members_from`; the checker expands it. This is
#                  deliberate -- copying 59 series into YAML would create two
#                  registries that drift apart, which is worse than one.
#   non_metrics:   fields that are provenance, diagnostics or labels and are
#                  NOT metrics. Declared so that "unregistered" and "knowingly
#                  not a metric" are different states. Without this list the
#                  drift check cannot tell a new metric from a new comment.
#
# Required on every metric:
#
#   source            an id from source_registry.yaml
#   mechanism_group   which cluster it belongs to for confluence purposes.
#                     Metrics sharing a group are ONE piece of evidence, never
#                     several. This is the field that stops four Greeks from
#                     being counted as four votes (architecture 26.9).
#   native_horizon    the horizon the metric actually describes. Not how often
#                     it is computed -- what it is about.
#   units             from the vocabulary below.
#   trigger_eligible  whether this metric may, on its own, move a decision.
#
# TRIGGER_ELIGIBLE DEFAULTS TO FALSE, AND EVERY METRIC IS FALSE TODAY. Nothing
# in this repo produces a recommendation yet, and the pin-log base rate has an
# effective n too small to act on. A metric earns trigger eligibility by
# demonstrated performance, not by existing. Flipping one to true is a
# deliberate, reviewable edit -- which is the point of writing it down.

version: 1
updated: 2026-09-05

vocabularies:
  native_horizon: [intraday, daily, weekly, monthly, quarterly, structural]
  units:
    - usd                    # a dollar amount
    - usd_per_1pct           # dollars per 1% move in spot
    - usd_per_volpt          # dollars per 1 implied-vol point
    - usd_per_day            # dollars per calendar day
    - shares                 # shares of the underlying
    - shares_per_1pct
    - shares_per_volpt
    - shares_per_day
    - price                  # a price or strike, in the underlying's currency
    - bps                    # basis points
    - ratio                  # unbounded ratio
    - fraction               # 0..1
    - count
    - days
    - label                  # closed-vocabulary string
    - boolean
    - date
    - from_member            # bulk blocks only: the member's own declared units
  # 26.4: every signal carries a native horizon AND an information half-life.
  # Outside them a metric may DISPLAY as context but may not affect a decision.
  # They are different questions and a metric can be short on one and long on
  # the other -- a pin outcome describes a single session and never decays.
  information_half_life:
    - intraday            # dead within the session; a stale read is not truth
    - session             # superseded by the next capture
    - to_next_expiry      # structurally REWRITTEN when the contributing
                          # options expire, not merely superseded
    - until_next_release  # valid until the source's next scheduled print
    - week
    - month
    - permanent           # a recorded historical fact; never decays
  # HALF-LIFE GATES DECISION USE, so it must be the TIGHTER constraint. An
  # expiry rewrite is a hard invalidation, not a half-life: encoding it as one
  # would license acting on a ten-day-old gamma flip merely because no expiry
  # had intervened, when a fresh one is computed every night. So the half-life
  # is `session` and the rewrite gets its own field.
  invalidated_by:
    - none
    - expiry_rewrite      # the contributing options expire and the profile is
                          # structurally rebuilt -- not decay, deletion
    - position_change     # any fill makes the previous reading untrue
  # 26.4 OBSERVATION_TYPE.
  observation_type:
    - observed            # a source reported it; we did not compute it
    - calculated          # computed deterministically from stored inputs
    - inferred            # derived under a model or assumption that can be
                          # wrong in a way arithmetic cannot be. EVERY
                          # dealers-hand-v1 metric is here: the signing
                          # convention is an assumption about inventory that
                          # public chains cannot observe, and under the
                          # customer-hand reading every sign inverts. Calling
                          # it `calculated` would lend the arithmetic's
                          # certainty to the assumption underneath it.
  # 26.4 REVISION_POLICY. One rule, one real exception:
  #   observed   -> never       a snapshot is a snapshot
  #   calculated -> recomputed  a methodology change REWRITES it, which is not
  #                             the same thing as the source restating
  #   FRED       -> revised     the source itself restates
  revision_policy:
    - never
    - recomputed
    - revised
  mechanism_group:
    # Dealer chain. The greeks and the OI structure are SEPARATE groups on
    # purpose -- architecture 26.9 requires settled OI, effective OI and flow
    # polarity kept distinct, and max pain is an OI construct rather than a
    # gamma one. Everything inside dealer_chain_derived is one cluster.
    - dealer_chain_derived
    - dealer_chain_oi
    - chain_quality
    - pin_outcome
    # Broker state. Its own group because it is an OBSERVATION OF OUR OWN BOOK
    # rather than of the market -- it can never confirm a market signal, and
    # letting it share a group with one would be self-confirmation.
    - portfolio_truth
    # Macro, by pillar. Pillars are genuinely different mechanisms -- labour and
    # liquidity can confirm each other; two labour series cannot.
    - macro_labor
    - macro_momentum
    - macro_consumer_stress
    - macro_liquidity
    - macro_inflation
    - macro_sentiment
    - macro_valuation_credit
    - macro_global_fx
    - macro_sovereign

defaults:
  trigger_eligible: false
  status: active
  # Documented so a missing field is a default, not an oversight.
  rationale: >-
    Nothing here may move a decision on its own. No recommendation path exists,
    and the pin-log sample is far too small for any level to have earned it.

# -----------------------------------------------------------------------------
# Exposure engine -- tools/exposure_compute.py
# -----------------------------------------------------------------------------
# Every greek-derived metric below shares mechanism_group dealer_chain_derived,
# which is the same string the engine stamps on each profile. They are four
# derivatives of one object: same open interest, same vol surface, same signing
# assumption. Treating any two of them as independent confirmation is
# double-counting one chain.

metrics:

  # --- GEX family -----------------------------------------------------------
  exposure.net_gex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd
    description: Raw signed gamma notional across strikes. Underlying quantity.
  exposure.shares_per_1pct:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares_per_1pct
    description: >-
      STORED PRIMARY for gamma. Change in dealer delta, in shares, per 1% move.
  exposure.dollar_gamma_per_1pct:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd_per_1pct
    derived_from: exposure.shares_per_1pct
    description: shares_per_1pct x spot. Derived so the two cannot drift.
  exposure.gamma_flip:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      Spot at which net dealer gamma changes sign, by scan and bisection.
      Blank is meaningful and flip_reason says which blank it is.
  exposure.gamma_flip_cum_strikes:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      Zero crossing of GEX cumulated across strikes at fixed spot. A DIFFERENT
      question from gamma_flip; the two disagreeing is expected.
  exposure.call_wall:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
  exposure.put_wall:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: Extreme negative GEX strike, all strikes. Not the tradeable one.
  exposure.put_wall_otm:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      Extreme negative GEX restricted to OTM. Matches the vendor and is the
      tradeable reading. Immune to the at-the-money artifact that broke the
      peak strike, since an ATM strike cannot be an OTM wall.
  exposure.call_wall_otm:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
  exposure.put_wall_gamma:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
  exposure.put_wall_oi:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: calculated
    revision_policy: recomputed
    units: price
    description: Largest OTM put OI shelf. An OI construct, not a gamma one.
  exposure.peak_abs_gex_strike:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: price
    description: >-
      Largest |GEX| strike. EX-0DTE at a settled capture -- with 0DTE in it was
      an artifact of the MIN_T floor and pinned at the money by construction.

  # --- DEX family -----------------------------------------------------------
  exposure.dex_shares:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares
    description: >-
      STORED PRIMARY for delta. What the dealer OPTION BOOK is long; the hedge
      is the opposite sign. One-signed under dealers-hand-v1, so the magnitude
      and its distribution across expiries carry the information and the
      direction carries none.
  exposure.dex_notional:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd
    derived_from: exposure.dex_shares
  exposure.abs_dex_shares:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares
    description: Gross delta, as a denominator that does not cancel.
  exposure.expiration_release.dex_shares:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: monthly
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares
    description: >-
      Dated dealer-delta unwind: hedge scheduled to be released at one expiry.
      Mechanical consequence of contracts expiring, not a forecast.
  exposure.expiration_release.share_of_abs_dex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: monthly
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: fraction

  # --- VEX / CHEX -----------------------------------------------------------
  exposure.vex_shares_per_volpt:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares_per_volpt
    description: >-
      Vanna. VOL-TRIGGERED: does nothing until IV moves. Collapses to ~0 in
      0DTE, which is a property of the greek and not a data fault.
  exposure.vex_notional_per_volpt:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd_per_volpt
    derived_from: exposure.vex_shares_per_volpt
  exposure.chex_shares_per_day:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares_per_day
    description: >-
      Charm. TIME-TRIGGERED: resolves over hours to days, not on a price move.
      Diverges as 1/sqrt(T), which is why a settled capture reports none for
      0DTE and why the intraday cadence will need a fractional time to expiry.
  exposure.chex_notional_per_day:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd_per_day
    derived_from: exposure.chex_shares_per_day

  # --- per-strike profile ---------------------------------------------------
  # The aggregates above are sums of these. Registered separately because a
  # reader can act on the SHAPE -- where the exposure sits across strikes --
  # without ever touching the scalar, and a shape is a different claim.
  exposure.per_strike.gex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd
    description: Signed dealer gamma notional at one strike.
  exposure.per_strike.call_gex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd
  exposure.per_strike.put_gex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: usd
  exposure.per_strike.dex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares
  exposure.per_strike.vex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares_per_volpt
  exposure.per_strike.chex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: shares_per_day

  # --- bucket shares --------------------------------------------------------
  exposure.share_of_total_abs_gex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: fraction
  exposure.share_of_total_abs_dex:
    source: yfinance
    mechanism_group: dealer_chain_derived
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: inferred
    revision_policy: recomputed
    units: fraction
    description: >-
      Deliberately separate from the gamma share: 0DTE dominates gamma while
      carrying little delta, and one number cannot say both.
  exposure.floored_share_of_abs_gex:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: fraction
    description: >-
      Share of a bucket's |GEX| resting on the MIN_T floor. MIN_T is a guard
      and must never be load-bearing; past 5% the bucket flags itself.

  # --- OI structure (a different mechanism from the greeks) -----------------
  exposure.max_pain:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: calculated
    revision_policy: recomputed
    units: price
    description: >-
      Strike minimising total ITM payout. An OI construct: unaffected by the
      MIN_T floor, so it reads every row including settled 0DTE.
  exposure.oi_total:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: observed
    revision_policy: never
    units: count
  exposure.oi_calls:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: observed
    revision_policy: never
    units: count
  exposure.oi_puts:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: observed
    revision_policy: never
    units: count
  exposure.oi_put_call_ratio:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
  exposure.oi_strikes:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: daily
    information_half_life: session
    invalidated_by: expiry_rewrite
    observation_type: observed
    revision_policy: never
    units: count
  exposure.spot:
    source: yfinance
    mechanism_group: dealer_chain_oi
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: expiry_rewrite
    observation_type: observed
    revision_policy: never
    units: price
    description: >-
      For massive-sourced symbols this is derived from the put-call parity
      forward, not a printed index level; spot_source records which.

  # --- data-quality gates ---------------------------------------------------
  gates.data_quality:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: label
    description: ok / degraded / excluded. Governs whether a day may enter a base rate.
  gates.liquidity_floor:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: boolean
  gates.iv_dispersion:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    description: Normalised IV surface roughness. Threshold PROVISIONAL, uncalibrated.
  gates.oi_concentration:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: ratio
    description: OI Herfindahl and effective strike count.
  gates.oi_weighted_dte:
    source: yfinance
    mechanism_group: chain_quality
    native_horizon: daily
    information_half_life: session
    invalidated_by: none
    observation_type: calculated
    revision_policy: recomputed
    units: days

  # --- pin outcomes ---------------------------------------------------------
  # A different mechanism from the levels themselves: these measure whether a
  # level was reached, which is evidence ABOUT the levels, not more of it.
  pin.dist_bps:
    source: yfinance
    mechanism_group: pin_outcome
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: bps
    description: >-
      Signed distance from a scored level to the close. Applies to max_pain,
      peak_gex, call_wall, put_wall, call_wall_otm, put_wall_otm.
  pin.hit:
    source: yfinance
    mechanism_group: pin_outcome
    native_horizon: daily
    information_half_life: permanent
    invalidated_by: none
    observation_type: calculated
    revision_policy: never
    units: boolean
    description: >-
      |dist_bps| within config.PIN_TOLERANCE_BPS. A CONDITIONER, not a signal,
      until effective n is meaningful -- the sample is currently one session.

  # --- Portfolio Truth (architecture 26.11 Gate 1) --------------------------
  # Read-only broker state. native_horizon is intraday because each row is an
  # instant, not a period: NAV describes the moment it was read.
  portfolio.nav:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
    description: Net liquidation value. The account's mark-to-market worth.
  portfolio.cash:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
  portfolio.buying_power:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
  portfolio.gross_position_value:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
  portfolio.init_margin:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
  portfolio.maint_margin:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
  portfolio.excess_liquidity:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
  portfolio.available_funds:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: usd
  portfolio.cushion:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
    information_half_life: intraday
    invalidated_by: position_change
    observation_type: observed
    revision_policy: never
    units: ratio
    description: >-
      Excess liquidity as a fraction of net liquidation. The margin-stress
      reading; the one to watch rather than the absolute margin figures.
  portfolio.position_qty:
    source: ibkr_paper
    mechanism_group: portfolio_truth
    native_horizon: intraday
