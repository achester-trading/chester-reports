# config/crypto_sources.yaml -- Batch 4 Tranche A, part 1: CD-1 (the watch names'
# DefiLlama series), CD-2 (perp funding, open interest, long/short) and CD-5 (chain
# and mempool state, the fear-and-greed index), with the S-1 and S-3 derived series.
# docs/change-order-crypto-data-sources-2026-10-06.md, pulled forward by Batch 8
# (docs/change-order-signal-triage-batch-8-2026-10-17.md section 6). crypto-tranche-
# a-1, 17 Oct 2026, session B. Read by altdata/sources/{llama,hl,fut,mempool,fng,
# blockscout}.py and altdata/sources/crypto_derived.py.
#
# Every source here is keyless and read within robots.txt (a 4xx robots.txt is no
# rules, RFC 9309 2.3.1.3). SESSION-SET values are marked; the notes list them.
version: 1

# ---------------------------------------------------------------------------
# CD-1: the watch names' fees and revenue (DS-29). The order's watch names are the
# deep and light tiers of the alternative-assets order (BTC, ETH, SOL, ZEC, PRL;
# HYPE, TAO, LINK, AAVE). AAVE, TAO and PRL are crypto-basket names and already
# carry llama.fees_<sym> from config/crypto_basket.yaml, so they are NOT pulled
# again here (one series, one writer). The slug is RESOLVED AT RUN TIME, never
# written down:
#   kind chain     the /overview/fees row whose protocolType is "chain" and whose
#                  name is `match`
#   kind protocol  the parent protocol shared by the /protocols rows whose symbol
#                  is `match` (parentProtocol "parent#<slug>")
# A name that resolves to nothing, or to two parents, is a named failure that
# run, never a guess.
watch_names:
  - {sym: BTC, kind: chain, match: Bitcoin, series: [fees, revenue]}
  - {sym: ETH, kind: chain, match: Ethereum, series: [fees, revenue]}
  - {sym: SOL, kind: chain, match: Solana, series: [fees, revenue]}
  - {sym: ZEC, kind: chain, match: Zcash, series: [fees, revenue]}
  - {sym: HYPE, kind: protocol, match: HYPE, series: [fees, revenue]}
  - {sym: LINK, kind: protocol, match: LINK, series: [fees, revenue]}
# The coin service's caps for the S-3 denominator (OI over market cap). Forward-
# only, as the basket's caps are.
watch_coins:
  - {sym: BTC, coin: "coingecko:bitcoin"}
  - {sym: ETH, coin: "coingecko:ethereum"}

# ---------------------------------------------------------------------------
# CD-2: the perp venues. The order's three are Hyperliquid, Bybit and OKX
# (Binance dropped, D-2). BYBIT IS GEO-BLOCKED FROM THE US: api.bybit.com's
# CloudFront answers 403 "configured to block access from your country" (probed
# 17 Oct 2026 from the laptop), the condition D-2 dropped Binance for -- a leg
# that runs on the box only and cannot be tested from the laptop. Under the 16 Oct
# rule (friction -> a keyless alternative or a listed gap) the third venue is
# DERIBIT's perpetuals (keyless, reachable from both; www.deribit.com publishes no
# robots.txt), already an adopted source in the order (DS-41). Bybit's reader is
# built and fixture-tested on its documented response shape, and switched off.
coins: [BTC, ETH]
venues:
  hyperliquid: {enabled: true, family: hl}
  okx: {enabled: true, family: fut, inst: {BTC: BTC-USDT-SWAP, ETH: ETH-USDT-SWAP}}
  deribit: {enabled: true, family: fut, inst: {BTC: BTC-PERPETUAL, ETH: ETH-PERPETUAL}}
  bybit: {enabled: false, family: fut, inst: {BTC: BTCUSDT, ETH: ETHUSDT},
          off: "blocks the box's country and the laptop's (ruling 1 of 17 Oct 2026): no call path; Deribit is the third venue"}

# HYPERLIQUID'S WEIGHT LIMIT, from its documentation (hyperliquid.gitbook.io,
# "Rate limits and user limits", read 17 Oct 2026): REST requests share an
# aggregated weight limit of 1,200 per minute per IP; metaAndAssetCtxs and
# fundingHistory weigh 20; fundingHistory adds 1 per 20 items returned (at most
# 500 a call). SESSION-SET: the guard spends at most 600 a minute, half the limit,
# because the box shares its IP with nothing else that calls Hyperliquid but a
# second process (a by-hand backfill beside the nightly pull) must still fit.
hyperliquid:
  limit_per_min: 1200
  budget_per_min: 600
  weight_info: 20
  weight_per_items: {fundingHistory: 20}
  max_items: 500

# BACKFILL BOUNDS (SESSION-SET). Every backfill is bounded by a start date and a
# page cap and writes point in time: available_at is the pull instant, never
# backdated (the venues refill nothing, but the system could not know a past day
# before it read it).
backfill:
  hyperliquid_funding_from: 2023-05-12      # Hyperliquid's first funding print
  okx_oi_days: 365                          # OKX serves per-instrument OI history
  okx_funding_days: 92                      # OKX serves about three months
  deribit_funding_from: 2019-01-01
  max_pages: 200

# The daily pull's own window (the first pull of an empty key writes all of it).
daily_window_days: 14

# ---------------------------------------------------------------------------
# S-3 (the order's section 3): OI-weighted funding across the venues, annualised;
# total OI in USD; OI over market cap; z-scores on a 90-day window. SESSION-SET:
# an aggregate needs at least two venues with both funding and OI on the day
# (the order rejects single-venue readings); a z needs 60 of the 90 days.
s3:
  min_venues: 2
  z_window: 90
  z_min_obs: 60

# ---------------------------------------------------------------------------
# CD-5
mempool:
  base: https://mempool.space/api
  # mempool.space serves its single-page app at /robots.txt (200, HTML, no rules):
  # read as no rules. /v1/mining/hashrate/3m and /all are the history.
  pools_top: 10
fng:
  url: https://api.alternative.me/fng/
# ETHEREUM, under the 16 Oct rule (b). The order's DS-11 is Etherscan (ethsupply2,
# the gas oracle), which needs ETHERSCAN_API_KEY, a registration Ari has not made.
# The keyless path within robots is Blockscout's Ethereum explorer
# (eth.blockscout.com, robots: Allow /): the gas oracle (slow/average/fast gwei),
# network utilisation and the daily transaction count (30 days of history). ETH
# supply, staked and burnt (ethsupply2) has no keyless source here: a listed gap,
# with the key's name. Blockscout's price and market cap are CoinGecko's and are
# NOT stored (the 13 Oct ruling on CoinGecko's terms).
blockscout:
  base: https://eth.blockscout.com/api/v2

# ---------------------------------------------------------------------------
# GAPS, named (each printed by its writer's summary and in the notes).
gaps:
  raises: "DefiLlama /raises answers 402 'Upgrade to the paid API plan' (re-probed 17 Oct 2026)"
  eth_supply_burn: "Etherscan ethsupply2 needs ETHERSCAN_API_KEY (a registration Ari has not made); no keyless source within robots serves supply, staked and burnt"
  coingecko_global: "CoinGecko /global (total market cap, BTC dominance): no ST-13 fetcher exists, and CoinGecko's terms bar storing its data (ruled 13 Oct 2026); no free source with storable terms serves the total"
  bybit: "geo-blocked from the US (17 Oct 2026); Deribit perpetuals are the third venue"

# ===========================================================================
# TRANCHE A, PART 2 (crypto-tranche-a-2, 17 Oct 2026): CD-3, CD-4, CD-7, CD-8,
# CD-9's Weekly and Monthly parts, CD-10; the 17 Oct rulings 1-5 on part 1.
# ===========================================================================

# CD-3: Deribit DVOL (DS-41; D-4 ruled DVOL now, strike-level OI with EL-12 --
# not fetched here). Public, no key; www.deribit.com publishes no robots.txt.
deribit:
  base: https://www.deribit.com/api/v2
  currencies: [BTC, ETH]
  dvol_from: 2021-03-24          # the index's first print (probed 17 Oct 2026)
  window_days: 900               # one call's window; the API pages within it
# S-4 (SESSION-SET band): DVOL's full-history percentile at or below 20 is
# "compressed", at or above 80 "stressed", between "normal". A lens: no gate.
s4:
  band: {compressed: 20, stressed: 80}
  rv_days: 30
  price_keys: {BTC: yfinance.mkt_btc_usd, ETH: yfinance.mkt_eth_usd}
  pct_5y_days: 1826

# CD-4: Farside (DS-33; D-3 ruled Farside). farside.co.uk's robots.txt names only
# Twitterbot (no rule for any other agent). The order: a browser user-agent; it
# still names the project. On 17 Oct 2026 the site answered the laptop 403
# through Cloudflare to both user-agents: the writer is built, the gap is listed,
# nothing is scraped around the refusal. Values are US$ millions on the page and
# are stored in dollars.
farside:
  pages:
    btc: https://farside.co.uk/btc/
    eth: https://farside.co.uk/eth/
  all_data:                      # verify at build: linked from the recent pages
    btc: https://farside.co.uk/bitcoin-etf-flow-all-data/
    eth: https://farside.co.uk/ethereum-etf-flow-all-data/
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36 (compatible; chester-reports/1.0)"
  backfill_from: 2024-01-11      # the US spot bitcoin ETFs' first day of trading
  # THE COLUMN-CHANGE DETECTOR: the issuer columns each table must carry, exactly.
  # A table whose header set differs is refused whole (STALE, the change named).
  columns:
    btc: [IBIT, FBTC, BITB, ARKB, BTCO, EZBC, BRRR, HODL, BTCW, MSBT, GBTC, BTC]
    eth: [ETHA, FETH, ETHW, TETH, ETHV, QETH, EZET, ETHE, ETH]
# S-2 (the order): the streak is consecutive same-sign sessions; the 5-day sum's
# percentile against the full history (from Jan 2024); the flag at the 5th and
# 95th. Stored, never printed (gate status: not passed).
s2:
  window: 5
  flag_low: 5
  flag_high: 95

# CD-7: the froth gauge (DS-19, S-5; D-5 ruled build now). GeckoTerminal's API
# host forbids every agent in robots.txt (api.geckoterminal.com: "Disallow: /",
# only /docs/ allowed; read 17 Oct 2026), so its API is not read: the writer
# checks robots first and stops there. DexScreener (api.dexscreener.com, no
# robots.txt) is the order's fallback, used only when GeckoTerminal fails, its
# rows marked in the source column; it is a different sample (a search, not a
# census), so it never enters the z-score.
gt:
  base: https://api.geckoterminal.com/api/v2
  accept: "application/json;version=20230302"
  networks: [solana, base]
  per_min: 30                    # GeckoTerminal's published limit
  budget_per_min: 20             # SESSION-SET: two thirds of it
  new_pool_pages: 10             # 20 pools a page; >= 200 in 24h is censored
  trending_top: 20
  dexscreener: https://api.dexscreener.com/latest/dex/search
  fallback_source: "dexscreener:fallback"
# S-5 (the order): each measure z-scored on a 20-day window once 90 days of
# GeckoTerminal store exist. SESSION-SET flag: both measures of a network at z
# >= +2 on the same day. Stored, never printed.
s5:
  z_window: 20
  min_store_days: 90
  flag_z: 2.0

# Ruling 2 of 17 Oct: total market cap and BTC dominance from a keyless source
# within robots. CoinPaprika's /v1/global (api.coinpaprika.com, no robots.txt;
# the free plan is keyless, personal and non-commercial, attribution "Powered by
# Coinpaprika", no redistribution; API terms read 17 Oct 2026). Forward-only:
# the endpoint serves the current figure.
paprika:
  url: https://api.coinpaprika.com/v1/global
  attribution: "Powered by Coinpaprika"

# CD-9, the blocks. The Weekly's crypto flows block: at most 12 lines, a sub-
# section of Positioning & flows. The Monthly's rows: mechanics (network health)
# and the slow layers (the data layer), every row in the triple form.
blocks:
  weekly_max_lines: 12
  z_from: 2026-12-15             # ruling 5: the aggregate's z prints from mid-December
  froth_from: 2027-01-15         # S-5: 90 days of store after a first sample
  watch_triple_window_days: 1825

# ===========================================================================
# ITEM 49 (digital-49-51b, 17 Oct 2026): the treasury companies.
# ===========================================================================
# Holdings from BitcoinTreasuries.com's public-companies table (treasuries.bitbo.io,
# robots: allowed; no terms page), the top companies by BTC held. Strategy's share
# count from EDGAR with the repo's contact (CHESTER_SEC_CONTACT); MSTR's spot from
# the captured chains. www.strategy.com refuses this client (403); bitcointreasuries
# .net's terms forbid automated extraction -- neither is read.
treasury:
  holdings_url: https://treasuries.bitbo.io/
  top: 20
