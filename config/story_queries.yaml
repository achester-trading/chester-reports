# Story queries for the narrative scan. DECLARED HERE, NEVER COMPOSED AT RENDER.
#
# -----------------------------------------------------------------------------
# WHY A CONFIG FILE AND NOT AN ARGUMENT
# -----------------------------------------------------------------------------
# A query chosen to match the day is a search for confirmation. If the report
# could pick its own searches it would ask about whatever had already moved, find
# coverage of it, and present the coverage as corroboration -- which is the same
# fact twice, dressed as two.
#
# So the record of WHAT WAS SEARCHED FOR has to be older than the answer. These
# four are the ones Audit #3 section I names; adding one is an edit to this file,
# in a commit, dated, ahead of the pass that runs it.
#
# -----------------------------------------------------------------------------
# WHAT A COUNT FROM THESE MEANS, AND WHAT IT DOES NOT
# -----------------------------------------------------------------------------
# The result set is whatever a free aggregator chose to return, capped by our own
# `cap_per_day`. So "AI capex coverage rose" means "more of what this query
# returns was returned" -- a measure with a denominator nobody publishes. It is
# worth logging as attention and it is not evidence about the thing attention is
# on. `mechanism_group: narrative` in the registry is what keeps it from ever
# counting as confirmation of a price move, and nothing here is trigger_eligible.
#
# The `watch_for` field is the point of each query: what would make it matter.
# It is prose for a human reading the block, not a rule -- a rule would need a
# threshold, and none of these has an honest one yet.

# -----------------------------------------------------------------------------
# THE FETCH WAS RETIRED, THE QUERIES WERE NOT (Phase B, 4 Oct 2026)
# -----------------------------------------------------------------------------
# These were run against Google News search, which returned zero new items a day
# (relevance-ranked, so the same old items deduplicated every morning) and whose
# robots.txt disallows /rss/search for every user agent. The voices scan
# (config/voices_sources.yaml) now writes each story's `headline` rows from a
# declared list of public sources, keyed by the query names below, so the
# register's attention series keep their names and their rules. The `query` text
# and `cap_per_day` are no longer fetched; they stay as the record of what each
# series meant from 26 Sep to 3 Oct 2026.
version: story-queries-v2
updated: 2026-10-04

# Per query per day. The block prints counts and links the top few; a hundred
# stories a day about one theme is not a hundred facts, and storing them would
# make the table a news archive rather than a record of attention.
cap_per_day: 12

queries:

  ai_capex_durability:
    query: "AI capex durability hyperscaler capital expenditure"
    theme: AI capex
    watch_for: >-
      A hyperscaler GUIDING capex DOWN, or depreciation schedules lengthening. The
      thesis that matters is not whether the spend continues but whether it is
      being funded from cash flow or from debt, and a change in the funding mix is
      what shows up in coverage before it shows up in a filing.
    entities: [NVDA, MSFT, GOOGL, AMZN, META]

  fiscal_dominance:
    query: "fiscal dominance Treasury issuance term premium debt service"
    theme: Fiscal dominance
    watch_for: >-
      Auction tails, a shift in the bill-to-coupon mix, or debt-service crossing a
      politically legible threshold. This is the story that ends in the long end
      repricing, and `calc.r_minus_g` is the arithmetic underneath it.
    entities: [fred.yield_30y, fred.yield_10y, calc.r_minus_g, calc.net_liquidity]

  yen_carry:
    query: "yen carry trade unwind Bank of Japan policy rate"
    theme: Yen carry
    watch_for: >-
      BoJ policy normalisation, or USDJPY moving fast in either direction. August
      2024 is the reference: a funding-currency move that reprices every crowded
      trade at once, with equity volatility as the transmission rather than the
      cause.
    entities: [fred.usd_jpy, yfinance.mkt_vix]

  midterm_cycle:
    query: "midterm election market cycle policy uncertainty"
    theme: Midterm cycle
    watch_for: >-
      Policy proposals with a market-mechanical consequence -- tariffs, tax, the
      debt ceiling calendar. The midterm date itself is a claim, not a headline:
      see `cal.midterm_election_2026` in the claims registry.
    entities: []

# -----------------------------------------------------------------------------
# THE MECHANISM-WATCH GROUP (ST-15, signal-triage Tranche 5; st-t5-render, 18 Oct
# 2026). G-28: this loader is a plain YAML read and every existing reader takes
# `queries` only, so the second group lives here, with its own cadence and cap.
# The search engines stay retired (Phase B, above), so the group's terms are not
# sent to any search: they FILTER the items of the declared public feeds below,
# each read only where its robots.txt allows the path. A feed item matches a
# query when any of its terms appears in the item's title. Only the title, the
# link and the date are kept -- never the body -- as the voices scan does.
# -----------------------------------------------------------------------------
mechanism_watch:
  version: mechanism-watch-queries-v1
  updated: 2026-10-18
  cadence: weekly          # the Saturday run of the crypto basket's timer; no new timer
  window_days: 14          # 2.7.7: the past 14 days
  cap_per_run: 60          # items kept per run across the feeds
  max_candidates: 20       # the most the gate's one model call is handed
  # The order's 2.7.7 query set, as terms.
  queries:
    proof_of_useful_work: {terms: ["proof of useful work", "proof-of-useful-work", "PoUW"]}
    ai_compute_mainnet: {terms: ["AI compute", "AI-compute"], also: ["mainnet", "cryptocurrency", "token", "blockchain"]}
    fair_launch_gpu_l1: {terms: ["fair launch"], also: ["layer 1", "L1", "GPU", "mining"]}
    verifiable_compute: {terms: ["verifiable compute", "verifiable computation"], also: ["consensus", "blockchain"]}
    new_proof_of_work: {terms: ["new proof-of-work", "new proof of work", "proof-of-work algorithm"]}
    post_quantum_mainnet: {terms: ["post-quantum", "post quantum", "quantum-resistant"], also: ["mainnet", "blockchain", "chain"]}
  # THE FEEDS. robots read 18 Oct 2026 by the session; each URL served RSS.
  # Terms: each is the publisher's own RSS syndication; nothing beyond the title,
  # the link and the date is stored, and nothing is republished. THE CATALOGUE OF
  # TERMS (ruling 6 of 19 Oct 2026): the seven feeds stay, each one's terms are
  # re-read every quarter, and `terms_read` is the date of the last reading (the
  # 18 Oct 2026 review for all seven). The Monthly's Mechanism Watch part prints
  # one line naming any feed last read more than 92 days before its as-of.
  feeds:
    - {id: iacr_eprint, url: "https://eprint.iacr.org/rss/rss.xml", robots: "https://eprint.iacr.org/robots.txt",
       terms_read: "2026-10-18",
       robots_line: "no rule matches /rss/ (read 18 Oct 2026)"}
    - {id: arxiv_cs_cr, url: "https://rss.arxiv.org/rss/cs.CR", robots: "https://rss.arxiv.org/robots.txt",
       terms_read: "2026-10-18",
       robots_line: "no robots.txt (404: no rules; read 18 Oct 2026). export.arxiv.org's robots.txt disallows everything, so its API is not used"}
    - {id: coindesk, url: "https://www.coindesk.com/arc/outboundfeeds/rss/", robots: "https://www.coindesk.com/robots.txt",
       terms_read: "2026-10-18",
       robots_line: "no rule matches /arc/outboundfeeds/rss/ (read 18 Oct 2026)"}
    - {id: theblock, url: "https://www.theblock.co/rss.xml", robots: "https://www.theblock.co/robots.txt",
       terms_read: "2026-10-18",
       robots_line: "no rule matches /rss.xml (read 18 Oct 2026)"}
    - {id: blockworks, url: "https://blockworks.co/feed", robots: "https://blockworks.co/robots.txt",
       terms_read: "2026-10-18",
       robots_line: "Allow: / (read 18 Oct 2026)"}
    - {id: tomshardware, url: "https://www.tomshardware.com/feeds/all", robots: "https://www.tomshardware.com/robots.txt",
       terms_read: "2026-10-18",
       robots_line: "no rule matches /feeds/all (read 18 Oct 2026)"}
    - {id: hashrateindex, url: "https://hashrateindex.com/blog/rss/", robots: "https://hashrateindex.com/robots.txt",
       terms_read: "2026-10-18",
       robots_line: "no rule matches /blog/rss/ (read 18 Oct 2026)"}
  # THE POSTING (ruling 6 of 19 Oct 2026): each assessed entry is posted to the
  # narrative register as a PROPOSED story through altdata.narratives' proposal
  # path (altdata/mechanism_watch.py post_entries), for the operator's confirm or
  # reject, and is graded on outcome as Audit #3 section I grades that register.
  # Its implied outcome and horizon are its factor's template below: the entry's
  # own text is the story's direction, and these say what it claims about a
  # stored series. SESSION-SET, a rule-31 draft for the operator's accept-all.
  posting:
    factors:
      I:
        direction: >-
          read as Factor I: a new AI-compute or useful-work mechanism is drawing
          capital, and the compute complex keeps rising.
        linked_dimensions: {trend: "+"}
        linked_instruments: [NVDA]
        implied_outcome:
          claim: >-
            NVDA's close at the horizon is above its close known when the forecast
            was emitted.
          metrics: [yfinance.mkt_nvda]
          comparison: up
          quorum: 1
          horizon_days: 182
      V:
        direction: >-
          read as Factor V: a new monetary mechanism is drawing capital outside the
          dollar system, and Bitcoin keeps rising.
        linked_dimensions: {liquidity: "+"}
        linked_instruments: [BTC-USD]
        implied_outcome:
          claim: >-
            Bitcoin's close (BTC-USD) at the horizon is above its close known when
            the forecast was emitted.
          metrics: [yfinance.mkt_btc_usd]
          comparison: up
          quorum: 1
          horizon_days: 182
  # THE TWO NON-RSS LEGS (MW-5).
  legs:
    recently_added:
      source: defillama
      url: "https://api.llama.fi/protocols"
      robots_line: "api.llama.fi publishes no robots.txt (404: no rules; read 18 Oct 2026)"
      terms_line: "DefiLlama's open API, keyless, as the crypto basket already reads it (source_registry.yaml defillama)"
      # CoinGecko's recently-added list is not read: CoinGecko is retired (13 and 18 Oct 2026).
      categories: ["Chain", "Decentralized AI", "Mining Pools", "Gamified Mining"]
      window_days: 14
    hashrate_trackers:
      gap: "not read: hashrate.no's coin list is an HTML page with no feed or API, and Kryptex's listing path returned 404 (18 Oct 2026); under the standing rule of 16 Oct on sources, a listed gap. Hashrate Index's blog is read as a feed, above."
  # THE RULE PRE-FILTER (2.7.7): drop the known, the excluded classes, and anything
  # with no materiality-bar (iii) hit detectable by rule.
  prefilter:
    exclusions: ["memecoin", "meme coin", "fork of", "rebrand", "restaking", "liquid staking",
                 "yield farm", "layer 2", "rollup", "GPU marketplace", "compute marketplace"]
    override: []           # names kept despite an exclusion keyword, by hand, with the reason
    tier1_exchanges: ["Coinbase", "Binance", "Kraken", "OKX", "Bybit", "Upbit"]
    serious_outlets: ["coindesk.com", "theblock.co", "blockworks.co", "tomshardware.com",
                      "ft.com", "bloomberg.com", "wsj.com"]
    hashrate_trackers: ["hashrate.no", "kryptex.com", "hashrateindex.com"]
    mcap_min_usd: 50000000
