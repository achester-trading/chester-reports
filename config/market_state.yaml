# market_state.yaml -- the market-state object's declared rules.
#
# Audit #3 §K is the schema; this file is the RULES, and it is a config file
# rather than a table in regime.py for one reason: a threshold in code is a
# threshold that gets tuned in a commit nobody reads as a change of belief.
# regime.py reads this and carries no dimension, no metric and no threshold of
# its own.
#
# -----------------------------------------------------------------------------
# HOW A DIMENSION GETS ITS STATE -- BANDS ON ONE PRIMARY, NOT A COMPOSITE
# -----------------------------------------------------------------------------
#
# Each dimension declares an ordered list of members. The FIRST is the primary
# and it alone sets the state, through declared percentile bands. The others are
# EVIDENCE: each is scored the same way, and a member landing in the state's own
# band is `supporting`, a member landing in a different band is `contradicting`.
#
# This is deliberately NOT a 0-100 composite. daily_cascade/payload.py has said
# so since the regime block was first named: "Declared thresholds and a state
# machine, never a 0-100 composite." A composite averages disagreement away --
# it turns "credit is calm and equities are not" into a middling number, which is
# precisely the information worth keeping. Here the disagreement survives as a
# list of metric ids a reader can look up.
#
# `polarity` maps a member onto the dimension's own scale: +1 means a higher
# reading pushes toward the FIRST-listed state, -1 means it pushes away. Getting
# a polarity wrong inverts a dimension, so each one carries a `because` note.
#
# `persistence_sessions` keeps states from flapping: a raw reading that
# disagrees with the published state must hold for this many consecutive session
# computations before the published state moves. Until then the object carries
# the old state plus `pending_state` and `pending_since`, which is the honest
# rendering of "it looks like it is turning and has not turned yet".
#
# WHEN A DIMENSION STOPS HAVING A STATE, and why it is not a number of sessions.
#
# It used to be `max_staleness_sessions`, one hand-set count per dimension, and that
# is a DAILY CALENDAR applied to series that are not daily. Ten sessions is generous
# for a 10-year yield and meaningless for initial claims, which prints weekly: the
# same number either forgives a daily series that has gone quiet for two weeks or
# condemns a weekly one that is printing exactly on time. Growth, whose fastest
# member is weekly, was the dimension that made this obvious.
#
# So the rule is a MULTIPLE of each metric's OWN allowance, and the allowance comes
# from the registry: `information_half_life`, resolved through the series' cadence
# (daily 2 sessions, weekly 8, monthly 32, quarterly 95 -- see altdata/derived.py).
# A dimension goes absent when its primary member is staler than
# allowance x staleness_multiple, so every dimension is judged on its own clock and
# a weekly series is not called stale for being weekly.
#
# 3 is the multiple derived_forms() already uses to separate "stale" from "very
# stale" in its confidence table, so a dimension goes absent exactly when its
# primary's confidence would read low for staleness.
#
# -----------------------------------------------------------------------------
# V1 IS EIGHT DIMENSIONS AND THREE OF THEM ARE ABSENT TODAY
# -----------------------------------------------------------------------------
#
# The Phase 2 order chose these eight "because the store already has daily series
# for them". For five that is true. For growth, trend and breadth it is not, and
# the reason is worth stating in the file rather than discovering per-run:
#
# Phase 2b closed the price gap: yfinance_source.py now runs twice a session
# (16:10 and 06:45) with a five-year history backfilled, so `trend`, `breadth` and
# the volatility dimension's realized leg all compute from stored closes. What
# remains, and why:
#
#   BREADTH IS A SECTOR PROXY, NOT MARKET-WIDE BREADTH. It is the share of the
#   eleven SPDR sector funds above their own averages, plus RSP/SPY. The registry
#   flags the two share metrics `sample: sector_etf_proxy` and the dimension says
#   so in its note, because eleven cap-weighted funds are eleven portfolios: in a
#   market led by four megacaps XLK can sit above its average while most of its own
#   holdings sit below theirs. The proxy UNDERSTATES narrowness, which is the
#   direction that matters, so it is worth having and worth labelling.
#
#   growth still has no daily series. Its members are weekly and monthly, and its
#   primary is initial claims because that is the fastest growth signal the store
#   actually carries. Its freshness is judged against its OWN metrics' half-lives
#   rather than a daily calendar -- see piece 4.

# BUMPED WHENEVER A RULE CHANGES, and that is what makes the exact-replay check
# meaningful. A stored object records the config_version it was computed under; the
# gate replays only objects whose version matches the current file, and reports the
# rest as superseded rather than failing on them. Without the bump, editing a
# threshold and breaking the arithmetic look identical.
#
#   v1    (19 Sep 2026) eight dimensions, three dials, seven contradiction rows.
#   v1.1  (20 Sep 2026) Phase 2b: breadth and trend given real members from the
#         price feed, the volatility dimension given its realized leg, the vol
#         dial's realized/implied ratio bands, and pairs 1 and 2 pointed at the
#         series the order names (SPY, HY OAS) rather than at the dimensions.
#   v1.2  (20 Sep 2026) staleness judged as a MULTIPLE of each metric's own
#         registry allowance rather than one hand-set session count per
#         dimension, so growth's weekly primary is not called stale for
#         printing weekly.
#   v1.3  (20 Sep 2026) the volatility dimension and the vol dial read
#         yfinance.mkt_vix (same-day) as their primary, with FRED's VIXCLS kept as
#         a member because it is the revisable, official series and disagreement
#         between the two is worth seeing.
#   v1.4  (20 Sep 2026) price_vs_breadth's price leg is SPY's distance from its
#         252-session high rather than SPY's level percentile -- see the pair's own
#         note for why the level was the wrong leg.
#   v1.5  (20 Sep 2026) the vol dial's term-structure leg computes from
#         calc.vix3m_over_vix, a DECLARED PROXY for the VX futures curve, with its
#         own bands and its own persistence rule. The CFE keys stay declared as the
#         champion the proxy will be measured against.
#   v1.6  (23 Sep 2026) the vol dial's realized/implied leg actually computes --
#         its bands were declared in v1.1 and never applied -- and the
#         implied_vs_realized_vol pair's implied leg moves from fred.vix to
#         yfinance.mkt_vix so the dial and the pair read ONE implied series and
#         ONE realized series between them. A pair whose implied leg publishes the
#         next morning was comparing yesterday's implied with today's realized.
#   v1.7  (23 Sep 2026) the term-structure leg runs a DUAL: calc.vx_front_ratio
#         (VX2/VX1 from Cboe settlements) as champion beside calc.vix3m_over_vix
#         as challenger, each with its own bands, both states printed, the
#         challenger still published until 23 Dec 2026. calc.vx1_vix_basis is
#         reported on the leg because it is the one thing the proxy cannot see.
version: market-state-v1.7
schema_source: docs/chester-reports-audit-3.md §K

defaults:
  persistence_sessions: 2
  staleness_multiple: 3
  window_days: 1826            # five years, §K's percentile_5y

# ---------------------------------------------------------------------------
# THE EIGHT DIMENSIONS
# ---------------------------------------------------------------------------
dimensions:

  growth:
    horizon: 1-3m
    states: [expanding, slowing, contracting]
    bands:
      - {state: expanding,   min_percentile: 66}
      - {state: slowing,     min_percentile: 33}
      - {state: contracting, min_percentile: 0}
    members:
      - metric: fred.claims_4wk
        polarity: -1
        because: >-
          More people filing for unemployment is less growth, so a HIGH claims
          percentile pushes toward contracting, not expanding.
      - metric: fred.housing_permits
        polarity: +1
        because: Permits are forward-looking construction demand.
      - metric: fred.job_openings
        polarity: +1
        because: Vacancies are labour demand.
      - metric: fred.avg_wkly_hours
        polarity: +1
        because: >-
          Hours are cut before heads are, so they turn before payrolls do.
    note: >-
      NO DAILY SERIES. The store's growth material is weekly (claims) and
      monthly (permits, openings, hours). The dimension is real but its cadence
      is not daily, and its staleness allowance says so.

  inflation:
    horizon: 1-3m
    states: [rising, stable, falling]
    bands:
      - {state: rising, min_percentile: 66}
      - {state: stable, min_percentile: 33}
      - {state: falling, min_percentile: 0}
    members:
      - metric: fred.breakeven_10y
        polarity: +1
        because: >-
          The 10y breakeven is the market's own inflation expectation and it is
          daily, which is why it leads rather than the CPI prints.
      - metric: fred.breakeven_5y5y
        polarity: +1
        because: The forward breakeven, the anchored-expectations read.
      - metric: fred.sticky_core
        polarity: +1
        because: Sticky-price core is the slow, persistent component.
      - metric: fred.wti
        polarity: +1
        because: Crude passes into headline inflation within a quarter.

  rates:
    horizon: 1-3m
    states: [high, mid, low]
    bands:
      - {state: high, min_percentile: 66}
      - {state: mid, min_percentile: 33}
      - {state: low, min_percentile: 0}
    members:
      - metric: fred.yield_10y
        polarity: +1
        because: The 10y is the discount rate everything else is priced off.
      - metric: fred.yield_2y
        polarity: +1
        because: The 2y is the policy path.
      - metric: fred.yield_30y
        polarity: +1
        because: The 30y is the term-premium and fiscal read.
      - metric: fred.mortgage_30y
        polarity: +1
        because: Where the rate complex reaches the household.

  liquidity:
    horizon: 1-3m
    states: [ample, neutral, tight]
    bands:
      - {state: ample, min_percentile: 66}
      - {state: neutral, min_percentile: 33}
      - {state: tight, min_percentile: 0}
    members:
      - metric: fred.rrp
        polarity: -1
        because: >-
          Cash parked at the reverse repo facility is cash NOT in the system, so
          a high RRP percentile is tight liquidity. This polarity is the one
          most likely to be set backwards.
      - metric: fred.bank_reserves
        polarity: +1
        because: Reserves are the banking system's own liquidity.
      - metric: fred.fed_balance
        polarity: +1
        because: >-
          The balance sheet is the stock of central-bank money. NOTE the units
          trap CLAUDE.md names -- WALCL is in MILLIONS while RRP and TGA are in
          billions. derived_forms() never mixes two series in one number, so the
          trap cannot bite here; it bites anything that subtracts them.
      - metric: fred.nfci
        polarity: -1
        because: >-
          The Chicago Fed's index is scaled so that POSITIVE is tighter than
          average. A high percentile is tight.

  credit:
    horizon: 1-3m
    states: [easy, neutral, stressed]
    bands:
      - {state: easy, min_percentile: 66}
      - {state: neutral, min_percentile: 33}
      - {state: stressed, min_percentile: 0}
    members:
      - metric: fred.hy_oas
        polarity: -1
        because: >-
          A WIDE high-yield spread is stress, so a high spread percentile is the
          stressed end of the scale, not the easy end.
      - metric: fred.bb_oas
        polarity: -1
        because: The crossover tier, where the cycle shows first.
      - metric: fred.ccc_oas
        polarity: -1
        because: The distressed tier, the tail of the credit distribution.
      - metric: fred.ig_oas
        polarity: -1
        because: Investment grade, the broad corporate funding cost.

  trend:
    horizon: 1-3m
    states: [up, flat, down]
    bands:
      - {state: up, min_percentile: 66}
      - {state: flat, min_percentile: 33}
      - {state: down, min_percentile: 0}
    members:
      - metric: calc.trend_spy_vs_200d
        polarity: +1
        because: >-
          SPY against its own 200-day average -- the classic trend definition, and
          the primary because it is the slowest of the three and therefore the one
          a 1-3m horizon should turn on.
      - metric: calc.trend_spy_vs_50d
        polarity: +1
        because: The faster position read, which turns first at a top.
      - metric: calc.trend_spy_ma20_slope
        polarity: +1
        because: >-
          DIRECTION, not position. A market above its average and rolling over and
          one above its average and rising are the same distance from it and not
          the same trend; nothing else in this dimension can tell them apart.
    note: >-
      Computed from the stored split-adjusted closes -- the same series the pin log
      and the exposure engine speak in, which is why a contradiction row comparing
      dealer gamma to the trend is comparing one SPY and not two.

  breadth:
    horizon: 1-3m
    states: [broad, mixed, narrow]
    bands:
      - {state: broad, min_percentile: 66}
      - {state: mixed, min_percentile: 33}
      - {state: narrow, min_percentile: 0}
    members:
      - metric: calc.breadth_sector_above_50d
        polarity: +1
        because: >-
          More of the eleven sector funds above their own 50-day average is
          broader participation. A SECTOR PROXY -- see the dimension note.
      - metric: calc.breadth_sector_above_200d
        polarity: +1
        because: The same share on the slower average, so a short squeeze in a
          narrow tape does not read as participation.
      - metric: calc.breadth_rsp_over_spy
        polarity: +1
        because: >-
          Equal weight over cap weight, and the honest half of this dimension: the
          two funds hold the same universe weighted two ways, so the ratio is a
          participation measure that needs no constituent data and carries no
          proxy caveat.
    note: >-
      A SECTOR-ETF PROXY, NOT MARKET-WIDE BREADTH. The two share metrics carry
      `sample: sector_etf_proxy` in the registry, and nothing may describe this
      dimension as market-wide breadth: real breadth counts ~500 constituents,
      while eleven cap-weighted funds are eleven portfolios. The proxy moves with
      breadth and understates narrowness -- the direction that matters -- so it is
      worth having as long as it is labelled. RSP/SPY is the leg with no caveat.

  volatility:
    horizon: 1-3m
    states: [elevated, normal, subdued]
    bands:
      - {state: elevated, min_percentile: 66}
      - {state: normal, min_percentile: 33}
      - {state: subdued, min_percentile: 0}
    members:
      - metric: yfinance.mkt_vix
        polarity: +1
        because: >-
          Implied volatility of the index, SAME DAY. The primary because FRED's
          VIXCLS is published the next morning, so an object computed at 16:45 from
          FRED is stating yesterday's volatility as today's.
      - metric: fred.vix
        polarity: +1
        because: >-
          The same index from FRED, kept as a member rather than dropped: it is the
          official revisable series, and the two disagreeing is worth seeing rather
          than hiding behind whichever arrived first.
      - metric: calc.vol_spy_realized_20d
        polarity: +1
        because: >-
          Realized volatility of SPY's own 20-session returns. The leg this
          dimension was missing: implied alone has nothing to be rich or cheap
          against, and the two disagreeing IS the fourth contradiction row.
    note: >-
      Implied and realized together. The vol dial reads their RATIO separately --
      a level and a premium are different statements.

# ---------------------------------------------------------------------------
# THE THREE DIALS
# ---------------------------------------------------------------------------
dials:

  macro:
    # A DECLARED TABLE, NOT A MODEL. Phase 4 maps the eleven pillars onto the
    # dials properly; until then this is an explicit lookup over three dimension
    # states, and its crudeness is visible rather than buried in a weighting.
    from_dimensions: [growth, inflation, rates]
    rules:
      - {when: {growth: expanding, inflation: rising}, state: overheating}
      - {when: {growth: expanding, inflation: falling}, state: goldilocks}
      - {when: {growth: expanding}, state: expansion}
      - {when: {growth: contracting, inflation: rising}, state: stagflation}
      - {when: {growth: contracting, inflation: falling}, state: deflationary_bust}
      - {when: {growth: contracting}, state: contraction}
      - {when: {growth: slowing, inflation: rising}, state: late_cycle}
      - {when: {growth: slowing, inflation: falling}, state: disinflationary_slowdown}
      - {when: {}, state: mixed}          # the catch-all, and it says so
    note: >-
      `rates` is declared as an input and is NOT used by the rules yet. That is
      deliberate and visible: the table needed a third axis to be worth having,
      and inventing one now would be the composite this design refuses.

  vol:
    # VIX LEVEL BANDS -- absolute levels, not percentiles, because the whole
    # point of a vol dial is that 30 means something on its own.
    #
    # THE SAME-DAY INDEX, for the reason the dial's own absence message gave: "a vol
    # dial is a statement about today". Reading a series published tomorrow morning
    # contradicted that on every run.
    primary: yfinance.mkt_vix
    level_bands:
      - {state: crisis, min_level: 30}
      - {state: elevated, min_level: 20}
      - {state: normal, min_level: 14}
      - {state: subdued, min_level: 0}
    realized_implied:
      metric: calc.vol_spy_realized_20d
      window_sessions: 20
      # BANDS ON THE RATIO realized/implied, not on either level. Below 1 means
      # implied is rich to realized -- a risk premium being paid; above 1 means
      # implied is cheap to what the tape is actually doing, which is the
      # complacency case and the one worth a row.
      ratio_bands:
        - {state: implied_cheap, min_ratio: 1.0}
        - {state: fair, min_ratio: 0.75}
        - {state: implied_rich, min_ratio: 0.0}
      note: >-
        realized/implied as a ratio, from the stored SPY closes against VIX. The
        more informative number of the two, and the reason the volatility
        dimension carries both legs. ONE SOURCE FOR EACH LEG: the realized number
        is calc.vol_spy_realized_20d, computed once in altdata/market_features.py,
        and the implied number is this dial's own primary -- the same two keys the
        implied_vs_realized_vol contradiction row reads. Neither consumer computes
        a standard deviation of its own, because two realized numbers for one
        concept is two answers to "is implied rich" with no way to say which one a
        decision was taken under.
    term_structure:
      # ------------------------------------------------------------------------
      # THE DUAL RUN. Cboe's public per-contract settlement files turned out to be
      # reachable without a key, so the VX curve the proxy was standing in for now
      # exists in the store -- and the proxy is NOT retired on the day its champion
      # arrives. Both legs are computed and both states are printed for a quarter;
      # `published` says which one the dial's own term_structure.state reports, and
      # it stays the challenger until the champion has a quarter of live sessions
      # behind it.
      #
      # WHY NOT SWITCH AT ONCE. The challenger has been publishing a state that
      # reports and exceptions have been read against. Switching silently would
      # change what a printed word means with no way for a reader to see that the
      # meaning changed -- and the two DO disagree: VIX3M/VIX read 1.2316 on
      # 18 September while VX2/VX1 read 1.0485, because a three-month implied vol
      # against a one-month one is a steeper number than a one-month futures spread.
      # Same direction, different scale, different bands. A quarter of both printed
      # side by side is how that gets understood before it gets acted on.
      published: challenger
      # QUOTED, because an unquoted YAML date parses to a date object and the
      # object is stored as JSON -- which raised on the first backfill rather than
      # storing something wrong, but a config value whose type depends on its
      # spelling is a value to pin.
      dual_run_from: "2026-09-23"
      dual_run_until: "2026-12-23"
      champion:
        metric: calc.vx_front_ratio
        requires_store_keys: [cfe.vx1, cfe.vx2]
        # BANDS ON VX2/VX1, and they are not the challenger's bands. A one-month
        # futures spread sits nearer 1.00 than a three-month/one-month implied
        # ratio does: ordinary contango is 2-6% here against 15-25% there. Reusing
        # the challenger's 1.05 threshold would have read every ordinary curve as
        # flat.
        ratio_bands:
          - {state: contango, min_ratio: 1.02}
          - {state: flat, min_ratio: 0.99}
          - {state: backwardation, min_ratio: 0.0}
        persistence_sessions: 2
        note: >-
          VX2/VX1 from Cboe settlements -- the curve itself, not a proxy for it.
          Monthly contracts only, slots assigned by expiry order on the session.
          calc.vx1_vix_basis carries the futures-to-index dislocation beside it,
          which is the one thing the challenger structurally cannot see.
      challenger:
        metric: calc.vix3m_over_vix
        proxy_for: vx_futures_curve
        ratio_bands:
          - {state: contango, min_ratio: 1.05}
          - {state: flat, min_ratio: 0.98}
          - {state: backwardation, min_ratio: 0.0}
        persistence_sessions: 2
      # WHAT THE CHALLENGER IS, stated once here rather than twice. VIX3M/VIX is
      # three-month against one-month implied volatility OF THE INDEX. It is
      # NOT the VX futures curve -- that is a set of tradeable instruments with their own
      # roll and their own basis -- and it is labelled `proxy_for:
      # vx_futures_curve` in the registry wherever it appears. Contango is its
      # normal state, because longer-dated implied vol usually exceeds near-dated
      # as uncertainty compounds, so the informative reading is the other one:
      # backwardation means the market is paying more for protection now than for
      # protection in three months.
      #
      # THE PERSISTENCE RULE IS THE DIMENSIONS' RULE, on both legs and for the same
      # reason: either ratio crosses its own boundary intraday on a sharp day, and a
      # term-structure state that flips on one close is a state nobody can act on.
      #
      # THE QUARTER'S QUESTION IS NOT "WHICH IS MORE CORRECT". The proxy is free,
      # same-day and already running; the curve is the real instrument. What the
      # dual run answers is whether the cheap one disagrees with the real one often
      # enough to matter, and the answer is a count of disagreeing sessions rather
      # than an opinion. 30.8's VX1/VX2/VX3 state machine remains the target, and
      # the champion is now built on exactly those three series.
      basis_metric: calc.vx1_vix_basis

  gamma:
    # READ, NEVER RECOMPUTED. The exposure engine owns dealer gamma; a second
    # implementation here would be a second answer, and the Phase 2 order says
    # read it. altdata/grader.py already has the reader this uses.
    source: exposure_engine
    symbol: SPY
    states: [positive, negative, flat]
    note: >-
      The sign of dollar gamma per 1% from the session's own exposure profile.
      No threshold, no smoothing, no recomputation.

# ---------------------------------------------------------------------------
# CONTRADICTION TABLE v1 -- six computed pairs and one reserved
# ---------------------------------------------------------------------------
#
# Each pair names two legs that normally move together and measures the DIVERGENCE
# between their own-history percentiles as a z of that divergence over the same
# window. A row opens after persistence_sessions and closes the same way, so a
# single day's disagreement is not an event.
#
# `expect` says what agreement looks like: `same` means the two effective
# percentiles should be close, `opposite` means they should be far apart, and a
# row fires when the relationship inverts.
contradictions:
  persistence_sessions: 2
  exception_sessions: 5          # at or past this, the row is an exception
  window_days: 1826              # the same five years the dimensions use

  # A DIVERGENCE IS A STATEMENT ABOUT TODAY, exactly like a dial. A leg staler than
  # its own allowance x this multiple sends the row absent rather than reporting a
  # gap measured between two stale prints -- which is what the first run of this
  # table did for 77 straight sessions, reporting an unchanging z off data that had
  # stopped moving in May.
  #
  # PER LEG, ON ITS OWN CLOCK, for the same reason the dimensions are: this table
  # pairs a weekly series (claims) against a daily one (XLY/XLP), and one session
  # count for both would call the weekly leg stale for printing weekly.
  staleness_multiple: 3

  # WHEN A GAP COUNTS AS A DIVERGENCE. The magnitude is the z of TODAY'S gap
  # against that gap's own history, so 2.0 means "the two legs are further apart
  # than they have been 95% of the time" -- not "the legs are far apart", which
  # for two legs that normally sit far apart would fire every day.
  open_threshold_z: 2.0

  # The alert path the order asks for at >= exception_sessions. There is no
  # Phase 1 exceptions alert in this repo: scripts/check_heartbeat_cron.sh sends
  # the heartbeat and drift alerts through scripts/send_smtp_alert.py and nothing
  # sends an exceptions alert. So an exception is REPORT-ONLY and says so on the
  # row itself, rather than being silently dropped into a path that does not
  # exist.
  exception_alert_path: report_only
  exception_alert_note: >-
    Report-only. When an exceptions alert exists it belongs beside the drift
    branch in scripts/check_heartbeat_cron.sh, which already owns
    send_smtp_alert.py.

  pairs:
    - id: price_vs_breadth
      legs: [calc.spy_vs_252d_high, calc.breadth_sector_above_50d]
      kind: metric_pair
      polarities: [+1, +1]
      expect: same
      because: >-
        An index making new highs while participation narrows is the classic
        distribution signature. (1) in the order.
        THE PRICE LEG IS DISTANCE FROM THE ONE-YEAR HIGH, and it took two wrong
        answers to get there. First the leg was the TREND DIMENSION, whose primary
        is SPY's distance from its 200-day average -- and a market at a five-year
        high can sit an ordinary 6% above that average, which reads as middling and
        hid the row. Then it was SPY's LEVEL PERCENTILE, which is better and still
        wrong: in any uptrend the level sits near the top of its own five-year
        distribution almost every day, so the leg is nearly constant and the
        divergence barely moves with it. Distance from the running high is ~0 at a
        new high and falls away at once, which is the thing the sentence above
        actually describes.

    - id: equities_vs_credit
      legs: [yfinance.mkt_spy, fred.hy_oas]
      kind: metric_pair
      polarities: [+1, -1]
      expect: same
      because: >-
        SPY against HY OAS, which is what the order names. Credit usually leads
        equities at turns, so equities strong while credit widens is the divergence
        worth a row. The HY polarity is -1: a WIDE spread is stress, so on a
        shared risk-on scale it points the other way from a rising index.

    - id: long_bond_vs_hy
      legs: [fred.yield_30y, fred.hy_oas]
      kind: metric_pair
      polarities: [+1, -1]
      expect: same
      because: >-
        THE STANDING WATCH LINE. (3) in the order, and the one pair named as
        already being watched: a long bond selling off while high yield stays
        calm says the two markets disagree about what the term premium means.

    - id: implied_vs_realized_vol
      legs: [yfinance.mkt_vix, calc.vol_spy_realized_20d]
      kind: metric_pair
      polarities: [+1, +1]
      expect: same
      also_reads: probability_ledger.tail_weight
      because: >-
        (4). Implied rich to realized is a risk premium; implied cheap to
        realized is complacency. The probability ledger's tail weight is read
        where one is live, and the ledger is empty today, so that leg reports
        absent rather than assuming. THE IMPLIED LEG IS THE INDEX FEED, not FRED's
        VIXCLS, for the reason v1.3 gave the dial: VIXCLS publishes the next
        morning, so a pair reading it was comparing yesterday's implied with
        today's realized and calling the mismatch a divergence. Both legs are now
        same-day and daily, so they align exactly rather than by forward fill --
        and the dial's ratio and this row read the same two series.

    - id: growth_vs_cyclicals
      legs: [growth, calc.cyclical_over_defensive]
      kind: mixed_pair
      polarities: [+1, +1]
      expect: same
      because: >-
        (5). The growth dimension against what the equity market is paying for
        growth -- consumer discretionary over staples. Needs sector prices.

    - id: gamma_vs_trend
      legs: [dial.gamma, trend]
      kind: dial_pair
      expect: same
      because: >-
        (6). Negative dealer gamma with an uptrend is a market where the flow
        amplifies moves against the prevailing direction.

    - id: prediction_markets_vs_assets
      legs: [pm.implied, trend]
      kind: reserved
      requires: part_27_v1
      because: >-
        THE RESERVED SEVENTH ROW. Prints absent until Part 27 v1 exists -- the
        audit admits prediction markets in 6d, after Phase 3. Reserved here so
        the table's shape is fixed now and the row cannot be forgotten.
