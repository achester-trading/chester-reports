# The narrative register's declared stories. (6c-2; Audit #3 §I and §F item 11;
# Daily Cascade v2 Part 0.4)
#
# -----------------------------------------------------------------------------
# WHAT A NARRATIVE IS HERE, AND WHAT IT IS NOT
# -----------------------------------------------------------------------------
# A story the market is trading, held as a DATED ENTITY with a state, a direction,
# the evidence for and against it (as event ids from the events table), the
# market-state dimensions it should move, and an IMPLIED OUTCOME -- a claim about a
# stored series at a horizon, which is what makes the story gradeable through the
# probability ledger. It is not a signal: every narrative sits in the `narrative`
# mechanism group, nothing here is trigger_eligible, and a story can never count as
# confirmation of the price move it is about.
#
# THE STATE MOVES ON DECLARED RULES, NEVER ON THE MODEL'S READING. The model may
# PROPOSE a new story from the events (status: proposed) and it writes the 07:00
# paragraph; it never moves a state. Transitions are computed from attention,
# agreement with the linked dimensions and persistence (`rules`, below), so they
# replay exactly from stored events and stored objects.
#
# ONE HUMAN GATE. A proposal stays `proposed` until the operator confirms it with
#     python -m altdata.narratives confirm <id>
# which the Weekly prints beside each pending proposal. Nothing else here needs a
# human, and nothing else can promote a proposal: a proposed story is never
# evaluated, so it cannot reach consensus without that line being run.
#
# THE FOUR SEEDS are the stories Audit #3 §I names, opened 26 September 2026 as
# `emerging` with no evidence. Their definitions live HERE and are synced into the
# register on every seed; their STATE and EVIDENCE live in the register and are
# never overwritten by a seed.

version: narratives-v2
updated: 2026-09-27

vocabularies:
  states: [emerging, consensus, contested, fading]
  statuses: [active, proposed, rejected]
  # A linked dimension's expected direction, in the object's own convention:
  # `+` is the dimension's primary rising on its declared polarity (growth `+` is
  # claims FALLING; credit `+` is spreads TIGHTENING; volatility `+` is VIX rising).
  directions: ["+", "-"]
  # How an implied outcome resolves. Every one compares a stored series at the
  # horizon with the same series as known at emission -- the only comparison the
  # store can answer without a judgement.
  comparisons:
    up: the value at the horizon is above the value known at emission
    down: the value at the horizon is below the value known at emission
    magnitude_up: >-
      the absolute value at the horizon is above the absolute value known at
      emission -- for a series published with a sign convention (capex is
      reported negative, as an outflow)
    magnitude_down: the absolute value at the horizon is below the one at emission

# -----------------------------------------------------------------------------
# PROBABILITY -- WHAT A STATE CLAIMS, DECLARED BEFORE ANY OUTCOME
# -----------------------------------------------------------------------------
# The register grades its OWN STATE MACHINE: a story the rules call consensus is
# claiming its implied outcome is likely, and a fading one that it is not. So each
# state carries the probability it asserts, declared here ahead of every outcome,
# and a forecast enters the ledger when a story ENTERS a state that carries one.
#
# EMERGING AND CONTESTED CARRY NONE, deliberately. Both mean "the system has not
# taken a view", and recording that as 50% would score exactly 0.25 whatever
# happened -- a row that says nothing and drags the narratives' running Brier toward
# the coin, which would hide whether the states that DO claim something are
# calibrated. A mapping that proves miscalibrated is corrected by editing these
# numbers in a dated commit, never by revising a recorded forecast.
probability_by_state:
  consensus: 0.70
  fading: 0.30

# -----------------------------------------------------------------------------
# THE TRANSITION RULES -- declared, deterministic, replayable from stored events
# -----------------------------------------------------------------------------
# Three inputs and nothing else, evaluated once per session by the close pass after
# the object is stored (altdata.narratives evaluate):
#
#   ATTENTION    headlines returned for the story's DECLARED query
#                (config/story_queries.yaml), counted over the last `short` and
#                `long` sessions, with the change (Δ) and the change in the
#                change (Δ²) of each window against the window before it. A count
#                of coverage, not a reading of it: the aggregator's result set has
#                no published denominator, so attention can MOVE a state only
#                alongside the other two inputs, never alone.
#   AGREEMENT    the share of the story's linked dimensions whose `direction` in the
#                latest market-state object matches the direction the story
#                declares. A dimension that is absent or flat (direction 0) is not
#                counted either way; with none counted, agreement is undefined and
#                every rule that needs it fails.
#   EVIDENCE     event ids, classified by DECLARED rules per story (`evidence`,
#                below) -- a release whose naive surprise has the declared sign, a
#                linked name's earnings surprise -- inside `evidence_window_days`.
#                Never the model's reading of a headline: headlines are attention.
#
# PERSISTENCE is the contradiction table's rule, for the same reason: a condition
# must hold `persistence_sessions` consecutive evaluations before the state moves,
# because a single session's coverage spike is noise and a register that moved on
# it would cry wolf until nobody read it.
#
# A PROPOSED story is never evaluated. A story with no evidence FOR can never be
# consensus: the rule requires `min_evidence_for`, so the count is a gate, not a
# weight.
rules:
  attention_sessions: {short: 5, long: 20}
  evidence_window_days: 60
  persistence_sessions: 3
  consensus:          # emerging or contested -> consensus
    min_attention_long: 20
    min_agreement: 0.66
    min_evidence_for: 1
    evidence_for_must_exceed_against: true
  contested:          # emerging or consensus -> contested
    min_attention_long: 20
    # EITHER the data disagrees with the story, OR the evidence does.
    max_agreement: 0.34
    min_evidence_against: 1
  fading:             # consensus or contested -> fading
    # The short window's run-rate below this fraction of the long window's, and
    # still falling: attention decaying, not merely quiet for a day.
    max_short_to_long_rate: 0.5
    require_short_delta_negative: true
  revive:             # fading -> emerging
    min_short_to_long_rate: 1.0
    min_attention_long: 20

# How a transition reaches an alert. There is no exceptions alert path in this
# repo (config/market_state.yaml says the same of the contradiction table), so a
# transition is REPORT-ONLY and says so on its record.
transition_alert_path: report_only

narratives:

  ai_capex_durability:
    name: AI capex durability
    direction: >-
      The hyperscalers' AI capital spending keeps rising, and the market funds it.
    story_query: ai_capex_durability
    linked_dimensions: {trend: "+", credit: "+"}
    linked_instruments: [NVDA, MSFT, GOOGL, AMZN, META]
    prediction_market_contracts: []
    evidence:
      # An earnings beat by a linked name counts FOR (the spend is being funded
      # from results), a miss AGAINST. EPS is not capex -- this is the nearest
      # stored, dated, per-name fact, and it is named as such.
      earnings: {symbols: [NVDA, MSFT, GOOGL, AMZN, META], sign: "+"}
    implied_outcome:
      claim: >-
        At least three of AMZN, GOOGL, MSFT and META report larger quarterly
        capital expenditure in their next filed quarter than in the last quarter
        known when the forecast was emitted.
      metrics: [yfinance.fund_amzn_capex, yfinance.fund_googl_capex,
                yfinance.fund_msft_capex, yfinance.fund_meta_capex]
      comparison: magnitude_up
      quorum: 3
      horizon_days: 120

  fiscal_dominance:
    name: Fiscal dominance
    direction: >-
      Deficits and Treasury supply, not the Fed, are setting the long end: the
      term premium rises.
    story_query: fiscal_dominance
    linked_dimensions: {rates: "+", inflation: "+"}
    linked_instruments: [fred.yield_30y, fred.yield_10y, acm.term_premium_10y]
    prediction_market_contracts: []
    evidence:
      # Inflation surprising UP is the mechanism the story runs through (a long
      # end that must price more inflation risk); surprising down cuts against it.
      release_surprises: {fred.cpi: "+", fred.core_cpi: "+", fred.core_pce: "+"}
    implied_outcome:
      claim: >-
        The ACM 10-year term premium is higher at the horizon than it was when
        the forecast was emitted.
      metrics: [acm.term_premium_10y]
      comparison: up
      quorum: 1
      horizon_days: 90

  yen_carry:
    name: The yen carry
    direction: >-
      Yen-funded carry is being unwound: the yen strengthens and cross-asset
      volatility rises with it.
    story_query: yen_carry
    # RATES AND VOLATILITY until 6f adds funding stress, which is the dimension
    # this story is really about. Rates `-`: an unwind is a flight to quality and
    # a narrowing rate differential, so US yields FALL with it (August 2024).
    # Volatility `+`: equity volatility is the transmission. Credit was linked in
    # 6c-2 and is dropped -- spreads widen late in an unwind, if at all, and a
    # link that lags the story argues against it on every early session.
    linked_dimensions: {rates: "-", volatility: "+"}
    linked_instruments: [fred.usd_jpy, mof.jgb_10y, yfinance.mkt_vix]
    prediction_market_contracts: []
    evidence:
      # THE PRICES THE STORY IS ABOUT, by the same move percentile the close
      # report prints (altdata.derived.delta_percentile): the latest `horizon`-
      # observation change against five years of such changes. At or beyond
      # `percentile` in the story's direction counts FOR, at or beyond it the
      # other way AGAINST; a move whose last print is more than
      # `max_age_sessions` sessions before the cutoff is unscored as stale.
      series_moves:
        fred.usd_jpy: {sign: "-", horizon: 5, percentile: 10, max_age_sessions: 3}
        mof.jgb_10y: {sign: "+", horizon: 5, percentile: 10, max_age_sessions: 3}
      # BoJ AND MoF HEADLINES FROM THE STORY'S OWN QUERY, signed by declared
      # title patterns and nothing else -- no model reads them. A title must name
      # the institution (`require`); then a FOR pattern (tightening, intervention,
      # the yen gaining) or an AGAINST pattern (the yen weakening, a hold) signs
      # it. Both or neither: unscored, and recorded as such. Crude on purpose: it
      # replays exactly, and a headline the patterns miss is visibly unscored.
      headlines:
        require: '(?i)\b(boj|bank of japan|ministry of finance|mof|finance ministry)\b'
        for:
          - '(?i)\b(tighten\w*|rate hikes?|hikes? rates|raises? rates|intervene\w*|intervention|unwind\w*|exodus)\b'
          - '(?i)\byen\b.{0,30}\b(gains?|surge\w*|recover\w*|rall\w*|strengthen\w*|jumps?)\b'
        against:
          - '(?i)\byen\b.{0,30}\b(weaken\w*|slump\w*|slides?|slid|falls?|fell|drops?|tumbles?)\b'
          - '(?i)\b(holds? rates|keeps? rates|stands? pat|pauses?|dovish)\b'
        # Checked by tools/validate_narratives.py: each must score as labelled.
        examples:
          for: "Carry Trade Exodus Fuels Yen Gain Ahead of BOJ Rate Decision - Bloomberg.com"
          against: "Yen slides as Bank of Japan holds rates steady"
          unscored: "What Is the Yen Carry Trade? How Rate Hikes Affect Global Markets - Markets.com"
    implied_outcome:
      claim: >-
        USD/JPY (yen per dollar, FRED DEXJPUS) is lower at the horizon than when
        the forecast was emitted -- the yen stronger.
      metrics: [fred.usd_jpy]
      comparison: down
      quorum: 1
      horizon_days: 60

  midterm_cycle:
    name: The midterm cycle
    direction: >-
      The midterm-year pattern: policy uncertainty weighs into the 3 November
      election (cal.midterm_election_2026) and equities rally after it.
    story_query: midterm_cycle
    linked_dimensions: {trend: "+"}
    linked_instruments: [yfinance.mkt_gspc]
    prediction_market_contracts: []
    evidence:
      # ITS HEADLINE QUERY, SIGNED BY THE CALENDAR. The story makes opposite
      # claims either side of election day -- weakness into it, strength after --
      # so one title means different things by date. The phase is read from the
      # claim's scheduled event in the events table (cal.midterm_election_2026,
      # ingested from config/claims.yaml) as knowable at the cutoff; a headline
      # on election day itself counts as `after`.
      headlines:
        calendar_claim: cal.midterm_election_2026
        before:
          for:
            - '(?i)\b(uncertaint\w*|jitters?|sell-?off|slump\w*|slides?|tumbles?|volatil\w*|gridlock|shutdown)\b'
          against:
            - '(?i)\b(rall\w*|record highs?|surge\w*|soar\w*)\b'
        after:
          for:
            - '(?i)\b(rall\w*|record highs?|surge\w*|soar\w*|relief|gains?)\b'
          against:
            - '(?i)\b(sell-?off|slump\w*|tumbles?|plunge\w*|slides?)\b'
        examples:
          before_for: "Midterm uncertainty weighs on stocks as election nears"
          after_for: "Stocks rally as midterm results ease policy fears"
          unscored: "What the midterm election means for your portfolio"
    # THE IMPLIED OUTCOME IS THE BASE RATES CONDITIONAL, EX ANTE. Not "from the
    # midterm-year low": the low is known only on 31 December and any series
    # rises from its own minimum (tools/base_rates.py, table 7). Election day to
    # election day, both dates declared now, both closes read at resolution.
    implied_outcome:
      claim: >-
        The S&P 500 (yfinance.mkt_gspc) closes on 3 November 2027 above its close
        on 3 November 2026, midterm election day (cal.midterm_election_2026).
      metrics: [yfinance.mkt_gspc]
      comparison: up
      quorum: 1
      baseline_date: "2026-11-03"
      horizon_date: "2027-11-03"
    # DATED HYPOTHESES: entered in the probability ledger ONCE, before their
    # window opens, with the base rate as prior -- independent of the story's
    # state, which emits its own forecast only if it reaches consensus, against
    # the same outcome, so the ledger scores the register against the base rate.
    #
    # THE PRIOR IS SHRUNK TOWARD THE UNCONDITIONAL RATE of the same window:
    # (hits + k * p0) / (n + k). The question a prior answers is how much of the
    # midterm effect is real and how much is drift plus a small n, so the target
    # is the market's own unconditional rate, not the 0.5 a uniform prior would
    # pull toward. The ledger row carries the rule, k, the raw rate with its n,
    # the unconditional rate with its n, and the binomial p of the midterm count
    # under the unconditional rate -- the evidence the effect is real, printed
    # beside its size rather than replacing it. No ledger row may carry 0 or 1.
    hypotheses:
      primary:
        claim: >-
          The S&P 500 (yfinance.mkt_gspc) closes on 3 November 2027 above its
          close on 3 November 2026, midterm election day.
        metric: yfinance.mkt_gspc
        comparison: up
        baseline_date: "2026-11-03"
        horizon_date: "2027-11-03"
        prior:
          table: baserate.midterm_from_election
          conditional: primary
          unconditional: primary_unconditional.all_years
          rule: shrink_to_unconditional
          k: 10
        statement_cited: Base Rates, Chapter 3.1 (the presidential cycle)
        claims_cited: [cal.midterm_election_2026]
      secondary:
        claim: >-
          The S&P 500 (yfinance.mkt_gspc) closes on 31 March 2027 above its close
          on 1 October 2026 -- the cycle's historically strongest stretch.
        metric: yfinance.mkt_gspc
        comparison: up
        baseline_date: "2026-10-01"
        horizon_date: "2027-03-31"
        prior:
          table: baserate.midterm_from_election
          conditional: secondary
          unconditional: secondary_unconditional.all_years
          rule: shrink_to_unconditional
          k: 10
        statement_cited: Base Rates, Chapter 3.1 (the presidential cycle)
        claims_cited: [cal.midterm_election_2026]

# -----------------------------------------------------------------------------
# DISAGREEMENTS (rule 31; the GTM change order of 3 Oct 2026)
# -----------------------------------------------------------------------------
# A disagreement is logged against a base rate's APPLICABILITY, never as a
# signal. Each is drafted under rule 31 and carries the operator's ruling when it
# has one (`status: accepted`). No code reads this block, and an accepted entry
# reaches the narrative register only by the operator's own confirm.
disagreements:
  gtm8_sentiment_trough_at_high:
    status: accepted
    drafted: "2026-10-17"
    accepted: "2026-10-17"   # accepted as drafted (the rulings of 17 Oct 2026)
    base_rate: baserate.sentiment_turning_points
    source: "J.P. Morgan Guide to the Markets 4Q 2026, scan section 4 (GTM-8)"
    statement: >-
      Michigan sentiment at 48.1 (Sep 2026) with the S&P 500 at an all-time high
      has no precedent in the base rate's sample: every sampled trough coincided
      with a price low; this one is at a high. Logged against the base rate's
      applicability, not as a signal.

# COMMITTED PROPOSALS -- PENDING THE OPERATOR'S CONFIRM
# Ruling (c) of 16 Oct 2026: "Judgment drafts (narrative lines, appendix notes,
# rule-table edits) are committed by the session as drafted and listed for Ari's
# accept-all; the register's confirm step stays his." So these enter the register
# at the next seed as `proposed` (origin config_proposal), emerging, never
# evaluated, and the Weekly prints each beside its confirm and reject commands,
# exactly as a model proposal waits. Nothing here can promote itself: until
#     python -m altdata.narratives confirm <id>
# is run, a story below makes no forecast and changes no state. No story_query:
# a confirmed story earns attention only once a query is declared in
# config/story_queries.yaml and the voices scan writes its rows, so each starts
# with its evidence rule alone (a series move, which the store already answers).
proposals:

  bond_bull_end_active_era:
    name: End of the bond bull, the active era
    direction: >-
      The 40-year bond bull compressed dispersion and rewarded passive investing;
      its end returns the edge to stock-picking, so single-name dispersion rises.
    proposed_by: >-
      session B, as drafted from the Batch 5 change order item 18 (9 Oct 2026;
      source arvy / Thierry, Macro Cycles, a product pitch; intensity low, one
      source), committed 16 Oct 2026 under ruling (c)
    linked_dimensions: {rates: "+", volatility: "+"}
    linked_instruments: [cboe.dspx, cboe.cor3m]
    prediction_market_contracts: []
    evidence:
      # The measure is the dispersion panel (Mechanics): DSPX's five-session
      # change at or beyond its 10th percentile upward counts FOR.
      series_moves:
        cboe.dspx: {sign: "+", horizon: 5, percentile: 10, max_age_sessions: 3}
    implied_outcome:
      claim: >-
        The Cboe S&P 500 Dispersion Index (DSPX) is higher at the horizon than
        when the forecast was emitted.
      metrics: [cboe.dspx]
      comparison: up
      quorum: 1
      horizon_days: 180

  treasury_asian_hours_selling:
    name: Treasury selling in Asian hours
    direction: >-
      The long end sells off in Asian and European hours and recovers in US hours
      (framed by its sources as manipulation or Asian selling against US buying):
      foreign-hours selling pushes long yields up.
    proposed_by: >-
      session B, as drafted from the Batch 5 change order item 27 (Monchau, Syz,
      credible, relaying Bull Theory, an aggregator; two sessions, the 30-year
      near 5.65%; intensity low), committed 16 Oct 2026 under ruling (c).
      "Manipulation" is the narrative's word, never the report's
    linked_dimensions: {rates: "+"}
    linked_instruments: [yfinance.mkt_tlt, fred.yield_30y]
    prediction_market_contracts: []
    evidence:
      # The measure is TLT's overnight leg against its session leg (Positioning
      # & flows); the store answers TLT's close move, so a five-session fall at
      # or beyond its 10th percentile counts FOR.
      series_moves:
        yfinance.mkt_tlt: {sign: "-", horizon: 5, percentile: 10, max_age_sessions: 3}
    implied_outcome:
      claim: >-
        The 30-year Treasury yield (FRED DGS30) is higher at the horizon than when
        the forecast was emitted.
      metrics: [fred.yield_30y]
      comparison: up
      quorum: 1
      horizon_days: 60

  capital_competition:
    name: Capital competition sets the long end
    direction: >-
      Private demand for capital, not fiscal supply, is repricing the long end:
      the expected short-rate path and r* rise, and the term premium carries less
      than half of the move. The other side of "what's driving 5.3%" -- fiscal
      dominance, already a seeded story, is the first.
    proposed_by: >-
      session B, as drafted from the Batch 5 change order item 26 (Boivin,
      BlackRock Investment Institute; Rai) as the disagreement pair "what's driving
      5.3%" against fiscal_dominance (Kovač, TAAI; Hartnett, BofA); adjudicator the
      fiscal-bark flag on the 10-year attribution, monthly. Committed 16 Oct 2026
      under ruling (c)
    linked_dimensions: {rates: "+", growth: "+"}
    linked_instruments: [acm.risk_neutral_yield_10y, acm.term_premium_10y]
    prediction_market_contracts: []
    evidence:
      series_moves:
        acm.risk_neutral_yield_10y: {sign: "+", horizon: 5, percentile: 10, max_age_sessions: 3}
    implied_outcome:
      claim: >-
        ACM's 10-year expected short-rate path (the risk-neutral yield) is higher
        at the horizon than when the forecast was emitted.
      metrics: [acm.risk_neutral_yield_10y]
      comparison: up
      quorum: 1
      horizon_days: 90

  # SIGNAL-TRIAGE BATCH 12, ITEM 60.6 (a53, 20 Oct 2026): the narrative pair, seeded
  # PROPOSED through this path for the operator's confirm or reject. The realised
  # forecast-error series would adjudicate between them once it exists (F3: a listed
  # gap today), so each starts with its evidence rule alone, on QQQ.
  ai_excess_orderly_flush:
    name: AI excess flushed in an orderly way
    direction: >-
      The AI-capex cycle's excess is being worked off in an orderly way:
      hyperscaler multiples compress from their 2025 peaks while earnings carry
      the index, and companies guide to a return on capex.
    proposed_by: >-
      session A, as drafted from the Batch 12 change order item 60 (a commentator's
      post, already in the voices register; the bull reading of an
      estimates-overshoot chart), committed 20 Oct 2026
    linked_dimensions: {trend: "+"}
    linked_instruments: [yfinance.mkt_qqq]
    prediction_market_contracts: []
    evidence:
      series_moves:
        yfinance.mkt_qqq: {sign: "+", horizon: 5, percentile: 10, max_age_sessions: 3}
    implied_outcome:
      claim: >-
        QQQ is higher at the horizon than when the forecast was emitted.
      metrics: [yfinance.mkt_qqq]
      comparison: up
      quorum: 1
      horizon_days: 180

  estimates_overshoot_reckoning:
    name: Estimates overshoot into a reckoning
    direction: >-
      Forward earnings estimates have overshot what will be earned, as they did
      into 2001, 2008 and 2020; the realised forecast error turns negative and the
      market reprices toward actual earnings.
    proposed_by: >-
      session A, as drafted from the Batch 12 change order item 60 (the bear reading
      of the same estimates-overshoot chart), committed 20 Oct 2026
    linked_dimensions: {trend: "-"}
    linked_instruments: [yfinance.mkt_qqq]
    prediction_market_contracts: []
    evidence:
      series_moves:
        yfinance.mkt_qqq: {sign: "-", horizon: 5, percentile: 10, max_age_sessions: 3}
    implied_outcome:
      claim: >-
        QQQ is lower at the horizon than when the forecast was emitted.
      metrics: [yfinance.mkt_qqq]
      comparison: down
      quorum: 1
      horizon_days: 180

  gse_mbs_purchase_floor:
    name: Mortgage-bond purchases as a floor under house prices
    direction: >-
      Purchases of mortgage bonds through Fannie Mae and Freddie Mac, instructed
      to force mortgage rates lower, keep a housing market at record real prices
      from correcting: the mortgage rate and its spread over the 10-year fall,
      and the house-price-decline watch is held off by policy.
    proposed_by: >-
      session A, as drafted from the Batch 14 change order item 69 (filed as 69;
      written as 62). Tag, as F6 rules it: verified (announcement of 8 Jan
      2026); the post's source is a promoter (an X account, Batch 14's
      promoter tag). Primary check: no FHFA news release or statement on the
      purchases was found for Dec 2025 to Feb 2026; the date and terms rest on
      the announcement as reported that day and the FHFA director's confirmation
      that Fannie Mae and Freddie Mac would make the purchases. The size and pace
      actually bought would be the GSE retained-portfolio line, which is a
      listed gap. Committed 21 Oct 2026 as PROPOSED; confirming or rejecting is
      the operator's
    linked_dimensions: {rates: "-"}
    linked_instruments: [fred.mortgage_30y, fred.yield_10y]
    prediction_market_contracts: []
    evidence:
      # The measure is the housing block's mortgage spread over the 10-year
      # (Batch 14 item 69); the store answers PMMS itself, weekly, so a fall over
      # the next four releases at or beyond its 10th percentile counts FOR.
      series_moves:
        fred.mortgage_30y: {sign: "-", horizon: 4, percentile: 10, max_age_sessions: 10}
    implied_outcome:
      claim: >-
        Freddie Mac's 30-year PMMS rate (FRED MORTGAGE30US) is lower at the
        horizon than when the forecast was emitted.
      metrics: [fred.mortgage_30y]
      comparison: down
      quorum: 1
      horizon_days: 90

  # SIGNAL-TRIAGE BATCH 14, ITEM 67 (written as 60; F3, b55, 23 Oct 2026): the bull
  # narrative the order rules into the register, seeded PROPOSED with its caveat.
  # PEG and LTEG are listed gaps, so the story's own measure cannot print; it
  # starts with its evidence rule on the S&P 500 alone. The adjudicator the order
  # names, item 60's realised forecast error turning negative, is a listed gap too
  # (no keyless forward-EPS source with vintages), so the outcome the store can
  # answer is the index's level two quarters on.
  market_cheap_on_peg:
    name: The market is cheap on PEG
    direction: >-
      The S&P 500 is cheap because its PEG (forward P/E over five-year consensus
      long-term earnings growth) is at a record low, so the index rises as
      earnings growth is delivered. Caveat, carried with the story: the PEG is
      low because its denominator is an inflated long-term growth estimate, not
      because the price is low; long-term growth estimates overshoot at peaks
      (docs/base-rate-notes/lteg-overshoot-2026-10.md), so a record-low PEG is a
      measure of estimate optimism before it is a measure of value.
    proposed_by: >-
      session B, as drafted from the Batch 14 change order item 67 (written as
      60; a chart-house post, tagged as the order tags it: credible voice;
      chart-house source). PEG and LTEG are listed gaps under F3 and print
      nowhere. Committed 23 Oct 2026 as PROPOSED; confirming or rejecting is the
      operator's
    linked_dimensions: {trend: "+"}
    linked_instruments: [yfinance.mkt_gspc]
    prediction_market_contracts: []
    evidence:
      # A five-session rise in the S&P 500 at or beyond its 10th percentile counts
      # FOR; the store answers the index's close.
      series_moves:
        yfinance.mkt_gspc: {sign: "+", horizon: 5, percentile: 10, max_age_sessions: 3}
    implied_outcome:
      claim: >-
        The S&P 500 (^GSPC) is higher at the horizon, two quarters on, than when
        the forecast was emitted.
      metrics: [yfinance.mkt_gspc]
      comparison: up
      quorum: 1
      horizon_days: 182
