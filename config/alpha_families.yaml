# THE ALPHA LAB'S FAMILY REGISTRY (Batch 19 item 99, accepted 27 Oct 2026; B98).
#
# Every hypothesis carries a family_ref keyed to a section of Kakushadze and
# Serur, "151 Trading Strategies" (Palgrave Macmillan, 2018; SSRN 3247865, free),
# or to one of the two house entries below. The family budget and the
# deflated-Sharpe and RAS variant counts key on it (docs/alpha-lab-rules.md
# section 15).
#
# THE SOURCE, AS READ (31 Oct 2026):
# - SSRN's page https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3247865
#   answered HTTP 403 to the fetch. The English PDF could not be read from it.
# - The section numbers and titles below are read from the authors' own full
#   Spanish edition, arXiv:1912.04492 (https://arxiv.org/abs/1912.04492; "151
#   Estrategias de Trading", 2019, "Translation from the English language
#   edition"). Its contents list numbers the same chapters and sections.
# - `title` is the section's title put into English. `title_es` is the Spanish
#   edition's title as extracted (the dash the extraction dropped restored as "–",
#   and "fi" in "filtro"). Re-read the titles against the English PDF when
#   SSRN serves it.
#
# WHICH SECTIONS. One entry per section the lab could use with what it stores:
# equities, ETFs, fixed income, indexes, volatility, FX, commodities, futures,
# inflation, weather, crypto and global macro. Left out: chapter 2's option
# structures (an options idea takes the house entry "KS options"), structured
# assets, convertibles, tax arbitrage, distressed assets, real estate, cash and
# infrastructure, none of which the store holds. Sections titled "Generalidades"
# (overviews) are not strategies and are left out too.
#
# A FAMILY_REF is the entry's `ref`, exactly: "KS §<section> <short name>", or a
# house entry's name.

version: 1
read_on: "2026-10-31"
source:
  citation: >-
    Kakushadze, Z. and Serur, J. A. (2018). 151 Trading Strategies. Palgrave
    Macmillan (Springer Nature), Cham. ISBN 978-3-030-02791-9. SSRN 3247865.
  ssrn: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3247865"
  contents_read_from: "https://arxiv.org/abs/1912.04492 (the authors' Spanish edition)"

families:
  # --- 3. Stocks ------------------------------------------------------------
  - {ref: "KS §3.1 price momentum", section: "3.1", title: "Price-momentum", title_es: "Precio-momentum",
     house_description: "Rank names by trailing return, skipping the last month; long the winners, short the losers.",
     asset_classes: [equities, etfs]}
  - {ref: "KS §3.2 earnings momentum", section: "3.2", title: "Earnings-momentum", title_es: "Ganancias-momentum",
     house_description: "Trade the drift after an earnings surprise against consensus (post-announcement drift).",
     asset_classes: [equities]}
  - {ref: "KS §3.3 value", section: "3.3", title: "Value", title_es: "Valor (Value)",
     house_description: "Long cheap, short dear on a valuation ratio.", asset_classes: [equities]}
  - {ref: "KS §3.4 low-volatility anomaly", section: "3.4", title: "Low-volatility anomaly", title_es: "Anomalía de baja volatilidad",
     house_description: "Low-volatility names earn more per unit of risk than high-volatility names.", asset_classes: [equities]}
  - {ref: "KS §3.5 implied volatility", section: "3.5", title: "Implied volatility", title_es: "Volatilidad implícita",
     house_description: "Stock selection on changes in the name's own options' implied volatility.", asset_classes: [equities, options]}
  - {ref: "KS §3.6 multifactor portfolio", section: "3.6", title: "Multifactor portfolio", title_es: "Portafolio multifactor",
     house_description: "Several factor ranks combined into one portfolio.", asset_classes: [equities]}
  - {ref: "KS §3.7 residual momentum", section: "3.7", title: "Residual momentum", title_es: "Momentum residual",
     house_description: "Momentum in returns after the factor exposures are removed.", asset_classes: [equities]}
  - {ref: "KS §3.8 pairs trading", section: "3.8", title: "Pairs trading", title_es: "Trading de pares",
     house_description: "Two related names; trade the spread back to its mean.", asset_classes: [equities, etfs]}
  - {ref: "KS §3.9 mean-reversion", section: "3.9", title: "Mean-reversion (single and multiple clusters)", title_es: "Reversión a la media – grupo único",
     house_description: "Cross-sectional reversal: names demeaned within their group fade back.", asset_classes: [equities, etfs]}
  - {ref: "KS §3.10 weighted-regression mean-reversion", section: "3.10", title: "Mean-reversion: weighted regression", title_es: "Reversión a la media – regresión ponderada",
     house_description: "Reversal on residuals from a weighted factor regression.", asset_classes: [equities]}
  - {ref: "KS §3.11 moving average", section: "3.11", title: "Single moving average", title_es: "Media móvil",
     house_description: "Long above a moving average, out or short below it.", asset_classes: [equities, etfs, futures]}
  - {ref: "KS §3.12 two moving averages", section: "3.12", title: "Two moving averages", title_es: "Dos medias móviles",
     house_description: "A fast and a slow average; trade the cross.", asset_classes: [equities, etfs, futures]}
  - {ref: "KS §3.13 three moving averages", section: "3.13", title: "Three moving averages", title_es: "Tres medias móviles",
     house_description: "Three averages; trade only when all three agree.", asset_classes: [equities, etfs, futures]}
  - {ref: "KS §3.14 support and resistance", section: "3.14", title: "Support and resistance", title_es: "Soporte y resistencia",
     house_description: "Levels from prior highs, lows and pivots; trade the hold or the break.", asset_classes: [equities, etfs, futures]}
  - {ref: "KS §3.15 channel", section: "3.15", title: "Channel", title_es: "Canal",
     house_description: "Trade a price range's edges (breakout or fade).", asset_classes: [equities, etfs, futures]}
  - {ref: "KS §3.16 event-driven M&A", section: "3.16", title: "Event-driven: M&A", title_es: "Eventos – Fusiones y Adquisiciones",
     house_description: "Merger arbitrage on announced deals.", asset_classes: [equities]}
  - {ref: "KS §3.17 machine learning KNN", section: "3.17", title: "Machine learning: single-stock KNN", title_es: "Aprendizaje automático – acción individual con KNN",
     house_description: "A nearest-neighbour forecast of one name's return.", asset_classes: [equities]}
  - {ref: "KS §3.18 statistical arbitrage", section: "3.18", title: "Statistical arbitrage: optimization", title_es: "Arbitraje estadístico – Optimización",
     house_description: "An optimised dollar-neutral book on expected returns.", asset_classes: [equities]}
  - {ref: "KS §3.19 market-making", section: "3.19", title: "Market-making", title_es: "Market-making",
     house_description: "Earn the spread by quoting both sides.", asset_classes: [equities]}
  - {ref: "KS §3.20 alpha combo", section: "3.20", title: "Alpha combos", title_es: "Combo alfa",
     house_description: "Many weak signals combined into one.", asset_classes: [equities]}
  # --- 4. ETFs --------------------------------------------------------------
  - {ref: "KS §4.1 sector momentum rotation", section: "4.1", title: "Sector momentum rotation", title_es: "Rotación de momentum sectorial",
     house_description: "Hold the sectors leading on trailing return (with the MA filter and dual-momentum variants).", asset_classes: [etfs]}
  - {ref: "KS §4.2 alpha rotation", section: "4.2", title: "Alpha rotation", title_es: "Rotación de alfa",
