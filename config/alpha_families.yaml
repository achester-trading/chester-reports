  - {ref: "KS §5.13 yield curve spread", section: "5.13", title: "Yield curve spread (flatteners and steepeners)", title_es: "Margen de la curva de rendimientos (Flattener & Steepener)",
     house_description: "Trade the curve's slope.", asset_classes: [fixed_income]}
  # --- 6. Indexes -----------------------------------------------------------
  - {ref: "KS §6.2 cash and carry arbitrage", section: "6.2", title: "Cash-and-carry arbitrage", title_es: "Arbitraje Cash & Carry",
