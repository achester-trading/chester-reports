  - {ref: "KS §6.5 index volatility targeting", section: "6.5", title: "Index volatility targeting with a risk-free asset", title_es: "Targeting de volatilidad sobre índice con activo libre de riesgo",
     house_description: "Scale index exposure to a volatility target, the rest in cash.", asset_classes: [indexes]}
  # --- 7. Volatility --------------------------------------------------------
  - {ref: "KS §7.2 VIX futures basis", section: "7.2", title: "VIX futures basis trading", title_es: "Trading de la base de futuros del VIX",
