# reporting_stack.yaml -- the ten-section stack, the tape set, the charts and the
# budgets. (docs/briefs/reporting-stack-brief-2026-10-02.md, Tranche T1)
#
# RATIFIED 2 OCT 2026 at the Doctrine monthly, item 10 ("ratify as stated";
# docs/briefs/doctrine-monthly-2026-10-minutes.md): the trigger thresholds, the
# reading budgets and chart caps, the long-frame averages, the prediction-market
# watch list and the two disagreement thresholds. Checked against item 10 by D-1;
# one value differed and was corrected (the What's-priced breakeven: item 10
# names the 5-year breakeven, which this file had as the 5y5y forward).
#
# NOT PART OF ITEM 10, and set by the T1 session rather than ruled: depth_words,
# the bars retry, the outlook rules and the style word lists. They stay here,
# marked as session-set, until a sitting rules on them.
#
# Values are configuration so a ruling is a one-line change with a version,
# never a code edit. Doctrine #2 recalibrates any trigger that fired more than
# weekly or not at all in October (item 10; the Weekly prints the counts, T2).
ratified: 2026-10-02
version: reporting-stack-v1
updated: 2026-10-02
status: ratified

# THE TAPE SET (brief 2.2). `bars` is the Yahoo symbol the close run pulls 5-minute
# and daily bars for (brief 2.3); `kind` decides the unit a move is printed in:
# a yield moves in basis points, a price in percent. `dealer` names the symbol
# whose computed exposure profile supplies flip, walls and max pain. SPY stands
# for ES until 6b.
tape:
#
# `daily` is the store series the daily frames, moving averages, 52-week levels
# and the Weekly's candles read (T2.1: the bars table holds intraday only).
# `fallback` is read ONLY when the instrument's own series is empty, and the
# tape then names it ("DXY (proxy: UUP)") -- never silently.
  - {id: spy,  label: "SPY",              bars: SPY,      kind: price, dealer: SPY, daily: yfinance.mkt_spy}
  - {id: qqq,  label: "QQQ",              bars: QQQ,      kind: price, dealer: QQQ, daily: yfinance.mkt_qqq}
  - {id: iwm,  label: "IWM",              bars: IWM,      kind: price, dealer: IWM, daily: yfinance.mkt_iwm}
  - {id: y10,  label: "10-year yield",    bars: "^TNX",   kind: yield, daily: yfinance.mkt_tnx, fallback: {daily: fred.yield_10y, label: "FRED DGS10"}, aliases: ["10-year yield", "10-year", "ten-year"]}
  - {id: y30,  label: "30-year yield",    bars: "^TYX",   kind: yield, daily: yfinance.mkt_tyx, fallback: {daily: fred.yield_30y, label: "FRED DGS30"}, aliases: ["30-year yield", "30-year", "long bond"]}
  - {id: dxy,  label: "DXY",              bars: "DX-Y.NYB", kind: price, daily: yfinance.mkt_dxy, fallback: {daily: yfinance.mkt_uup, label: "UUP"}, aliases: ["DXY", "dollar index", "the dollar"]}
  - {id: gold, label: "Gold (front future)", bars: "GC=F", kind: price, daily: yfinance.mkt_gold_front, fallback: {daily: yfinance.mkt_gld, label: "GLD"}, aliases: ["gold"]}
  - {id: oil,  label: "WTI (front future)",  bars: "CL=F", kind: price, daily: yfinance.mkt_wti_front, fallback: {daily: yfinance.mkt_uso, label: "USO"}, aliases: ["WTI", "oil", "crude"]}
  - {id: btc,  label: "Bitcoin",          bars: "BTC-USD", kind: price, continuous: true, daily: yfinance.mkt_btc_usd, aliases: ["bitcoin", "BTC"]}

# INTRADAY-ONLY INSTRUMENTS (T2.3, ruled 4 Oct 2026, item 2): pulled into the
# 5-minute bars table beside the tape set, never printed in the tape's tables.
# ES=F's FULL SESSION -- 18:00 ET the evening before to 17:00 ET -- so W7 can draw
# the overnight hours beside the cash session.
intraday_extra:
  - {id: es, label: "S&P 500 e-mini (front)", bars: "ES=F", session: full}

# INTRADAY BARS (brief 2.3). Pulled by the `bars` feed in the 16:10 eod run
# (altdata/feeds.py); the close reads the store only.
bars:
  interval: 5m
  # Fewer than this share of a session's expected 5-minute bars and the
  # intraday frame prints "bars incomplete (n=...)" and C1 is omitted.
  complete_share: 0.90
  # (T2.1: the bars feed pulls the session's 5-minute bars only. Daily frames
  # read the price feed's daily OHLC in the store.)
  # The session's FINAL counted bar not yet served: fetch again every 30 seconds
  # for up to five minutes, then store what arrived (ruled 2 Oct 2026).
  retry_seconds: 300
  retry_interval_seconds: 30

# THE THREE READING RULES (brief 1.3) and the budgets (1.4).
# WORDS COUNT PROSE ONLY, every report (T2.2, ruled 4 Oct 2026): the claim lines
# and paragraphs the model writes. Tables and the code-written lines beneath them
# are data and are never counted or cut. The Weekly's chart cap is 10 (ruled
# 4 Oct: W7 intraday, W8 panel, W9 gauges, W10 priced).
budget:
  daily: {words: 1000, charts: 3}
  weekly: {words: 3500, charts: 10}
  monthly: {words: 7000, charts: 10}

# CONDITIONAL DEPTH (brief 1.1): computed, never judged. Ratified thresholds
# (item 10). A firing trigger raises the report's chart cap by one (stack.chart_plan).
# `pending` holds ratified values whose series or feed is not built yet: they are
# recorded here at their ruled values and read by nothing until it is.
triggers:
  plumbing:
    tier1_events:
      - "FOMC statement"
      - "FOMC minutes"
      - "Consumer Price Index"
      - "Personal Income and Outlays"
      - "Employment Situation"
      - "Gross Domestic Product"
      - "Treasury quarterly refunding"
    auctions: ["Note:10-Year", "Bond:30-Year"]
    moves_bp:
      fred.yield_10y: 10
      fred.yield_30y: 10
      calc.yield_curve_2s10s: 8
      fred.hy_oas: 15
  priced:
    # Item 10's "5- or 10-year breakeven >= 10 bp", and the 5y5y forward beside
    # them at the same threshold (6d, 2 Oct 2026: T5YIE added to the FRED feed).
    moves_bp:
      fred.breakeven_5y: 10
      fred.breakeven_10y: 10
      fred.breakeven_5y5y: 10
    # 6d: the implied rate after any of the next four FOMC meetings moving this
    # far since the prior session (altdata/fed_funds.py), and any watched venue
    # probability moving this many points in a session (the attention shock).
    fomc_implied_rate_next_four_meetings_bp: 12.5
    prediction_market_points: 10
    pending:
      consensus_eps_revision_pct: 1.0                  # the Weekly only (T2)
      expectations_1y_pt: 0.3                          # UMich or SCE one-year; not stored yet

# THE LONG FRAME (Monthly tape, item 10): the 40-week, 10-month and 20-month
# averages -- levels, never signals; a cross counts only after the monthly close.
# altdata/levels.py computes them as ma_40w, ma_10m and ma_20m; T3 prints them.
long_frame_averages: {weekly_weeks: [40], monthly_months: [10, 20]}

# PREDICTION MARKETS (6d, item 10). The watch list goes to
# config/prediction_markets.yaml when 6d is built; the ruled thresholds are here.
prediction_markets:
  watch_list:
    - "the FOMC decision at each of the next four meetings"
    - "US recession in 2026 and in 2027"
    - "each month's CPI print"
    - "House and Senate control on 3 November"
    - "a government shutdown by date"
    - "the twenty highest-volume markets matching the narrative register's stories by keyword"
  disagreement_points:
    venue_vs_fed_funds_implied: 15
    venue_vs_scenario_weight: 20

# THE OUTLOOKS (brief 1.3 rule 3): every probability in Ahead is a ledger entry
# first. Each is a BASE RATE (kind: base_rate, D-1 2 Oct 2026): the empirical
# frequency of the rule's outcome over the stored closes, with its n -- never
# chosen by the model, and printed only as "the base rate for ... is X% (n=...)",
# never as the system's view. `text` is a noun phrase so that sentence reads.
outlooks:
  - id: week_low_holds
    kind: base_rate
    symbol: SPY
    rule: week_closing_low_holds
    text: "SPY's lowest close of the week so far holding through the week's last session"
  - id: above_20d_next
    kind: base_rate
    symbol: SPY
    rule: stays_above_20d_next_session
    text: "SPY closing on the same side of its 20-day average at the next session"

# The section order and the depth each takes on the daily close (brief 1). Each
# header prints "number · name — subtitle" (T2.2 item 1, every stacked report).
# The Weekly column (T2) is the brief's matrix: What's priced goes deep on a
# major movement over the week (`weekly_deep_on`); Plumbing has no weekly rule.
sections:
  - {id: read,        title: "The read", subtitle: "the week's five lines, and the week day by day",            daily: deep,  weekly: deep}
  - {id: tape,        title: "The tape", subtitle: "where prices went and the levels they met",            daily: deep,  weekly: deep}
  - {id: mechanics,   title: "Mechanics", subtitle: "how dealer hedging shaped the moves",           daily: deep,  weekly: medium}
  - {id: misfit,      title: "What doesn't fit", subtitle: "where markets disagree with each other",    daily: deep,  weekly: deep}
  - {id: plumbing,    title: "Plumbing & rates", subtitle: "rates, the curve and credit",    daily: light, deep_on: plumbing, weekly: medium}
  - {id: positioning, title: "Positioning & flows", subtitle: "who holds what, and how it changed", daily: light, weekly: deep}
  - {id: priced,      title: "What's priced", subtitle: "what markets and surveys expect, not how they're positioned",       daily: light, deep_on: priced, weekly: medium, weekly_deep_on: priced}
  - {id: narratives,  title: "Narratives", subtitle: "the stories the market is telling, and who is telling them",          daily: line,  weekly: medium}
  - {id: ahead,       title: "Ahead", subtitle: "what is scheduled, and what we are watching",               daily: deep,  weekly: deep}
  - {id: book,        title: "The book", subtitle: "our decisions, our rules and our attention",            daily: short, weekly: medium}

# Paragraphs a section's commentary may run to, by depth. (Session-set, T1.)
depth_paragraphs: {deep: "2 to 3", medium: "1", light: "0", short: "0", line: "0"}
# Words a section's prose may run to, claim included, by depth -- so ten sections
# fit the daily budget without the cut doing the editing. (Session-set, T1; not
# part of item 10.)
depth_words: {deep: 150, medium: 80, light: 35, short: 35, line: 25}
# The Weekly's sections are longer at the same depth (20 minutes against 5);
# session-set (T2), not part of item 10.
depth_words_weekly: {deep: 420, medium: 220, light: 60, short: 60, line: 40}

# TAPE STYLE (brief 2.1 rules 4 and 7): words that assert a motive or do a
# number's work. A motive word is refused outright; an intensity word only when
# its sentence carries no figure.
style:
  motive_phrases: ["because", "due to", "driven by", "on fears", "on hopes",
                   "as investors", "amid concerns", "thanks to", "spooked",
                   "cheered"]
  # Closers the stack does not use (T2.1 item 8): refused in any section.
  banned_phrases: ["for the system", "what it will test next", "what it tests next",
                   "what next week tests", "what tomorrow tests",
                   # T2.2 item 2: internal phrases found in the 4 Oct edition.
                   # "Prediction market" replaces "venue" in prose.
                   "mapped scenario counterpart", "venue disagreement", "venue",
                   "venues", "venue's", "bias zone", "the tracker", "scorecard entry",
                   "legs normalised", "not_sourced", "contradiction:", "extreme:",
                   # T2.5 item 3 (ruled 5 Oct 2026): sentences about the
                   # system's own method. They are not the market; the standing
                   # notes they came from moved to the glossary, and the Reader's
                   # Guide explains the rest. tools/validate_readability.py
                   # holds the whole rendered body to this list.
                   "which is itself the finding", "written as such rather than left silent",
                   "rather than left silent", "a count is attention, not evidence",
                   "cited by id", "said positively so", "the system is watching",
                   "the system tested", "the system will test"]
  intensity_words: ["sharply", "massive", "massively", "huge", "surged",
                    "plunged", "soared", "skyrocketed", "crashed", "tanked",
                    "collapsed", "exploded", "dramatic", "dramatically"]

# THE WEEKLY DEALER SCORECARD'S FLAGS (T2.2 item 18). PROPOSED for the Doctrine
# monthly (#2); computed by code from the stored scorecard rows, never by the
# model -- the prose may say "pinned", "held" or "amplified" only on a session
# whose flag is set.
dealer_flags:
  status: proposed
  # pinned: the close within this % of max pain.
  pinned_pct: 0.25
  # a wall held: the session's high (call) or low (put) within this % of the
  # wall, and the close inside it.
  wall_pct: 0.25
  # amplified: the flip crossed and the actual range at least this multiple of
  # the implied one-day range.
  amplified_range_ratio: 1.2
  # The implied one-day range is spot x IV x sqrt(1/252). IV is the session's
  # VIX close (SPY's 30-day implied volatility), a declared choice: the profile
  # does not store an at-the-money IV per session.
  implied_vol_key: yfinance.mkt_vix
  # PB-1 (5 Oct 2026): SPY's own ATM IV and the VIX further apart than this, in
  # vol points, print side by side and mark the row "check".
  iv_vix_check_points: 5.0
