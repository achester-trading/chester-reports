# release_calendar.yaml -- standard release times and importance, for the
# Weekly's day-by-day calendar (T2.2 item 10, ruled 4 Oct 2026).
#
# THE EVENTS TABLE SAYS WHAT IS SCHEDULED AND ON WHICH DAY; THIS FILE SAYS WHEN IN
# THE DAY AND HOW MUCH IT MATTERS. A release is matched by the first pattern (a
# case-insensitive substring of its stored title) that names it; the time is the
# agency's standard release time in US Eastern. A speaker's time comes from the
# Fed's own calendar (altdata/sources/fed_calendar.py), never from here. A release
# no pattern names prints "time not stated" and importance 3.
#
# IMPORTANCE is the existing tiers: tier 1 is the Plumbing trigger's list
# (config/reporting_stack.yaml, triggers.plumbing.tier1_events), tier 2 is ruled
# here, and everything else is tier 3.
#
# THE MONTHLY'S 1-5 SIGNIFICANCE RANK (T3.1 item 14, ruled 9 Oct 2026) is read
# from the tiers by daily_cascade/events_block.significance: tier 1 is 5; tier 2
# is 4 when the Plumbing trigger's list names it and 3 otherwise; a tier-3
# release this file names is 2, anything else 1. `why` is the one clause printed
# beside a rank of 4 or 5 (session-set, not ruled).
version: release-calendar-v1
updated: 2026-10-09

releases:
  # tier 1
  - {match: "FOMC statement",              time: "14:00", tier: 1, label: "FOMC statement", why: "the rate decision itself"}
  - {match: "FOMC Meeting",                time: "14:00", tier: 1, label: "FOMC statement", why: "the rate decision itself"}
  - {match: "Consumer Price Index",        time: "08:30", tier: 1, label: "CPI", why: "the inflation print the rate path is priced on"}
  - {match: "Personal Income and Outlays", time: "08:30", tier: 1, label: "PCE (personal income and outlays)", why: "the Fed's own inflation gauge"}
  - {match: "Employment Situation",        time: "08:30", tier: 1, label: "Payrolls (employment situation)", why: "the labour market's monthly read"}
  - {match: "Gross Domestic Product",      time: "08:30", tier: 1, label: "GDP", why: "growth for the quarter, against the cycle read"}
  - {match: "Treasury quarterly refunding", time: "08:30", tier: 1, label: "Treasury quarterly refunding", why: "coupon supply, and so the term premium"}
  # tier 2
  - {match: "FOMC minutes",                time: "14:00", tier: 2, label: "FOMC minutes", why: "how the committee argued the last decision"}
  - {match: "Minutes of the Federal Open Market Committee", time: "14:00", tier: 2, label: "FOMC minutes", why: "how the committee argued the last decision"}
  - {match: "ISM",                         time: "10:00", tier: 2, label: "ISM"}
  - {match: "Job Openings",                time: "10:00", tier: 2, label: "JOLTS (job openings)"}
  - {match: "Producer Price",              time: "08:30", tier: 2, label: "PPI"}
  - {match: "Retail Sales",                time: "08:30", tier: 2, label: "Retail sales"}
  - {match: "Advance Monthly Sales",       time: "08:30", tier: 2, label: "Retail sales"}
  - {match: "Unemployment Insurance Weekly Claims", time: "08:30", tier: 2, label: "Jobless claims"}
  - {match: "Note:10-Year",                time: "13:00", tier: 2, label: "10-year note auction", why: "demand for duration at the benchmark"}
  - {match: "Bond:30-Year",                time: "13:00", tier: 2, label: "30-year bond auction", why: "demand for the long end"}
  # tier 3, with their standard times
  - {match: "Surveys of Consumers",        time: "10:00", tier: 3, label: "University of Michigan sentiment"}
  - {match: "University of Michigan",      time: "10:00", tier: 3, label: "University of Michigan sentiment"}
  - {match: "H.4.1",                       time: "16:30", tier: 3, label: "Fed balance sheet (H.4.1)"}
  - {match: "Factors Affecting Reserve Balances", time: "16:30", tier: 3, label: "Fed balance sheet (H.4.1)"}
  - {match: "Note:",                       time: "13:00", tier: 3, label: null}
  - {match: "Bond:",                       time: "13:00", tier: 3, label: null}
  - {match: "Bill:",                       time: "11:30", tier: 3, label: null}
  - {match: "Industrial Production",       time: "09:15", tier: 3, label: "Industrial production"}
  - {match: "New Residential Construction", time: "08:30", tier: 3, label: "Housing starts"}
  - {match: "Durable Goods",               time: "08:30", tier: 3, label: "Durable goods"}
  - {match: "Consumer Credit",             time: "15:00", tier: 3, label: "Consumer credit"}

# Option expiries come from the session calendar's events (OPEX); a monthly
# expiry is importance 2, a quarterly one 1.
expiries:
  monthly_tier: 2
  quarterly_tier: 1
  quarterly_why: "a quarterly expiry: dealers' hedges roll off at once"

# THE HEADLINE OF EACH TIER-1 RELEASE (T2.2; forms ruled 5 Oct 2026): what The
# read's week-by-day table and Plumbing print for it, in a declared FORM under a
# declared label -- raw series names never print. A release is matched when its
# stored name STARTS with the key (so "Debt to Gross Domestic Product Ratios" is
# not GDP). Values are read from the store as of the cutoff; the prior is the
# same form one period earlier.
#   level       the latest print
#   change      latest minus prior, in the series' own unit, its scale written
#               (payrolls are stored in thousands and print as +29k)
#   mom         month on month, percent
#   yoy         year on year, percent (twelve monthly prints back)
#   annualised  quarter on quarter, annualised, percent
tier1_headlines:
  "Employment Situation":
    - {key: fred.nfp, form: change, label: "nonfarm payrolls, monthly change"}
    - {key: fred.u3_rate, form: level, label: "unemployment rate"}
  "Consumer Price Index":
    - {key: fred.cpi, form: mom, label: "CPI, month on month"}
    - {key: fred.cpi, form: yoy, label: "CPI, year on year"}
    - {key: fred.core_cpi, form: mom, label: "core CPI, month on month"}
    - {key: fred.core_cpi, form: yoy, label: "core CPI, year on year"}
  "Personal Income and Outlays":
    - {key: fred.pce, form: mom, label: "PCE prices, month on month"}
    - {key: fred.pce, form: yoy, label: "PCE prices, year on year"}
    - {key: fred.core_pce, form: mom, label: "core PCE prices, month on month"}
    - {key: fred.core_pce, form: yoy, label: "core PCE prices, year on year"}
  "Gross Domestic Product":
    - {key: fred.real_gdp, form: annualised, label: "real GDP, quarterly annualised"}
  "Unemployment Insurance Weekly Claims":
    - {key: fred.claims_4wk, form: level, label: "jobless claims, four-week average"}

# THE EARNINGS SEASONS (T2.3 item 9): the Weekly's earnings block prints only
# inside these windows ([month, day] to [month, day]); outside them it prints
# nothing at all.
earnings_seasons:
  - {from: [1, 10], to: [2, 28]}
  - {from: [4, 10], to: [5, 31]}
  - {from: [7, 10], to: [8, 31]}
  - {from: [10, 10], to: [11, 30]}
