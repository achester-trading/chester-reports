# THE PER-DOMAIN COMMANDS (AUD-3a item 5, 14 Oct 2026): every module under
# altdata/, altdata/sources/ and altdata/loggers/ that runs as `python -m <module>`,
# one line each. `python -m altdata.catalogue commands` prints this table, and
# `show ID` names the command that produces a metric through `sources`.
# tools/validate_audit_3a.py fails when a command module has no line here, or a
# line names a module that is gone. The `line` is the module's own docstring's
# first sentence, shortened; the domain is assigned here.
commands:
  altdata.ai_fcf:
    domain: equity
    line: SR-37 -- THE AI FCF-TRANSFER PANEL (signal-triage batch 4, ST4-01)
  altdata.alt_scan:
    domain: alternatives
    line: The alternative-assets quarterly scan's ingest
  altdata.attribution:
