    line: 'The gold residual, the driver attribution and the yields-up/dollar-down series, stored as calculated series for the Monthly'
  altdata.bars:
    domain: equity
    line: 'OHLC bars for the tape set: 5-minute for the session, daily for the frames'
  altdata.basis_proxy:
