        absorption measurement already detects
    source: docs/whitepapers/positioning-and-flows-whitepaper.md, Table C
    source_class: inferred
    date: 2026-06-30
    review_date: 2027-06-30
    warnings: [three_denominators]

  pf.vol_ctas:
    value: "$300-350B AUM, mostly futures"
    unit: assets; small in cash volume, material in index futures
    detail:
      heightened: 10-20% of index-futures volume after a trend-flip level breaks
      forced_or_discretionary: FORCED by rule
    source: docs/whitepapers/positioning-and-flows-whitepaper.md, Table C
    source_class: inferred
    date: 2026-06-30
    review_date: 2027-06-30
    warnings: [three_denominators]

  pf.vol_vol_control:
    value: "$400-600B AUM (estimates disagree by half)"
    unit: assets; near-zero ordinary volume
    detail:
      heightened: >-
        10-20% of index-product volume 1-5 sessions after a realized-vol spike
      forced_or_discretionary: FORCED by mandate
      note: >-
        the width of the AUM range IS the claim. Estimates disagree by half, and a
        forced-flow estimate built on the midpoint carries that disagreement.
    source: docs/whitepapers/positioning-and-flows-whitepaper.md, Table C
    source_class: inferred
    date: 2026-06-30
    review_date: 2027-06-30
    warnings: [three_denominators]

  pf.vol_levered_etf:
    value: "1-2% of close volume"
    unit: ordinary share of closing volume
    detail:
      heightened: 5-10% of close volume on a +/-3% index day
      forced_or_discretionary: FORCED by prospectus
    source: docs/whitepapers/positioning-and-flows-whitepaper.md, Table C
    source_class: inferred
    date: 2026-06-30
    review_date: 2027-06-30
    warnings: [three_denominators]

  pf.vol_short_sellers:
    value: "embedded in the rows above"
    unit: share of volume
    detail:
      owned: 1.5-2% of index cap
      heightened: 30-50% of a squeezed name's volume during forced covering
      forced_or_discretionary: discretionary until the borrow says otherwise
    source: docs/whitepapers/positioning-and-flows-whitepaper.md, Table C
    source_class: inferred
    date: 2026-06-30
    review_date: 2027-06-30
    warnings: [three_denominators]

  pf.forcing_multiple:
    value: "forced-flow footprint = equity exposure x turnover x rule-boundness"
    detail:
      the_reading: >-
        a forty-trillion-dollar insurance industry holding fifteen percent equity
        with near-zero turnover generates less tradeable forced flow than a
        five-hundred-billion-dollar volatility-control complex that can reset its
        book inside a week, because the second is obliged to trade on a rule and
        the first is not
      forcing_multiple: >-
        the ratio between a participant's heightened and ordinary volume columns --
        how much larger its footprint becomes on the day its rule binds
    source: docs/whitepapers/positioning-and-flows-whitepaper.md, Part I
    source_class: inferred
    date: 2026-06-30
    review_date: 2027-06-30
    warnings: [three_denominators]

  # ===========================================================================
  # DATED CALENDAR FACTS -- read by the Weekly Tactical's WEEK AHEAD block
  #
  # These are in the claims registry and not in the observation store for the
  # reason the file's header gives: the system cannot compute them and cannot
  # currently fetch them either. A meeting date is a published fact about the
  # future, which is exactly a claim.
  #
  # AND THEIR review_date IS THE MECHANISM THAT KEEPS THEM CURRENT. cal.fomc_2026
  # is reviewed on 1 December 2026, which is when the 2027 calendar has to exist
  # for the first Sunday of January to read it -- so the heartbeat's overdue
  # warning fires exactly when the work is due rather than after a report has
  # printed nothing.
  # ===========================================================================
  cal.fomc_2026:
    value: "2026 FOMC meeting dates: Jan 27-28, Mar 17-18, Apr 28-29, Jun 16-17,
      Jul 28-29, Sep 15-16, Oct 27-28, Dec 8-9"
    unit: scheduled two-day meetings; the decision lands on the second day
    detail:
      decision_days: [2026-01-28, 2026-03-18, 2026-04-29, 2026-06-17,
                      2026-07-29, 2026-09-16, 2026-10-28, 2026-12-09]
      note: >-
        ENTERED FROM THE BOARD'S ANNOUNCED CALENDAR AND NOT RE-VERIFIED BY THIS
        SYSTEM, which has no fetcher for federalreserve.gov. Verify a date against
        the Board's page before a report prints it. The failure mode is quiet: a
        meeting date wrong by a day makes every "the week before the FOMC" reading
        wrong by a week, and no downstream check would catch it.
      projections_meetings: [2026-03-18, 2026-06-17, 2026-09-16, 2026-12-09]
    source: >-
      Federal Reserve Board, published FOMC calendar (federalreserve.gov/
      monetarypolicy/fomccalendars.htm)
    source_class: cited
    date: 2026-09-23
    review_date: 2026-12-01
  cal.fomc_2027:
    value: "2027 FOMC meeting dates: Jan 26-27, Mar 16-17, Apr 27-28, Jun 8-9,
      Jul 27-28, Sep 14-15, Oct 26-27, Dec 7-8"
    unit: scheduled two-day meetings; the decision lands on the second day
    detail:
      decision_days: [2027-01-27, 2027-03-17, 2027-04-28, 2027-06-09,
                      2027-07-28, 2027-09-15, 2027-10-27, 2027-12-08]
      note: >-
        Read from the Board's published 2027 calendar on 2 Oct 2026 by the 6d
        session (fetched once, by hand; the system still has no fetcher for
        federalreserve.gov). Kalshi's KXFEDDECISION strike dates for Jan, Mar
        and Apr 2027 agree. The rate path (altdata/fed_funds.py) needs the next
        four meetings, which run into 2027 from October.
      projections_meetings: [2027-03-17, 2027-06-09, 2027-09-15, 2027-12-08]
    source: >-
      Federal Reserve Board, published FOMC calendar (federalreserve.gov/
      monetarypolicy/fomccalendars.htm)
    source_class: cited
    date: 2026-10-02
    review_date: 2027-06-01
  # THE FOMC HISTORY (a55 round 2; ruled 21 Oct 2026, 00:41 ET: entered once as a
  # claim, audited monthly by altdata/fomc_audit.py from the heartbeat). Every
  # meeting that ended in a policy statement, scheduled or unscheduled, from the
  # first statement (4 Feb 1994, before which the FOMC published none) through
  # 2025; 2026 and 2027 are the rows above. altdata/events_ingest.py reads
  # detail.statements in place of parsing the value.
  cal.fomc_history:
    value: "FOMC policy statements 1994-2025: 239 statements, 14 of them after an
      unscheduled meeting or conference call"
    unit: one row per policy statement, dated the day the statement was released
    detail:
      note: >-
        Read on 21 Oct 2026 by session A from the Board's historical FOMC pages
        (fomchistorical<year>.htm, 1994-2020) and its meeting calendar
        (fomccalendars.htm, 2021-2025). A row is a meeting the page links to a
        Statement (a Press Release before 1999). Each row's date is the release
        date printed on the statement itself, checked for all rows; the one page
        whose link was misdated is the June 2007 meeting, linked as 20070618 and
        printed June 28. LEFT OUT, as ruled: conference calls and meetings with no
        statement (before May 1999 the Committee announced only a change), the
        cancelled meeting of 17-18 Mar 2020, and the notation votes (19, 23 and 31
        Mar and 27 Aug 2020, 22 Aug 2025), which are not meetings. Two statements
