    source: docs/whitepapers/base-rates-whitepaper.md, 13.2
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample, survivorship_country]

  br.intl_us_1966_82:
    value: "real total return down by over 40% at the worst"
    detail:
      nominal: roughly flat
      years_to_real_recovery: 17
      mechanism: inflation; multiple compression
    source: docs/whitepapers/base-rates-whitepaper.md, 13.2
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample]

  br.intl_germany_1914_23:
    value: "bonds and cash went to zero; equities preserved a fraction of real value"
    detail:
      mechanism: hyperinflation and monetary reset
      recovery: currency replaced twice within a generation
      the_reading: >-
        the asset that failed was the one held for safety. This is the claim the
        debt-cycle scenario's inflationary branch is written against.
    source: docs/whitepapers/base-rates-whitepaper.md, 13.2
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample, survivorship_country]

  br.intl_germany_japan_1944_48:
    value: "-90%+ real"
    detail:
      mechanism: war, occupation, currency reform; exchanges closed
      recovery: decades
    source: docs/whitepapers/base-rates-whitepaper.md, 13.2
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample, survivorship_country]

  br.intl_greece_2007_16:
    value: "-90% real"
    detail:
      mechanism: sovereign crisis inside a currency union
      recovery: not recovered
    source: docs/whitepapers/base-rates-whitepaper.md, 13.2
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample, survivorship_country]

  br.intl_argentina:
    value: "repeated 80-95% real drawdowns since 1970"
    detail:
      mechanism: fiscal dominance, currency destruction
      recovery: repeated resets
    source: docs/whitepapers/base-rates-whitepaper.md, 13.2
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample, survivorship_country]

  br.intl_expropriation:
    value: "-100% for outside holders"
    detail:
      cases: [Russia 1917, China 1949]
      mechanism: expropriation
      recovery: never, for outside holders
      the_reading: >-
        several markets in the 1900 index did not survive. The correction to a
        survivor-only base rate is a wider distribution with mass at total loss,
        not a smaller mean.
    source: docs/whitepapers/base-rates-whitepaper.md, 13.1 and 13.2
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [survivorship_country]

  br.dms_world_vs_us_real:
    value: "world ~5% real against the U.S. ~6.5% real, 1900 onward"
    detail:
      dataset: Dimson-Marsh-Staunton, 21-35 markets from 1900
      the_reading: >-
        the U.S. figure is the TOP of the distribution and not the centre of it.
        Every long-run expectation taken from U.S. history is taken from the
        best case in the sample.
    source: docs/whitepapers/base-rates-whitepaper.md, 13.1
    source_class: cited
    date: 2026-09-06
    review_date: 2028-09-06
    warnings: [survivorship_country]

  br.extended_tail_percentiles:
    value: "p95 of bad markets is -80% over 20-35 years"
    detail:
      median: "-30%, ~2 years (1990, 2022)"
      p75: "-45 to -50%, 4-5 years (1973-74, 2000-02, 2008-09)"
      p90: "-55 to -60% real, 10-15 years (1966-82 in real terms)"
      p95: "-80%, 20-35 years (Japan 1989; U.S. 1929)"
      p99: "-90%+ real or total loss; never, for the original holders"
      the_reading: >-
        the tail is real, has happened to developed markets with functioning
        institutions within living memory, and sits at roughly the 95th percentile
        of the historical distribution rather than off the end of it
    source: docs/whitepapers/base-rates-whitepaper.md, 13.3
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample, survivorship_country]

