# claims.yaml -- every cited figure the system may print and cannot compute.
# Audit #3 row 6l; architecture 26.5, 31.1 and 31.4.
#
# -----------------------------------------------------------------------------
# WHY A SECOND REGISTRY, BESIDE metrics_registry.yaml
# -----------------------------------------------------------------------------
#
# The metrics registry declares things the system MEASURES: a series, its units,
# its half-life, its revision policy. Everything in it can be recomputed from the
# store, and `tools/base_rates.py` exists so that the Base Rates paper's Part I
# tables are in that category rather than this one.
#
# This file is for the other kind of figure -- the ones a report may legitimately
# print and this system cannot derive from any data it holds or could fetch:
#
#   * The pre-1970 downturns. The store's own index history begins in 1927, which
#     covers 1929 and 1937, and stops short of 1907 entirely; and no amount of
#     price history yields "the crisis was ended by a private bailout organised by
#     J. P. Morgan", which is the part of the episode the tail watch actually uses.
#   * The international drawdowns. Japan 1989, Germany 1923, Greece 2007, Argentina
#     repeatedly. The system holds no foreign index history and no real-return
#     series, and the figures are quoted from the long-run returns literature.
#   * The participant map. Tables A-C of Positioning and Flows are flow-of-funds
#     statistics, exchange disclosures and academic estimates. They are not
#     observations and they are not computable; they are CITED.
#   * The statistical figures from Evidence and Inference. Standard errors are
#     arithmetic, but the arithmetic is the paper's and the figures below are what
#     a report would otherwise retype.
#
# -----------------------------------------------------------------------------
# THE RULE, WHICH IS THE WHOLE POINT
# -----------------------------------------------------------------------------
#
# A REPORT CITES A CLAIM BY ID AND NEVER BY RETYPING THE FIGURE.
#
# Retyping is how "-45%" becomes "-40%" three reports later with nobody able to
# say which number was believed when. An id is replayable: it resolves to a value,
# a source, the date the figure was taken and the date it must next be checked.
# `register/store.py` enforces the same rule on decision packets -- base_rate_cited
# accepts `claim:<id>` or `baserate.<table>` and REFUSES free text.
#
# -----------------------------------------------------------------------------
# WHAT AN OVERDUE REVIEW MEANS, AND WHAT IT DOES NOT
# -----------------------------------------------------------------------------
#
# Every claim carries a review_date. Past it, the heartbeat prints a WARNING and
# the verdict and exit code are untouched: an ownership share from mid-2026 that
# has not been rechecked in 2027 is a figure to recheck, not a broken pipeline.
# Making it a failure would train the reader to ignore the light, which is the one
# outcome that costs more than the stale figure.
#
# `status` says what to do about a claim, independently of its review date:
#   current      -- checked, in force
#   stale        -- past review and known not to have been rechecked
#   superseded   -- a newer claim replaces it; `superseded_by` names it
#   withdrawn    -- believed wrong; kept so a citation of it still resolves
#
# A claim is never deleted. A report that cited it must still resolve the id.

version: claims-v1
schema_source: docs/chester-reports-audit-3.md row 6l; architecture 26.5, 31.1, 31.4

defaults:
  # A year unless a claim says otherwise. Flow-of-funds shares move slowly; a
  # 1929 drawdown moves not at all and carries a long interval by hand.
  review_interval_months: 12
  status: current

# -----------------------------------------------------------------------------
# STANDING WARNINGS -- attached to claims by id, so a caveat travels with the
# figure instead of living in a paragraph nobody reads twice.
# -----------------------------------------------------------------------------
warnings:
  three_denominators:
    # 31.4 requires this VERBATIM wherever the participant map is cited. It is
    # reproduced from the paper rather than paraphrased, because the paraphrase is
    # exactly what produces the error it warns about.
    text: >-
      Direct ownership of U.S. equity, global AUM by institution type, and
      equity-relevant AUM are three different measurements, and
      forced-flow footprint = equity exposure x turnover x rule-boundness is the
      fourth and the one the system sizes by.
    detail: >-
      Three denominators are routinely confused in positioning commentary and they
      give answers that differ by an order of magnitude for the same institution.
      Direct ownership (Table A) is the Federal Reserve's flow-of-funds measure --
      immediate holder only, one asset class, one country -- on which pension funds
      hold ~9% and insurers ~2%. Global AUM by institution type is a different
      universe: pension assets worldwide are roughly $55-60tn, insurance roughly
      $40tn, regulated open-end funds roughly $70-80tn. Equity-relevant AUM is the
      intersection. The gap between the first two is accounting rather than
      economics: flow-of-funds records the immediate holder, so a pension holding
      U.S. equity through a commingled index fund appears in the fund row, not the
      pension row -- pensions held close to 30% of U.S. equities in the 1980s when
      they held stocks directly, and the fall to ~9% is overwhelmingly a change in
      HOW they hold rather than how much.
    source: docs/whitepapers/positioning-and-flows-whitepaper.md, Part I
  small_sample:
    text: >-
      Small samples, given for the shape rather than the decimal. TWELVE bear
      markets is a sample of twelve, and a quartile of it is not a distribution.
      Twelve is the COMPUTED count -- at or beyond -20% from the running maximum
      on closing prices, ^GSPC from 1927. The papers' narrated roster of thirteen
      is a different sample: it opens at 1907, counts 1937-38 and 1946-47 as their
      own episodes inside the unrecovered 1929 decline, and includes 1990 at
      -19.92%. The Base Rates erratum of 23 September 2026 lists both.
    source: docs/whitepapers/base-rates-whitepaper.md, Chapter 16
  survivorship_country:
    text: >-
      Survivorship operates at the level of the COUNTRY, not merely the company. A
      base rate built from markets that still exist is conditioned on survival, and
      the honest correction is not a smaller number but a wider distribution with
      mass at total loss.
    source: docs/whitepapers/base-rates-whitepaper.md, 13.1

claims:

  # ===========================================================================
  # PRE-1970 DOWNTURNS -- Base Rates Chapter 11
  # ===========================================================================
  br.episode_1907:
    value: "-45%"
    unit: peak-to-trough decline, approximate
    detail:
      months_down: 15
      recession: true
      mechanism_family: funding/liquidity crisis
      what_signaled: >-
        call-money rates spiking to extraordinary levels; trust-company
        balance-sheet fragility visible to anyone who looked
      what_stayed_silent: the broad economy until the panic was underway
      why_it_belongs: >-
        the cleanest case of a funding crisis in an institution class the
        regulatory perimeter did not cover -- the mechanism that recurred in 2008
        and that the tail scenarios track in private credit today
    source: docs/whitepapers/base-rates-whitepaper.md, 11.1 and 11.6
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample]

  br.episode_1929_32:
    value: "-86%"
    unit: peak-to-trough decline
    detail:
      months_down: 34
      recession: severe
      mechanism_family: debt deflation plus policy error
      years_to_nominal_recovery: 25
      counter_trend_rally: "+46% November 1929 to April 1930"
      the_reading: >-
        the -86% is not the useful number; the +46% bear-market rally is -- it is
        the archetype of the counter-trend rally that ends short campaigns and
        restarts long ones at the wrong time
    source: docs/whitepapers/base-rates-whitepaper.md, 11.2 and 11.6
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    # THE ONE CLAIM THIS SYSTEM CAN CHECK ITSELF. ^GSPC covers 1929, so
    # baserate.drawdown_by_depth computes the depth (-86.19%) and the largest
    # counter-trend rally (+46.77%) from the store. The claim is kept because the
    # mechanism and the dates are not computable, and the computed field is named
    # so the two can be compared rather than diverging quietly.
    computable_as: baserate.drawdown_by_depth|bear_properties.depth_by_depth.deepest
    warnings: [small_sample]

  br.episode_1937_38:
    value: "-50%"
    unit: peak-to-trough decline, approximate
    detail:
      months_down: 12
      recession: true
      mechanism_family: policy error
      mechanism: >-
        premature tightening -- a doubling of reserve requirements and fiscal
        contraction -- into an incomplete recovery
      why_it_belongs: >-
        the canonical case of a second downturn inside a longer recovery, and the
        reason the Monthly's policy pillar watches for tightening into weakness
        rather than for tightening as such
    source: docs/whitepapers/base-rates-whitepaper.md, 11.3 and 11.6
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample]

  br.episode_1946_47:
    value: "-30%"
    unit: nominal peak-to-trough decline, approximate
    detail:
      months_down: 12
      recession: false
      mechanism_family: inflation / financial repression
      the_reading: >-
        the real damage fell on BONDHOLDERS, not equity holders -- nominal yields
        were capped below an inflation rate above 15% for years, and a duration
        sleeve held through it lost a third of its purchasing power. This is the
        episode a stock-bond correlation estimated on 1998-2020 cannot imagine.
    source: docs/whitepapers/base-rates-whitepaper.md, 11.4 and 11.6
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample]

  br.episode_1961_62:
    value: "-28%"
    unit: peak-to-trough decline, approximate
    detail:
      months_down: 6
      recession: false
      mechanism_family: valuation unwind
      why_it_belongs: >-
        the cleanest pre-1970 example of a bear market WITHOUT an economic
        contraction -- the pattern that makes "wait for the recession" an
        unreliable rule
    source: docs/whitepapers/base-rates-whitepaper.md, 11.5 and 11.6
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample]

  br.pre1970_aggregate:
    value: "five episodes, three mechanism families the post-1970 set lacks"
    detail:
      episodes: [1907, 1929-32, 1937-38, 1946-47, 1961-62]
      adds: [pre-Fed liquidity crisis, debt deflation, financial repression]
      effect: >-
        adding these five to the eight post-1970 episodes roughly doubles the
        calibration sample; the post-1970 sample alone understates the left tail
        because it excludes 1929 and 1937
    source: docs/whitepapers/base-rates-whitepaper.md, 11.6 and Chapter 12
    source_class: cited
    date: 2026-09-06
    review_date: 2029-09-06
    warnings: [small_sample]

  # ===========================================================================
  # INTERNATIONAL AND REAL-TERMS DRAWDOWNS -- Base Rates Chapter 13
  # ===========================================================================
  br.intl_japan_1989:
    value: "-82% nominal"
    unit: peak-to-trough decline
    detail:
      years_to_nominal_high: 34
      recovered_on: 2024-02
      mechanism: >-
        credit and asset bubble, slow bank recognition, deflation; deeper in real
