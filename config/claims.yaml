  cal.midterm_election_2026:
    value: "2026-11-03"
    unit: US federal midterm election day
    detail:
      note: >-
        The first Tuesday after the first Monday in November, which is computable
        -- and it is a claim rather than an observation because what a report cites
        it FOR is the presidential-cycle conditional, and 31.6 rules that the
        conditional enters as a dated register hypothesis rather than as a
        trigger_eligible metric.
      why_it_matters_here: >-
        Base Rates Chapter 3 rules seasonality trigger_eligible false permanently;
        the midterm conditional is the one calendar effect admitted, and only as a
        hypothesis with a date.
    source: >-
      2 U.S.C. 7 -- the first Tuesday after the first Monday in November of each
      even-numbered year
    source_class: cited
    date: 2026-09-23
    review_date: 2028-01-01

  # ===========================================================================
  # STATISTICAL FIGURES -- Evidence and Inference
  # ===========================================================================
  ei.expectancy_standard_error:
    value: "standard error of measured expectancy is roughly 1 / sqrt(n) in R"
    detail:
      basis: >-
        trading results have a per-decision spread close to one R, so sigma/sqrt(n)
        with sigma ~ 1R
      intervals_on_a_true_0_2R_edge:
        n_30: "+/-0.18R -- interval -0.16R to +0.56R; nothing can be said"
        n_50: "+/-0.14R -- interval -0.08R to +0.48R; nothing can be said"
        n_150: "+/-0.08R -- interval +0.04R to +0.36R; barely positive"
        n_200: "+/-0.07R -- one year; positive, magnitude unknown by a factor of six"
        n_400: "+/-0.05R -- two years; magnitude known within a factor of three"
        n_1000: "+/-0.03R -- five years; known"
      the_reading: >-
        the Doctrine's thirty-and-fifty thresholds are minima for the crudest
        question -- is the sign positive -- and are far too small for any
        interesting one. A year of disciplined trading cannot exclude zero.
    source: docs/whitepapers/evidence-inference-whitepaper.md, Chapter 1
    source_class: literature
    date: 2026-09-06
    review_date: 2029-09-06

  ei.sharpe_standard_error:
    value: "SE(Sharpe) ~ sqrt((1 + S^2/2) / T) for T years"
    detail:
      one_year_at_S_1: "SE ~1.2 -- the estimate is smaller than its own error bar"
      five_years_at_S_1: "SE ~0.55 -- distinguishable from zero"
      ten_years_at_S_1: "interval roughly 0.6 to 1.4"
      the_reading: >-
        for anything under five years the error bar is roughly the size of the
        number, and the promotion gates at 150 decisions are permission to believe
        the SIGN, not the size
    source: docs/whitepapers/evidence-inference-whitepaper.md, Chapter 2
    source_class: literature
    date: 2026-09-06
    review_date: 2029-09-06

  ei.effective_sample_size:
    value: "200 clustered decisions a year have an effective n nearer 60"
    detail:
      basis: >-
        decisions sharing a mechanism group and a window count once; a book making
        200 decisions a year in clusters of three or four on shared themes
      consequence: >-
        the honest interval on a year's expectancy is nearer +/-0.13R than the
        +/-0.07R of the independent case
      the_reading: >-
        the heat rule -- correlated positions count once at their common factor --
        is a risk rule and a statistics rule at the same time
    source: docs/whitepapers/evidence-inference-whitepaper.md, Chapter 3
    source_class: literature
    date: 2026-09-06
    review_date: 2029-09-06
