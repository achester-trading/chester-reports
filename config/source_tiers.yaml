# -----------------------------------------------------------------------------
# FEDERAL RESERVE PRESS RELEASES, BY KIND
# -----------------------------------------------------------------------------
# fed_press carries everything the Board publishes, and most of it is not market
# news: on 26 September the only release since the close was an approval of a
# bank holding company's application, and the morning prose spent a sentence on
# it. Classified by declared title patterns, FIRST MATCH WINS in this order.
# APPLICATIONS ARE A COUNT ONLY: never listed, never citable, never evidence.
# A title that matches nothing is `other` and is listed, so a new kind is seen.
fed_press_classes:
  - class: applications
    patterns: ['(?i)\bapproval of (?:the )?application', '(?i)\bapplications? (?:by|from)\b']
    listed: false
  - class: monetary_policy
    patterns: ['(?i)\bFOMC\b', '(?i)Federal Open Market Committee', '(?i)\bdiscount rate',
               '(?i)\bmonetary policy', '(?i)\beconomic projections', '(?i)\bBeige Book']
    listed: true
  - class: speeches
    patterns: ['(?i)\bspeech\b', '(?i)\btestimony\b', '(?i)\bremarks\b', '(?i)\bto testify\b']
    listed: true
  - class: supervision
    patterns: ['(?i)\benforcement actions?\b', '(?i)\bsupervis', '(?i)\bregulat',
               '(?i)\bstress test', '(?i)\bcapital\b', '(?i)\bguidance\b',
               '(?i)\bexam(?:ination)? cycle', '(?i)^Agencies\b', '(?i)\bproposals?\b',
               '(?i)\bframework\b']
    listed: true
fed_press_sources: [fed_press, fed_monetary]
