# source_tiers.yaml -- which outlets a story's attention may count, and what
# kind of thing a Federal Reserve press release is. (Weekly edition 1, item 5)
#
# -----------------------------------------------------------------------------
# WHY A HEADLINE IS NOT A HEADLINE
# -----------------------------------------------------------------------------
# A story's ATTENTION is a count of headlines under its declared query, and the
# register's states move on that count. The feed is a free aggregator, so the
# count was whatever it returned: on 27 September the yen carry's newest item was
# from finance.biggo.com and the midterm cycle's from a syndicated listicle. A
# content farm that republishes a wire story three times is three units of
# "attention" and zero new information. So outlets are tiered, and ATTENTION AND
# EVIDENCE COUNT TIERS 1 AND 2 ONLY. Tier 3 is stored and shown -- a reader may
# want to see what the aggregator surfaced -- and never counted.
#
#   tier 1   wires and major outlets: original reporting, an editor, a masthead
#   tier 2   regional, trade and research: real sources with a narrower beat
#            (national papers outside the US, sell- and buy-side research,
#            think tanks and official bodies)
#   tier 3   aggregators, platforms and content farms: republishing, SEO copy,
#            marketing, exchange and broker blogs
#
# AN OUTLET NOT LISTED IS UNCLASSIFIED AND IS NOT COUNTED. Defaulting unknowns to
# tier 2 would let a new content farm move a story's state the day it first
# appears; defaulting them to tier 3 silently would hide that the list is
# incomplete. So they are counted like tier 3 and LISTED as unclassified in the
# reports, which is the prompt to add them here.
#
# The outlet is the text after the last " - " in the stored title, which is how
# Google News attributes an item. Matching is case-insensitive and exact against
# the names and aliases below. The mapping is hashed into each narrative
# evaluation's rules_version, so a reclassification is a declared rule change and
# the replay gate does not compare across it.
version: source-tiers-v1
updated: 2026-09-27

unclassified_counts_as: 3
counted_tiers: [1, 2]

