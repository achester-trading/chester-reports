# setups.yaml -- the setup catalogue a Decision Packet names (EL-1, §3.1 and
# §3.6 of docs/change-order-enterprise-layer-2026-09-27.md).
#
# ONE ENTRY PER CANONICAL SETUP FAMILY THE OPERATING DOCTRINE NAMES PER BOOK
# (docs/whitepapers/operating-doctrine-whitepaper.md, Part IV), the setups the
# Weekly's tells already name, and `unclassified`. `setup_id` is the Edge
# Ledger's key: expectancy is measured per setup, so a family written here is a
# family whose record can be read back. A packet naming a setup_id that is not
# here is REFUSED at write time and the refusal logged (register/store.py).
#
# `unclassified` is ALLOWED and COUNTED -- the Weekly prints how many packets used
# it. A high count means this list is missing a family the operator actually
# trades, and the fix is an entry here, not a vaguer label on the packet.
#
# EACH SETUP IS AN EXPERIMENT (§3.6), with, before its first trade:
#   mechanism     one paragraph: why the edge should exist
#   base_rate     the unconditional base rate of the setup, CITED BY ID where one
#                 is stored ('baserate.<table>' or 'claim:<id>', the register's
#                 base_rate_cited rule), else "not yet"
#   claimed_edge  the conditional edge claimed over that base rate
#   target_n      the graded paper trades before the kill criterion is read
#   kill          `fixed` -- the order's kill criterion, below, word for word
#   status        `stub` until the operator completes the entry (Doctrine #2,
#                 7-8 Nov 2026), then `complete`
#
# Adding a family: a new entry with its book and the passage it comes from.
# Removing one: never -- packets that cite it would stop resolving. Retire it with
# `retired: true` and a date instead (the kill criterion retires; nothing deletes).

# THE KILL CRITERION, FIXED BY THE ORDER (§3.6) AND THE SAME FOR EVERY SETUP:
kill_criterion: >-
  Retired when, after N >= 40 graded paper trades, expectancy after modeled
  costs is <= 0 or its Brier is worse than the unconditional base rate's; never
  resized before N.
min_target_n: 40

setups:
  # --- Book A -- Allocation (Doctrine 4.1) ------------------------------------
  a_stance_rebalance:
    book: A
    name: Monthly stance rebalance
    doctrine: "4.1 -- rebalance to the stance within the Macro dial's band at the monthly session"
    mechanism: "STUB -- the operator writes the mechanism at Doctrine #2. The Doctrine's passage is the starting point: rebalancing to the stance inside the Macro dial's band harvests the dial's read at a monthly cadence rather than trading its noise."
    base_rate: not yet
    claimed_edge: not yet
    target_n: 40
    kill: fixed
    status: stub
  a_tb_override:
    book: A
    name: Top & Bottom override
    doctrine: "4.1 -- the stance moves to the override band when the T&B report fires"
    mechanism: "STUB -- the operator writes the mechanism at Doctrine #2. The Doctrine's passage: when the Top & Bottom report fires, the stance moves to the override band, on the claim that extremes the report names are rarer and more informative than the dial's monthly read."
    base_rate: not yet
    claimed_edge: not yet
    target_n: 40
    kill: fixed
    status: stub

