  # The Weekly's tells (EL-1 brief, 12 Oct 2026): seeded from the signal-triage
  # register's own rulings, as stubs.
  b_style_regime_pair:
    book: B
    name: Style-regime pair -- value against growth after a growth extreme breaks
    doctrine: "SR-1 (signal-triage register) -- Book B pair trade; the Monthly style-regime panel"
    mechanism: "STUB, drafted from SR-1 for the operator to complete. When the log Growth/Value total-return ratio stretches more than two standard deviations above its ten-year trend, leadership is crowded into one style; a break -- the ratio below its 40-week average, or more than 8% off its 52-week high -- marks the crowd unwinding, and the pair (long IVE / short IVW, or IWD / IWF) is positioned for the rotation, with a hard stop on a new ratio high."
    base_rate: not yet           # SR-1's ledger is stored (docs/ledgers/sr-1-ledger-2026-10-18.md, PASS, n 6); the stub's base rate is completed at Doctrine #2
    claimed_edge: "SR-1's rule to test: positive expectancy after costs at 6 and 12 months across at least six non-overlapping episodes; gate pending (ST-8), so unclaimed until it passes"
    target_n: 40
    kill: fixed
    status: stub
  b_consumer_rs_tell:
    book: B
    name: Consumer relative-strength tell
    doctrine: "SR-5 (signal-triage register) -- weekly Book B tell (XLY/XLP; equal-weight discretionary against SPY; homebuilders)"
    mechanism: "STUB, drafted from SR-5 for the operator to complete. Consumer-dependent relative strength -- discretionary over staples (XLY/XLP, the held calc.cyclical_over_defensive where its definition matches), equal-weight discretionary against SPY, homebuilders -- reads what the tape pays for consumer growth before the credit data confirms it; the tell is a narrow flag on that relative strength turning."
    base_rate: not yet
    claimed_edge: "not yet -- SR-5 adopts the tell with narrow-flag rights; no conditional edge is claimed before its gate"
    target_n: 40
    kill: fixed
    status: stub

  # --- Book C -- Tactical (Doctrine 4.3) --------------------------------------
  # The dealer-regime setups the Weekly's dealer scorecard grades by session.
  c_pin_fade:
    book: C
    name: Fade toward a gamma-implied pin
    doctrine: "4.3 -- a fade toward a gamma-implied pin in a Positive-gamma regime"
    mechanism: "STUB, drafted from the Dealer's Hand for the operator to complete. In a positive-gamma regime dealers are long gamma: they sell rallies and buy dips to stay hedged, which suppresses moves in both directions and pulls price toward the strike with the largest total gamma; a move away from that strike is faded toward it, sized for the range."
    base_rate: not yet
    claimed_edge: "not yet -- the dealer scorecard's per-session hit rate is the evidence it will be read against"
    target_n: 40
    kill: fixed
    status: stub
  c_negative_gamma_continuation:
    book: C
    name: Continuation through a level, Negative gamma
    doctrine: "4.3 -- a continuation through a level in a Negative-gamma regime after confirmation"
    mechanism: "STUB, drafted from the Dealer's Hand for the operator to complete. Below the gamma flip dealers are short gamma: their hedging sells into declines and buys into rallies, amplifying a move through a level rather than absorbing it; after confirmation the continuation is followed rather than faded."
    base_rate: not yet
    claimed_edge: "not yet -- the dealer scorecard's per-session hit rate is the evidence it will be read against"
