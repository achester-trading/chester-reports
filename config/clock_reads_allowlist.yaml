# THE CLOCK-READS ALLOWLIST (A116, 2 Nov 2026), read by tools/validate_clock_reads.py.
#
# The direct clock reads the code under test still makes, to be burned down one
# paste per group (A119 takes the first: the modules no merge-week branch
# touches). Seeded from B106's inventory (docs/briefs/b106-notes.md on
# b101-date-drift-gates, 1 Nov 2026), checked against this gate's first scan of
# main at 422ea697: 41 of B106's 42 files, 57 reads, every line where B106 put
# it. A124 (3 Nov 2026) widened the scan to the whole tree less its named
# exclusions (tools/, tests/, docs/, smoke_test.py, the harness's directories):
# the 42nd, register/heat.py, is now scanned and carried here like the rest.
#
# An entry is matched by its calls and their counts, never its lines (lines
# drift); `lines_b106` is kept for reference. `burn_down` is what routing it
# through altdata.session would take. A read beyond its count fails the gate; an
# entry with no read left is reported "burned down, remove from the allowlist".
# date.today() is the MACHINE's date (UTC on the box) where session's dates are
# ET, so each date.today() conversion states whether the ET date is meant.
