# THE GAPS -- the quarterly scan's standing search list (change order of 10 Oct
# 2026, section 8, part 2: "the papers' Gaps sections are the standing search
# list"; section 4.1 item 9: "what the system does not yet measure (the paper's
# Gaps, standing)"). Read by the scan's prompt, docs/scans/PROMPT-alt-assets-
# quarterly.md, every quarter.
#
# HOW IT WAS COMPILED (12 Oct 2026). The structural papers carry no section headed
# "Gaps": the Disruptive Themes paper's 7.6 "The Gaps Register" is the library's
# only formal one. Each family paper states its gaps in place -- "What is
# uncertain", "Nobody's model contained ...", "is unknown" -- and the change
# order names more. Every entry below is one such statement, `passage` copied
# VERBATIM from its source (Markdown emphasis aside), so a gate can find it
# (tools/validate_alt_asset_scan.py). Cited by the paper's name and section, never
# by numeral (Library conventions, D1).
#
#   id        stable; a candidate series in the scan's part 3 names it
#   family    the Quarterly chapter it serves
#   gap       what the system does not measure, in one line
#   source    the file the passage is in; `section` the heading it sits under
#   passage   the source's own words
#   search    what the scan looks for each quarter
#
# An entry leaves the list when a stored series or a sourced figure closes it --
# by a commit that says which, never by the scan.
version: "1.0"
