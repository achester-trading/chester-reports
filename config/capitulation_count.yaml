# THE CAPITULATION COUNT AND ITS FEEDS (signal-triage Batch 17, item 97;
# docs/change-order-signal-triage-batch-17-2026-10-26.md, entry 97 and Appendix A;
# B79, b79-capitulation-count, 26 Oct 2026, session B). Read by
# altdata/capitulation_count.py; held by tools/validate_capitulation_feeds.py
# (the feeds) and tools/validate_capitulation_count.py (the count and 97(c)).
#
# A five-family bottom checklist on a fast clock (is selling exhausted? days),
# printed BESIDE the Top & Bottom verdict (is the regime turning? months) and never
# inside it: the order's Appendix A table 3, "the pair is the read". Report rights.
# Nothing here enters the T&B composite, the market-state object, a dial or a band;
# the binary "4 or more" enters the T&B intake queue only after the calibration
# ledger (docs/ledgers/capitulation-count-2026-10-26.md).

version: capitulation-count-1
updated: 2026-10-26

# ---------------------------------------------------------------- 97(b) the feeds
feeds:
  put_call:
    module: altdata/sources/cboe_putcall.py
    keys: [cboe.pc_equity, cboe.pc_index, cboe.pc_total]
    state: "built, switched off: its terms fail the 16 Oct 2026 rule (D40, 27 Oct 2026); family 2 a listed gap"
  vol_indices:
    fred: {VXNCLS: fred.vxn, VXVCLS: fred.vix3m}
    # 97(b)(ii): the VIX/VIX3M ratio is NOT a new stored series. The existing
    # calc.vix3m_over_vix (altdata/market_features.py, stored every session by the
    # features pass) is read inverted; FRED's pair (fred.vix, fred.vix3m) is read
    # first where both are stored for the day, the keyless and non-Yahoo route.
    ratio_from: [fred.vix3m, fred.vix]
    ratio_fallback: calc.vix3m_over_vix
  # 97(b)(iii): fund flows. A reader is built only where robots.txt AND the terms
  # permit it (the 16 Oct 2026 rule); each verdict below was read on 26 Oct 2026.
  # None permits, so every leg is a listed gap and family 5 is unscorable (J4).
  flows:
    - fund: SPY
      issuer: State Street Investment Management (ssga.com)
      robots: "no rule against the product pages (read 26 Oct 2026)"
      terms: "ssga.com's pages: 'The whole or any part of this work may not be reproduced, copied or transmitted ... without SSGA's express written consent' (read 26 Oct 2026)"
      state: gap
    - fund: QQQ
      issuer: Invesco (invesco.com)
      robots: "disallows query parameters such as asOfDate, startDate and endDate, not product pages (read 26 Oct 2026)"
      terms: "not located at a stable URL on 26 Oct 2026 (the legal page answered 404); permission not established"
      state: gap
    - fund: IWM
      issuer: iShares (ishares.com)
      robots: "disallows search, sign-on and .dl paths, not product pages (read 26 Oct 2026)"
      terms: "not located at a stable URL on 26 Oct 2026 (terms page answered 404); permission not established. altdata/sources/ishares_trusts.py's registry entry records no terms reading"
      state: gap
    - fund: SMH
      issuer: VanEck (vaneck.com)
      robots: "Crawl-delay 25; no rule against SMH's pages (read 26 Oct 2026)"
      terms: "not located at a stable URL on 26 Oct 2026 (terms page answered 404); permission not established"
      state: gap
    - fund: ICI weekly combined estimated flows
      issuer: Investment Company Institute
      robots: "not read: a listed gap by J4"
      terms: "ICI refuses an identified client (altdata/sources/ici_mmf.py, parked)"
      state: gap

# ---------------------------------------------------------------- 97(a) the count
# One point per SCORABLE family, exactly the order's five tests. No decimals, no
# weights, no blending. A family whose inputs are missing or older than
# `max_age_days` at the cutoff is a gap: it scores nothing and reduces the
# scorable count, which prints beside the count ("k of n scorable", J4).
count:
  max_age_days: 10          # session-set: two trading weeks for a daily input
  families:
    - id: vix
      name: "VIX"
      test: "VIX above 30, or VIX/VIX3M above 1"
      vix_above: 30
      ratio_above: 1.0
      keys: [fred.vix, fred.vix3m, calc.vix3m_over_vix]
    - id: put_call
      name: "equity put/call"
      test: "the equity put/call ratio's 20-session mean at or above 0.8"
      key: cboe.pc_equity
      sessions: 20
      at_least: 0.8
    - id: gamma
      name: "dealer gamma"
      test: "net GEX flipped negative to positive, with spot above the flip"
      instrument: SPY
      keys: [exposure.net_gex, exposure.net_to_gross, exposure.gamma_flip, exposure.spot]
      # the gate's own rule (6b): a sign is read only at net-to-gross of 0.10 or more
      min_net_to_gross: 0.10
      # "flipped": a negative capture within this many sessions before today's
      # positive one (session-set)
      lookback_sessions: 5
    - id: short_interest
      name: "short interest"
      test: "short interest in the top quintile of its own history while price holds above the drawdown low, with RSP/SPY above its value at the low"
      key: finra.short_interest
      instrument: SPY
      top_percentile: 80
      min_prints: 24        # session-set: a year of semi-monthly prints
      price_key: yfinance.mkt_gspc
      breadth_key: calc.breadth_rsp_over_spy
      high_sessions: 252    # the 52-week high
      hold_sessions: 3      # session-set: the low is at least 3 sessions old
    - id: flows
      name: "flows and AAII"
      test: "equity ETF flows turned to two consecutive weeks of inflow, and AAII bearish peaked above 50% and falling"
      # Every flows leg is a listed gap (feeds.flows), and the AAII writer stores
      # only aaii.bull_bear_spread, not the bearish share: family 5 is unscorable
      # (J4) until both exist.
      flow_keys: []
      aaii_bearish_key: null
      inflow_weeks: 2
      bearish_peak_above: 50
  labels:                   # the order's bands, read against the count itself
    - {at_least: 4, label: surrender}
    - {at_least: 2, label: oversold}
    - {at_least: 0, label: none}
  print:
    close_on_change: true
    close_at_least: 2       # the oversold band
    weekly_below_high_pct: 5
    index_key: yfinance.mkt_gspc

# The pair is the read (Appendix A, table 3). The T&B verdict is not built (no
# writer stores top_bottom.verdict), so the caption prints that.
table_3:
  - {verdict: OVEREXTENDED, band: surrender, read: "Oversold inside an expensive market: Book C bounce, not a Book A add"}
  - {verdict: BOTTOM SIGNAL, band: surrender, read: "The historical rhyme (2009, 2020)"}
  - {verdict: BOTTOM SIGNAL, band: none, read: "2022-type: the macro second derivative turned; the checklist cannot confirm it and should not be asked to"}
  - {verdict: NEUTRAL, band: surrender, read: "Mechanical correction (1998, 2018, 2024): fast, fully retraced, Book C only"}

# ---------------------------------------------------------------- 97(c) the sector line
divergence:
  vxn_key: fred.vxn
  vix_key: fred.vix
  pct_sessions: 252
  spread_pct_above: 90
  sector_key: yfinance.mkt_smh      # J5: SMH, not SOXX (D33: no new yfinance symbol)
  index_key: yfinance.mkt_gspc
  high_sessions: 252
  drawdown_multiple: 2

# ---------------------------------------------------------------- the calibration ledger
# Pre-registered in docs/ledgers/capitulation-count-2026-10-26.md (held by its
# SHA-256 in tools/validate_capitulation_count.py), committed alone before its
# first run. The episodes are Tops and Bottoms' bears' lows and near-miss lows as
# A77's config/tb_episodes.yaml carries them (origin/a77-6i-tranches-1-2-5, read
# 26 Oct 2026, not merged), deduplicated; 1994's and 2011's are session-set there.
ledger:
  spx_key: yfinance.mkt_gspc
  ndx_proxy_key: yfinance.mkt_qqq    # QQQ, a labelled proxy for the Nasdaq-100 (from March 1999)
  # The date each family's series begins to exist; before it the reading is "not
  # existent", never back-filled. null: not fixed here, so every episode reads
  # "not existent" for that family until a later edition states a date.
  exists_from:
    vix: "1990-01-02"               # FRED VIXCLS; VIX3M (VXVCLS) from 2007-12-04 is the ratio's optional leg
    put_call: "2019-10-23"          # the first Cboe daily file verified on 26 Oct 2026 (earlier dates answered 403)
    gamma: null                     # SPY's stored captures began in October 2026
    short_interest: null            # FINRA's history in the store is not fixed here
    flows: null                     # a listed gap (J4)
  episodes:
    - {id: bear_1973, kind: bear low, low: "1974-10-03"}
    - {id: bear_1980, kind: bear low, low: "1982-08-12"}
    - {id: bear_1987, kind: bear low, low: "1987-12-04"}
    - {id: bear_1990, kind: bear low, low: "1990-10-11"}
    - {id: near_1994, kind: near-miss low, low: "1994-04-04"}
    - {id: near_1998, kind: near-miss low, low: "1998-10-08"}
    - {id: bear_2000, kind: bear low, low: "2002-10-09"}
    - {id: bear_2007, kind: bear low, low: "2009-03-09"}
    - {id: near_2011, kind: near-miss low, low: "2011-10-03"}
    - {id: near_2015, kind: near-miss low, low: "2016-02-11"}
    - {id: near_2018, kind: near-miss low, low: "2018-12-24"}
    - {id: bear_2020, kind: bear low, low: "2020-03-23"}
    - {id: bear_2022, kind: bear low, low: "2022-10-12"}
    - {id: near_2024, kind: near-miss low, low: "2024-08-05"}
  rule:
    min_scorable: 4
    min_episodes: 5
    min_firings: 3
    held_share: 0.6
    positive_share: 0.67
