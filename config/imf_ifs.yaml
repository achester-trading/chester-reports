  - {iso3: POL, name: "Poland",         tonnes_oct26: 673}
  - {iso3: NLD, name: "Netherlands",    tonnes_oct26: 612}
  - {iso3: UZB, name: "Uzbekistan",     tonnes_oct26: 431}
  - {iso3: TWN, name: "Taiwan Province of China", tonnes_oct26: 424}
  - {iso3: PRT, name: "Portugal",       tonnes_oct26: 383}
  - {iso3: KAZ, name: "Kazakhstan",     tonnes_oct26: 377}
