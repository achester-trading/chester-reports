# THE DIGITAL-ASSET CALENDAR -- hand-seeded (Batch 8, item 49c and item 51's
# section 8; docs/change-order-signal-triage-batch-8-2026-10-17.md, filed on
# docs-batch-8; 6e-digital, 17 Oct 2026, session B).
#
# Read twice: by the Weekly's Ahead as one of its hand calendars
# (config/weekly_ahead.yaml `hand_calendars`, class crypto_index_event: an entry
# prints in the week it falls in), and by the Digital Assets addendum's section
# 8, which prints every entry inside its own look-ahead window
# (config/digital_addendum.yaml `ahead.window_days`).
#
# One entry per event, each with its source. `marker` prints after the event in
# brackets and says what is not yet confirmed -- "to verify on MSCI's calendar"
# until MSCI's own calendar has been read (Batch 8 section 7, verify item 2).
# Remove the marker, and correct the date if it moved, once it is verified.
#
#   - date:   YYYY-MM-DD
#     body:   "MSCI"                  # who
#     event:  "..."                   # what, in the source's words
#     time:   "after the US close"    # optional; "time not stated" otherwise
#     marker: "to verify ..."         # optional
#     kind:   index | company | regulation | expiry
#     source: "https://..." or the order that dated it
#
# `watch_undated`: the broad-exclusion watch's providers whose next review date
# is not published where a keyless client may read it. Each prints as "date not
# published" with its reason, never a guessed date (Batch 8 item 49.4).
#
# Seeded 17 Oct 2026 by session B; edited by hand from here on.
