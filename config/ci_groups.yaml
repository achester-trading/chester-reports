# The CI job groups (B122, 2 Nov 2026; B107's "later" item).
#
# The Gates workflow ran one job per code gate: about 165 jobs, each paying a
# runner start, a checkout, the interpreter and (before B111's cache) a 20-second
# install, for gates whose median run is 3 seconds (B107). This file groups them.
#
# - `alone`: each gate runs in its own job, as before. These are B107's ten
#   slowest, plus the two whose job carries something of its own:
#   validate_session_calendar.sh (its 20-minute allowance) and validate_names.py
#   (the repository secret its job alone reads, B109; listed before it reaches
#   main, so the grouping is right the day it lands).
# - `groups`: the rest, one job per group, its gates run one at a time and each
#   reported by name (tools/ci_groups.py `run`). A gate is placed by the FIRST
#   group whose patterns match its file name (fnmatch, on the name without
#   `tools/`), and a gate no pattern matches goes to `default`. A new gate
#   therefore needs no edit here unless it should run alone.
# - `docs_set`: the docs-only push's three gates (B111, ruling (c)), run as one
#   job named `docs`.
#
# tools/validate_gates.py group E holds that every code gate lands in exactly
# one job. Nothing here changes what a gate checks or whether it runs.
version: ci-groups-1

alone:
  - tools/validate_stack.py
  - tools/validate_monthly_stack.py
  - tools/validate_prediction_markets.py
  - tools/validate_readability.py
  - tools/validate_quarterly_stack.py
  - tools/validate_weekly_stack.py
  - tools/validate_alpha.py
  - tools/validate_weekly_complete.py
  - tools/validate_alpha_lab_3.py
  - tools/validate_quarterly_gates.py
  - tools/validate_session_calendar.sh
  - tools/validate_names.py

docs_set:
  - tools/check_library.py
  - tools/check_registry.py
  - tools/check_master_guide.py

groups:
  - name: library-and-guide
    match: ["check_*.py", "validate_library_*", "validate_b51_registry_html.py", "validate_numeral_audit.py", "validate_figure_budget.py", "validate_horizon_charts.py"]
  - name: box-and-deploy
    match: ["validate_deploy.py", "validate_secrets.py", "validate_systemd_units.py", "validate_backup*.py", "validate_audit_*.py", "validate_*.sh", "validate_gates.py", "validate_config_refs.py", "validate_feeds_scheduled.py", "validate_feed_repair.py", "validate_a55_box_fixes.py", "validate_by_hand_audit.py", "validate_system_metrics.py", "validate_stitch_tools.py", "smoke_test.py"]
  - name: weekly
    match: ["validate_weekly*.py", "validate_edition_consistency.py", "validate_no_filler.py", "validate_stack_cadence.py"]
  - name: reports
    match: ["validate_monthly*.py", "validate_quarterly*.py", "validate_daily_close.py", "validate_morning_anchor.py", "validate_secondary_notes.py", "validate_digital_addendum.py", "validate_voices.py", "validate_narratives.py", "validate_alt_asset_scan.py", "validate_thesis_register.py", "validate_a43_render.py", "validate_st_t5_*.py", "validate_stack_hooks.py", "validate_themes_panels.py"]
  - name: register-and-books
    match: ["validate_register.py", "validate_packets.py", "validate_ibkr_*.py", "validate_grader.py", "validate_exec*.py", "validate_enforce.py", "validate_rollup.py", "validate_benchmark.py", "validate_claims.py", "validate_b48_scoreboard.py", "validate_book_b_scanner.py", "validate_meme_ingest.py", "validate_security_master.py", "validate_attribution.py", "validate_crypto_basket.py", "validate_alpha*.py", "validate_b45_chain3.py", "validate_dth1.py", "validate_paper_exec.py", "validate_premium_sleeve.py", "validate_decision_quality.py", "validate_postmortems.py", "validate_value_of_information.py", "validate_ll6.py"]
  - name: dealer-and-tape
    match: ["validate_dealer*.py", "validate_exposure_*.py", "validate_vol_event.py", "validate_a50_dealer_store.py", "validate_opening_setup.py", "validate_a47_chain3.py", "validate_a48_batch11.py", "validate_volume_profile.py", "validate_es_block.py", "validate_batch13.py", "validate_structure_compare.py", "validate_move_screen.py", "validate_prices.py", "validate_derived.py"]
  - name: rates-and-releases
    match: ["validate_regime.py", "validate_base_rates.py", "validate_events.py", "validate_releases*.py", "validate_lenses.py", "validate_6e_rest.py", "validate_st_r*.py", "validate_st_t1_rest.py", "validate_st_t2_rates.py", "validate_st_t3_calib.py", "validate_rates_anchors.py", "validate_fred_history.py", "validate_batch*.py", "validate_6f_*.py", "validate_gtm.py", "validate_correlation_layer.py", "validate_trend_breadth.py", "validate_tb_harness*.py"]
  - name: sources-and-quality
    match: ["validate_official_sources.py", "validate_em_scorecard.py", "validate_imf_ifs.py", "validate_crypto_sources.py", "validate_outliers.py", "validate_quality.py", "validate_ledgers_b6.py", "validate_aq3_series.py", "validate_basis_proxy.py", "validate_ai_fcf.py", "validate_sr38_inbox.py", "validate_edgar_*.py", "validate_gold_*.py", "validate_gld_*.py", "validate_price_sources.py", "validate_error_corpus.py"]

default: other
