      - {key: fred.ig_oas,       label: "IG OAS (ICE BofA, BAMLC0A0CM)"}
      - {key: fred.ccc_oas,      label: "CCC OAS (ICE BofA, BAMLH0A3HYC)"}
      - {key: yfinance.mkt_hyg,  label: "High yield (HYG)"}
      - {key: yfinance.mkt_lqd,  label: "Investment grade (LQD)"}
    structure:
      - {hook_key: fred.sloos_ci_large, branch: aq-3-series-2, label: "SLOOS: C&I net tightening, large and medium firms (DRTSCILM)"}
      - {hook_key: fred.sloos_ci_small, branch: aq-3-series-2, label: "SLOOS: C&I net tightening, small firms (DRTSCIS)"}
      - {hook_key: fred.sloos_cre_nonres, branch: aq-3-series-2, label: "SLOOS: CRE net tightening, nonfarm nonresidential (SUBLPDRCSN)"}
      - {diff: [fred.ccc_oas, fred.bb_oas], label: "BB-CCC: the CCC OAS less the BB OAS"}
      - {label: "The dual-track default rate and the LME count", absent: "PitchBook LCD is paid; not stored"}
      - {label: "The loan distress ratio", absent: "PitchBook LCD is paid; not stored"}
      - {label: "Private-credit non-accruals and PIK share", absent: "BDC filings and the Boston Fed series are not stored (AQ-3)"}
      - {label: "The listed-BDC discount to NAV", absent: "not stored (AQ-3)"}
      - {label: "Cross-sectional mark dispersion", absent: "filings analysis; not stored"}
      - {label: "HY spread acceleration", absent: "the Top & Bottom overlay is not on this build"}
      - {label: "Credit-equity divergence", absent: "not computed here; the HY OAS and SPY rows are printed beside each other"}
      - {key: fred.hy_oas,       label: "HY OAS"}
      - {key: fred.ig_oas,       label: "IG OAS"}
      - {key: fred.bb_oas,       label: "BB OAS"}
      - {key: fred.ccc_oas,      label: "CCC OAS"}
      - {key: yfinance.mkt_spy,  label: "SPY (the equity leg)"}
      - {key: fred.nfci,         label: "The Chicago Fed NFCI"}
      - {key: fred.cc_delinq_30, label: "Card delinquency, 30 days"}
      - {key: fred.auto_delinq,  label: "Auto delinquency"}
    structure_charts:
      - {id: hy_spy, title: "HY OAS against SPY (the credit-equity divergence)", kind: twin,
         series: [{key: fred.hy_oas, label: "HY OAS, %"},
                  {key: yfinance.mkt_spy, label: "SPY"}]}
      - {id: bb_ccc, title: "BB and CCC OAS", kind: line,
         series: [{key: fred.ccc_oas, label: "CCC OAS, %"},
                  {key: fred.bb_oas, label: "BB OAS, %"}]}
    implied_range_symbols: [HYG]
    curve: {waits: "CDX and the spread curve are not stored"}
    analyses: []
    falsification:
      - id: lending_standards
        paper: "Credit"
        section: "Falsification Tests"
        statement: >-
          "The credit cycle is a lending-standards cycle" is falsified if a spread widening
          of more than 200 basis points occurs without SLOOS having tightened in the prior
          four quarters and without dispersion having widened first — an exogenous shock
          excepted.
        measurable:
          all:
            - {change_above: {series: fred.hy_oas, above: 200, label: "proxy until SLOOS"}}
            - {not_tightened: {hook_series: fred.sloos_ci_large, branch: aq-3-series-2, quarters: 4}}
            - {unmeasured: {reason: "dispersion is not stored (AQ-3)"}}
        session_set: "SLOOS is the lending-standards leg (operator's ruling, 11 Oct 2026): the C&I large-and-medium net tightening, tightened meaning a print above zero in the prior four quarters. The widening is the HY OAS change over the quarter, labelled a proxy until SLOOS is stored; with no widening of 200 bp the test holds whatever SLOOS did"
      - id: dispersion_signal
        paper: "Credit"
        section: "Falsification Tests"
        statement: >-
          "Dispersion is the signal" is falsified if the BB-CCC spread and the listed-BDC
          discount widen materially and no aggregate deterioration follows within four
          quarters — in which case the tail was contained and the aggregate was right.
        measurable: null
        not_measured: "the listed-BDC discount is not stored (AQ-3); BB-CCC is, in item 4"
      - id: credit_leads
        paper: "Credit"
        section: "Falsification Tests"
        statement: >-
          "Credit leads equities in endogenous downturns" is falsified by an endogenous
          equity drawdown of more than 15% that credit did not precede on any of the
          Section 9 signals.
        measurable:
          all:
            - {drawdown_at_least: {series: yfinance.mkt_spy, at_least: 15, lookback_days: 365}}
            - {unmeasured: {reason: "whether the drawdown was endogenous and whether credit preceded it on the Section 9 signals is a reading, not a stored series"}}
        session_set: "the drawdown is SPY's from its high over the last year to the quarter's end; with none of 15% the test holds"
      - id: default_suppressed
        paper: "Credit"
        section: "Falsification Tests"
        statement: >-
          "The headline default rate is structurally suppressed" is falsified if the LME
          count falls toward zero with the distress ratio also falling — meaning the
          rerouting has ended because the distress has.
        measurable: null
        not_measured: "the LME count and the distress ratio are PitchBook LCD's (paid); not stored"
      - id: marks_unanchored
        paper: "Credit"
        section: "Falsification Tests"
        statement: >-
          "Private-credit marks are not anchored" is falsified if cross-sectional dispersion
          falls to public-market levels without accompanying mark-downs — meaning managers
          have converged on a common value that the market accepts.
        measurable: null
        not_measured: "mark dispersion is a filings analysis; not stored"
      - id: vintage_cohort
        paper: "Credit"
        section: "Falsification Tests"
        statement: >-
          "The 2020–2021 vintage is the stress cohort" is falsified if it refinances
          through 2028 at spreads within 100 basis points of origination.
        measurable: null
        not_measured: "refinancing spreads by vintage are not stored"
      - id: split_90_10
        paper: "Credit"
        section: "Falsification Tests"
        statement: >-
          "The 90/10 split is real" is falsified if the 10% shrinks to 5% without realised
          losses — the distressed cohort recovering — or grows to 20%, in which case it was
          not a tail.
        measurable: null
        not_measured: "the distressed share is not stored"
    # Appendix D, verbatim. A light chapter does not print item 11 (section 4.1's
    # last paragraph); the questions are carried so the operator can move it.
    ten_questions:
      - {n: 1,  text: "Did the last two SLOOS readings show net C&I tightening?", series: []}
      - {n: 2,  text: "Is the BB-CCC spread widening while the HY index holds?", series: [fred.ccc_oas, fred.bb_oas, yfinance.mkt_hyg]}
      - {n: 3,  text: "Where is the dual-track default rate against the headline rate, and is the LME count rising?", series: []}
      - {n: 4,  text: "Is the loan distress ratio above 8% and rising?", series: []}
      - {n: 5,  text: "Are private-credit non-accruals and PIK rising across managers, or at one?", series: []}
      - {n: 6,  text: "Where do listed BDCs trade relative to NAV, and is the discount widening?", series: []}
      - {n: 7,  text: "Is cross-sectional mark dispersion rising, or falling with mark-downs?", series: []}
      - {n: 8,  text: "Has the HY-acceleration overlay fired, and was it accompanied by an equity decline or a divergence?", series: []}
      - {n: 9,  text: "Are maturing CRE loans being extended or foreclosed?", series: []}
      - {n: 10, text: "Which of the four twelve-month scenarios did this quarter's evidence support?", series: []}
    scenarios:
      - name: "Twelve months (Credit §37)"
        horizon: "12 months"
        source: "the Credit paper, §37; the credit-led-turn weight \"is higher than a spread of 269 implies\""
        rows:
          - {name: "Extended late cycle", prior: "~45%"}
          - {name: "Credit-led turn", prior: "~30%"}
          - {name: "Recession", prior: "~15%"}
          - {name: "Policy-truncated", prior: "~10%"}
      - name: "Private credit through a full cycle (Credit §38)"
        horizon: "10 years"
        source: "the Credit paper, §38"
        rows:
          - {name: "Orderly resolution", prior: "~40%"}
          - {name: "The disorderly episode", prior: "~35%"}
          - {name: "The regulatory settlement", prior: "~25%"}
    panels:
      - id: credit_tier1
        n: "4d"
        title: "The Tier 1 rule"
        kind: lines
        after: structure
        lines:
          - "The Credit paper's Tier 1 cycle-critical set: \"any two firing warrants a written cycle reassessment.\" Of its nine indicators, BB-CCC is stored (item 4); the firing count is not computed while seven are not."
          - "EM credit is the Credit paper's named gap and lives in the Emerging markets chapter."
    words:
      permitted: ["dispersion", "dual-track default rate", "lending standards", "extend-and-pretend"]
      banned: ["credit is fine", "the all-clear"]
    figure_budget: {quarter: 5, supply: 4, questions: 2, summary: 3}

