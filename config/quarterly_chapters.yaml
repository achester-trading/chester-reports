      - {key: fred.tips_10y,           label: "The 10-year real yield (DFII10)"}
      - {key: fred.dxy,                label: "The broad dollar (DTWEXBGS)"}
    structure:
      - {key: wgc.cb_gold_holdings_t,  label: "Official-sector gold holdings (WGC), tonnes"}
      - {key: wgc.cb_net_purchases_t,  label: "Official-sector net purchases (WGC), tonnes"}
      - {key: safe.gold_reserves_oz,   label: "China's reported gold reserves (SAFE), ounces"}
      - {key: fred.tips_10y,           label: "The 10-year real yield (DFII10)"}
      - {key: fred.dxy,                label: "The broad dollar (DTWEXBGS)"}
      - {key: cftc.noncomm_net, instrument: GOLD, label: "Gold futures, non-commercial net (CFTC legacy)"}
      - {hook_key: etf.gld_tonnes, branch: aq-3-series-1, label: "Gold ETF holdings: GLD, tonnes"}
      - {hook_key: etf.iau_tonnes, branch: aq-3-series-1, label: "Gold ETF holdings: IAU, tonnes"}
      - {hook_key: etf.slv_tonnes, branch: aq-3-series-1, label: "Silver ETF holdings: SLV, tonnes"}
      - {hook_key: cftc.dis_managed_money_net_oi, instrument: GOLD, branch: aq-3-series-1, label: "Gold futures, managed money net, % of open interest (CFTC disaggregated)"}
      - {hook_key: cftc.dis_managed_money_net_oi, instrument: SILVER, branch: aq-3-series-1, label: "Silver futures, managed money net, % of open interest (CFTC disaggregated)"}
      - {hook_key: cftc.dis_managed_money_net_oi, instrument: COPPER, branch: aq-3-series-1, label: "Copper futures, managed money net, % of open interest (CFTC disaggregated)"}
      - {label: "Copper TC/RCs", absent: "no free source stored (AQ-3)"}
      - {hook_key: shfe.stocks_t, instrument: COPPER, branch: aq-3-series-1, label: "SHFE copper stocks, tonnes (weekly)"}
      - {hook_key: shfe.warrants_t, instrument: COPPER, branch: aq-3-series-1, label: "SHFE copper on warrant, tonnes (weekly)"}
      - {label: "LME and COMEX copper inventories", absent: "no free source (AQ-3 part 1: CME prohibits scripted access; LME is licensed)"}
      - {label: "COMEX and LBMA silver inventories", absent: "exchange inventories are not stored (AQ-3)"}
      - {label: "Lease rates and EFP", absent: "no free source stored (AQ-3)"}
      - {label: "SGE and Yangshan premiums", absent: "no free source stored (AQ-3)"}
      - {label: "Chilean copper output (Cochilco)", absent: "not stored (AQ-3)"}
    structure_charts:
      - {id: real_yield, title: "Gold against the 10-year real yield (DFII10, inverted)", kind: twin,
         series: [{key: yfinance.mkt_gold_front, label: "Gold (GC=F)"},
                  {key: fred.tips_10y, label: "10-year real yield, % (inverted)", invert: true}]}
      - {id: official, title: "Official-sector gold holdings (WGC), tonnes", kind: line,
         series: [{key: wgc.cb_gold_holdings_t, label: "Official-sector holdings, tonnes"}]}
    implied_range_symbols: [GLD, SLV]
    curve: {waits: "the futures curve and the roll arrive with 6b"}
    analyses:
      - {id: gold_residual, title: "The gold residual", module: altdata.attribution, reader: gold_block,
         kill: "none ruled (section 5)"}
      - {id: two_bid, title: "The two-bid decomposition", module: altdata.paper_bid, reader: two_bid,
         kill_reader: oi_kill_state, kill_args: [GLD],
         kill: "drop call-put OI if its percentile shows no relationship to forward 20-day returns in either direction after twelve months"}
      - {id: effective_float, title: "Effective-float elasticity", waits: "not built (AQ-8)",
         kill: "only above a market-cap floor"}
      - {id: sovereign_gap, title: "The sovereign gold-share gap",
         waits: "the by-hand gold-share key is dropped (16 Oct 2026); a reader from the IMF's keyless IFS world aggregate is listed, not built",
         kill: "none ruled (section 5)"}
      - {id: copper_gold_10y, title: "Copper/gold against the 10-year", module: altdata.correlation,
         reader: corr_triple, key: corr.copper_gold__10y.60d, kill: "none ruled (section 5)"}
    falsification:
      - id: official_floor
        paper: "Metals"
        section: "Falsification Tests"
        statement: "\"Official-sector demand provides a gold floor\" is falsified by two consecutive quarters of net central bank selling, or by purchases decelerating below roughly 500 tonnes annualised while price declines."
        measurable:
          any:
            - {quarters_negative: {series: wgc.cb_gold_holdings_t, quarters: 2}}
            - all:
                - {pace_below: {series: wgc.cb_net_purchases_t, months: 3, annualise: 4, below: 500}}
                - {change_below: {series: yfinance.mkt_gold_front, below: 0}}
      - id: real_yield_broken
        paper: "Metals"
        section: "Falsification Tests"
        statement: "\"Gold's real-yield relationship is permanently broken\" is falsified by gold resuming a tight inverse correlation to TIPS yields, which would indicate the marginal buyer has reverted to rate-sensitive Western investors."
        measurable:
          correlation_at_most: {a: yfinance.mkt_gold_front, b: fred.tips_10y, window: 63,
                                at_most: -0.5, strained_at_most: -0.3}
        session_set: "\"tight\" read as a 63-session correlation of daily changes at or below -0.5 (strained at or below -0.3)"
      - id: silver_deficit
        paper: "Metals"
        section: "Falsification Tests"
        statement: "\"Silver's deficit will force a re-rating\" is falsified by another two years of deficits without inventory reaching genuine constraint, or by COMEX and LBMA stocks stabilising or rebuilding. Six years have already passed without the predicted squeeze; specify how many more you will accept before concluding the mechanism does not work."
        measurable: null
        not_measured: "COMEX and LBMA silver inventories are not stored (AQ-3)"
      - id: silver_industrial
        paper: "Metals"
        section: "Falsification Tests"
        statement: "\"Silver's industrial demand is structurally growing\" is falsified if ex-solar industrial demand fails to offset the solar decline, indicating 2026 was a peak rather than a transition."
        measurable: null
        not_measured: "the Silver Institute's balance arrives with the quarterly scan (AQ-7)"
      - id: copper_deficit
        paper: "Metals"
        section: "Falsification Tests"
        statement: "\"Copper faces a structural deficit\" is falsified by TC/RCs recovering toward historical levels, by concurrent inventory rebuilding across LME, COMEX, and SHFE, or by Goldman's surplus forecast proving correct."
        measurable: null
        not_measured: "TC/RCs and the three exchanges' inventories are not stored (AQ-3)"
      - id: electrification
        paper: "Metals"
        section: "Falsification Tests"
        statement: "\"Electrification demand is price-insensitive\" is falsified by evidence of aluminium substitution at scale in grid applications or by thrifting reducing copper intensity per EV."
        measurable: null
        not_measured: "the paper names evidence, not a series"
      - id: miners_leverage
        paper: "Metals"
        section: "Falsification Tests"
        statement: "\"Mining equities offer leverage to the metal\" is falsified by continued underperformance during a sustained high-price period, which would indicate the leverage is being destroyed by cost inflation and capital allocation."
        measurable: null
        not_measured: "the miners (GDX, SIL) are not in the price feed"
    ten_questions:
      - {n: 1,  text: "Are central banks still buying gold at 200+ tonnes per quarter?", series: [wgc.cb_net_purchases_t, wgc.cb_gold_holdings_t]}
      - {n: 2,  text: "Are Western gold ETF holdings accumulating or bleeding?", series: []}
      - {n: 3,  text: "Has gold's inverse relationship to real yields shown any sign of restoration?", series: [yfinance.mkt_gold_front, fred.tips_10y]}
      - {n: 4,  text: "Are COMEX and LBMA silver inventories still drawing down?", series: []}
      - {n: 5,  text: "Where is the gold-silver ratio in its multi-year range?", series: []}
      - {n: 6,  text: "Is ex-solar silver industrial demand growing enough to offset solar's decline?", series: []}
      - {n: 7,  text: "Have copper TC/RCs recovered from zero?", series: []}
      - {n: 8,  text: "Are LME, COMEX, and SHFE copper inventories falling together, or is metal simply relocating?", series: []}
      - {n: 9,  text: "Is Chilean production stabilising?", series: []}
      - {n: 10, text: "Which scenario in Part VII did this quarter's evidence support?", series: []}
    # THE SCENARIO SETS TO REWRITE (section 4.2; AQ-2 choice 12, added in AQ-3
    # part 1). The paper's per-metal ranges carry no weight -- they print as
    # ranges -- and its ten-year families carry the paper's priors.
    scenarios:
      - name: "Gold, the paper's ranges (Metals, Part VII)"
        horizon: "the paper's horizon"
        source: "the Metals paper's rough ranges; bull, base and bear carry no probability"
        rows:
          - {name: "Bull", prior: "range $5,500–7,000"}
          - {name: "Base", prior: "range $4,200–5,500"}
          - {name: "Bear", prior: "range $3,200–4,200"}
      - name: "Silver, the paper's ranges (Metals, Part VII)"
        horizon: "the paper's horizon"
        source: "the Metals paper's rough ranges; no probability"
        rows:
          - {name: "Bull", prior: "range $85–120"}
          - {name: "Base", prior: "range $55–75"}
          - {name: "Bear", prior: "range $35–55"}
      - name: "Copper, the paper's ranges (Metals, Part VII)"
        horizon: "the paper's horizon"
        source: "the Metals paper's rough ranges, per tonne; no probability"
        rows:
          - {name: "Bull", prior: "range $14,000–17,000/t"}
          - {name: "Base", prior: "range $11,000–13,500/t"}
          - {name: "Bear", prior: "range $8,500–11,000/t"}
      - name: "Gold, ten years"
