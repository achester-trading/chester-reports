# THE QUARTERLY'S CHAPTERS, ITEM BY ITEM (AQ-2 parts 1 and 2; change order of 10
# Oct 2026, sections 4.1-4.11, 5 and 10A). Part 1 filled metals, oil and energy,
# and currency; part 2 the other eight. config/reporting_stack.yaml holds the
# chapter list and the section 4.1 template (AQ-1); this file holds what each
# FILLED chapter reads for each item. A chapter not here, or `filled: false`,
# stays on the AQ-1 shell ("not yet built -- AQ-2").
#
# RULES THIS FILE KEEPS (the gate holds them, tools/validate_quarterly_stack.py):
#   - Every series is an existing registry key (metrics_registry.yaml). A series
#     the store lacks is listed with `absent: <reason>` and prints by name as
#     "not tracked"; none is invented or proxied.
#   - Falsification tests are the papers' OWN wording, from each paper's
#     "Falsification Tests" section, verbatim. `measurable` is given only where
#     the paper gives one and the store holds its series; otherwise null, with
#     `not_measured` naming the reason. The thresholds a measurable needs and
#     the paper does not state numerically (what "tight" means) are marked
#     `session_set` with the reading chosen.
#   - The ten questions are each paper's Appendix D, verbatim.
#   - `figure_budget`: the most figures each item's written read may cite --
#     T3.4's rule at the frame: the frame offers no more figures than this, the
#     rest by name only. T3.4 (t3-4-figure-budget) is not merged under this
#     branch, so the rule is applied here by the chapter's own frames.
#
#   - Every analysis (item 6) carries `kill`: the kill condition section 5
#     ruled for it, or "none ruled" where the ruling gave none. An analysis
#     without one fails AQ-10's kill-condition gate. Its kill STATE prints
#     beside its reading -- holds / strained / killed / not measured -- <reason>
#     -- from `kill_measurable` (a measurable, below; met = killed), or from
#     `kill_reader` (a function of the analysis's own module, with `kill_args`),
#     or else "not measured" with the reason (monthly_macro.quarterly_items.
#     kill_state).
#
# RULE KINDS for a measurable (evaluated by monthly_macro.quarterly_items):
#   quarters_negative  {series, quarters}: the level fell in each of the last N
#                      calendar quarters -> fails; the last quarter alone -> strained
#   pace_below         {series, months, annualise, below}: the sum of the last
#                      `months` monthly prints x annualise is below `below`
#   change_below       {series, below}: the level's change over the quarter is
#                      below `below` (in the series' own unit; a price in percent)
#   level_above        {series, above}: the latest level is above `above`
#   below_year_mean    {series, year}: the latest level is below that calendar
#                      year's mean
#   correlation_at_most {a, b, window, at_most, strained_at_most, transform}: the
#                      correlation of the two series' daily changes over `window`
#                      sessions is at or below `at_most` -> fails
#   all / any          a list of the above: `all` fails when every leg fails and is
#                      strained when some do; `any` fails when one fails
version: aq2-chapters-2
updated: 2026-10-11

common:
  # Item 9's structural-change line: its status is read from the tail watch's
  # re-specification log and the signal-intake register, never declared. Neither
  # is stored yet, so the line prints its default with that reason.
  structural_default: "none confirmed"
  structural_waits: "the tail watch's re-specification log and the signal-intake register are not stored yet"
  # The five-year percentile column waits for the metric lenses (6e).
  five_year_column: "until the lenses"
  # The options-implied range: the expiry nearest a quarter out with at least a
  # week to run; the at-the-money implied volatility (the call and put nearest
  # spot, averaged); the one-standard-deviation range spot x exp(+/- iv x
  # sqrt(days / 365)). Session-set (AQ-2).
  implied_range: {target_days: 91, min_days: 7}
  # The funds whose option chains the capture logs (AQ-8a). A chapter's fund
  # not in this list prints its range as not captured, by name.
  chains_captured: [GLD, SLV, USO]

families:

  # =========================================================================
  # METALS -- gold, silver, copper (paper VIII, docs/whitepapers/metals-whitepaper.md)
  # =========================================================================
  metals:
    filled: true
    paper: "Metals"
    paper_file: docs/whitepapers/metals-whitepaper.md
