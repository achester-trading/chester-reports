          - {name: "2: financial infrastructure layer", prior: "~35%"}
          - {name: "3: contained niche", prior: "~30%"}
          - {name: "4: structural impairment", prior: "~15%"}
    panels:
      - id: coin_pages
        kind: coins
        after: analyses
