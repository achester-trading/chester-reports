      - {id: pqc, title: "Post-quantum milestones against verified capability (S18)",
         waits: "milestones arrive through the scan (AQ-7)", kill: "the scenario's own re-specification rule"}
    falsification:
      - id: btc_store_of_value
        paper: "Digital Assets"
        section: "Falsification Tests"
        statement: >-
          "Bitcoin is a store of value" is falsified if rolling correlation to equities
          remains in the 0.4–0.7 range across another full cycle while the holder base
          broadens. The excuse that it is "still early" has a shelf life; specify yours
          in advance.
        measurable:
          correlation_in_band: {a: yfinance.mkt_btc_usd, b: yfinance.mkt_spy, window: 63,
                                low: 0.4, high: 0.7, b_change: log}
        session_set: "one quarter's 63-session correlation of daily log returns inside 0.4-0.7 reads strained; failing needs \"another full cycle\", which code does not declare, so code never fails it"
      - id: btc_scarcity
        paper: "Digital Assets"
        section: "Falsification Tests"
        statement: >-
          "Bitcoin scarcity is credible" is falsified by a quantum event redistributing
          dormant coins, or by a contentious fork over BIP-361 that splits the chain and
          the supply guarantee.
        measurable: null
        not_measured: "a quantum event or a contentious fork is an event, read through the scan (AQ-7)"
      - id: eth_value_capture
        paper: "Digital Assets"
        section: "Falsification Tests"
        statement: >-
          "Ethereum captures value from its ecosystem" is falsified if L2 activity and RWA
          issuance continue growing while base-layer fee capture stays negative and
          ETH/BTC continues declining. This test has been running against the thesis for
          two years.
        measurable: null
        not_measured: "ETH, ETH/BTC, L2 activity and base-layer fee capture are not stored (AQ-3)"
      - id: institutional_vol
        paper: "Digital Assets"
        section: "Falsification Tests"
        statement: >-
          "Institutional adoption reduces volatility" is falsified by another 70%-plus
          drawdown. Partially falsified already: 2026's ~50% decline was shallower but not
          transformative.
        measurable:
          drawdown_at_least: {series: yfinance.mkt_btc_usd, at_least: 70, strained_at_least: 50}
        session_set: "the drawdown is BTC's from its stored all-time high to the quarter's end; strained at 50% or more"
      - id: sol_pmf
        paper: "Digital Assets"
        section: "Falsification Tests"
        statement: >-
          "Solana has durable product-market fit" is falsified if application TVL fails to
          recover when speculative conditions improve — indicating the prior activity was
          purely cyclical.
        measurable:
          all:
            - {change_below: {series: llama.chain_tvl, instrument: Solana, below: 0}}
            - {change_above: {series: yfinance.mkt_btc_usd, above: 0, label: "speculative conditions improving"}}
        session_set: "\"fails to recover\" read as Solana's TVL (llama.chain_tvl, instrument Solana; USD, so price moves it too) lower over the quarter; \"when speculative conditions improve\" read as BTC higher over the quarter"
      - id: privacy_path
        paper: "Digital Assets"
        section: "Falsification Tests"
        statement: >-
          "Privacy assets have a regulatory path" is falsified by US reversal of the 2026
          administrative accommodations, or by EU-style listing bans spreading to major
          jurisdictions.
        measurable: null
        not_measured: "a regulatory event, read through the scan (AQ-7)"
      - id: stablecoin_infra
        paper: "Digital Assets"
        section: "Falsification Tests"
        statement: >-
          "Stablecoins are genuine infrastructure" is falsified by supply contracting during
          a period of price stability — which would indicate the growth was speculative
          positioning after all.
        measurable:
          all:
            - {quarters_negative: {series: llama.stable_total, quarters: 1}}
            - {unmeasured: {reason: "\"a period of price stability\" is given no threshold by the paper and none is set here"}}
        session_set: "\"supply contracting\" read as total stablecoin supply lower over the last quarter; while supply grows the test holds, and a contraction prints not measured until \"price stability\" has a reading"
    ten_questions:
      - {n: 1,  text: "Is stablecoin supply growing or contracting?", series: []}
      - {n: 2,  text: "Are ETF flows positive, and against what float?", series: []}
      - {n: 3,  text: "Is Bitcoin long-term holder supply rising or falling?", series: []}
      - {n: 4,  text: "Has Bitcoin's correlation to equities changed structurally?", series: [yfinance.mkt_btc_usd, yfinance.mkt_spy]}
      - {n: 5,  text: "Is Ethereum's base-layer fee capture positive?", series: []}
      - {n: 6,  text: "Is RWA tokenized value still compounding, and is secondary liquidity developing?", series: []}
      - {n: 7,  text: "Has any sovereign actually purchased — not seized — Bitcoin?", series: []}
      - {n: 8,  text: "Has statutory regulatory clarity arrived, or is the framework still administrative?", series: []}
      - {n: 9,  text: "What is the current credible range on quantum timelines, and has migration progressed?", series: []}
      - {n: 10, text: "Which ten-year scenario did this quarter's evidence support?", series: []}
    scenarios:
      - name: "Outlook 2026-29 (Part VI)"
        horizon: "2026-29"
        source: "the Digital Assets paper, Part VI; renewed expansion \"requires a new marginal buyer\""
        rows:
