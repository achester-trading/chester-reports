        source: "the Metals paper's ten-year view"
        rows:
          - {name: "Deepening", prior: "~30%"}
          - {name: "Persisting at current intensity", prior: "~40%"}
          - {name: "Exhausting", prior: "~30%"}
      - name: "Silver, ten years"
        horizon: "10 years"
        source: "the Metals paper's ten-year view"
        rows:
          - {name: "The transition completes", prior: "~35%"}
          - {name: "Industrial demand disappoints", prior: "~40%"}
          - {name: "The deficit persists but never binds", prior: "~25%"}
      - name: "Copper, ten years"
        horizon: "10 years"
        source: "the Metals paper's ten-year view"
        rows:
          - {name: "Structural deficit (the bull outcome)", prior: "~40%"}
          - {name: "Substitution", prior: "~35%"}
          - {name: "Demand disappointment", prior: "~25%"}
    words:
      permitted: ["official bid", "paper bid", "real yield", "stock-to-flow", "marginal buyer"]
      banned: ["safe haven", "inflation hedge", "store of value"]
    figure_budget: {quarter: 5, supply: 4, questions: 2, summary: 3}

