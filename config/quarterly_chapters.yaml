    falsification:
      - id: debasement
        paper: "Currencies"
        section: "Falsification Tests"
        statement: "\"Dollar debasement against real assets is underway\" is falsified by gold falling and holding below its 2024 levels while central banks turn net sellers — indicating the reserve rotation has reversed."
        measurable:
          all:
            - {below_year_mean: {series: yfinance.mkt_gold_front, year: 2024}}
            - {quarters_negative: {series: wgc.cb_gold_holdings_t, quarters: 1}}
        session_set: "\"its 2024 levels\" read as gold's 2024 mean; \"net sellers\" as official holdings down over the last quarter"
      - id: fed_fighting
        paper: "Currencies"
        section: "Falsification Tests"
        statement: "\"The Fed is fighting, not accommodating\" is falsified by the Fed easing while inflation remains above 3% without a clear growth deterioration to justify it. This is the single most important test in the paper."
        measurable:
          all:
            - {change_below: {series: fred.fed_funds, below: 0}}
            - {level_above: {series: calc.yoy_cpi, above: 3.0}}
        session_set: "\"easing\" read as the effective funds rate lower over the quarter; \"without a clear growth deterioration\" is not measured and the line says so"
      - id: disorderly_tail
        paper: "Currencies"
        section: "Falsification Tests"
        statement: "\"A disorderly episode is a tail, not the base case\" is falsified by two consecutive quarters in which the yields-up/dollar-down signature dominates, auction metrics deteriorate, and term premium expands together."
        measurable: null
        not_measured: "waits for AQ-8a (the yields-up/dollar-down recurrence, its YUDD_KEYS[recurrence]); auction metrics are not a single stored series"
      - id: yuan_reserve
        paper: "Currencies"
        section: "Falsification Tests"
        statement: "\"The yuan cannot be a reserve currency this decade\" is falsified by material capital-account liberalisation — not digitisation, not bilateral settlement deals, but removal of controls on portfolio outflows."
        measurable: null
        not_measured: "a policy event, not a stored series"
      - id: yen_undervalued
        paper: "Currencies"
        section: "Falsification Tests"
        statement: "\"The yen is structurally undervalued and will appreciate\" is falsified by the BoJ abandoning normalisation and the PPP gap persisting beyond 2028 with no policy response — at which point the framework has to accept that Japan's fiscal position has permanently changed the equilibrium."
        measurable: null
        not_measured: "PPP is not stored (AQ-3); a policy decision"
      - id: stablecoins_dollar
        paper: "Currencies"
        section: "Falsification Tests"
        statement: "\"Stablecoins strengthen the dollar\" is falsified by stablecoin growth shifting materially toward non-dollar denominations, or by supply contracting during a period of dollar stability."
        measurable:
          all:
            - {quarters_negative: {series: llama.stable_total, quarters: 1}}
            - {unmeasured: {reason: "\"a period of dollar stability\" is given no threshold by the paper and none is set here"}}
        session_set: "the second clause only: \"supply contracting\" read as total stablecoin supply (dollar-pegged, llama.stable_total) lower over the last quarter; the first clause, the non-dollar share, is not stored. While supply grows the test holds; a contraction prints not measured until \"dollar stability\" has a reading"
    ten_questions:
