                  {key: mof.jgb_10y, label: "10-year JGB yield, %"}]}
    implied_range_symbols: [FXE, FXY]
    curve: {waits: "forward points arrive with 6b"}
    analyses:
      - {id: yields_up_dollar_down, title: "Yields-up/dollar-down (the credibility fingerprint)", module: altdata.attribution,
         reader: attr_triple, key: calc.yields_up_dollar_down.recurrence_13w, kill: "none ruled (section 5)"}
      - {id: two_year_gap, title: "The two-year-spread fair-value gap", waits: "the five other two-year yields are not stored (AQ-3)", kill: "none ruled"}
      - {id: carry_to_vol, title: "Carry-to-vol per pair", waits: "not built (AQ-8)", kill: "none ruled"}
