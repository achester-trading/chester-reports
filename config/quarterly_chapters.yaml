  # =========================================================================
  # AQ-2 PART 2 -- the other eight chapters (sections 4.5-4.11).
  #
  # Keys beyond part 1's (the rules the gate holds are the same):
  #   frame          the chapter's frame item (0): the owning paper's status,
  #                  the change order's interim paragraph and its citations
  #   scenarios      the sets the chapter rewrites (2a): the paper's priors as
  #                  printed in the paper; this quarter's weights are AQ-6's,
  #                  never typed here. `pending` names a set no paper supplies yet
  #   falsification_note / questions_note
  #                  where NO paper owns the chapter (EM, China, real estate,
  #                  Thailand, agriculture): "no owning paper -- not stated".
  #                  No test and no question is invented
  #   related_tests  another paper's own words read beside the chapter, verbatim,
  #                  never graded as the chapter's tests
  #   panels         the chapter's own sub-sections, each placed `after` a
  #                  template item: series | matrix | hook | calendar | lines |
  #                  political | light_tier | return_decomp | coins
  #   hook_key/branch, module/reader/branch
  #                  another branch's key or block, NAMED and never imported at
  #                  load: "not yet: <branch>" until that branch is merged
  #   diff / share / ratio_pct / rel_return / corr
  #                  rows computed from two registered keys (quarterly_items)
  #   book_rule      `line` printed in item 10, or `no_draft` (an isolated
  #                  chapter writes no register draft at all); `understood_
  #                  instruments` (agriculture) the only instruments a draft
  #                  may name -- any other prints as a no draft
  #   isolation      namespace, trigger_eligible, feeds (Thailand)
  # =========================================================================

