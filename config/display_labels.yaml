# display_labels.yaml -- the reader's names for the system's ids. (T2.1, 4 Oct 2026)
#
# NO INTERNAL ID REACHES PROSE OR A LIST. Every contradiction and every metric the
# market-state object can name in an exception carries a plain label here;
# altdata/labels.py reads it, and tools/validate_weekly_stack.py fails if any id in
# config/market_state.yaml has none. A narrative_vs_data row takes its story's name
# from config/narratives.yaml.
version: display-labels-v1

contradictions:
  price_vs_breadth: "SPY's price against market breadth"
  equities_vs_credit: "equities against high-yield credit"
  long_bond_vs_hy: "the long bond against high-yield credit"
  implied_vs_realized_vol: "implied against realized volatility"
  growth_vs_cyclicals: "the growth read against cyclicals over defensives"
  gamma_vs_trend: "dealer gamma against the trend"
  prediction_markets_vs_assets: "prediction markets against asset prices"
  narrative_vs_data: "a story against the data"

metrics:
  calc.breadth_rsp_over_spy: "equal-weight over cap-weight S&P (RSP/SPY)"
  calc.breadth_sector_above_200d: "sectors above their 200-day average"
  calc.breadth_sector_above_50d: "sectors above their 50-day average"
  calc.cyclical_over_defensive: "cyclicals over defensives"
  calc.net_liquidity: "net liquidity (Fed balance sheet less TGA and RRP)"
  calc.sahm_rule: "the Sahm rule"
  calc.spy_vs_252d_high: "SPY against its 52-week high"
  calc.trend_spy_ma20_slope: "the slope of SPY's 20-day average"
  calc.trend_spy_vs_200d: "SPY against its 200-day average"
  calc.trend_spy_vs_50d: "SPY against its 50-day average"
  calc.vix3m_over_vix: "the VIX term structure (VIX3M over VIX)"
  calc.vol_spy_realized_20d: "SPY's 20-day realized volatility"
  calc.vx1_vix_basis: "the front VIX future against spot VIX"
  calc.vx_front_ratio: "the front two VIX futures"
  calc.yield_curve_2s10s: "the 2s10s curve"
  dial.gamma: "dealer gamma"
  fred.avg_wkly_hours: "average weekly hours"
  fred.bank_reserves: "bank reserves"
  fred.bb_oas: "BB credit spreads (OAS)"
  fred.breakeven_10y: "the 10-year breakeven"
  fred.breakeven_5y5y: "the 5-year, 5-year-forward breakeven"
  fred.breakeven_5y: "the 5-year breakeven"
  fred.ccc_oas: "CCC credit spreads (OAS)"
  fred.claims_4wk: "four-week average jobless claims"
  fred.fed_balance: "the Fed's balance sheet"
  fred.housing_permits: "housing permits"
  fred.hy_oas: "high-yield credit spreads (OAS)"
  fred.ig_oas: "investment-grade credit spreads (OAS)"
  fred.job_openings: "job openings"
  fred.mortgage_30y: "the 30-year mortgage rate"
  fred.nfci: "the Chicago Fed financial conditions index"
  fred.rrp: "the Fed's reverse repo facility"
  fred.sticky_core: "sticky core inflation"
  fred.vix: "the VIX"
  fred.wti: "WTI crude"
  fred.yield_10y: "the 10-year Treasury yield"
  fred.yield_2y: "the 2-year Treasury yield"
  fred.yield_30y: "the 30-year Treasury yield"
  pm.implied: "prediction-market odds"
  yfinance.mkt_spy: "SPY"
  yfinance.mkt_vix: "the VIX"

# -----------------------------------------------------------------------------
# PLAIN LANGUAGE (T2.2, ruled 4 Oct 2026, item 2). The prose may describe these
# only in these words; the reports print them beside the ids' labels. A
# contradiction's `legs` says what each side is saying, `closes` what would close
# it -- read by "What doesn't fit" and Ahead's "What the system is watching".
# -----------------------------------------------------------------------------
contradiction_plain:
  price_vs_breadth:
    legs: "SPY near its one-year high says the index is strong; the share of sectors above their 50-day average says fewer stocks are taking part"
    closes: "breadth recovers toward the index, or the index falls back from its high"
  equities_vs_credit:
    legs: "SPY rising says risk appetite is healthy; high-yield spreads widening says lenders are asking more to hold risky debt"
    closes: "spreads tighten back, or equities fall to meet them"
  long_bond_vs_hy:
    legs: "the 30-year yield rising says investors want more to hold long Treasuries; high-yield spreads staying calm says credit sees no matching stress"
    closes: "the long bond rallies, or high-yield spreads widen to match"
  implied_vs_realized_vol:
    legs: "the VIX is what options price for the next month; SPY's 20-day realized volatility is how much it has actually moved"
    closes: "implied and realized volatility converge"
  growth_vs_cyclicals:
    legs: "the growth read says the economy's data is firm or soft; cyclicals over defensives says how equity investors are positioned for it"
    closes: "cyclical leadership turns to match the growth data, or the data turns"
  gamma_vs_trend:
    legs: "dealer gamma says whether dealers' hedging damps or amplifies moves; the trend says which way prices have been going"
    closes: "dealer gamma or the trend turns so the two agree"
  prediction_markets_vs_assets:
    legs: "prediction-market odds say what event bettors expect; asset prices say what investors have priced"
    closes: "the odds and the prices move into line"
  narrative_vs_data:
    legs: "a story the market tells says one thing; the data it is tied to says another"
    closes: "the data moves the story's way, or the story fades"

exception_kinds:
  extreme: "a reading at a five-year extreme -- in the top or bottom of its own five-year range"
  contradiction: "a gap between two markets held past five sessions"

# The narrative register's stories, in plain words: a title and one sentence.
stories:
  ai_capex_durability:
    title: "AI spending keeps growing"
    statement: "The largest technology companies keep raising what they spend on AI data centres, and investors keep funding it."
  fiscal_dominance:
    title: "Deficits drive long-term rates"
    statement: "Government borrowing, not the Fed, is setting long-term interest rates, so investors demand more to hold long bonds."
  yen_carry:
    title: "The yen carry trade unwinds"
    statement: "Investors who borrowed cheaply in yen to buy other assets are unwinding, so the yen strengthens and markets get more volatile."
  midterm_cycle:
    title: "The midterm-year pattern"
    statement: "Stocks tend to be held back by policy uncertainty before the 3 November election and to rally after it."

sectors:
  XLK: "Technology (XLK)"
  XLF: "Financials (XLF)"
  XLE: "Energy (XLE)"
  XLV: "Health Care (XLV)"
  XLI: "Industrials (XLI)"
  XLP: "Consumer Staples (XLP)"
  XLY: "Consumer Discretionary (XLY)"
  XLU: "Utilities (XLU)"
  XLB: "Materials (XLB)"
  XLRE: "Real Estate (XLRE)"
  XLC: "Communication Services (XLC)"

# State words the reports print, in plain words (the legend under Narratives and
# What doesn't fit, and the glossary).
states:
  pending: "a reading has crossed its line but not yet for long enough to count"
  open: "a gap between two markets has been wide for at least two sessions"
  exception: "a gap open five sessions or more, or a reading at a five-year extreme"
  emerging: "the story is new or still gathering evidence"
  consensus: "the evidence and the data agree with the story"
  contested: "the evidence is split for and against the story"
  fading: "the story is losing attention and the data has turned against it"
  confirmed: "a proposed story the operator has accepted into the register"

# The glossary printed once at the end of the Weekly (item 11).
glossary:
  - term: "z"
    text: "how many standard deviations a reading sits from its own average; 2.0 is further out than about 95% of its history."
  - term: "gap z-score"
    text: "how unusual today's distance between two markets is against that pair's own history; rising means the gap is widening, falling means it is closing."
  - term: "pending, open, exception"
    text: "pending: a reading has crossed its line but not for long enough to count; open: a gap wide for at least two sessions; exception: a gap open five sessions or more, or a reading at a five-year extreme."
  - term: "outside 10–90%"
    text: "prediction-market odds this far from even are known to be mispriced at the level, so the change is read, not the level."
  - term: "base rate"
    text: "how often the outcome happened in the stored history under the same rule, with the count of cases (n); a frequency, not a forecast."
  - term: "Brier"
    text: "a score for probability calls: the average squared gap between the stated probability and what happened; 0 is perfect, 0.25 is what always saying 50% scores."
  # T2.6 (8 Oct 2026): the Monthly's terms. The flag thresholds quoted here are
  # config/reporting_stack.yaml `dealer_flags` and the retrospective's floor;
  # tools/validate_stack_cadence.py holds these sentences to those values.
  - term: "Slow layers"
    text: "the Monthly's eleventh section: valuation, base rates, tail risks and the long-running themes — the readings that move over months, printed as levels and frequencies, never as signals."
  - term: "pinned, held, amplified"
    text: "a session's dealer flags, computed from the stored close and never judged: pinned, SPY closed within 0.25% of max pain; held, the session's high came within 0.25% of the morning's call wall (or its low of the put wall) and the close stayed inside it; amplified, price crossed the morning's gamma flip and the session's range was at least 1.2 times the one-day range implied by volatility. A flag is left blank when an input is missing, never guessed."
  - term: "IV check"
    text: "marks a session on which SPY's own 30-day at-the-money implied volatility and the VIX differ by more than 5 volatility points; both are printed side by side and neither is chosen. The implied range uses SPY's own volatility when it is stored, and the VIX, labelled as a proxy, when it is not."
  - term: "hit rate"
    text: "in the Monthly's dealer retrospective, how often a flag was set over the sessions on which it could be computed — a count over a count; below 20 scored sessions the section prints \"insufficient sessions\" and no rate."
