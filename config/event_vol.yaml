# event_vol.yaml -- item 119's event-vol pricing ledger (signal-triage Batch 22,
# the order's 101) with Batch 23 item 124f's catalyst-class tags and the T, T+1,
# T+2 window (Batch 23 section 0, Q3; D-2). A129, 6 Nov 2026. Read by
# altdata/event_vol.py; the seeds by altdata/vol_event.py's seed-tags command.
#
# PRE-REGISTERED before the code: docs/ledgers/event-vol-preregistration-2026-11.md,
# whose SHA-256 (LF bytes) is held here and by tools/validate_item_119.py.
#
# RIGHTS: the Ahead line (the close and the Weekly) and the "cheap event vol"
# flag, in Ahead only. Nothing here enters a composite, a dial, the market-state
# object, a tell, a setup, a size or the register. FlashAlpha is never read (the
# 9 Oct rule): the implied move is the box's own captured chain's.
version: event-vol-v1
updated: 2026-11-06
preregistration: docs/ledgers/event-vol-preregistration-2026-11.md
preregistration_sha256: 639d142c2d794c7e0e4552971c6a5de38bd61d4ecb2d5820357a059d33329e70

# Log-only until this many RESOLVED rows of a type; no flag below it.
min_events: 20

# THE TYPES. `match` is a case-insensitive pattern on the stored calendar row's
# title (altdata/events.py's calendar, the close's Ahead) or on Ahead's event
# text (the Weekly); `classes` are config/weekly_ahead.yaml's classes a ranked
# row may carry; `timing` is when the event lands against the close ("before" or
# "after"; an earnings row's time is read from the row, "unknown" when absent);
# `underlying` is the chain and the closes read (an earnings row reads the name);
# `time` (ET) decides the straddle's expiry by Ahead's rule: an event before the
# open counts the event date's own expiry, any later one the first expiry after
# the date.
types:
  fomc:      {match: "FOMC statement|FOMC decision", classes: [fomc_decision], timing: before, time: "14:00", underlying: SPY, default_class: "policy response"}
  cpi:       {match: "Consumer Price Index|^CPI\\b", classes: [inflation_print], timing: before, time: "08:30", underlying: SPY, default_class: "data print"}
  payrolls:  {match: "Employment Situation|Payrolls", classes: [labour_print], timing: before, time: "08:30", underlying: SPY, default_class: "data print"}
  refunding: {match: "refunding", classes: [refunding], timing: before, time: "08:30", underlying: SPY, default_class: "policy shock"}
  election:  {match: "election day|midterm election|US midterm|presidential election", classes: [us_election], timing: after, underlying: SPY, default_class: "political"}
  earnings:  {match: "^([A-Z.]+) earnings", classes: [earnings_mega, earnings_index, earnings_bank, earnings_tracked], timing: unknown, underlying: name, default_class: "earnings"}

# THE LEDGER'S OWN SEED ROWS (the first edition prints them, marked; the store's
# ledger never holds them and no median counts them): the 2026 midterm, its
# implied move the order's figure (a sell-side desk's estimate the order quotes,
# never a chain read; V-101b), its realised moves from the edition's source.
ledger_seeds:
  - {type: election, underlying: SPY, event: "US midterm election, 3 Nov 2026", event_date: "2026-11-03", time: "results after the close", timing: after, implied_text: "about 1.2% (order's figure)", scheduled: scheduled, catalyst_class: political, mark: "seed, order's figure (V-101b)"}

# The earnings names: the box's 13 (config.options_universe()); SPY, QQQ and IWM
# report nothing. Read from altdata.config at run time; listed for the reader.
earnings_names: [NVDA, AAPL, MSFT, AMZN, META, GOOGL, TSLA, MSTR, COIN, ASTS]

# 124f's two fields (nullable on every row of both ledgers).
tags:
  scheduled: [scheduled, unscheduled]
  catalyst_class: [policy shock, policy response, exogenous, data print,
                   positioning unwind, earnings, political]

# THE SEED ROWS (124f, with D-2): judgment drafts for the operator's accept-all
# (rule 31), written into item 52's vol.event_ledger by
# `python -m altdata.vol_event seed-tags [--dry-run]` (the box's, dry run first)
# as rows marked seed: true, which never count toward the ledger's 30-event
# right. Dates and moves are the study's (docs/studies/tail-days-study-2026-11-05.md
