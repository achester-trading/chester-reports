# alpha_crypto_venues.yaml -- engine 5's venues and their costs (X-3.2;
# alpha/engines/carry.py). STORED CONSTANTS, LISTED AND DATED: each fee is the
# venue's published entry-tier taker rate (the lab's book is the smallest tier on
# every venue), as read on the date given, with where it was read. A fee changes
# here only with a new date and a new source line, never silently.
#
# Taker, not maker, on every leg: the cost model is conservative by construction
# (X-1.4: never the mid), and a delta-neutral pair is entered and left in one
# motion. Where two published figures disagree the higher is used.
version: 1
read_on: "2026-10-17"

perp_venues:
  hyperliquid:
    funding_key: hl.funding
    oi_key: hl.oi
    taker_bps: 4.5
    source: "Hyperliquid docs, Trading > Fees: tier 0 (< $5M 14-day weighted volume) perps 0.045% taker, 0.015% maker (hyperliquid.gitbook.io/hyperliquid-docs/trading/fees), read 17 Oct 2026"
  okx:
    funding_key: fut.funding_okx
    oi_key: fut.oi_okx
    taker_bps: 5.0
    source: "OKX regular-user USDT-margined perpetuals 0.05% taker, 0.02% maker -- from third-party fee summaries; OKX's own fee page was not reached on 17 Oct 2026 (UNVERIFIED at the primary source; needs-you)"
  deribit:
    funding_key: fut.funding_deribit
    oi_key: fut.oi_deribit
    taker_bps: 5.0
    source: "Deribit support centre, BTC/ETH futures and perpetuals 0.05% taker, 0.00% maker (support.deribit.com, article 25944746248989); the same centre's 'upcoming' tier table shows 3.5 bp taker -- the higher is used; read 17 Oct 2026"

spot_leg:
  venue: coinbase_advanced
  price_keys: {BTC: yfinance.mkt_btc_usd, ETH: yfinance.mkt_eth_usd}
  taker_bps: 60.0
  source: "Coinbase Advanced, lowest tier (< $10k 30-day volume) 0.60% taker, 0.40% maker -- from several 2026 reviews; Coinbase's own fee table was not reached on 17 Oct 2026 (UNVERIFIED at the primary source; needs-you)"

# The spread and slippage on each leg come from config/alpha_costs.yaml's `perp`
# class (spread_estimate, min_slippage_bps) on top of the fees above.

coins: [BTC, ETH]

# THE FUNDING REGIME, THE SWITCH (S-3: calc.funding_agg, annualised %, and its
# 90-day z, calc.leverage_z). Decided weekly at the last session of the ISO week:
#   ON   the trailing 7-day mean of calc.funding_agg at or above `on_annual_pct`
#        and calc.leverage_z below `crowded_z` (a crowded long is a squeeze risk,
#        not a carry)
#   OFF  the trailing mean below `off_annual_pct`, or leverage_z at or above
#        crowded_z
# While ON: long spot, short the perp on the venue paying the highest funding at
# entry, equal notional; held until the switch turns OFF. Funding received or
# paid is accrued per day from that venue's stored daily funding.
switch:
  on_annual_pct: 10.0
  off_annual_pct: 3.0
  crowded_z: 2.0
  mean_days: 7

# THE HISTORY WINDOW THE MANIFEST STATES. The engine runs nothing until the store
# holds this many weekly decisions with the switch computable (calc.funding_agg
# and calc.leverage_z knowable): a year's fit (52) and the constitution's weekly
# minimum sample (40). Below it the engine prints "insufficient history".
min_history_weeks: 92

# THE BASIS LEG IS A LISTED GAP: no perp mark price is stored (hl.* and fut.*
# store funding and open interest only), so the spot-perp basis cannot be read.
# The engine prices both legs at the stored spot close, i.e. assumes the basis
# unchanged over the hold, and says so in every result.
basis_gap: "no perp mark price is stored (hl.* and fut.* carry funding and open interest only): both legs are priced at the spot close and the basis is assumed unchanged over the hold"
