# vol_state.yaml -- signal-triage Batch 23 item 124c(i) (the order's 106c(i); paste
# B134, 6 Nov 2026). Read by altdata/vol_state.py; printed by
# daily_cascade/vol_state_block.py in the close's Mechanics (after item 52's block)
# and as one row in the Weekly's.
#
# RIGHTS (the order): a daily line and the sizing input to item 124g, through the
# hook vol_state_k. No regime, no dial, no composite: the stored calc.vol_state.*
# keys are barred from the market-state object (metrics_registry.yaml
# market_state_barred).
#
# EVERY VALUE HERE IS SESSION-SET, not fitted: the rule, the bins and the k table
# are declared, and changing one is a config change with its date, never a fit.

version: vol-state-v1
updated: 2026-11-06

# The five inputs, each as a percentile over its own stored history to the day
# (expanding, point in time: the share of its values on or before the day that are
# at or below the day's). `from` is the first day an input is read; before it, and
# before `min_history` values, the input is "n/a" and leaves the mean.
min_history: 252
inputs:
  - id: vix
    label: VIX
    # FRED's VIXCLS is the history; on the close's own day, before FRED publishes,
    # Yahoo's ^VIX close fills the day. FRED's value wins wherever both exist.
    keys: [fred.vix, yfinance.mkt_vix]
    from: "1990-01-02"
  - id: rv20
    label: S&P 500 20-day realised vol
    # Annualised: the sample standard deviation of the 20 daily log returns
    # ending the day, times sqrt(252), in percent.
    keys: [yfinance.mkt_gspc]
    from: "1990-01-02"
  - id: term
    label: VIX/VIX3M
    keys: [yfinance.mkt_vix3m]
    from: "2007-01-03"
  - id: vvix
    label: VVIX
    keys: [yfinance.mkt_vvix]
    from: "2012-01-03"
  - id: bigmove
    label: "|return| >= 2% days in the last 20"
    keys: [yfinance.mkt_gspc]
    from: "1990-01-02"
    threshold: 0.02
    window: 20

# THE RULE, session-set (the order's default): the state score is the mean of the
# available percentiles, unweighted; no weight is fitted. The decile is the
# score's bin: 1 below 10, 2 from 10 to below 20, ..., 10 at 90 and above.
rule:
  combine: mean_of_available
  min_inputs: 2

# THE CALIBRATION the print reads, copied from the ledger (written once,
