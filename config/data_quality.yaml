# STEP SERIES (ruled 15 Oct 2026, AUD-3c answer 4). A policy rate moves in steps:
# flat for months, then 25 bp. Its last 60 changes are mostly zero, so the
# standard-deviation rule would flag every decision. A step series' change
# prints as an informational "step" line in the check's table and never flags
# (the close's Warnings table prints flags only).
steps:
  reason: >-
    Ruled: IORB, the ECB deposit rate and Japan's call rate, "and any other
    policy rate". The session added the effective fed funds rate, daily (DFF)
    and as a monthly average (FEDFUNDS): each moves with the target range, a
    step a decision at a time.
  series:
    - {key: fred.iorb,         why: "interest on reserve balances, set by the Fed"}
    - {key: fred.ecb_dfr,      why: "the ECB deposit facility rate, set by the ECB"}
    - {key: fred.jp_call_rate, why: "Japan's call rate, held at the BoJ's target"}
    - {key: fred.effr_daily,   why: "effective fed funds, daily: moves with the target range"}
    - {key: fred.fed_funds,    why: "effective fed funds, monthly average: steps with the target"}

# THE CLOSE. The day's flags print in the close's Warnings table, one line each,
# at most `close_lines` of them and then a count; nothing on a clean day.
close_lines: 5
close_lines_reason: >-
  The brief's. Five lines keep the Warnings table readable on a bad-feed day
  when a whole family misprints; the rest are counted, and the full table is
  one command away (python -m altdata.quality check).
