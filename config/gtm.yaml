# The J.P. Morgan Guide to the Markets batch, part 1 (GTM-1, 7, 8, 9, 13, 15, 21).
# Change order docs/change-order-jpm-gtm-2026-10-03.md (ruled 3 Oct 2026); built
# on branch gtm-core-1, 17 Oct 2026. altdata/gtm.py computes; daily_cascade/
# gtm_block.py lays out; tools/base_rates.py stores the three base-rate tables;
# tools/validate_gtm.py holds it.
#
# TWO KINDS OF NUMBER, NEVER MIXED. A figure the store can compute is computed
# (the eras, the episodes, the all-time-high shares, the duration returns, the
# tariff and debt-service ratios). A figure only the Guide has is a SOURCED
# FIGURE: it is declared under `sourced` below with the scan's own words quoted,
# its section reference (and slide where the scan recorded one -- the 8 Oct
# narrowing of the scans ingest), and its as-of date; `altdata.scans ingest`
# stores it beside the reference table, and it prints only from the store,
# labelled, and never recomputed. A sourced figure without a section reference,
# an as-of date, or a quote the scan contains is refused.
#
# Everything here is session-set unless a line names a ruling.
version: gtm-v1
updated: 2026-10-17
scan_id: jpm-gtm-2026q4

# Register numbers (ruling 4 of 17 Oct 2026): the adopted items take fresh
# numbers from SR-48 upward in the order's table order. SR-49 is skipped: it is
# the selloff-shape axis's working number in code (signal-triage batch 4), and
# the working numbers the other branches use stand, as SR-43, 45 and 46 do.
# Part 1 had used SR-37 ... SR-47; renumbered on gtm-core-1 before part 2.
register_numbers:
  GTM-1: SR-48
  GTM-3: SR-50
  GTM-4: SR-51
  GTM-8: SR-52
  GTM-9: SR-53
  GTM-10: SR-54
  GTM-11: SR-55
  GTM-12: SR-56
  GTM-13: SR-57
  GTM-14: SR-58
  GTM-15: SR-59
  GTM-7: SR-9    # amended, keeps its key
  GTM-21: SR-5   # amended, keeps its key

# GTM-1: the eight prior tops and bottoms, as the scan names them (month only;
# the scan gives a day for 12 Oct 2022 alone, and no day is invented).
inflection_points:
  - {id: top_2000, kind: top, label: "24 Mar 2000"}
  - {id: top_2007, kind: top, label: "9 Oct 2007"}
  - {id: top_2020, kind: top, label: "19 Feb 2020"}
  - {id: top_2022, kind: top, label: "3 Jan 2022"}
  - {id: bottom_2002, kind: bottom, label: "9 Oct 2002"}
  - {id: bottom_2009, kind: bottom, label: "9 Mar 2009"}
  - {id: bottom_2020, kind: bottom, label: "23 Mar 2020"}
  - {id: bottom_2022, kind: bottom, label: "12 Oct 2022"}
inflection_fields: [level, forward_pe, dividend_yield, yield_10y]

# GTM-7: the three eras (the Guide's), monthly total returns from Shiller's sheet
# (the S&P Composite's price and dividend; a 10-year par bond priced off GS10),
# the average of the 24-month rolling correlation whose window ends in the era,
# and the era's average CPI inflation on the year. An era our history does not
# cover to `min_coverage` prints the Guide's figure, labelled.
stock_bond:
  rolling_months: 24
  bond_maturity_years: 10
  min_coverage: 0.9
  eras:
    - {id: "1964-1999", label: "1964 to 1999", start: "1964-01", end: "1999-12"}
    - {id: "2000-2020", label: "2000 to 2020", start: "2000-01", end: "2020-12"}
    - {id: "2021-now", label: "2021 to now", start: "2021-01", end: null}
  # The regime word Book A's rule table reads (and nothing automated does): the
  # current 24-month correlation at or above +0.10 is "positive", at or below
  # -0.10 "negative", between them "near zero".
  regime_bands: {positive: 0.10, negative: -0.10}

# GTM-8: Michigan sentiment's turning points. A peak (trough) is a month whose
# reading is strictly the highest (lowest) within `window_months` either side (a
# tie is neither, so a flat stretch marks nothing);
# turning points then alternate (two peaks in a row keep the higher), and a
# peak-trough pair less than `min_swing_points` apart is dropped. The forward
# return is the S&P 500's month-end close 12 months on, price only. A trough "at
# a price low" is one where the S&P 500 sat at least `price_low_drawdown_pct`
# below its prior 12-month closing high -- the test of the order's caveat.
sentiment:
  window_months: 12
  min_swing_points: 15.0
  forward_months: 12
  price_low_drawdown_pct: 10.0
  # The order's words, printed in the row (change order, GTM-8's ruling).
  caveat: "every sampled trough coincided with a price low; this one is at a high"

# GTM-9: all-time highs from the S&P 500's daily closes (^GSPC). An all-time high
# is a close above every prior close. A FLOOR is the scan's definition (section 4,
# GTM-9): an all-time high the market never afterwards closed 5% or more below,
# measured to the end of the stored data. "Followed by another within a week":
# another all-time high in the next five sessions. The comparison sample is the
# scan's, 1988 to 2025.
all_time_highs:
  floor_drawdown_pct: 5.0
  within_sessions: 5
  sample: {start: "1988-01-01", end: "2025-12-31"}
  definition_source: "the scan's (section 4, GTM-9): never fell 5% below"

# GTM-13: the fixed-income scenario table. A sector prints only through a proxy
# the store holds; a sector without one prints "no proxy". Yields are the store's
# own series for the tenor (the CMT nearest the fund's maturity band, labelled);
# a sector whose yield is not stored prints "not stored". Duration only from
# config/instrument_reference.yaml; the +/-100 bp price return is -duration x
# change (no convexity: the reference carries none).
fixed_income:
  window_sessions: 252
  shift_bp: 100
  rate_key: fred.yield_10y
  equity_key: yfinance.mkt_spy
  sectors:
    - {sector: "Treasury 2-year", yield_key: fred.yield_2y, yield_label: "2-year CMT",
       proxy: SHY, proxy_key: yfinance.mkt_shy, guide: "2y"}
    - {sector: "Treasury 10-year", yield_key: fred.yield_10y, yield_label: "10-year CMT",
       proxy: IEF, proxy_key: yfinance.mkt_ief, guide: "10y"}
    - {sector: "Treasury 30-year", yield_key: fred.yield_30y, yield_label: "30-year CMT",
       proxy: TLT, proxy_key: yfinance.mkt_tlt, guide: "30y"}
    - {sector: "TIPS", yield_key: fred.tips_10y, yield_label: "10-year real",
       proxy: TIP, proxy_key: yfinance.mkt_tip, guide: "TIPS"}
    - {sector: "Aggregate", yield_key: null, proxy: AGG, proxy_key: yfinance.mkt_agg,
       guide: "Agg"}
    - {sector: "Investment grade", yield_key: null, proxy: LQD,
       proxy_key: yfinance.mkt_lqd, guide: "IG"}
    - {sector: "High yield", yield_key: null, proxy: HYG, proxy_key: yfinance.mkt_hyg,
       guide: "HY"}
    # Ruling 2 of 17 Oct 2026: TIP, MUB and MBB join the price basket (Yahoo,
    # keyless) as the TIPS, municipal and MBS proxies.
    - {sector: "Municipals", yield_key: null, proxy: MUB, proxy_key: yfinance.mkt_mub,
       guide: "munis"}
    - {sector: "MBS", yield_key: null, proxy: MBB, proxy_key: yfinance.mkt_mbb, guide: "MBS"}

# GTM-15: customs duties over goods imports. FRED serves the receipts QUARTERLY
# (B235RC1Q027SBEA, billions, SAAR) and goods imports MONTHLY (BOPGIMP, millions,
# SA); the rate is the quarter's receipts over four times the quarter's three
# months of imports. No monthly customs-receipts series is on FRED, so the
# order's "monthly" is quarterly here and is printed so.
tariff:
  customs_key: fred.customs_duties
  imports_key: fred.goods_imports

# GTM-21: the household debt-service ratio and its two splits (FRED, quarterly).
dsr:
  keys:
    - {key: fred.dsr_household, label: "Household debt service, % of disposable income (TDSP)"}
    - {key: fred.dsr_consumer, label: "Consumer debt service (CDSP)"}
    - {key: fred.dsr_mortgage, label: "Mortgage debt service (MDSP)"}
  short_window_days: 1826

# ===========================================================================
# PART 2 (gtm-core-2, 17 Oct 2026): GTM-3, 4, 10 and 12, and the fixes to GTM-13
# and GTM-15 the rulings of 17 Oct asked for. Computed in altdata/gtm_equities.py
# (GTM-3, 4, 10) and altdata/gtm.py (GTM-12, GTM-15 monthly); laid out in
# daily_cascade/gtm_block.py. Every Guide figure is a sourced figure below, with
# its slide and as-of, and is never recomputed.
# ===========================================================================

# GTM-3: the concentration twin. The top 10 ISSUERS by SPY's weights (a second
# share class counts with its first: config/st_r5_t1_rest.yaml's
# `share_classes`, the one map). Earnings share: each top-10 name's weight over its
# trailing P/E (Yahoo's trailing twelve months, yf.trailing_pe), times the index's
# trailing P/E from Shiller's sheet (the month's price over the month's trailing
# twelve-month earnings) -- cap share over P/E is earnings share, so no share
# count is needed. Forward P/E: the top 10's is their weight over the sum of
# weight over forward P/E (Yahoo's forward P/E, the next fiscal year); the
# index's is the S&P 500's close over S&P DJI's forward twelve-month operating EPS
# (the operator's monthly drop); the other 490's backs the top 10 out of the
# index, the Guide's own method. Every name must carry its multiple, or the cell
# prints the Guide's figure, labelled. Own averages: over every stored holdings
# day the inputs cover; under `min_own_history_days` ours prints with its window
# and the Guide's average is the comparison.
concentration_twin:
  weight_key: sp500.member_weight
  top_n: 10
  trailing_pe_key: yf.trailing_pe
  forward_pe_key: yf.forward_pe
  index_close_key: yfinance.mkt_gspc
  index_forward_eps_key: spdji.fwd12m_op_eps
  shiller_price_key: shiller.sp_price
  shiller_earnings_key: shiller.sp_earnings
  max_age_days: 7
  min_own_history_days: 252
  # The consensus log (altdata/loggers/consensus.py) reads these beside its own
  # universe, so the top 10 and the hyperscaler bucket carry their multiples:
  # the bucket's members not already in it, and the newest holdings' top
  # `consensus_top_n` issuers' lines (keyless Yahoo, the same read as the rest).
  consensus_static: [ORCL, GOOG]
  consensus_top_n: 12

# GTM-4: the five buckets are config/ai_buckets.yaml (slide 11, refreshed each
# quarter). A bucket's weight is the sum of its members' SPY weights; its year to
# date the market-weighted price return from the last close of the prior year
# (each member's starting weight backed out of today's weight and its return);
# its NTM P/E the members' weight over the sum of weight over forward P/E. Every
# member must be stored, or the cell prints the Guide's figure, labelled.
ai_buckets:
  close_key: sp500.member_close
  weight_key: sp500.member_weight
  forward_pe_key: yf.forward_pe
  ocf_key: edgar.xbrl_operating_cash_flow
  capex_key: edgar.xbrl_capex
  forecast_years: [2026F, 2027F, 2028F]

# GTM-10: the sector rows. The correlation of each sector ETF's daily price return
# with the 10-year's daily change in basis points (FRED DGS10), over one year and
# five years of sessions where both are stored; at least `min_coverage` of the
# window's sessions, else "not reached". The Guide's columns (forward P/E against
# its 20-year average, NTM EPS growth against its 20-year median, foreign share
# of sales, and its own 2-year monthly correlation) are sourced figures. The ETF
# maps to the slide's sector row.
sector_rows:
  rate_key: fred.yield_10y
  windows: {one_year: 252, five_years: 1260}
  min_coverage: 0.9
  sectors:
    XLE: energy
    XLB: materials
    XLF: financials
    XLI: industrials
    XLY: cons_disc
    XLK: tech
    XLC: comm_services
    XLRE: real_estate
    XLV: health_care
    XLP: cons_staples
    XLU: utilities
  index_row: s_p_500

# GTM-12: what the Factor IV panel lacks (the Monthly's fiscal rows carry debt to
# GDP and r minus g). Two bases, never mixed in one ratio: the national accounts,
# quarterly at an annual rate, each against federal current expenditures
# (FGEXPND); and the budget, by fiscal year, each against net outlays (FYONET).
# Defense in the national accounts is consumption AND gross investment, which
# current expenditures exclude, so its share is printed with that caveat. Each
# row: the latest, its period, and the share's percentile over `short_years` and
# over the full stored history.
federal:
  short_years: 10
  nipa_denominator: fred.fed_outlays
  budget_denominator: fred.fy_net_outlays
  rows:
    - {id: interest_nipa, key: fred.fed_interest_payments, series: A091RC1Q027SBEA,
       label: "Interest payments (national accounts)", basis: nipa}
    - {id: defense_nipa, key: fred.fed_defense, series: FDEFX,
       label: "Defense consumption and gross investment (national accounts)", basis: nipa}
    - {id: customs_nipa, key: fred.customs_duties, series: B235RC1Q027SBEA,
       label: "Customs duties receipts (national accounts)", basis: nipa}
    - {id: net_interest_fy, key: fred.fy_net_interest, series: FYOINT,
       label: "Net interest outlays (budget, fiscal year)", basis: budget}
    - {id: deficit_fy, key: fred.fy_deficit, series: FYFSD,
       label: "Deficit (budget, fiscal year)", basis: budget, sign: -1}
    - {id: deficit_gdp, key: fred.fy_deficit_gdp, series: FYFSGDA188S,
       label: "Deficit, % of GDP (fiscal year)", basis: gdp, sign: -1}
  # The CBO path: a sourced figure taken from the scan or CBO's own outlook at each
  # update, dated, never typed from memory (ruled 17 Oct 2026).
  cbo_path: [gtm12.debt_2025, gtm12.debt_2036]

# GTM-15, MONTHLY (ruling 3 of 17 Oct 2026): customs duties from the Monthly
# Treasury Statement (Table 4, keyless, through the fiscaldata writer) over the
# month's goods imports (BOPGIMP). GROSS receipts: the month's duties collected;
# net receipts subtract refunds, which since the IEEPA refunds of mid-2026 turn
# net receipts negative and say nothing about the rate on current imports. The
# refunds print beside it. Duties are not seasonally adjusted and imports are, so
# the three-month rate prints beside the month's. The quarterly FRED rate above
# is the cross-check.
tariff_monthly:
  gross_key: fiscaldata.mts_customs_gross
  refunds_key: fiscaldata.mts_customs_refunds
  imports_key: fred.goods_imports
  smooth_months: 3

