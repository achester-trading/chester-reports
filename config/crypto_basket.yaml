      pays: "Cut of rewards on $24B of staked ETH; small buyback (capped $10M/yr)"
      note: "DefiLlama TVL for `lido`: the staked ETH, in dollars"
    thesis: "The largest service for staking Ethereum, holding about $24 billion of ETH on behalf of users and taking a small cut of the rewards."
    case_for: "The token is priced at a fraction of the business behind it: its treasury alone is worth about a third of the market value, it has started buying back tokens, and it collects a fee on a very large pool of assets. If Ethereum recovers and staking keeps growing, a tenfold rise only takes Lido back to where it traded in early 2024, which is a far easier claim than growing into new territory."
    case_against: "If Ethereum stays weak, Lido's fee pool shrinks with it. Competitors and the new ETFs that stake Ethereum themselves could take share, the buyback is capped at $10 million a year, and governance could cut fees to defend market share. In that case the token drifts down alongside ETH with no catalyst of its own."
