# config/crypto_basket.yaml -- the crypto long-shot basket (basket tier).
#
# Ruled 12 Oct 2026: docs/briefs/crypto-basket-brief-2026-10-12.md (decisions
# 1-7; decision 3 as the alternative). The thesis source is the operator's
# document, docs/scans/crypto-basket-summary-2026-10-12.md.
#
# QUOTED, NEVER PARAPHRASED: thesis (the document's italic line), case_for,
# case_against, measurable.pays and the table's us_access are the document's
# words, with its Markdown escapes removed; tools/validate_crypto_basket.py finds
# each one in the document.
#
# THE ODDS ARE THE OPERATOR'S. `odds` is hand-seeded and dated; the model never
# writes or revises it (the gate refuses a file whose odds differ from the
# document's table). The quarterly restatement (decision 3) prints BESIDE it and is
# written to the thesis register, never here. `operator_restatement` is the
# operator's own third column, hand-seeded, empty until he adds one.
#
# SYMBOLS ARE RESOLVED, NOT ASSUMED. Yahoo's bare `-USD` pair is a different coin
# for three names (SKY-USD is Skycoin, AERO-USD Aerovek, PRL-USD The Parallel) and
# absent for four (TAO, MORPHO, UNI, VVV), whose pairs Yahoo suffixes with an id;
# each `yahoo` below was checked against Yahoo's own name on 13 Oct 2026. The
# ticker is never a key (SR-10 MW-1).
version: crypto-basket-v1
dated: 2026-10-12
source: docs/scans/crypto-basket-summary-2026-10-12.md
tier: basket

# Sources, one per series kind (one source per name, never two).
sources:
  price: {source: yfinance, key: "yfinance.crypto_<sym>", why: "the sanctioned exception (11 Oct); Yahoo lists all twelve"}
  market_cap: {source: llama_coins, key: "llama.mcap_<sym>", why: "CoinGecko's terms do not provide for keyless reads and discourage storing data; DefiLlama's coin service (coins.llama.fi/mcaps) serves the current cap, no history"}
  supply: {source: llama_coins, key: "llama.supply_<sym>", why: "the coin service's cap divided by its own price at the same instant"}
  fees: {source: defillama, key: "llama.fees_<sym> / llama.revenue_<sym> / llama.holders_revenue_<sym>", why: "DS-29, CD-1"}
  tvl: {source: defillama, key: "llama.tvl_<sym>", why: "DS-29, CD-1"}

# The lenses (metric-lenses brief): each kind's family and long window.
lenses:
  price: {family: price, long_window: full}
  market_cap: {family: quantity, long_window: full}
  supply: {family: quantity, long_window: full}
  fees: {family: quantity, long_window: 365d}
  tvl: {family: quantity, long_window: full}
  dilution: {family: ratio, long_window: 365d}

# The grader's session-set parameters (item 3). Proposed, not ruled.
grader:
  strained_band: 0.10        # within 10% of a threshold is strained
  half_time_rule: true       # past half the time to a date with no progress is strained
  proposed: true

names:
  SKY:
    name: "Sky"
    tier: basket
    yahoo: "SKY33038-USD"
    llama_slug: "sky"
    llama_coin: "coingecko:sky"
    llama_series: ["fees", "revenue", "holders_revenue", "tvl"]
    measurable:
      key: "llama.revenue_sky"
      pays: "Interest on the collateral behind its USDS/DAI dollar, ~$200M/yr; buybacks and staking rewards"
      note: "DefiLlama revenue for the parent protocol `sky` (Sky Lending, Sky Money, Sky RWA)"
    thesis: "The company-like protocol behind USDS and DAI, a dollar-pegged coin backed by crypto collateral and Treasury bills. Nearly all tokens are already in circulation."
    case_for: "Sky earns interest on everything backing its dollar, about $200 million a year net, and uses that money to buy back its own token and pay people who stake it. It is one of the few crypto projects that is plainly profitable, and it set a new all-time high in October 2026 while the rest of the market was down. If stablecoins keep growing the way the new US law (GENIUS) encourages, Sky grows with them. A tenfold rise would make it an $18 billion asset, roughly the eleventh-largest coin, which is a large but believable size for a profitable crypto bank."
    case_against: "The dollar it issues could lose ground to Circle's USDC, Tether, or new bank-issued coins, which would shrink the interest it earns. Falling interest rates would shrink it further. A bad loan or a collateral failure would hit the balance sheet directly, and control is concentrated in a small group. In that case the token is simply a shrinking cash flow, and in a crypto bear market even a profitable token can fall 50 to 80 percent."
    falsifier:
      quoted: "The dollar it issues could lose ground to Circle's USDC, Tether, or new bank-issued coins, which would shrink the interest it earns. Falling interest rates would shrink it further. A bad loan or a collateral failure would hit the balance sheet directly, and control is concentrated in a small group. In that case the token is simply a shrinking cash flow, and in a crypto bear market even a profitable token can fall 50 to 80 percent."
      kind: "unthresholded"
      measured: false
      reason: "the document gives no threshold or date for this falsifier"
    us_access: "Coinbase"
    market_cap_in_document: "$1.81B"
    odds:
      operator_10x: "12–15%"
      operator_100x: "~0"
      operator_10x_pct: [12.0, 15.0]
      operator_100x_pct: [0.0, 0.0]
      dated: 2026-10-12
      source: docs/scans/crypto-basket-summary-2026-10-12.md
    operator_restatement: null
