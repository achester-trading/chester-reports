    case_for: "Maple is the fastest-growing version of private credit done on a blockchain, and private credit is the trend institutions are already moving into. It is small enough that a tenfold rise, about $3 billion, would only put it back among the top 30 or 35 coins. Of the twelve names here it has the only realistic path to a hundredfold outcome, because its starting size is so small relative to the market it serves."
    case_against: "Lending is a loss business until it is not. Maple's own history includes defaults in 2022 when borrowers failed, and a bad credit cycle could take the token down 80 to 90 percent. Only a tenth of its revenue reaches the token through buybacks, and whether a US resident can buy it on a major exchange was not verified. It is a credit book, and it will behave like one."
