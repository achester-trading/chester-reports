# Monthly Macro Report — automated generation

name: Monthly Macro Report

on:
   workflow_dispatch:

permissions:
  contents: write   # required to commit the run snapshot back to the repo

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALTDATA_STORE: data_store
          SNAPSHOT_DIR: snapshots
        run: python -m monthly_macro.run --verbose

      - name: Commit run snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Snapshot: monthly macro run $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload report files as run artifact
        uses: actions/upload-artifact@v5
        with:
          name: monthly-macro-report
          path: |
            reports/*.md
            reports/*.html
          retention-days: 90
