# Monthly Macro Report — automated generation

name: Monthly Macro Report

on:
  # 06:00 UTC on the 1st. This replaces cron-job.org, which fired the same
  # schedule through the dispatch API using a PAT that needed renewing in April
  # 2027. GitHub's own scheduler removes the third party, the token and the
  # calendar item at once.
  #
  # PROVE, THEN RETIRE. Do not delete the external job until one run has fired
  # from here -- the workflow had `workflow_dispatch` and no `schedule` for its
  # whole life, so this line has never been exercised.
  #
  # The 60-day inactivity rule that disables scheduled workflows is not a risk
  # here: registry-check.yml runs on every push, so the repository is never
  # idle for 60 days while this one is expected to fire.
  #
  # UTC, because GitHub's cron has no timezone. 06:00 UTC is 01:00 or 02:00 ET
  # depending on DST -- an hour of drift twice a year, which is immaterial for
  # a monthly report and is the reason this is not worth working around.
  schedule:
    - cron: "0 6 1 * *"

  workflow_dispatch:

permissions:
  contents: write   # required to commit the run snapshot back to the repo

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          # Full history so a rebase can replay cleanly if the remote moved
          # ahead while this run was in flight.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALTDATA_STORE: data_store
          SNAPSHOT_DIR: snapshots
          CHESTER_STATE_URL: ${{ secrets.CHESTER_STATE_URL }}
          CHESTER_STATE_TOKEN: ${{ secrets.CHESTER_STATE_TOKEN }}
        run: python -m monthly_macro.run --verbose

      # Upload BEFORE the commit step. The report is the product; a git
      # problem must never cost you the artifact.
      - name: Upload report files as run artifact
        uses: actions/upload-artifact@v5
        with:
          name: monthly-macro-report
          path: |
            reports/*.md
            reports/*.html
          retention-days: 90

      # Snapshot persistence is best-effort. If someone commits to main while
      # this run is in flight, rebase and retry rather than failing the run.
      - name: Commit run snapshot
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "Snapshot: monthly macro run $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            if git push; then
              echo "Snapshot pushed."
              exit 0
            fi
            echo "Push rejected — rebasing onto remote and retrying."
            git pull --rebase --autostash origin main || {
              echo "Rebase failed; leaving remote untouched."
              exit 0
            }
          done
          echo "Could not push snapshot after 3 attempts. Report is unaffected;"
          echo "next run will write a fresh snapshot."
