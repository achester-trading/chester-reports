# Monthly Macro Report — automated generation

name: Monthly Macro Report

on:
  schedule:
    - cron: "10 23 * * *"  # TEMP TEST 4 — fires at 23:10 UTC (7:10 PM ET); revert after test confirms
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALTDATA_STORE: data_store
        run: python -m monthly_macro.run --verbose

      - name: Upload report files as run artifact
        uses: actions/upload-artifact@v5
        with:
          name: monthly-macro-report
          path: |
            reports/*.md
            reports/*.html
          retention-days: 90
