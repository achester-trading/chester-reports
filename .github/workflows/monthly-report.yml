# Monthly Macro Report — automated generation

name: Monthly Macro Report

on:
  # THE SCHEDULE IS GONE, AND THE BOX IS THE SCHEDULER (Phase 4b piece 4).
  #
  # This workflow briefly held `schedule: 0 6 1 * *` as the replacement for
  # cron-job.org. Both are now retired in favour of chester-monthly.timer, which
  # fires on the 1st at 07:30 America/New_York -- and the move is not about
  # tidiness:
  #
  #   THE STORE IS ON THE BOX. A runner starts with an empty checkout, so a
  #   scheduled run here would pull 59 FRED series from scratch and compute a
  #   report with no market-state object, no register, no grades and no
  #   probability ledger -- every one of which lives in data/chester.db, which is
  #   gitignored. The six-section Monthly would print five absences.
  #
  #   THE ZONE IS REAL NOW. GitHub's cron has no timezone and 06:00 UTC drifts an
  #   hour twice a year; the report fires forty-five minutes after the 06:45 ET
  #   overnight pass and thirty after the 07:00 anchor, and those offsets only hold
  #   if all three are pinned to the same zone.
  #
  # WHAT THIS WORKFLOW IS FOR NOW: a manual fallback. `workflow_dispatch` stays so
  # a report can be produced from CI when the box is unreachable -- with the
  # absences that implies, honestly rendered rather than hidden.
  #
  # cron-job.org is deleted by the operator on 30 September 2026; see the status
  # ledger in docs/chester-reports-audit-3.md.
  workflow_dispatch:

permissions:
  contents: write   # required to commit the run snapshot back to the repo

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          # Full history so a rebase can replay cleanly if the remote moved
          # ahead while this run was in flight.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALTDATA_STORE: data_store
          SNAPSHOT_DIR: snapshots
          CHESTER_STATE_URL: ${{ secrets.CHESTER_STATE_URL }}
          CHESTER_STATE_TOKEN: ${{ secrets.CHESTER_STATE_TOKEN }}
        run: python -m monthly_macro.run --verbose

      # Upload BEFORE the commit step. The report is the product; a git
      # problem must never cost you the artifact.
      - name: Upload report files as run artifact
        uses: actions/upload-artifact@v5
        with:
          name: monthly-macro-report
          path: |
            reports/*.md
            reports/*.html
          retention-days: 90

      # Snapshot persistence is best-effort. If someone commits to main while
      # this run is in flight, rebase and retry rather than failing the run.
      - name: Commit run snapshot
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "Snapshot: monthly macro run $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            if git push; then
              echo "Snapshot pushed."
              exit 0
            fi
            echo "Push rejected — rebasing onto remote and retrying."
            git pull --rebase --autostash origin main || {
              echo "Rebase failed; leaving remote untouched."
              exit 0
            }
          done
          echo "Could not push snapshot after 3 attempts. Report is unaffected;"
          echo "next run will write a fresh snapshot."
