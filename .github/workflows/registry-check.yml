# The gates. Every validator this repo ships, each in its own job.
#
# WHY A MATRIX AND NOT SEQUENTIAL STEPS. As a single job the gates ran in
# order and the first failure ended the run, so a change touching two areas
# reported one problem and hid the other -- and the fix-rerun-discover-the-next
# loop cost a round trip per defect. `fail-fast: false` runs all of them and
# reports all of them, which is what a human wants after a change: not "what
# did I break first" but "what did I break".
#
# It also isolates them. A gate that dies on an import error no longer takes
# the rest of the suite with it, which is exactly how tools/validate_backup.py
# hid a syntax error for two commits while its siblings kept passing.
#
# THE LIST LIVES IN THE MAKEFILE, NOT HERE. `make validate` and this workflow
# read one list, so neither can quietly hold a shorter one -- which is how four
# validators drifted out of CI while still passing locally. The matrix below is
# generated from the Makefile at run time.
#
# Runs on every push and pull request, because the failures these catch are
# introduced by a code edit and are cheapest to fix in the same change.

name: Gates

on:
  # EVERY BRANCH PUSH (5 Oct 2026): a branch's full validate runs in CI before
  # it is merged, rather than only on main after the merge.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# ONE RUN PER BRANCH (B100, 1 Nov 2026). A push runs 150 to 175 jobs, and a second
# push to the same branch while the first is queued doubled that: the operator
# cancelled five such runs by hand on 28 Oct. A branch's runs share one group, so
# a new push cancels its older queued or running run.
#
# ONE PENDING RUN FOR MAIN (B111, ruling (d) of 2 Nov 2026). main now shares one
# group too, but never cancels in progress: the run already going always
# completes, and of the runs waiting behind it GitHub keeps only the newest (a new
# pending run replaces the older pending one). During the merge week that is one
# run per merge burst rather than one per merge. A run for a given merge commit
# can therefore be cancelled while pending: read the newest COMPLETED run for the
# merge commit, never the run listed first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # THE RUNNER IS PINNED (T2.6, 8 Oct 2026): GitHub moves ubuntu-latest to Ubuntu
  # 26 on 19 Oct, inside the freeze week, and a gate's verdict must not change
  # because the image under it did. Every job here and in monthly-report.yml says
  # ubuntu-24.04; tools/validate_deploy.py refuses `-latest` in any workflow.
  #
  # One job resolves both lists so the matrices and the Makefile cannot disagree.
  #
  # TWO LISTS, BECAUSE THERE ARE TWO KINDS OF CHECK. A code gate returns the same
  # verdict forever given the same source, so its failure is a regression in the
  # commit under test and must fail the build. A DATA GATE's verdict depends on the
  # data on the box that runs it -- validate_iv_solver reads a captured chain --
  # so on a CI runner, which has no captured chains at all, its answer says nothing
  # about the commit. `make list-code` and `make list-data` print them bare, one
  # per line, so nothing here has to parse the human-readable `make list`.
  #
  # THE DOCS-ONLY PUSH (B111, ruling (c) of 2 Nov 2026). A push whose changed files
  # are ALL under docs/briefs/ or docs/pastes/ runs the docs set only:
  # check_library, check_registry and check_master_guide, taken from
  # `make list-code` so the set cannot name a gate the Makefile lacks. Every other
  # push, every pull request and every manual run gets the full lists. `paths-ignore`
  # cannot say "only these paths" for one subset of the jobs, so this job computes
  # the changed files (the push's before..after) and narrows the matrix itself; one
  # workflow keeps one required check. When the changed set cannot be read -- a new
  # branch, a force-push whose old tip is gone, an empty diff -- it runs the full set.
  #
  # THE JOBS ARE GROUPED (B122, 2 Nov 2026; B107's "later" item). The fast gates run
  # a group to a job, one at a time, each still reported by name; the slow ones
  # and the two with a job of their own run alone. `tools/ci_groups.py matrix`
  # makes both lists from `make list-code` and config/ci_groups.yaml, so the
  # workflow never names a gate, and validate_gates group E holds every code gate
  # to exactly one job. `gates` stays the full list, for the record and the log.
  enumerate:
    runs-on: ubuntu-24.04
    outputs:
      gates: ${{ steps.list.outputs.gates }}
      data: ${{ steps.list.outputs.data }}
      alone: ${{ steps.list.outputs.alone }}
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v5
      # ci_groups.py reads its YAML; the runner's own python3 may not carry PyYAML.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - id: scope
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          scope=full
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER" || true)
            if [ -n "$changed" ] && ! echo "$changed" | grep -Ev '^docs/(briefs|pastes)/' | grep -q .; then
              scope=docs
            fi
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Scope: $scope"
      - id: list
        env:
          SCOPE: ${{ steps.scope.outputs.scope || 'full' }}
        run: |
          as_json() { python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))'; }
          if [ "$SCOPE" = docs ]; then
            gates=$(make list-code | grep -E '\.(py|sh)$' \
              | grep -Fx -e tools/check_library.py -e tools/check_registry.py -e tools/check_master_guide.py | as_json)
            data='[]'
            make list-code | grep -E '\.(py|sh)$' | python tools/ci_groups.py matrix --docs >> "$GITHUB_OUTPUT"
          else
            gates=$(make list-code | grep -E '\.(py|sh)$' | as_json)
            data=$(make list-data  | grep -E '\.(py|sh)$' | as_json)
            make list-code | grep -E '\.(py|sh)$' | python tools/ci_groups.py matrix >> "$GITHUB_OUTPUT"
          fi
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "data=$data"  >> "$GITHUB_OUTPUT"
          echo "Scope: $SCOPE"
          echo "Code gates: $gates"
          echo "Data gates: $data"
          make list-code | grep -E '\.(py|sh)$' | python tools/ci_groups.py --by-group

  # The gates that run ALONE (B122): config/ci_groups.yaml's `alone` list.
  gate:
    needs: enumerate
    if: needs.enumerate.outputs.alone != '[]'
    runs-on: ubuntu-24.04
    # STOPGAP, 12 Oct 2026: tools/validate_session_calendar.sh alone gets 20.
    # Diagnosis: its stand-in interpreter passed every `-m` call through, so the
    # cron's run path did two LIVE feeds pulls (plus features, events, surprise)
    # and the gate's time grew with the writer roster -- 1,049 s on the laptop on
    # aq-3-series-2 (37 writers, 114 FRED series; main 24 and 83), over the ten
    # minutes in runs #286 and #295. The gate is fixed in the same branch (only
    # `-m altdata.session` is real); this allowance can return to 10 once the
    # fix has shown the gate well inside it.
    timeout-minutes: ${{ matrix.gate == 'tools/validate_session_calendar.sh' && 20 || 10 }}
    strategy:
      # THE POINT OF THIS FILE. Every gate reports, whatever the others do.
      fail-fast: false
      matrix:
        gate: ${{ fromJson(needs.enumerate.outputs.alone) }}

    name: ${{ matrix.gate }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        id: py
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # THE INSTALLED PACKAGES ARE CACHED (B111, ruling (b) of 2 Nov 2026). `cache:
      # pip` above keeps only pip's downloads, so every job still installed: 53 of
      # the green run's 134.5 job-minutes, about 20 s in each of 165 jobs (B107).
      # This restores the interpreter's whole tree, packages installed, keyed on the
      # OS, the exact Python version and requirements.txt's hash; any change to
      # either is a new key. A hit skips the install; a miss runs it as before.
      - name: Restore installed packages
        id: pkgs
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: gates-pkgs-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      # The full requirements, not a hand-picked subset. The old workflow
      # installed only PyYAML and worked because no covered module happened to
      # import pandas -- an undeclared invariant that one new import would have
      # broken, with a failure message about the import rather than the rule.
      # It is the cache-miss path: on a hit the packages are already installed.
      - name: Install dependencies
        if: steps.pkgs.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Shell gates run under bash, Python gates under python. The suffix is
      # the only difference and the Makefile already encodes which is which.
      - name: ${{ matrix.gate }}
        run: |
          case "${{ matrix.gate }}" in
            *.sh) bash "${{ matrix.gate }}" ;;
            *)    python "${{ matrix.gate }}" ;;
          esac

  # THE GROUPED GATES (B122). One job per group of config/ci_groups.yaml. The job
  # runs its gates one at a time (python, or bash for .sh, as above), prints a
  # PASS or FAIL line per gate with its name and tally, writes the same lines to
  # the job summary, and fails if any gate failed -- so a red still names its gate.
  # Each gate keeps its ten minutes (ci_groups.GATE_TIMEOUT_S); the job's
  # allowance is the group's, at most 45 minutes.
  group:
    needs: enumerate
    if: needs.enumerate.outputs.groups != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.enumerate.outputs.groups) }}

    name: "group: ${{ matrix.group }}"

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        id: py
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # The same cache as the gate job's (B111): one key, one restore.
      - name: Restore installed packages
        id: pkgs
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: gates-pkgs-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.pkgs.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "group: ${{ matrix.group }}"
        run: |
          make list-code | grep -E '\.(py|sh)$' | python tools/ci_groups.py run "${{ matrix.group }}"

  # DATA GATES, REPORTED AND NOT REQUIRED.
  #
  # A CI runner is a fresh checkout with no captured chains, so a data gate cannot
  # reach the data its verdict is about. Until 2 Oct 2026 the five failed here on
  # every push behind continue-on-error -- a build that is always red is a build
  # nobody reads. Each now prints "skipped: box-only" and exits 0 under GitHub
  # Actions (tools/box_only.py); `make data-gates` on the box is where the verdict
  # actually means something. Still not required by gates-passed.
  #
  # It is deliberately NOT in `needs` for gates-passed below.
  data-gate:
    needs: enumerate
    if: needs.enumerate.outputs.data != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No error-tolerance flag (6d, 2 Oct 2026): each data gate now SKIPS explicitly
    # under GitHub Actions -- "skipped: box-only", exit 0 (tools/box_only.py) --
    # so a red leg here is a real failure, not the expected one.
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJson(needs.enumerate.outputs.data) }}
    name: "data: ${{ matrix.gate }}"
    steps:
      - uses: actions/checkout@v5
      - id: py
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # The same cache as the gate job's (B111): one key, one restore.
      - id: pkgs
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: gates-pkgs-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - if: steps.pkgs.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ${{ matrix.gate }}
        run: |
          case "${{ matrix.gate }}" in
            *.sh) bash "${{ matrix.gate }}" ;;
            *)    python "${{ matrix.gate }}" ;;
          esac

  # A single required check to point branch protection at, since the matrix
  # legs have generated names that change when a gate is added.
  gates-passed:
    needs: [enumerate, gate, group]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All gates passed
        env:
          ALONE: ${{ needs.enumerate.outputs.alone }}
          GROUPS: ${{ needs.enumerate.outputs.groups }}
        run: |
          # needs: the code jobs only (enumerate is there for its outputs). The
          # data-gate job is EXCLUDED on purpose -- its verdict is about the data on
          # the machine that runs it, and a CI runner has no captured chains, so its
          # result says nothing about this commit. Adding it here would make the
          # required check depend on data CI does not have. See its comment.
          #
          # B122: two code jobs, `gate` (the lone gates) and `group`. Each must be
          # success. The one exception is a job skipped because its list was empty
          # (the docs-only push has no lone gates); a cancelled leg, a failed one,
          # or a job skipped for any other reason still fails this check.
          if [ "${{ needs.enumerate.result }}" != "success" ]; then
            echo "The enumerate job did not succeed -- no gate list, so no verdict."
            exit 1
          fi
          if [ "${{ needs.gate.result }}" != "success" ] && ! { [ "${{ needs.gate.result }}" = "skipped" ] && [ "$ALONE" = "[]" ]; }; then
            echo "At least one CODE gate failed -- see the individual jobs above."
            exit 1
          fi
          if [ "${{ needs.group.result }}" != "success" ] && ! { [ "${{ needs.group.result }}" = "skipped" ] && [ "$GROUPS" = "[]" ]; }; then
            echo "At least one CODE gate in a group failed -- see the group jobs' PASS/FAIL lines."
            exit 1
          fi
          echo "Every code gate passed. Data gates report separately."
