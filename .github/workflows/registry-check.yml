# The gates. Every validator this repo ships, each in its own job.
#
# WHY A MATRIX AND NOT SEQUENTIAL STEPS. As a single job the gates ran in
# order and the first failure ended the run, so a change touching two areas
# reported one problem and hid the other -- and the fix-rerun-discover-the-next
# loop cost a round trip per defect. `fail-fast: false` runs all of them and
# reports all of them, which is what a human wants after a change: not "what
# did I break first" but "what did I break".
#
# It also isolates them. A gate that dies on an import error no longer takes
# the rest of the suite with it, which is exactly how tools/validate_backup.py
# hid a syntax error for two commits while its siblings kept passing.
#
# THE LIST LIVES IN THE MAKEFILE, NOT HERE. `make validate` and this workflow
# read one list, so neither can quietly hold a shorter one -- which is how four
# validators drifted out of CI while still passing locally. The matrix below is
# generated from the Makefile at run time.
#
# Runs on every push and pull request, because the failures these catch are
# introduced by a code edit and are cheapest to fix in the same change.

name: Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # One job resolves both lists so the matrices and the Makefile cannot disagree.
  #
  # TWO LISTS, BECAUSE THERE ARE TWO KINDS OF CHECK. A code gate returns the same
  # verdict forever given the same source, so its failure is a regression in the
  # commit under test and must fail the build. A DATA GATE's verdict depends on the
  # data on the box that runs it -- validate_iv_solver reads a captured chain --
  # so on a CI runner, which has no captured chains at all, its answer says nothing
  # about the commit. `make list-code` and `make list-data` print them bare, one
  # per line, so nothing here has to parse the human-readable `make list`.
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.list.outputs.gates }}
      data: ${{ steps.list.outputs.data }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          as_json() { python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))'; }
          gates=$(make list-code | grep -E '\.(py|sh)$' | as_json)
          data=$(make list-data  | grep -E '\.(py|sh)$' | as_json)
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "data=$data"  >> "$GITHUB_OUTPUT"
          echo "Code gates: $gates"
          echo "Data gates: $data"

  gate:
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # THE POINT OF THIS FILE. Every gate reports, whatever the others do.
      fail-fast: false
      matrix:
        gate: ${{ fromJson(needs.enumerate.outputs.gates) }}

    name: ${{ matrix.gate }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # The full requirements, not a hand-picked subset. The old workflow
      # installed only PyYAML and worked because no covered module happened to
      # import pandas -- an undeclared invariant that one new import would have
      # broken, with a failure message about the import rather than the rule.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Shell gates run under bash, Python gates under python. The suffix is
      # the only difference and the Makefile already encodes which is which.
      - name: ${{ matrix.gate }}
        run: |
          case "${{ matrix.gate }}" in
            *.sh) bash "${{ matrix.gate }}" ;;
            *)    python "${{ matrix.gate }}" ;;
          esac

  # DATA GATES, REPORTED AND NOT REQUIRED.
  #
  # continue-on-error, and the reason is not leniency: a CI runner is a fresh
  # checkout with no captured chains, so this gate cannot reach the data its
  # verdict is about. Requiring it would make every build red for the absence of
  # something CI was never going to have, and a build that is always red is a
  # build nobody reads. It runs so the output is on the record; `make data-gates`
  # on the box is where the verdict actually means something.
  #
  # It is deliberately NOT in `needs` for gates-passed below.
  data-gate:
    needs: enumerate
    if: needs.enumerate.outputs.data != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJson(needs.enumerate.outputs.data) }}
    name: "data: ${{ matrix.gate }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ${{ matrix.gate }}
        run: |
          case "${{ matrix.gate }}" in
            *.sh) bash "${{ matrix.gate }}" ;;
            *)    python "${{ matrix.gate }}" ;;
          esac

  # A single required check to point branch protection at, since the matrix
  # legs have generated names that change when a gate is added.
  gates-passed:
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: |
          # needs: [gate] only. The data-gate job is EXCLUDED on purpose -- its
          # verdict is about the data on the machine that runs it, and a CI runner
          # has no captured chains, so its result says nothing about this commit.
          # Adding it here would make the required check depend on data CI does
          # not have. See the data-gate job's comment.
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "At least one CODE gate failed -- see the individual jobs above."
            exit 1
          fi
          echo "Every code gate passed. Data gates report separately."
