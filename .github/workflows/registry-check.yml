# Registry gate — no metric feeds a decision without a registry entry.
#
# The single check standing behind metrics_registry.yaml and
# source_registry.yaml. A registry nobody validates is a document, not a
# control: it drifts the first time someone adds a column, and the drift is
# invisible until a decision gets made on an unregistered number.
#
# Runs on every push and pull request, because the failure it catches is
# introduced by a code edit and is cheapest to fix in the same change.

name: Registry gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Only what the check itself needs. The gate reads the registries and
      # imports altdata.config and tools.pin_log for their declared members;
      # it does not fetch anything, so the heavy data dependencies stay out.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyYAML>=6.0"

      - name: Registry gate
        run: python tools/check_registry.py --verbose
