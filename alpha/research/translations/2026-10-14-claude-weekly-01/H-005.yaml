# H-005, "At a long-end extreme, the term premium sets the direction", in
# grammar v1.
batch_id: 2026-10-14-claude-weekly-01
batch_sha256: 6fdc4dc7a32d659375e22e0dbe1293b480b4c0877c48174a8cc8272d14446626
local_id: H-005
translated_at: "2026-10-14"
translator: "session B, alpha-lab-2"
translation_note: >-
  Faithful, with three readings. The 95th percentile over five years is over the
  trailing 1,260 stored daily observations of the 10-year yield (fred.yield_10y).
  The branch is the ACM 10-year term premium's change over its last 20 stored
  observations: above zero shorts TLT, otherwise (zero included) longs it. TLT
  carries stored closes only, so the entry is the next session's close and the
  20-day ATR is the mean absolute close-to-close move; the stop is checked on
  closes. The pre-2002 proxy variant (yield change x duration) is not expressed:
  it needs a duration, which the store does not hold.
rule_dsl:
  grammar: alpha-lab-rules/v1
  universe: [TLT]
  cadence: friday_close
  trigger:
    - {series: fred.yield_10y, transform: percentile, w: 1260, op: ">=", value: 95}
  direction:
    if: {series: acm.term_premium_10y, transform: change, n: 20, op: ">", value: 0}
    then: short
    else: long
  instrument: TLT
  entry: next_close
  exits:
    stop: {atr: 1.5, n: 20}
    time: 40
  conditioning:
    - name: term_premium_rising
      condition: {series: acm.term_premium_10y, transform: change, n: 20, op: ">", value: 0}
