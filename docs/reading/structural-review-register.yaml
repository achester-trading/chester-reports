# Papers on open library branches, rowed here when they merge: XXVII (Debt
# Cycles, Regimes, and Environments; review month 9) and XXXI (the Top & Bottom
# Report Manual; review month 11).

# THE STANDING REGISTER OF WHAT COULD CHANGE (Audit 2 §5.3, "the first version,
# from the brief"). Each change names the papers it touches and a measurable
# tripwire. `status` is the review's word for its indicator: watching (no
# measurement stored yet), quiet, near, crossed. A crossed tripwire opens the
# review of the papers it touches within the month (XXXII §5); the Doctrine
# monthly decides.
changes:
  - {id: C01, change: "AI transforms research; autonomous agents trade", papers: [XXV, XVIII, XIX, XXX, XII], tripwire: "share of volume attributed to algorithmic/agentic flow; a named agentic-trading incident; a change in the dispersion of analyst estimates", status: watching}
  - {id: C02, change: "Widespread algorithmic price discovery; automated liquidity provision", papers: [XXX, XIII, XVI], tripwire: "non-bank market-maker share of equity/options volume; a liquidity event with no dealer in the middle", status: watching}
  - {id: C03, change: "Tokenization; blockchain settlement; 24/7 markets", papers: [IX, XXX, XII, XV], tripwire: "tokenized Treasury/equity notional; a major exchange extending hours; T+0 in a major market", status: watching}
  - {id: C04, change: "Prediction markets as information markets", papers: [XII, XXIV, XVIII], tripwire: "open interest on a macro/earnings contract exceeding a stated notional; a documented lead over consensus", status: watching}
  - {id: C05, change: "New derivative structures; changing exchanges; clearing/collateral changes", papers: [XXII, XIII, XI, XXX], tripwire: "a new listed product class crossing a volume threshold; a CCP margin-model change; a clearing failure", status: watching}
