# The standing structural-review register (Paper XXXII, The Annual Structural
# Review; Audit 2 §5, decision 1 of 7 September 2026: "the standing register as a
# file the gate reads"). Seeded 24 October 2026 by session A (A73) from the library
# guide's at-a-glance rows and each paper's masthead.
#
# THE GATE READS THIS FILE. tools/check_library.py check 15 warns when a paper on
# the roster has no row here, and when a paper's review clock is past thirteen
# months: the clock runs from `last_reviewed`, or from `version_date` while a
# paper has never been reviewed. One row per paper, in flow style, one line each,
# so the gate can read it without a YAML parser.
#
# Fields:
#   numeral        the paper's roster numeral (the guide is canonical for it)
#   slug           its file, docs/whitepapers/<slug>-whitepaper.md
#   version        as the guide's at-a-glance row and the masthead carry it
#   version_date   the version's date (a month-only date is that month's first)
#   last_reviewed  the date of the paper's last structural review, or null
#   review_month   the month of the paper's annual review (1-12; XXXII §4)
#   status         never reviewed | reviewed: <decision> | in review
#   log            where the last review's log lives, or null
#
# Edited by the review session that reviews a paper, never by a writing session:
# a new version moves `version` and `version_date`, not `last_reviewed`.
version: structural-review-register-1
seeded: 2026-10-24

