<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" style="font-family:Georgia,serif;"><text x="14" y="22" font-size="14" font-weight="bold" fill="#0f2747">Figure 16 — Four books, four clocks, one spot price</text><rect x="70" y="56" width="120" height="44" rx="4" fill="#DCFCE7" stroke="#2F5E3A" stroke-width="1.8"/><text x="80" y="76" font-size="13" font-weight="bold" fill="#2F5E3A">0DTE</text><text x="80" y="92" font-size="11" fill="#2F5E3A">shelf life: hours</text><text x="208" y="83" font-size="11.5" fill="#5B5E66">36% of book · rebuilt every session · governs the last 2 hours</text><rect x="70" y="120" width="220" height="44" rx="4" fill="#DCFCE7" stroke="#2F5E3A" stroke-width="1.8"/><text x="80" y="140" font-size="13" font-weight="bold" fill="#2F5E3A">Weekly</text><text x="80" y="156" font-size="11" fill="#2F5E3A">shelf life: days</text><text x="308" y="147" font-size="11.5" fill="#5B5E66">30% · event hedges · governs this week’s corridor</text><rect x="70" y="184" width="380" height="44" rx="4" fill="#E8EDF4" stroke="#0f2747" stroke-width="1.8"/><text x="80" y="204" font-size="13" font-weight="bold" fill="#0f2747">Monthly</text><text x="80" y="220" font-size="11" fill="#0f2747">shelf life: weeks</text><text x="468" y="211" font-size="11.5" fill="#5B5E66">26% · institutional hedges &amp; overwriting · THE regime map</text><rect x="70" y="248" width="540" height="44" rx="4" fill="#FAFAF9" stroke="#5B5E66" stroke-width="1.8"/><text x="80" y="268" font-size="13" font-weight="bold" fill="#5B5E66">Quarterly</text><text x="80" y="284" font-size="11" fill="#5B5E66">shelf life: months</text><text x="628" y="275" font-size="11.5" fill="#5B5E66">8% · JHEQX-class collars · the bookends</text><text x="70" y="320" font-size="11.5" fill="#5B5E66">bar length ≈ shelf life (log scale). Shares from the reference Friday 0700 bucket table.</text></svg>