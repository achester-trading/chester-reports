<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11"><rect x="0" y="0" width="680" height="404" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><text x="62" y="20" font-size="12.5" font-weight="600" fill="#1a1a1a">Figure 1 · The cascade as a loop: a move that changes constraints produces the next move</text><rect x="240" y="52" width="200" height="44" rx="8" fill="#fff" stroke="#3a5f8a" stroke-width="1.6"/><text x="340" y="78" text-anchor="middle" font-weight="600" fill="#3a5f8a" font-size="12">1. A price move</text><rect x="435" y="145" width="210" height="66" rx="8" fill="#fff" stroke="#3a5f8a" stroke-width="1.6"/><text x="540" y="174" text-anchor="middle" font-weight="600" fill="#3a5f8a" font-size="12">2. Constraints tighten</text><text x="540" y="190" text-anchor="middle" fill="#5b5b5b" font-size="10">margin, value-at-risk, volatility targets,</text><text x="540" y="202" text-anchor="middle" fill="#5b5b5b" font-size="10">redemptions, the dealer's hedge</text><rect x="235" y="251" width="210" height="54" rx="8" fill="#fff" stroke="#3a5f8a" stroke-width="1.6"/><text x="340" y="274" text-anchor="middle" font-weight="600" fill="#3a5f8a" font-size="12">3. Forced flow meets depth</text><text x="340" y="290" text-anchor="middle" fill="#5b5b5b" font-size="10">trades in the move's direction</text><rect x="40" y="151" width="200" height="54" rx="8" fill="#fff" stroke="#3a5f8a" stroke-width="1.6"/><text x="140" y="174" text-anchor="middle" font-weight="600" fill="#3a5f8a" font-size="12">4. The move extends</text><text x="140" y="190" text-anchor="middle" fill="#5b5b5b" font-size="10">by flow divided by depth</text><line x1="440" y1="84" x2="520" y2="144" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/><line x1="520" y1="212" x2="430" y2="262" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/><line x1="250" y1="268" x2="170" y2="206" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/><line x1="160" y1="150" x2="238" y2="90" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/><text x="340" y="182" text-anchor="middle" fill="#1a1a1a" font-size="11.5" font-weight="600">the loop</text><text x="340" y="198" text-anchor="middle" fill="#5b5b5b" font-size="10">each turn tightens the next</text><path d="M235,290 C180,320 130,330 96,334" fill="none" stroke="#2f6f4f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="62" y="350" fill="#2f6f4f" font-size="10.5" font-weight="600">Damps</text><text fill="#5b5b5b" font-size="10"><tspan x="106" y="350">depth absorbs the flow, or a buyer</tspan><tspan x="106" y="362">outside the constraints steps in</tspan></text><path d="M445,290 C500,320 560,330 600,334" fill="none" stroke="#9c3b3b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="658" y="350" fill="#9c3b3b" font-size="10.5" font-weight="600" text-anchor="end">Runs</text><text fill="#5b5b5b" font-size="10" text-anchor="end"><tspan x="618" y="350">shared constraint shapes, thin depth:</tspan><tspan x="618" y="362">the loop goes round again</tspan></text><text fill="#5b5b5b" font-size="10"><tspan x="62" y="383">Conceptual: no series. Whether the loop dies or runs depends on how much capital sits under constraints </tspan><tspan x="62" y="396">of the same shape, and on how deep the market is (Chapter 6).</tspan></text></svg>
