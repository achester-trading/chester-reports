# STORED SOURCE STRINGS THAT ARE NOT IDS (AUD-3a item 4). A row's `source` is the
# string its writer wrote and the store is append-only, so an old string is read
# through altdata/source_ids.py: an id is itself, `<id>:<variant>` (kalshi:backfill,
# fred:csv_migrated) is <id>, and a string listed here is the id beside it. Each
# alias needs a reason; a string that is none of these is printed by
# tools/check_store_registry.py rather than guessed at.
#
# An alias is either an id (the string always means it) or `by_key_family`: the
# id depends on the row's registry key, matched by prefix (a trailing `*` marks a
# family, so tools/validate_config_refs.py does not read it as a misspelled
# metric id; an exact registered key needs none), first match wins, and a
# key no line matches leaves the string off the list. Ruled 15 Oct 2026: a bare
# `ibkr` resolves by the metric's family, to the id that family's writer writes
# today (`ibkr_paper` or `ibkr_stock_loan`), so these lines read any row stored
# under the bare string the way its family's current rows read. The costs and what-if paths
# write no observation (their packets carry ibkr_<mode>, a registered id), so they
# have no family here; the trade log's `executions.source` fallback `ibkr` is its
# own table, which the store check does not read.
stored_aliases:
  ibkr:
    by_key_family:
      - prefix: ibkr.auction_*
        source: ibkr_paper
        reason: >-
          The closing-auction rows: altdata/loggers/auction.py writes them as
          ibkr_paper today, the Gateway session they are read through (the feed
          behind it is the ibkr_md_nyse_imbalances subscription).
      - prefix: ibkr.borrow_probe
        source: ibkr_paper
        reason: >-
          The borrow probe tests the Gateway connection itself;
          altdata/loggers/borrow.py writes it as ibkr_paper.
      - prefix: ibkr.stock_loan_file_probe
        source: ibkr_paper
        reason: >-
          The stock-loan file's reachability probe; altdata/loggers/borrow.py
          writes it as ibkr_paper.
      - prefix: ibkr.borrow_*
        source: ibkr_stock_loan
        reason: >-
          The borrow fee and rebate rates come from IBKR's stock-loan file
          (altdata/loggers/borrow.py writes them as ibkr_stock_loan).
      - prefix: ibkr.shortable_shares
        source: ibkr_stock_loan
        reason: Shortable shares, from the same stock-loan file.

# Which source wins when two describe the same fact. Tier order does the work;
# this records the one live collision so it is not re-derived each time.
precedence:
  - fact: option chain for a symbol both vendors serve
    winner: massive
    loser: yfinance
    reason: >-
      A1 redistributed primary outranks a C-tier unofficial mirror. Not yet
      exercised -- the two universes are currently disjoint (massive serves only
      SPX and SPCX) -- but it is the rule the day they overlap.
  - fact: real-time option quotes for a symbol both serve
    winner: massive
    loser: ibkr_md_opra
    reason: >-
      SPLIT BY ROLE, NOT BY TIER -- both are A1, so tier decides nothing here
      and something else has to. Massive is the options warehouse and the only
      one: it serves history, it is what every stored chain was captured from,
      and a second warehouse would mean two disagreeing OI series with no rule
      to pick between them. OPRA's entitlement is a real-time WINDOW for the
      intraday cadence (09:45 0DTE), where massive's 15-minute delay is the
      named gap it was bought to fill. Outside that cadence OPRA does not
      contribute, and it never backfills -- it serves no history.
    pending: >-
      Not yet exercised. OPRA is unprobed and unwired; this is the rule for the
      day the intraday cadence ships.

  - fact: SPX index level
    winner: ibkr_md_cboe_indexes
    loser: yfinance
    reason: >-
      IF the probe confirms SPX is entitled under Cboe Streaming Indexes, an A1
      redistributed primary outranks the C-tier ^GSPC mirror that fills this
      today. Massive cannot compete for it at all -- I:SPX aggregates return
      HTTP 403, so it is not entitled to the fact.
    pending: >-
      CONDITIONAL on the Tuesday probe. Until it returns, ^GSPC via yfinance
      remains the SPX index level and this row is intent, not practice.
