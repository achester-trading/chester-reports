# source_registry.yaml -- where facts come from, and how much each is worth.
#
# Architecture 26.10. Tiers run A0 (machine-readable primary) -> A1 -> B (global
# wires) -> C (specialist / local) -> D (desks) -> E, and the binding rule is:
# LOWER TIERS NEVER OVERWRITE HIGHER-TIER FACTS. That rule is the reason this
# file exists rather than a comment somewhere -- SPY and SPX overlap today
# across two vendors of different tiers, and something has to say which wins.
#
# `derived` is not one of the architecture's tiers. It is added here for our own
# computations, which are not sources at all: they inherit the tier and the
# timestamp reliability of whatever they read, and saying so explicitly stops a
# derived number from quietly acquiring more authority than its input.
#
# timestamp_reliability is about WHEN, not WHAT. A source can be perfectly
# accurate and still unable to say when its numbers were true; that is a
# different defect and it breaks different things (point-in-time joins, staleness
# checks, the entire pin log, which is keyed on a session).
#
# Every claim below that says "verified" was measured, and the probe that
# measured it is named. Anything not verified says so.

version: 2
updated: 2026-09-05

vocabularies:
  tier: [A0, A1, B, C, D, E, derived]
  timestamp_reliability: [high, medium, low, unknown]
  epistemic_role: [primary_fact, redistributed_primary, unofficial_mirror,
                   cross_check, own_computation]

sources:

  fred:
    name: Federal Reserve Economic Data (St. Louis Fed)
    tier: A0
    epistemic_role: primary_fact
    domain: [macro, rates, credit, fx, sovereign]
    geography: [US, global]
    latency: release-time; series-dependent
    timestamp_reliability: high
    timestamp_notes: >-
      Observations carry their own dates and the store records an as_of per row.
      The known failure here is not timestamps but silent deprecation: roughly
      one to two configured series a year stop updating, and the API returns an
      empty or stale observation set rather than an error.
    license: public domain, API key required
    allowed_reports: [monthly_macro, disruptive_themes, top_bottom, alt_asset,
                      daily_cascade]
    implemented_by: altdata/sources/fred.py
    status: live

  yfinance:
    name: Yahoo Finance (via the unofficial yfinance package)
    tier: C
    epistemic_role: unofficial_mirror
    domain: [equity_prices, option_chains]
    geography: [US]
    latency: near-real-time, undocumented
    timestamp_reliability: medium
    timestamp_notes: >-
      Rows carry lastTradeDate, which the IV solver uses for its staleness gate,
      but the feed publishes no timestamp contract and nothing is guaranteed.
      Treat a quote age as indicative. Separately and importantly: it serves NO
      history for option chains, so an uncaptured session is lost permanently.
    license: none -- unofficial scrape, no SLA, no redistribution right
    allowed_reports: [daily_cascade, gamma_weekly]
    implemented_by:
      - altdata/sources/yfinance_source.py
      - altdata/sources/options_chain.py
    status: live
    caveats:
      - No SPX index options; that gap is why massive was added.
      - Tier C. Where it overlaps a higher tier on the same fact, it loses.

  massive:
    name: Massive (formerly Polygon.io), Options Starter
    tier: A1
    epistemic_role: redistributed_primary
    domain: [option_chains, option_reference, equity_prices]
    geography: [US]
    latency: near-real-time
    timestamp_reliability: high
    timestamp_notes: >-
      Every record carries last_updated to nanosecond precision. ONE SHARP
      EXCEPTION, verified by probe on 5 Sep: open interest has NO timestamp and
      NO history. The `?date=` parameter is ignored -- three different dates
      returned the identical open_interest -- the daily aggregates carry no OI
      field, and the point-in-time contract reference returns terms without it.
      So OI is a live snapshot with no as-of, and any OI history must be
      accumulated by capture, never backfilled.
    license: paid subscription, Starter tier
    allowed_reports: [daily_cascade, gamma_weekly]
    implemented_by: altdata/sources/massive_chain.py
    status: live
    entitlements_verified: 2026-09-05
    entitlements:
      option_reference: served
      option_open_interest: served (live snapshot only)
      option_implied_volatility: NOT served for index underlyings (0/250 sampled
        near the money on SPX and VIX; SPY served 225/250)
      option_greeks: NOT served for index underlyings (same sample)
      index_level: NOT entitled -- I:SPX aggregates return HTTP 403
      history_depth: 2 years, rolling; verified by explicit 403 beyond it
    caveats:
      - >-
        Because IV is not served for index underlyings, every SPX Greek would
        rest on solved IV. SPX and SPCX are therefore INGESTION ONLY today and
        their rows carry greeks_status=pending_solver_gate.
      - >-
        SPCX is a reused ticker. Reference data returns contracts from a prior
        issuer; config.UNDERLYING_VERIFIED_FROM fences them out.

  flashalpha:
    name: FlashAlpha, Basic plan
    tier: C
    epistemic_role: cross_check
    domain: [option_analytics]
    geography: [US]
    latency: near-real-time
    timestamp_reliability: unknown
    timestamp_notes: >-
      Probed 4 Sep and could not be established. No OI field is exposed on any
      endpoint reachable at Basic, so OI vintage is unmeasurable. A 60s intraday
      diff showed the strike grid frozen while gamma_flip moved only as spot
      moved, consistent with recompute over a settled OI base -- consistent
      with, not proof of.
    license: paid subscription, Basic plan
    allowed_reports: []
    implemented_by: tools/cross_check.py
    status: live
    epistemic_note: >-
      NOT A DATA SOURCE. It is an independent recomputation used to cross-check
      our own, and allowed_reports is deliberately empty: nothing it says may
      reach a report directly. Per-strike exposure, OI and flow polarity are all
      gated above Basic, so the intended check -- recomputing from their own
      per-strike payload to catch a silent methodology change -- is impossible.
      What we run instead compares our profile against their aggregate: same
      purpose, weaker evidence.
    rate_limit: 250/day, verified live via X-RateLimit-Limit

  solver_derived:
    name: Implied volatility solved from option prices (Black-76, put-call parity)
    tier: derived
    epistemic_role: own_computation
    domain: [option_analytics]
    geography: [US]
    latency: inherits from the chain it reads
    timestamp_reliability: inherits
    timestamp_notes: >-
      Carries no timestamp of its own; it is as of the chain it was solved from.
    license: n/a
    allowed_reports: [daily_cascade, gamma_weekly]
    implemented_by: tools/iv_solver.py
    status: gated
    gate: tools/validate_iv_solver.py
    gate_status: PASS as of 2026-09-05
    caveats:
      - >-
        Solves the OTM wing and propagates each strike's vol to its ITM twin.
        43-49% of a typical comparison is twinned rather than directly measured
        vol, and the twinned rows carry a 5-8x wider IV tail (p90 0.159-0.355
        against 0.024-0.071). A per-row quality weight is the open follow-up.
      - >-
        Cannot solve 0DTE at a settled capture: 0.0-2.4% coverage across all 13
        symbols, 60-70% rejected on wide spreads. This is why the settled
        profile excludes DTE=0 by rule rather than by workaround.

  nasdaq_data_link:
    name: Nasdaq Data Link -- RTAT10 retail activity datatable
    tier: B
    epistemic_role: unofficial_mirror
    domain: [retail_flow]
    geography: [US]
    latency: >-
      Published daily for the prior session. The API response carries NO publication
      timestamp and the vendor's release lag is not documented in anything this code
      can read, which is why every row -- live and backfilled -- is stamped with the
      write instant and flagged ingest_instant rather than given a reconstructed
      availability it cannot defend.
    timestamp_reliability: medium
    timestamp_notes: >-
      observed_at is the vendor's own session date; available_at is when we wrote
      the row down, which is an upper bound on when we knew.
    license: Nasdaq Data Link terms; key in .env, never committed
    allowed_reports: [daily_cascade]
    implemented_by: altdata/loggers/rtat.py
    status: active
    caveats:
      - >-
        THE SAMPLE IS THE TOP TEN AND IS CENSORED. Absence means "not in the top
        ten", not "no retail activity". Every derived metric carries
        sample: top10_censored and each is wrong in a knowable direction --
        concentration is an upper bound, persistence breaks when a name slips to
        eleventh, and new entrants measure boundary turnover.
      - >-
        LOGGING ONLY (6a). Nothing reads these to make a decision; the analysis that
        would is 6h and gated on 150 graded decisions across two regimes.

  finra:
    name: FINRA equity short data -- Reg SHO daily volume and semi-monthly interest
    tier: A1
    epistemic_role: primary_fact
    domain: [short_flow, short_interest]
    geography: [US]
    latency: >-
      Reg SHO daily files publish the evening of the session. Short interest
      publishes semi-monthly with roughly a fortnight's lag.
    timestamp_reliability: high
    timestamp_notes: >-
      The file carries its own session date, which becomes observed_at. available_at
      is the write instant, which is an upper bound on when we knew.
    license: public FINRA files, no key
    allowed_reports: [daily_cascade]
    implemented_by: altdata/loggers/borrow.py
    status: active
    caveats:
      - >-
        DAILY SHORT VOLUME IS NOT SHORT INTEREST. The first is a flow that includes
        market-maker hedging covered within seconds; the second is the position
        still open at a settlement date. Separate metrics, separate mechanism
        groups, and the ratio between them is not meaningful.
      - >-
        The daily file covers every US symbol; only the tracked universe is stored.
  apewisdom:
    name: ApeWisdom social mention counts and ranks
    tier: D
    epistemic_role: unofficial_mirror
    domain: [social_attention]
    geography: [US]
    latency: trailing-day counts, refreshed through the day
    timestamp_reliability: low
    timestamp_notes: >-
      The API publishes no as-of timestamp for its counting window, so observed_at is
      the session on which it was read. A count is attributed to the day we saw it,
      which is the honest limit rather than a guess at the window.
    license: public API, no key
    allowed_reports: [daily_cascade]
    implemented_by: altdata/loggers/borrow.py
    status: active
    caveats:
      - >-
        THE INSTRUMENT CARRIES THE FEED (TICKER@all-stocks, TICKER@wallstreetbets).
        A count on one venue and a count across all venues measure different
        populations and must never be summed.
      - >-
        A mention count measures who is TALKING, not who is trading -- its own
        mechanism group for that reason, because pairing it with a flow measure as
        confirmation would count an opinion as a transaction.
      - >-
        Tier D and unofficial: a scraped social aggregate with no published
        methodology, logged because its CHANGES may be informative and never because
        its level is authoritative.
  blockchair:
    name: Blockchair Zcash chain statistics
    tier: C
    epistemic_role: unofficial_mirror
    domain: [on_chain]
    geography: [global]
    latency: chain tip, refreshed continuously
    timestamp_reliability: medium
    timestamp_notes: >-
      The endpoint reports a chain tip rather than a dated series, so observed_at is
      the session on which it was read.
    license: public API within its free rate limit, no key
    allowed_reports: [daily_cascade]
    implemented_by: altdata/loggers/shielded.py
    status: gated
    gate: the stored probe zec.shielded_probe
    caveats:
      - >-
        IT DOES NOT PUBLISH A SHIELDED/UNSHIELDED SPLIT, which is the one number this
        source was wanted for. 34 fields, and the ones whose names contain "shield"
        are mempool counters. zec.shielded_tx_share is registered and EMPTY, and the
        probe records all four candidates' answers so the gap is not re-investigated
        next quarter.
      - >-
        Tier C mirror: a third-party indexer of someone else's chain, useful for
        aggregates and not authoritative for any of them.
  ibkr_stock_loan:
    name: IB public stock-loan availability file (usa.txt)
    tier: A1
    epistemic_role: primary_fact
    domain: [borrow_terms]
    geography: [US]
    latency: refreshed intraday by IB
    timestamp_reliability: medium
    timestamp_notes: >-
      The file carries no per-row timestamp, so observed_at is the session and
      available_at is the read instant. Because it refreshes intraday, a CHANGED value
      read later in the day is a genuine vintage -- which is what a borrow rate moving
      during a session is.
    license: IB's own published anonymous endpoint, no key
    allowed_reports: [daily_cascade]
    implemented_by: altdata/loggers/borrow.py
    status: gated
    gate: the stored probe ibkr.stock_loan_file_probe
    caveats:
      - >-
        UNREACHABLE AS OF 23 September 2026. ftp3.interactivebrokers.com resolves to
        206.106.137.27 and times out on ports 21, 80 and 443 from two networks on two
        continents; every HTTPS mirror candidate returns 404. Either the endpoint is
        retired, restricted by source, or down. The parser is written and
        fixture-tested against IB's documented column layout so the day it answers
        the work is a probe and not a build.
      - >-
        THE PARSER'S COLUMN LAYOUT IS FROM DOCUMENTATION, NOT FROM A LIVE FILE. It is
        a written expectation proved against a fixture, and the first real file may
        not match it.
      - >-
        IB censors a large availability as '>1000000'. That is stored as MISSING
        rather than as one million, which it is not.
  coingecko:
    name: CoinGecko public API -- total crypto capitalisation and per-asset caps
    tier: C
    epistemic_role: unofficial_mirror
    domain: [crypto_aggregate]
    geography: [global]
    latency: current values, refreshed continuously
    timestamp_reliability: low
    timestamp_notes: >-
      The endpoints serve a CURRENT value with no as-of timestamp and no history, so
      observed_at is the session on which it was read and available_at is the read
      instant. The series is forward-only by construction.
    license: public API within its free rate limit, NO KEY -- probed and confirmed
    allowed_reports: [daily_cascade]
    implemented_by: altdata/loggers/shielded.py
    status: active
    caveats:
      - >-
        FORWARD-ONLY AND NOT BACKFILLABLE. The free tier serves no history of the
        total capitalisation, so every night not logged is a night of this series that
        cannot be recovered at any price. That is the argument for starting it before
        it is needed.
      - >-
        A market capitalisation is an aggregate over venues CoinGecko chooses, with a
        supply figure it also chooses. Tier C mirror: useful for a ratio's direction,
        not authoritative for its level.
      - >-
        The probe records a `needs_key` flag on a 401 or 403. If the endpoint stops
        being anonymous the logger must STOP rather than acquire a key unasked.
  zcashexplorer:
    name: zcashexplorer -- zcashd blockchain-info, including valuePools
    tier: B
    epistemic_role: redistributed_primary
    domain: [on_chain]
    geography: [global]
    latency: chain tip
    timestamp_reliability: medium
    timestamp_notes: >-
      Reports the chain tip rather than a dated series, so observed_at is the session
      on which it was read. The block height is logged with the probe so a reader can
      tell which tip a balance belongs to.
    license: public endpoint, no key
    allowed_reports: [daily_cascade]
    implemented_by: altdata/loggers/shielded.py
    status: active
    caveats:
      - >-
        valuePools IS A STOCK, NOT A FLOW. It gives the shielded share of SUPPLY, not
        the shielded share of transactions, and zec.shielded_tx_share stays unsourced
        for that reason. A chain can hold a third of its supply shielded with almost no
        shielded activity.
      - >-
        WHICH POOLS ARE USER-SHIELDED IS A DECLARED LIST (sprout, sapling, orchard).
        lockbox is the NU6 development-fund reserve and ironwood's semantics are
        unverified; both are logged and excluded from the share. Including them reads
        29.4 percent against 5.4.
      - >-
        It redistributes zcashd's own RPC output, so it is one hop from primary: a
        proxy going stale would show as a frozen block height rather than as an error.
  derived_state:
    name: The market-state object -- dimensions, dials and contradictions
    tier: derived
    epistemic_role: own_computation
    domain: [market_regime]
    geography: [US]
    latency: >-
      Computed by the close pass for the session just ended, so it is available
      the evening of the session it describes and never before it.
    timestamp_reliability: inherits
    timestamp_notes: >-
      The object carries the as-of cutoff it was computed under and is stored with
      observed_at = the session and available_at = the compute instant. A
      recompute is a revision of that session's object, not a second object.
    license: n/a
    allowed_reports: [daily_cascade, monthly_macro, gamma_weekly]
    implemented_by: regime.py
    status: active
    caveats:
      - >-
        allowed_reports is deliberately NOT empty, and this is the one place a
        derived source of ours is readable by reports. Audit #3 §K's rule is that
        every report reads this object and ONLY this object for its regime
        content -- the opposite of derived_grade and derived_probability, whose
        empty lists stop the system citing its own marking as evidence. A regime
        is an input; a grade of our own forecasting is not.
      - >-
        THREE OF THE EIGHT v1 DIMENSIONS ARE ABSENT AS OF 19 September 2026.
        trend and breadth need equity prices, which nothing in this repo
        schedules -- yfinance_source.py declares 27 symbols and no timer runs it.
        growth has no daily series and runs on weekly claims. The object reports
        each absence with its reason rather than substituting a proxy.
      - >-
        THE FRED HISTORY HAS NO REAL available_at. All 20,372 migrated
        observations share 2026-05-30, the CSV-to-SQLite migration instant, so an
        as-of-correct backfill cannot reach behind that date. ALFRED ingestion
        (O.16) is what would fix it.

  sec_edgar:
    name: SEC EDGAR -- company filing feeds
    tier: A0
    epistemic_role: primary_fact
    domain: [equity_fundamentals]
    geography: [US]
    latency: >-
      Filings appear in the full-text and company feeds within minutes of
      acceptance. The feed states an acceptance timestamp, which is the moment the
      filing became public.
    timestamp_reliability: high
    timestamp_notes: >-
      EDGAR states both a filing date and an acceptance datetime, and they differ:
      a filing accepted after 17:30 ET carries the NEXT business day as its filing
      date. The acceptance datetime is the one that says when the world could know,
      so it is what goes into observed_at -- and available_at is still our own
      ingest instant, because we learn of it when we poll.
    license: >-
      Public domain. EDGAR asks for a descriptive User-Agent with a contact
      address and rate-limits to 10 requests/second; both are honoured in
      altdata/sources/edgar.py.
    allowed_reports: [daily_cascade, monthly_macro]
    implemented_by: altdata/sources/edgar.py
    status: active
    caveats:
      - >-
        AN 8-K IS THE ONLY ONE THAT ARRIVES BECAUSE SOMETHING HAPPENED. The rest
        of the feed is calendar-driven -- 10-Q, 10-K, the 13F deadline -- so a
        count of filings is a measure of the reporting calendar and not of
        corporate news. The event rows carry the form type so a reader can tell
        which they are looking at.
      - >-
        A 13F IS 45 DAYS STALE BY CONSTRUCTION. It reports a quarter-end position
        as of a date up to a quarter and a half before the filing, so its
        observed_at is the ACCEPTANCE instant and the as-of date it describes is in
        the payload. Treating the filing date as the position date is the single
        most common error made with this data.

  news_rss:
    name: Free news search feeds -- declared story queries only
    tier: C
    epistemic_role: unofficial_mirror
    domain: [narrative]
    geography: [global]
    latency: >-
      Minutes to hours behind publication, and the lag is neither stated nor
      stable. Polled on the ingest passes rather than continuously.
    timestamp_reliability: medium
    timestamp_notes: >-
      Each item carries a publication timestamp from the aggregator, which is the
      PUBLISHER's claim rather than a measured instant and is occasionally wrong by
      hours. It is stored in observed_at because it is the best statement of when
      the item existed, and available_at remains our ingest instant, so no query
      can read a story before the pass that fetched it.
    license: >-
      Headlines, links and short excerpts only. Full article text is not stored
      and not redistributed; BODY_CHARS caps the excerpt at 600 characters.
    allowed_reports: [daily_cascade, monthly_macro]
    implemented_by: altdata/sources/news.py
    status: active
    caveats:
      - >-
        AN AGGREGATOR IS A MIRROR, NOT A SOURCE. The epistemic role is
        unofficial_mirror on purpose: the item is a third party's summary of
        somebody else's reporting, the url is where to go for the actual claim,
        and nothing here should be quoted as though this system had read the
        underlying document.
      - >-
        A COUNT IS ATTENTION, NOT TRUTH, AND NOT EVEN VOLUME. The result set is
        whatever the aggregator chose to return for a query, capped per query per
        day by our own limit, so "headline count rose" means "more of what this
        query returns was returned" -- it is a measure with a denominator nobody
        publishes. It is worth logging and it is not worth acting on, which is why
        mechanism_group is `narrative` and nothing in it is trigger_eligible.
      - >-
        THE QUERIES ARE DECLARED IN CONFIG, never composed at render time. A query
        chosen to match the day is a search for confirmation, and the record of
        what was searched for has to be older than the answer.

  cboe:
    name: Cboe public per-contract futures settlement files
    tier: A1
    epistemic_role: primary_fact
    domain: [volatility]
    geography: [US]
    latency: >-
      A contract's settlement is published after the 16:15 ET futures close and the
      file is refreshed the same evening. The stored availability is 16:45 ET on the
      trade date, declared once in the logger rather than chosen per run.
    timestamp_reliability: high
    timestamp_notes: >-
      The file carries a Trade Date per row, which is the observation date. Because
      a settlement is never restated, availability is RECONSTRUCTED from the trade
      date rather than stamped with the write instant -- the same rule
      tools/backfill_prices.py enforces for closes, and permitted for the same
      reason.
    license: >-
      Public data published by Cboe on cdn.cboe.com without authentication. No key,
      no account, no terms accepted in code.
    allowed_reports: [daily_cascade, monthly_macro, gamma_weekly]
    implemented_by: altdata/loggers/vxcurve.py
    status: active
    caveats:
      - >-
        THERE IS NO DIRECTORY LISTING AND NO ALL-PRODUCTS DAILY FILE. Both return
        403, as does the delayed-quote API. Only the per-contract history answers,
        so the expiry date has to be COMPUTED -- thirty days before the third
        Friday of the following month -- and the URL constructed from it. When
        Cboe moves a settlement for a holiday the URL 404s and that month is
        skipped with its reason, which leaves a session one slot short rather than
        filling a slot wrongly.
      - >-
        MONTHLY CONTRACTS ONLY. Cboe also lists weekly VX futures; VX1/VX2/VX3
        mean the front three monthlies, and the curve rows record which expiry
        filled each slot so the choice is visible.
      - >-
        A SETTLE OF ZERO IS DROPPED. A contract's listing day carries zeros in
        several columns before it trades, and a zero in the front slot would be a
        volatility of nothing.

  derived_base_rate:
    name: The Base Rates paper's tables, computed from the store
    tier: derived
    epistemic_role: own_computation
    domain: [market_regime]
    geography: [US]
    latency: >-
      Recomputed on the first session of a calendar year, on a method change, and
      whenever a table is missing -- not nightly. A distribution over ninety-nine
      years does not move because a Tuesday happened.
    timestamp_reliability: inherits
    timestamp_notes: >-
      Each table is stored with observed_at = the last completed session at compute
      time and available_at = the compute instant, so a packet citing a base rate
      can be replayed against the table that existed when it was cited rather than
      against the current one.
    license: n/a
    allowed_reports: [daily_cascade, monthly_macro, gamma_weekly,
                      disruptive_themes, top_bottom, alt_asset]
    implemented_by: tools/base_rates.py
    status: active
    caveats:
      - >-
        allowed_reports is deliberately WIDE, which is the opposite of
        derived_grade's empty list, and the distinction is the point: a base rate
        is a reference every report may cite, while a grade of our own forecasting
        is not evidence about a market. Nothing here is trigger_eligible and 31.6
        holds the Part 26 freeze over all of it -- a base rate says what usually
        happens and can never say that something is happening now.
      - >-
        PRICE RETURN, NOT TOTAL RETURN. The tables are computed from ^GSPC index
        levels, so the annual row is the paper's ~8% price figure and not its ~10%
        total return. Stated on every affected row rather than in one place.
      - >-
        TWO DEFINITIONS OF A DECLINE ARE STORED PER DEPTH BAND and they differ by a
        factor of four in frequency: loss from the running maximum with recovery
        (the portfolio's question) and a threshold swing from a local high (the
        operator's, and the one the paper's frequency column counts). Citing one
        where the other was meant turns a three-times-a-year event into a
        once-every-fourteen-months one.
      - >-
        THE GAP STATISTICS ARE NOT SOURCED. A gap is the open against the prior
        close and the store holds closes only, so the paper's gap-fill and
        overnight-versus-intraday rows report `not_yet_sourced` with the series
        they need. The same absence blocks the intraday extremes that would make
        the drawdown tables comparable to an intraday-based study.

  derived_grade:
    name: Decision grades computed from the register and the stored pin log
    tier: derived
    epistemic_role: own_computation
    domain: [decision_outcomes]
    geography: [US]
    latency: >-
      Graded at the far edge of the decision's declared horizon, so the latency
      IS the horizon: a swing decision is scoreable three weeks after entry and
      not before.
    timestamp_reliability: inherits
    timestamp_notes: >-
      Every grade carries the reference and horizon dates it read and the full
      close path between them, so it is as-of those observations and replays from
      them.
    license: n/a
    # EMPTY, and emphatically so. A grade measures THIS SYSTEM'S OWN OUTPUT. Feeding
    # it back into a report as an input would let the system cite its own marking
    # as independent evidence, which is the precise failure the register was built
    # to make impossible. Grades are read by tools/cuts.py and printed in the close
    # report's GRADES block -- both of which are the system reporting ON itself,
    # not consuming itself.
    allowed_reports: []
    implemented_by: altdata/grader.py
    status: active
    caveats:
      - >-
        Prices are SETTLED CLOSES from data/pin_log.csv, one per session. The
        maximum adverse excursion is therefore a LOWER BOUND -- a position
        stopped out intraday and recovered by the close is invisible. The
        invalidation test is unaffected, because the register words its
        invalidations as settled closes and the stored data matches the rule
        exactly.
      - >-
        The reference price is the settled close on the entry session, NOT a fill
        price. No execution record existed when the grader was written, so the
        grade measures the DECISION from the close it was made against rather
        than the operator's fill. Once altdata/executions.py has rows, the fill
        is the better reference and this caveat is the migration note.
      - >-
        `structural` decisions are graded at 18 months. The architecture's window
        is "1 yr+", which has no far edge; 18 months is a declared choice so that
        an unbounded horizon is scoreable at all, and it is arguable rather than
        measured.

  derived_probability:
    name: Brier scores over the probability ledger
    tier: derived
    epistemic_role: own_computation
    domain: [forecast_calibration]
    geography: [US]
    latency: >-
      A score exists only once its forecast resolves, so the latency is the
      forecast's own horizon.
    timestamp_reliability: inherits
    timestamp_notes: >-
      Each row carries emitted_at and resolved_at separately, so the gap between
      the claim and its scoring is always visible.
    license: n/a
    # Empty for the same reason derived_grade's is: a calibration score measures
    # this system's own forecasting, and feeding it back as a report input would
    # let the system cite its own marking as evidence.
    allowed_reports: []
    implemented_by: altdata/probability_ledger.py
    status: active
    caveats:
      - >-
        EMPTY AS OF 19 September 2026. Nothing in this system emits a
        machine-readable probability: the Monthly's section III is a manual
        placeholder and the 25-scenario tail list carries none by design
        ("effective n is approximately zero for all 25 ... conditioners, never
        triggers"). The seeding path is built and reports finding nothing rather
        than inventing weights.
      - >-
        A Brier score conflates CALIBRATION with RESOLUTION -- the willingness to
        say anything other than the base rate. Above 0.25 is unambiguously worse
        than always saying 50%; below it the number alone cannot separate a
        well-calibrated forecaster from a lucky one. The
        reliability/resolution/uncertainty decomposition that would is owed, and
        needs an n this ledger will not have for a year.

  ibkr_paper:
    name: Interactive Brokers, paper account via local IB Gateway
    tier: A0
    epistemic_role: primary_fact
    domain: [portfolio, positions, margin]
    geography: [US]
    latency: real-time on request
    timestamp_reliability: high
    timestamp_notes: >-
      A broker balance has no release lag: the value is true at the instant it
      is read and knowable at the same instant, so observed_at and available_at
      are equal by construction rather than by approximation. This is the
      opposite of FRED, where the gap between the two is the whole point.
      IBKR's own account values update on its schedule, so a reading is a
      snapshot of what the broker was reporting, not a continuous series.
    license: brokerage account; not redistributable
    allowed_reports: []
    implemented_by: altdata/sources/ibkr_portfolio.py
    status: live
    epistemic_note: >-
      PAPER account. Positions and NAV are simulated and must never be read as
      the operator's real book. The source id is derived FROM THE PORT
      (4002/7497 -> ibkr_paper, 4001/7496 -> ibkr_live), so a row cannot claim
      to be paper while holding live balances. allowed_reports is empty: this
      is Portfolio Truth for reconciliation, not a report input.
    caveats:
      - >-
        READ-ONLY. The guarantee is the ABSENCE OF CODE: the module constructs
        no order type and the validation gate greps its source for order-placing
        calls, per 26.11 Gate 1's "not disabled, not commented out, absent".
        CORRECTED 5 Sep: this entry previously claimed connect()'s readonly=True
        made the API session "reject orders at the socket". It does not. In
        ib_async 2.1.0 that flag only skips fetching open and completed orders
        at startup (ib.py:2057, 2061); it installs no check on placeOrder. The
        real read-only enforcement is server-side, Gateway's Read-Only API
        setting -- which is also why What-If is refused (see ibkr_whatif.py).
        readonly=True is a second layer, not the guarantee.

