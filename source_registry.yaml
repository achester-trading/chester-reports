  bitcoin_data:
    name: bitcoin-data.com (BGeometrics) -- Bitcoin on-chain API, long- and short-term-holder supply
    tier: C
    epistemic_role: derived_estimate
    domain: [crypto_network]
    geography: [global]
    latency: daily, 03:00 UTC
    timestamp_reliability: medium
    timestamp_notes: >-
      Each row carries its day ("d") and a unix time; most indicators update daily
      at 03:00 UTC (the API's own description). available_at is the pull instant
      (ingest_instant): the first pull's four years of history are knowable from
      that pull, not from the days they describe.
    license: >-
      A FREE-KEY SOURCE (CD-12; ruling 2 of 19 Oct 2026: the operator registers the
      free key; the fetcher reads BITCOIN_DATA_API_KEY from .env and fetches nothing
      without it). Robots: neither bitcoin-data.com/robots.txt nor
      api.bitcoin-data.com/robots.txt exists (404, verified 19 Oct 2026), so the
      REP excludes nothing. Endpoints (the OpenAPI spec at
      api.bitcoin-data.com/v3/api-docs): /v1/long-term-hodler-supply-btc,
      /v1/short-term-hodler-supply-btc, /v1/supply-current, each with startday,
      endday, page and size; the token "can be sent as a URL parameter (?token=...)
      or in the header: Authorization: Bearer <token>" (the header is used, so the
      key never reaches a URL or a log). The API's description: "Free plan: up to 10
      requests per hour and 15 requests per day. Historical data is limited to the
      last 4 years". THE TERMS, re-read 19 Oct 2026 (charts.bgeometrics.com/terms.html,
      "Last updated: October 14, 2026"): "The BGeometrics Bitcoin Data API is
      available with a free API key."; "Free tier: 8 requests per hour · 15 requests
      per day · No payment required"; "Exceeding the limit returns HTTP 429 (Too Many
      Requests) until the counter resets."; "Free-tier access is intended for
      personal projects, research, and evaluation."; "Using bots or multiple API
      keys to circumvent rate limits is strictly prohibited."; "Each API key is
      linked to a single registered user and is intended for that user's own use
      only."; "Using the same token from multiple IP addresses or systems not owned
      by the key holder" "is treated as commercial redistribution and requires the
      Professional plan." ON STORING: the terms contain no clause on storing,
      caching or saving data, so nothing forbids the store. ON REDISTRIBUTING:
      "BGeometrics data must not be provided to third parties through an API, data
      feed or any other machine-readable access."; "End users must not be able to
      download or export the historical data in any format"; "Resell, sublicense, or
      redistribute API access or the underlying data to third parties" is
      prohibited; "You may not reproduce, distribute, or create derivative works
      from BGeometrics content without prior written permission". ON PUBLISHING:
      "Publishing BGeometrics charts, current metric values, percentile positions or
      analysis derived from our data" "requires the Commercial Publishing Add-on on
      top of an active paid plan"; "Personal and non-commercial publishing does not
      require the add-on."; "BGeometrics must be credited as the data source." So:
      the key is used from the box only (one system, one key); no row is offered to
      any third party (the chester-meme export carries no btcdata key, and the
      backups are the operator's own encrypted copies); the reports are the
      operator's personal, non-commercial reading, and every printed line credits
      BGeometrics. The guard holds the stricter 8 an hour and 15 a day.
    allowed_reports: [monthly_macro, weekly_tactical]
    implemented_by: altdata/sources/btcdata.py
    status: built
