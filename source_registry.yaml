    license: >-
      public CSV at webstat.banque-france.fr/export/csv/fr/catalogue/FM/<series>, no key and
      no login (Webstat's API proper needs a key; this is not it); robots.txt "Allow: /",
      read each run (checked 16 Oct 2026). data.gouv.fr republishes the same export
    allowed_reports: [weekly_tactical, monthly_macro, daily_cascade]
    implemented_by: altdata/sources/bdf_webstat.py
    status: live
    caveats:
      - >-
        The TEC 10 is a constant-maturity interpolation between two OATs, and the Bund leg it is set against is the Bundesbank's fitted zero-coupon 10-year: the spread's basis is neither benchmark screen's, which is why SR-30's daily crisis line is the series' own November 2011 peak.

